<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systematische namen</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 18px}
.lijn{display:flex;gap:4px;background:#1b2731;border-radius:10px;padding:4px;margin-bottom:18px}
.lijn button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:13.5px;font-weight:700;background:transparent;color:#9fb2c3;cursor:pointer}
.lijn button.on{background:var(--goud2);color:var(--nacht)}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(520px,680px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:780px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:20px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul,.tekst ol{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.proces{border-left-color:#5d7387}
.vgl{font-family:var(--serif);font-size:17px;margin-top:6px;color:var(--inkt)}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:220px;color:var(--inkt)}
input.in:focus,textarea.in:focus,select.sel:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
textarea.in{font-family:var(--sans);font-size:14.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;width:100%;min-height:74px;background:#fff;color:var(--inkt)}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.chip.x{padding:3px 6px 3px 12px}
.chip.x b{margin-left:6px;font-weight:700;color:var(--grijs)}
.opties{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.model{background:var(--hint);border-radius:8px;padding:8px 11px;font-size:14px;color:#5b4210;margin-top:8px}
.model b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}
.uitw{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14.5px;color:var(--inkt2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;overflow:hidden}
.doek svg{display:block;width:100%;height:auto}
.legenda{font-size:12.5px;color:var(--grijs);line-height:1.5}
.bouw{display:grid;gap:10px}
.bouw .vak{background:var(--vel);border:1px solid var(--rand);border-radius:11px;padding:12px 14px}
.bouw h4{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
.strlijst{list-style:none;margin:0!important}
.strlijst li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rand2);font-size:14px}
.strlijst li:first-child{border-top:0}
.nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkt);font-size:12px;font-weight:700;margin-right:6px;flex:none}
.stroomkeuze{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stroomkeuze button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand2);background:#fff;font-weight:700;cursor:pointer;color:var(--inkt)}
.stroomkeuze button.on{background:var(--goud2);border-color:var(--goud2)}
.stroomkeuze button.goed{border-color:var(--goed);color:var(--goed)}
.stroomkeuze button.fout{border-color:var(--fout);color:var(--fout)}
body.beamer .wp{zoom:1.25}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wp{grid-template-columns:1fr}.simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}.tekst{padding:24px 20px 30px}}
@media (prefers-reduced-motion:no-preference){.nieuw{animation:verschijn .6s ease-out}@keyframes verschijn{from{opacity:0}to{opacity:1}}}

.ld{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--nacht);border-radius:8px;padding:9px 14px;margin:0 0 12px;color:var(--inkt2)}
.ld b{display:block;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--nacht);margin-bottom:2px}
table.spiek{border-collapse:collapse;font-size:14px;background:#fff;margin:4px 0 8px;width:100%}
table.spiek th,table.spiek td{border:1px solid var(--rand2);padding:4px 8px;text-align:left}
table.spiek th{background:#f3ead6;font-weight:600}
.formule{font-family:var(--serif);font-size:20px}
.groot{font-family:var(--serif);font-size:26px;color:var(--inkt)}
.twrij{display:grid;grid-template-columns:auto auto auto;gap:6px 12px;align-items:center;margin-bottom:8px;justify-content:start}
.preview{font-family:var(--serif);font-size:17px;min-height:1.4em;margin-top:4px;color:var(--grijs)}
.telling{display:flex;flex-direction:column;gap:8px;background:#fbf8f1;border:1px solid var(--rand);border-radius:12px;padding:12px 14px}
.telling .r{display:flex;align-items:center;gap:10px}
.telling .r b{width:34px;font-family:var(--serif);font-size:18px}
.telling .bol{width:20px;height:20px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.25)}
.telling .r span.w{margin-left:auto;font-size:13px;color:var(--grijs)}
details.sp summary{cursor:pointer;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:6px}
.lijn{margin-bottom:6px}
.conv{font-size:12px;color:#8aa0b3;margin:0 2px 16px;line-height:1.4}
.dset{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.dtaak{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.dtaak .l{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud)}
.dtaak .nm{font-family:var(--serif);font-size:26px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.tile{display:flex;border:1.5px solid var(--rand2);border-radius:9px;background:#fff;overflow:hidden;cursor:pointer;font:inherit;padding:0;text-align:left;color:var(--inkt)}
.tile:hover{border-color:#b9ad93}
.tile .f{flex:none;min-width:62px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--serif);font-size:18px;background:#faf6ec;border-right:1.5px dashed var(--rand2);padding:6px 8px}
.tile .n{padding:6px 9px;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere;hyphens:manual;display:flex;align-items:center}
.tile.fout{animation:schud .35s}
@keyframes schud{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ketting{display:flex;flex-direction:column;gap:6px}
.ketting .tile{cursor:default}
.ketting .tile.start{border-color:var(--goud2)}
.ketting .tile.nieuw{border-color:var(--goed)}
.dstats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--grijs);font-variant-numeric:tabular-nums;margin-bottom:6px}
.dstats b{color:var(--inkt)}
code{font-family:var(--mono);background:#f3ead6;border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Systematische namen</h1>
    <div class="sub">Molecuulstoffen met twee atoomsoorten · 3V</div>
    <div class="lijn"><button data-a="conv" data-v="huidig" id="c-huidig">Huidig</button><button data-a="conv" data-v="nieuw" id="c-nieuw">Nieuw</button></div>
    <div class="conv" id="convuitleg"></div>
    <nav id="nav"></nav>
    <div class="voet">
      <button data-a="beamer">Beamerstand</button>
      <button data-a="wis">Voortgang wissen</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
{
/* ============ NAAMGEVING ============ */
const EL={C:'koolstof',N:'stikstof',S:'zwavel',P:'fosfor',Si:'silicium',Cl:'chloor',I:'jood',Br:'broom',H:'waterstof',O:'zuurstof',F:'fluor',
  Na:'natrium',Ca:'calcium',K:'kalium',Mg:'magnesium',Al:'aluminium',Li:'lithium'};
const STAM={O:'oxide',S:'sulfide',Cl:'chloride',F:'fluoride',Br:'bromide',I:'jodide'};
const METAAL=new Set(['Na','Ca','K','Mg','Al','Li']);
const BRINCLHOF=['Br','I','N','Cl','H','O','F'];
const TW=['','mono','di','tri','tetra','penta','hexa','hepta','okta','nona','deca'];
const KLEUR={C:'#3b3b3b',N:'#4f7cc7',S:'#e3c043',P:'#e08a3c',Si:'#b49a7a',Cl:'#5fb25f',I:'#7d4fa8',Br:'#9c4a3a',H:'#f4f4f4',O:'#d9473f',F:'#9fd3c9',
  Na:'#a98fd8',Ca:'#8fa3a8',K:'#c49ad8',Mg:'#7fbf9f',Al:'#bfc3c8',Li:'#d6a0b8'};
const TRIV={H2O:'water',NH3:'ammoniak',CH4:'methaan',C6H12O6:'glucose',H2SO4:'zwavelzuur',C2H6O:'ethanol'};
let CONV='huidig';
const parse=f=>[...f.matchAll(/([A-Z][a-z]?)(\d*)/g)].map(m=>[m[1],m[2]?+m[2]:1]);
function deel2(f){const p=parse(f);if(p.length<2)return '';const[s,n]=p[1];const zout=METAAL.has(p[0][0]);
  const tw=zout?(n>1?TW[n]:''):TW[n];return (tw==='mono'&&STAM[s][0]==='o'?'mono-':tw)+STAM[s]}
function naam(f){if(TRIV[f])return TRIV[f];const p=parse(f);
  if(p.length===1)return (CONV==='nieuw'?TW[p[0][1]]:'')+EL[p[0][0]];
  return (p[0][1]>1?TW[p[0][1]]:'')+EL[p[0][0]]+deel2(f)}
const sub=f=>f.replace(/\d+/g,d=>'<sub>'+d+'</sub>');
const fm=f=>`<span class="formule">${sub(f)}</span>`;
const nm=n=>`<b>${n}</b>`;
const nrm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const variant=s=>nrm(s).replace(/-/g,'').replace(/monoxide/g,'monooxide').replace(/(tetr|pent|hex|hept|dec)oxide/g,'$1aoxide');
const canonF=s=>String(s).replace(/\s+/g,'').replace(/[₀-₉]/g,c=>'₀₁₂₃₄₅₆₇₈₉'.indexOf(c));
const isEl=f=>parse(f).length===1;
const isZout=f=>METAAL.has(parse(f)[0][0]);

function oordeelNaam(ans,f,goed){
  goed=goed||naam(f);const a=nrm(ans);
  if(a===nrm(goed))return{ok:true};
  if(f==='C2H6O'&&a==='alcohol')return{ok:true,note:'Ook goed: alcohol is de alledaagse naam voor ethanol.'};
  if(variant(ans)===variant(goed))return{ok:true,note:'Let op de schrijfwijze: '+goed+'.'};
  if(TRIV[f])return{ok:false,h:'Dit is een triviale naam: die moet je uit je hoofd kennen.'};
  const p=parse(f);
  if(p.length===1){
    if(CONV==='huidig'&&a==='di'+nrm(EL[p[0][0]]))return{ok:false,h:'Met de huidige namen heet de stof gewoon zoals het element, zonder telwoord.'};
    if(CONV==='nieuw'&&a===nrm(EL[p[0][0]]))return{ok:false,h:'Met de nieuwe namen krijgt ook de stof van een BrINClHOF-element een telwoord: het molecuul is opgebouwd uit twee atomen.'};
    return{ok:false,h:'Dit is de stof van één element. Welk element is het?'}}
  if(a.startsWith('mono'))return{ok:false,h:'Bij het eerste element laat je mono weg.'};
  if(isZout(f)&&a===nrm(EL[p[0][0]]+STAM[p[1][0]])&&(p[0][1]>1||p[1][1]>1))return{ok:false,h:'Met de nieuwe namen krijgt ook een zout telwoorden: kijk naar de indexen in de formule.'};
  if(isZout(f)&&a.includes('mono'))return{ok:false,h:'Bij zouten schrijf je nooit mono.'};
  if(!isZout(f)&&p[1][1]===1&&!a.includes('mono'))return{ok:false,h:'Bij het tweede element schrijf je mono wél.'};
  if(!/ide$/.test(a))return{ok:false,h:'De naam eindigt op -ide.'};
  if(!a.startsWith(nrm((p[0][1]>1?TW[p[0][1]]:'')+EL[p[0][0]])))return{ok:false,h:'Kijk naar het eerste deel: het element dat links in de formule staat, met telwoord als er meer dan één atoom is.'};
  return{ok:false,h:'Kijk naar het tweede deel: telwoord + stam + -ide.'};
}
function oordeelFormule(ans,f){
  const a=canonF(ans);if(a===f)return{ok:true};
  if(f==='C2H6O'&&(a==='C2H5OH'||a==='CH3CH2OH'))return{ok:true,note:'Ook goed. In de les schrijven we C₂H₆O.'};
  if(a.toLowerCase()===f.toLowerCase())return{ok:false,h:'Let op de hoofdletters: elk symbool begint met één hoofdletter. Co is kobalt, CO is koolstofmono-oxide.'};
  if(isEl(f)&&a===parse(f)[0][0])return{ok:false,h:'Dit is een BrINClHOF-element. Hoe is de stof opgebouwd?'};
  const p=parse(f);if(p.length===2&&a===p[1][0]+(p[1][1]>1?p[1][1]:'')+p[0][0]+(p[0][1]>1?p[0][1]:''))return{ok:false,h:'Het element dat als eerste in de naam staat, schrijf je ook als eerste in de formule.'};
  return{ok:false,h:'Kijk naar de telwoorden: die worden de index achter het symbool. Geen telwoord bij het eerste element betekent één atoom.'};
}

/* ============ WERKPLAATSEN ============ */

function render(){
  if(!vis().includes(W()))S.wp='tw';
  $('#c-huidig').className=CONV==='huidig'?'on':'';$('#c-nieuw').className=CONV==='nieuw'?'on':'';
  $('#convuitleg').innerHTML=(CONV==='huidig'?'Huidige namen: ':'Nieuwe namen: ')+(CONV==='huidig'?'O<sub>2</sub> = zuurstof · CaCl<sub>2</sub> = calciumchloride':'O<sub>2</sub> = dizuurstof · CaCl<sub>2</sub> = calciumdichloride');
  $('#nav').innerHTML=vis().map((w,i)=>{if(w.spel){const b=S.best[CONV+'-basis'];return `<a data-a="wp" data-v="${w.id}" class="${S.wp===w.id?'on':''}"><i>★</i><span>${w.k}<small>${b?'beste tijd basis '+b:'spel: leg de ketting'}</small></span></a>`}
    const d=w.opdr.filter((_,j)=>S.prog[w.id+'-'+j]).length;return `<a data-a="wp" data-v="${w.id}" class="${S.wp===w.id?'on':''} ${d===w.opdr.length?'klaar':''}"><i>${d===w.opdr.length?'✓':i+1}</i><span>${w.k}<small>${d} van ${w.opdr.length} opdrachten</small></span></a>`}).join('');
  const w=W();
  if(w.spel){domino();return}
  const done=w.opdr.filter((_,j)=>S.prog[w.id+'-'+j]).length;const nr=vis().indexOf(w)+1;
  let t=`<div class="kicker">Werkplaats ${nr} · 3V</div><h2>${w.t}</h2><div class="tabs"><button data-a="tab" data-v="uitleg" class="${S.tab==='uitleg'?'on':''}">Uitleg en voorbeeld</button><button data-a="tab" data-v="opdr" class="${S.tab==='opdr'?'on':''}">Opdrachten<span class="tel">${done}/${w.opdr.length}</span></button></div>`;
  let sim='';
  if(S.tab==='uitleg'){
    t+=`<div class="ld"><b>Leerdoel</b>${w.ld}</div>`+w.uitleg()+`<div class="vb"><div class="vbkop">Voorbeeld</div><div class="vbvraag">${val(w.vb.v)}</div>${w.vb.s().map((x,i)=>`<div class="vbstap"><div class="n">${i+1}</div><div class="b">${x}</div></div>`).join('')}</div><button class="btn" data-a="tab" data-v="opdr">Naar de opdrachten</button>`;
    sim=`<div class="simkop"><b>Spiekkaart</b></div>${w.spiek()}`;
  } else {const r=opdr();t+=r.t;sim=r.sim}
  $('#main').innerHTML=`<div class="wp"><div class="tekst">${t}</div><div class="simkol">${sim}</div></div>`;
  const inp=$('#f-in');if(inp){const pv=()=>{$('#f-pv').innerHTML=inp.value.trim()?'= '+sub(canonF(inp.value)):''};inp.addEventListener('input',pv);pv()}
}
function telling(f){
  return `<div class="telling">${parse(f).map(([e,n])=>`<div class="r"><b>${e}</b>${Array(n).fill(`<span class="bol" style="background:${KLEUR[e]}"></span>`).join('')}<span class="w">${n} ${n===1?'atoom':'atomen'}</span></div>`).join('')}</div>`;
}
function opdr(){
  const w=W(),o=O(),k=key(),nDone=S.steps[k]||0;
  let t=`<div class="oknop">${w.opdr.map((x,i)=>`<div class="dot ${i===oi()?'on':''} ${S.prog[w.id+'-'+i]?'goed':''} ${x.ster?'ster':''}" data-a="opd" data-v="${i}">${i+1}</div>`).join('')}<span class="rechts">${o.ster?'★ uitdaging':''}</span></div>
  <div class="opdkop">Opdracht ${oi()+1} ${o.ster?'<span class="st">★</span>':''}</div>`;
  if(S.prog[k])t+=`<div class="klaarbanner">Deze opdracht is af.</div>`;
  const kop=o.f&&!o.verborgen?`<div class="groot">${sub(o.f)}</div>`:'';
  const intro=o.intro?`<div style="${o.verborgen?'font-family:var(--serif);font-size:20px':(kop?'margin-top:6px':'')}">${val(o.intro)}</div>`:'';
  t+=`<div class="kader proces">${kop}${intro}${!kop&&!intro?esc(o.naam):''}</div>`;
  t+=o.steps.map((s,i)=>stap(s,i,nDone,o,k)).join('');
  const toon=o.f&&(!o.verborgen||S.prog[k]);
  let sim=`<div class="simkop"><b>${toon?'Atomen geteld':'Hulp'}</b><span>${toon?sub(o.f):''}</span></div>`;
  if(toon)sim+=telling(o.f)+`<div class="legenda">Elke bol is één atoom in één ${isZout(o.f)?'formule-eenheid (de verhouding in het zout)':'molecuul'}. De bolletjes laten alleen het aantal zien, niet hoe de atomen aan elkaar vastzitten.</div>`;
  if(S.prog[k]&&o.f)sim+=`<div class="kader"><div class="groot">${sub(o.f)}</div><div style="font-size:18px">${naam(o.f)}${o.f==='C2H6O'?' (alcohol)':''}</div></div>`;
  sim+=`<details class="sp"><summary>Spiekkaart</summary>${w.spiek()}</details><div class="legenda">Probeer het eerst zonder spiekkaart: zo onthoud je het beter.</div>`;
  return {t,sim};
}
function stap(s,i,nDone,o,k){
  const st=i<nDone?'goed':i===nDone?'':'dicht';const tk=k+'-'+i;const cur=T[tk]||{};
  const p=o.f?parse(o.f):[];
  const title=s.t==='tw'?'Kies bij elk element het telwoord.':s.t==='deel2'?'Geef het tweede deel van de naam.':s.t==='naam'?'Geef de naam.':val(s.v);
  let h=`<div class="stap ${st}"><div class="n">${i+1}</div><div class="inh"><div class="vr">${title}</div>`;
  if(i<nDone){
    if(s.t==='tw')h+=`<div class="fb goed">${p.map(([e,n])=>`${e}: ${n} ${n===1?'atoom':'atomen'} → ${TW[n]}`).join(' · ')}</div>`;
    if(s.t==='deel2')h+=`<div class="fb goed">${deel2(o.f)}</div>`;
    if(s.t==='naam')h+=`<div class="fb goed">${naam(o.f)}${cur.note?' · '+cur.note:''}</div>`;
    if(s.t==='form')h+=`<div class="fb goed">${sub(o.f)}${cur.note?' · '+cur.note:''}</div>`;
    if(s.t==='keuze')h+=`<div class="fb goed">${val(s.o[s.a])}</div>`;
    if(s.t==='multi')h+=`<div class="fb goed">${s.a.map(j=>s.o[j]).join(', ')}</div>`;
    return h+'</div></div>';
  }
  h+='<div class="inv">';
  if(s.t==='tw')h+=`<div class="twrij">${p.map(([e,n],j)=>`<span class="formule">${e}</span><span class="legenda">index ${n===1?'(geen) = 1':n}</span><select class="sel" id="tw-${j}"><option value="">telwoord…</option>${TW.slice(1,7).map(x=>`<option ${cur['t'+j]===x?'selected':''}>${x}</option>`).join('')}</select>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  if(s.t==='deel2'||s.t==='naam')h+=`<div class="rij"><input class="in" id="n-in" style="width:300px" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${s.t==='deel2'?'bijvoorbeeld trioxide':'typ de naam'}" value="${esc(cur.txt||'')}"><button class="btn" data-a="check" data-i="${i}">Controleer</button></div>`;
  if(s.t==='form')h+=`<div class="rij"><input class="in" id="f-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="bijvoorbeeld SO2" value="${esc(cur.txt||'')}"><button class="btn" data-a="check" data-i="${i}">Controleer</button></div><div class="preview" id="f-pv"></div><div class="legenda">Typ de index als gewoon cijfer: SO2 wordt SO<sub>2</sub>.</div>`;
  if(s.t==='keuze')h+=`<div class="opties">${s.o.map((x,j)=>`<button class="optie ${cur.v===j?'aan':''}" data-a="kies" data-i="${i}" data-v="${j}">${val(x)}</button>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  if(s.t==='multi')h+=`<div class="chips">${s.o.map((x,j)=>`<span class="chip ${(cur.sel||[]).includes(j)?'aan':''}" data-a="chip" data-i="${i}" data-v="${j}">${x}</span>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  if(cur.tries>=2&&(s.t==='naam'||s.t==='form'||s.t==='deel2'))h+=`<div class="model"><b>Het goede antwoord</b>${s.t==='form'?sub(o.f):s.t==='deel2'?deel2(o.f):naam(o.f)}. Typ het over en kijk waar het verschil zat.</div>`;
  h+='</div>';if(cur.fb)h+=`<div class="fb ${cur.fb[0]}">${cur.fb[1]}</div>`;
  return h+'</div></div>';
}
function check(i){
  const o=O(),k=key(),s=o.steps[i],tk=k+'-'+i,cur=T[tk]=T[tk]||{};let r={ok:false,h:'Nog niet goed.'};
  if(s.t==='tw'){const p=parse(o.f);const bad=[];p.forEach(([e,n],j)=>{const v=$('#tw-'+j).value;cur['t'+j]=v;if(v!==TW[n])bad.push(e)});
    if(p.some((_,j)=>!cur['t'+j])){cur.fb=['hint','Kies bij elk element een telwoord.'];render();return}
    r=bad.length?{ok:false,h:`Nog niet goed bij ${bad.join(' en ')}. Tel de atomen: de index staat achter het symbool, en geen index betekent één atoom.`}:{ok:true}}
  if(s.t==='deel2'||s.t==='naam'){const v=$('#n-in').value;cur.txt=v;if(!v.trim()){cur.fb=['hint','Typ eerst een antwoord.'];render();return}
    if(s.t==='naam')r=oordeelNaam(v,o.f);
    else{const g=deel2(o.f);r=nrm(v)===nrm(g)?{ok:true}:variant(v)===variant(g)?{ok:true,note:'Let op de schrijfwijze: '+g+'.'}:
      nrm(v)===nrm(g.replace(/^mono-?/,''))?{ok:false,h:'Bij het tweede element schrijf je mono wél.'}:!/ide$/.test(nrm(v))?{ok:false,h:'Het tweede deel eindigt op -ide.'}:{ok:false,h:'Telwoord + stam + -ide. Kijk naar de index van het tweede element.'}}}
  if(s.t==='form'){const v=$('#f-in').value;cur.txt=v;if(!v.trim()){cur.fb=['hint','Typ eerst een formule.'];render();return}r=oordeelFormule(v,o.f)}
  if(s.t==='keuze'){if(cur.v==null){cur.fb=['hint','Kies eerst een antwoord.'];render();return}r=cur.v===s.a?{ok:true}:{ok:false,h:'Nog niet goed. Lees de uitleg over atomen en stoffen nog eens.'}}
  if(s.t==='multi'){const sel=(cur.sel||[]).slice().sort();if(!sel.length){cur.fb=['hint','Kies minstens één antwoord.'];render();return}
    const mis=s.a.filter(j=>!sel.includes(j)).length,teveel=sel.filter(j=>!s.a.includes(j)).length;
    r=!mis&&!teveel?{ok:true}:{ok:false,h:`Nog niet goed: ${teveel?teveel+' gekozen '+(teveel===1?'antwoord is':'antwoorden zijn')+' fout':''}${teveel&&mis?' en ':''}${mis?'je mist er nog '+mis:''}.`}}
  if(r.ok){cur.fb=null;cur.note=r.note;S.steps[k]=i+1;if(i+1>=o.steps.length)S.prog[k]=true;save()}
  else{cur.tries=(cur.tries||0)+1;cur.fb=['fout',r.h]}
  render();
  const nx=$('#n-in')||$('#f-in');if(nx&&!r.ok)try{nx.focus();nx.select()}catch(e){}
}

/* ============ DOMINO ============ */
let D=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const shy=n=>n.replace(/(mono|di|tri|tetra|penta|hexa|hepta|deca)(?=[a-z])/g,'$1­').replace(/(koolstof|stikstof|zwavel|fosfor|chloor|silicium|jood|broom|fluor|natrium|calcium|kalium|magnesium|aluminium|lithium)(?=[a-z])/g,'$1­');
const clock=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function nieuwSpel(set){
  set=set||(D&&D.set)||'basis';if(SETS[set].alleen&&SETS[set].alleen!==CONV)set='basis';
  const order=shuffle(SETS[set].f);const tiles=order.map((f,i)=>({id:i,f,n:naam(order[(i+1)%order.length])}));
  clearInterval(window._tick);
  D={set,conv:CONV,order,tiles,chain:[tiles[0]],hand:shuffle(tiles.slice(1)),fouten:0,log:[],t0:null,t:0,klaar:false,laatst:null,fb:null};
}
function tileHTML(x){return `<span class="f"><span>${sub(x.f)}</span></span><span class="n">${shy(x.n)}</span>`}
function domino(){
  if(!D||D.conv!==CONV)nieuwSpel();
  const doel=D.chain[D.chain.length-1].n;const best=S.best[CONV+'-'+D.set];
  let t=`<div class="kicker">Spel · 3V</div><h2>Naamdomino</h2>
  <p>Elke tegel heeft links een formule en rechts een naam. De naam op de laatste tegel van de ketting hoort bij een formule op een tegel in je hand. Leg die tegel aan, tot de ketting rond is. Fouten tellen mee, en de klok loopt vanaf je eerste tegel.</p>
  <div class="dset">${Object.entries(SETS).filter(([_,v])=>!v.alleen||v.alleen===CONV).map(([k,v])=>`<button class="btn ${D.set===k?'':'g'} klein" data-a="set" data-v="${k}">${v.k}</button>`).join('')}<button class="btn g klein" data-a="set" data-v="${D.set}">Opnieuw schudden</button></div>
  <div class="dstats"><span>Gelegd: <b>${D.chain.length}/${D.tiles.length}</b></span><span>Fouten: <b>${D.fouten}</b></span><span>Tijd: <b id="d-tijd">${clock(D.t)}</b></span>${best?`<span>Beste tijd zonder fouten: <b>${best}</b></span>`:''}</div>`;
  if(!D.klaar){
    t+=`<div class="dtaak"><div class="l">Zoek de formule van</div><div class="nm">${doel}</div></div>`;
    if(D.fb)t+=`<div class="fb ${D.fb[0]}">${D.fb[1]}</div>`;
    t+=`<div class="opdkop" style="margin-top:12px">Jouw tegels</div><div class="hand">${D.hand.map(x=>`<button class="tile" id="tile-${x.id}" data-a="leg" data-v="${x.id}" aria-label="tegel ${x.f}, naam ${x.n}">${tileHTML(x)}</button>`).join('')}</div>`;
  } else {
    t+=`<div class="klaarbanner"><b>De ketting is rond!</b> De laatste naam, <b>${doel}</b>, hoort bij de startformule ${sub(D.chain[0].f)}. Tijd: <b>${clock(D.t)}</b> · fouten: <b>${D.fouten}</b>.${D.rec?' Nieuwe beste tijd zonder fouten!':''}</div>`;
    t+=D.log.length?`<p>Hier ging het mis. Bekijk deze nog eens:</p><ul>${D.log.map(([n,f])=>`<li>bij <b>${n}</b> koos je ${sub(f)}; goed is ${sub(D.order.find(g=>naam(g)===n))}</li>`).join('')}</ul>`:'<p>Geen enkele fout. Probeer een andere set, of speel nog eens voor een snellere tijd.</p>';
    t+=`<button class="btn" data-a="set" data-v="${D.set}">Nog een keer</button>`;
  }
  const sim=`<div class="simkop"><b>De ketting</b><span>${SETS[D.set].k}</span></div><div class="ketting">${D.chain.map((x,i)=>`<div class="tile ${i===0?'start':''} ${x.id===D.laatst?'nieuw':''}">${tileHTML(x)}</div>`).join('')}</div>`;
  $('#main').innerHTML=`<div class="wp"><div class="tekst">${t}</div><div class="simkol">${sim}</div></div>`;
}
function leg(id){
  if(D.klaar)return;
  if(!D.t0){D.t0=Date.now();window._tick=setInterval(()=>{D.t=Math.round((Date.now()-D.t0)/1000);const e=$('#d-tijd');if(e)e.textContent=clock(D.t)},500)}
  const x=D.hand.find(h=>h.id===id);const doel=D.chain[D.chain.length-1].n;const want=D.order.find(f=>naam(f)===doel);
  if(x.f===want){D.hand=D.hand.filter(h=>h.id!==id);D.chain.push(x);D.laatst=id;D.fb=['goed',`Goed: ${doel} is ${sub(want)}.`];
    if(!D.hand.length){D.klaar=true;clearInterval(window._tick);D.t=Math.round((Date.now()-D.t0)/1000);
      const prev=S.best[CONV+'-'+D.set];const sec=s=>{const[a,b]=s.split(':');return +a*60+ +b};
      if(D.fouten===0&&(!prev||D.t<sec(prev))){S.best[CONV+'-'+D.set]=clock(D.t);D.rec=true;save()}}
    render()}
  else{D.fouten++;D.log.push([doel,x.f]);D.fb=['fout','Niet goed. Kijk nog eens naar de telwoorden en het eerste element.'];render();
    const el=$('#tile-'+id);if(el)el.classList.add('fout')}
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'wp':S.wp=v;S.tab='uitleg';T={};save();window.scrollTo(0,0);break;
    case 'tab':S.tab=v;save();window.scrollTo(0,0);break;
    case 'opd':S.opd[S.wp]=+v;T={};save();break;
    case 'conv':CONV=S.conv=v;T={};save();break;
    case 'beamer':document.body.classList.toggle('beamer');return;
    case 'wis':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Zeker weten? Klik nogmaals';return}S.prog={};S.steps={};S.best={};T={};save();el.dataset.c='';el.textContent='Voortgang wissen';break;
    case 'kies':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};T[tk].v=+v;T[tk].fb=null;break}
    case 'chip':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};const s=T[tk].sel=T[tk].sel||[];const j=+v;T[tk].sel=s.includes(j)?s.filter(x=>x!==j):[...s,j];T[tk].fb=null;break}
    case 'check':check(+el.dataset.i);return;
    case 'set':nieuwSpel(v);break;
    case 'leg':leg(+v);return;
    default:return}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='n-in'||e.target.id==='f-in')){const b=e.target.parentNode.querySelector('[data-a=check]');if(b)b.click()}});
render();
window.__nd={WP,SETS,S:()=>S,naam,deel2,check,render,oordeelNaam,oordeelFormule,setConv:c=>{CONV=S.conv=c},D:()=>D,leg,nieuwSpel};
}
</script>
