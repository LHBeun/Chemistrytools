<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evenwichten: BOE-schema</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 18px}
.lijn{display:flex;gap:4px;background:#1b2731;border-radius:10px;padding:4px;margin-bottom:18px}
.lijn button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:13.5px;font-weight:700;background:transparent;color:#9fb2c3;cursor:pointer}
.lijn button.on{background:var(--goud2);color:var(--nacht)}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(520px,680px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:780px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:20px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul,.tekst ol{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.proces{border-left-color:#5d7387}
.vgl{font-family:var(--serif);font-size:17px;margin-top:6px;color:var(--inkt)}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:220px;color:var(--inkt)}
input.in:focus,textarea.in:focus,select.sel:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
textarea.in{font-family:var(--sans);font-size:14.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;width:100%;min-height:74px;background:#fff;color:var(--inkt)}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.chip.x{padding:3px 6px 3px 12px}
.chip.x b{margin-left:6px;font-weight:700;color:var(--grijs)}
.opties{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.model{background:var(--hint);border-radius:8px;padding:8px 11px;font-size:14px;color:#5b4210;margin-top:8px}
.model b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}
.uitw{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14.5px;color:var(--inkt2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;overflow:hidden}
.doek svg{display:block;width:100%;height:auto}
.legenda{font-size:12.5px;color:var(--grijs);line-height:1.5}
.bouw{display:grid;gap:10px}
.bouw .vak{background:var(--vel);border:1px solid var(--rand);border-radius:11px;padding:12px 14px}
.bouw h4{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
.strlijst{list-style:none;margin:0!important}
.strlijst li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rand2);font-size:14px}
.strlijst li:first-child{border-top:0}
.nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkt);font-size:12px;font-weight:700;margin-right:6px;flex:none}
.stroomkeuze{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stroomkeuze button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand2);background:#fff;font-weight:700;cursor:pointer;color:var(--inkt)}
.stroomkeuze button.on{background:var(--goud2);border-color:var(--goud2)}
.stroomkeuze button.goed{border-color:var(--goed);color:var(--goed)}
.stroomkeuze button.fout{border-color:var(--fout);color:var(--fout)}
body.beamer .wp{zoom:1.25}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wp{grid-template-columns:1fr}.simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}.tekst{padding:24px 20px 30px}}
@media (prefers-reduced-motion:no-preference){.nieuw{animation:verschijn .6s ease-out}@keyframes verschijn{from{opacity:0}to{opacity:1}}}

table.boe{border-collapse:collapse;font-size:15px;background:#fff;margin:6px 0}
table.boe th,table.boe td{border:1px solid var(--rand2);padding:5px 9px;text-align:center;min-width:64px}
table.boe th{background:#f3ead6;font-weight:600}
table.boe td.rl{font-weight:700;background:#faf6ec;min-width:30px}
table.boe input{width:92px;font-family:var(--mono);font-size:14px;border:1px solid var(--rand2);border-radius:6px;padding:4px 6px;text-align:center}
table.boe td.ok{background:var(--goedbg)}
table.boe td.leeg{color:var(--grijs)}
.kbouw{display:grid;grid-template-columns:auto auto auto;gap:6px 10px;align-items:center;margin-bottom:8px}
.kbouw select,.kbouw label{display:flex;gap:6px;align-items:center}
.kbouw input{font-size:14px}
.kbouw label{display:flex;gap:6px;align-items:center}
.kbouw input{width:58px;font-family:var(--mono);border:1px solid var(--rand2);border-radius:6px;padding:4px 6px}
.kform{font-family:var(--serif);font-size:20px;color:var(--inkt);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vgl.groot{font-size:19px;text-align:center;margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Evenwichten</h1>
    <div class="sub">Rekenen met het BOE-schema</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button data-a="beamer">Beamerstand</button>
      <button data-a="wis">Voortgang wissen</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
{
/* ============ STOFFEN EN REACTIES ============ */
const F={SO2:'SO₂',O2:'O₂',SO3:'SO₃',N2O4:'N₂O₄',NO2:'NO₂',CH3COOH:'CH₃COOH',H2O:'H₂O',CH3COO:'CH₃COO⁻',H3O:'H₃O⁺',C:'C',CO2:'CO₂',CO:'CO',Ag:'Ag⁺',Cl:'Cl⁻',AgCl:'AgCl',N2:'N₂',H2:'H₂',NH3:'NH₃',I2:'I₂',HI:'HI',PCl5:'PCl₅',PCl3:'PCl₃',Cl2:'Cl₂'};
const RX={
  so2:{L:[['SO2',2,'g'],['O2',1,'g']],R:[['SO3',2,'g']]},
  n2o4:{L:[['N2O4',1,'g']],R:[['NO2',2,'g']]},
  hac:{L:[['CH3COOH',1,'aq'],['H2O',1,'l']],R:[['CH3COO',1,'aq'],['H3O',1,'aq']]},
  cco2:{L:[['C',1,'s'],['CO2',1,'g']],R:[['CO',2,'g']]},
  agcl:{L:[['Ag',1,'aq'],['Cl',1,'aq']],R:[['AgCl',1,'s']]},
  nh3:{L:[['N2',1,'g'],['H2',3,'g']],R:[['NH3',2,'g']]},
  hi:{L:[['H2',1,'g'],['I2',1,'g']],R:[['HI',2,'g']]},
  hi2:{L:[['HI',2,'g']],R:[['H2',1,'g'],['I2',1,'g']]},
  pcl5:{L:[['PCl5',1,'g']],R:[['PCl3',1,'g'],['Cl2',1,'g']]},
  wgs:{L:[['H2',1,'g'],['CO2',1,'g']],R:[['H2O',1,'g'],['CO',1,'g']]},
  so3:{L:[['SO3',2,'g']],R:[['SO2',2,'g'],['O2',1,'g']]}
};
const side=a=>a.map(([f,c,p])=>`${c>1?c+' ':''}${F[f]}(${p})`).join(' + ');
const vgl=r=>`${side(RX[r].L)} ⇌ ${side(RX[r].R)}`;
const cols=r=>[...RX[r].L,...RX[r].R].filter(s=>s[2]==='g'||s[2]==='aq').map(s=>s[0]);
const sup=n=>n>1?`<sup>${n}</sup>`:'';
function kHTML(r){const t=RX[r].R.filter(s=>s[2]!=='s'&&s[2]!=='l').map(([f,c])=>`[${F[f]}]${sup(c)}`).join(' · ')||'1';
  const n=RX[r].L.filter(s=>s[2]!=='s'&&s[2]!=='l').map(([f,c])=>`[${F[f]}]${sup(c)}`).join(' · ')||'1';
  return `<span class="kform">K = <span class="frac"><span>${t}</span><span>${n}</span></span></span>`}
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const n=v=>String(v).replace('.',',');

/* ============ WERKPLAATSEN ============ */
// staptypes: kexpr | rij (mode waarde|x, rij B|O|E, a:[..]) | getal | keuze
const WP=[
{k:'K opstellen',t:'De evenwichtsvoorwaarde opstellen',
 uitleg:`<p>Bij een evenwicht hoort een <b>evenwichtsvoorwaarde</b>: K is gelijk aan een breuk met concentraties.</p>
 <div class="kader"><ul style="margin-bottom:0"><li>In de <b>teller</b> staan de stoffen rechts van de pijl, in de <b>noemer</b> de stoffen links.</li><li>De <b>coëfficiënt</b> wordt de <b>exponent</b>.</li><li><b>Vaste stoffen (s)</b> en <b>water als oplosmiddel (l)</b> laat je weg: hun concentratie verandert niet.</li><li>Staat er aan een kant niets over, dan staat daar 1.</li></ul></div>`,
 vb:{r:'nh3',v:'Geef de evenwichtsvoorwaarde.',s:['Rechts staat NH₃ met coëfficiënt 2: in de teller [NH₃]<sup>2</sup>.','Links staan N₂ (coëfficiënt 1) en H₂ (coëfficiënt 3): in de noemer [N₂] · [H₂]<sup>3</sup>.','Er zijn geen vaste stoffen of water om weg te laten.',`Antwoord: ${kHTML('nh3')}`]},
 opdr:[{r:'so2',naam:'Zwaveltrioxide',steps:[{t:'kexpr'}]},{r:'n2o4',naam:'Distikstoftetraoxide',steps:[{t:'kexpr'}]},
  {r:'hac',naam:'Azijnzuur in water',steps:[{t:'kexpr'}]},{r:'cco2',naam:'Koolstof en koolstofdioxide',steps:[{t:'kexpr'}]},
  {r:'agcl',naam:'Zilverchloride',ster:1,steps:[{t:'kexpr'}]}]},
{k:'BOE met waarden',t:'Het BOE-schema met waarden',
 uitleg:`<p>Met een <b>BOE-schema</b> houd je bij hoe de concentraties veranderen tot het evenwicht zich heeft ingesteld.</p>
 <div class="kader"><ul style="margin-bottom:0"><li><b>B</b>egin: de concentraties (mol/L) vóór de reactie.</li><li><b>O</b>mzetting: de verandering. Wat verdwijnt krijgt een minteken, wat ontstaat een plusteken. De omzettingen verhouden zich als de <b>coëfficiënten</b> (in mol).</li><li><b>E</b>venwicht: B + O.</li></ul></div>
 <p>Begin altijd bij de stof waarvan je de omzetting weet, en reken de andere omzettingen uit met de molverhouding.</p>`,
 vb:{r:'hi',v:'Begin: [H₂] = [I₂] = 1,00 mol/L, geen HI. Bij evenwicht is [HI] = 1,56 mol/L. Bereken K.',s:['B-rij: 1,00 · 1,00 · 0.','O-rij: HI neemt toe met 1,56. De molverhouding H₂ : I₂ : HI = 1 : 1 : 2, dus H₂ en I₂ nemen elk af met <span class="frac"><span>1,56</span><span>2</span></span> = 0,78. O-rij: −0,78 · −0,78 · +1,56.','E-rij: 0,22 · 0,22 · 1,56.',`K = ${fr('[HI]<sup>2</sup>','[H₂] · [I₂]')} = ${fr('1,56<sup>2</sup>','0,22 × 0,22')} = 50 (de O-rij werkt hier met waarden).`]},
 opdr:[
  {r:'so2',naam:'Zwaveltrioxide',intro:'In een vat van 1,00 L zit bij het begin 0,600 mol SO₂ en 0,400 mol O₂. Als het evenwicht zich heeft ingesteld, is er 0,500 mol SO₃ ontstaan.',
   steps:[{t:'rij',rij:'B',a:[0.600,0.400,0]},{t:'rij',rij:'O',a:[-0.500,-0.250,0.500]},{t:'rij',rij:'E',a:[0.100,0.150,0.500]},
    {t:'getal',v:'Bereken K.',a:166.7,u:'',w:`K = ${fr('[SO₃]<sup>2</sup>','[SO₂]<sup>2</sup> · [O₂]')} = ${fr('0,500<sup>2</sup>','0,100<sup>2</sup> × 0,150')} = 1,67·10<sup>2</sup>`}]},
  {r:'nh3',naam:'Ammoniak',intro:'In een vat van 2,00 L worden 2,00 mol N₂ en 6,00 mol H₂ gebracht. Bij evenwicht is er 0,800 mol NH₃ aanwezig.',
   steps:[{t:'rij',rij:'B',a:[1.00,3.00,0],h:'Reken eerst om naar mol/L: deel door het volume.'},{t:'rij',rij:'O',a:[-0.200,-0.600,0.400],h:'[NH₃] bij evenwicht is 0,800 mol / 2,00 L.'},{t:'rij',rij:'E',a:[0.800,2.40,0.400]},
    {t:'getal',v:'Bereken K.',a:0.01447,u:'',w:`K = ${fr('[NH₃]<sup>2</sup>','[N₂] · [H₂]<sup>3</sup>')} = ${fr('0,400<sup>2</sup>','0,800 × 2,40<sup>3</sup>')} = 1,45·10<sup>−2</sup>`}]},
  {r:'pcl5',naam:'Fosforpentachloride',ster:1,intro:'Bij het begin is [PCl₅] = 0,500 mol/L; er is nog geen PCl₃ of Cl₂. Als het evenwicht zich heeft ingesteld, is 30,0% van het PCl₅ ontleed.',
   steps:[{t:'rij',rij:'B',a:[0.500,0,0]},{t:'rij',rij:'O',a:[-0.150,0.150,0.150],h:'30,0% van 0,500 mol/L ontleedt.'},{t:'rij',rij:'E',a:[0.350,0.150,0.150]},
    {t:'getal',v:'Bereken K.',a:0.06429,u:'',w:`K = ${fr('[PCl₃] · [Cl₂]','[PCl₅]')} = ${fr('0,150 × 0,150','0,350')} = 6,43·10<sup>−2</sup>`}]}]},
{k:'BOE met x',t:'Het BOE-schema met x',
 uitleg:`<p>Als je K weet maar de evenwichtsconcentraties niet, schrijf je de omzetting als <b>x</b>.</p>

/* ============ STATE ============ */
const KEY='boe-v2';let S={wp:0,tab:'uitleg',opd:{},steps:{},prog:{}};
try{const t=JSON.parse(localStorage.getItem(KEY));if(t&&t.prog)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let T={};const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=()=>WP[S.wp];const oi=()=>Math.min(S.opd[S.wp]||0,W().opdr.length-1);const O=()=>W().opdr[oi()];const key=()=>S.wp+'-'+oi();

/* ============ PARSERS ============ */
function parseNum(txt){let t=String(txt).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-');
  t=t.replace(/[·×x*]10\^?/i,'e').replace(/e\+?/,'e');const v=Number(t);return t===''?NaN:v}
function parseX(txt){let t=String(txt).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-').toLowerCase();
  if(!t||!/^[0-9x+\-.*()]+$/.test(t))return null;
  t=t.replace(/(\d)x/g,'$1*x').replace(/\)x/g,')*x').replace(/x(\d)/g,'x*$1');
  try{const f=new Function('x','return ('+t+')');const a=f(0.013),b=f(0.071);if(!isFinite(a)||!isFinite(b))return null;return f}catch(e){return null}}
const sameX=(txt,model)=>{const f=parseX(txt),g=parseX(model);if(!f)return false;return[0.013,0.071,0.2].every(x=>Math.abs(f(x)-g(x))<1e-9)};

/* ============ RENDER ============ */
function render(){
  $('#nav').innerHTML=WP.map((w,i)=>{const d=w.opdr.filter((_,j)=>S.prog[i+'-'+j]).length;return `<a data-a="wp" data-v="${i}" class="${S.wp===i?'on':''} ${d===w.opdr.length?'klaar':''}"><i>${d===w.opdr.length?'✓':i+1}</i><span>${w.k}<small>${d} van ${w.opdr.length} opdrachten</small></span></a>`}).join('');
  const w=W();const done=w.opdr.filter((_,j)=>S.prog[S.wp+'-'+j]).length;
  let t=`<div class="kicker">Werkplaats ${S.wp+1} · 5V</div><h2>${w.t}</h2><div class="tabs"><button data-a="tab" data-v="uitleg" class="${S.tab==='uitleg'?'on':''}">Uitleg en voorbeeld</button><button data-a="tab" data-v="opdr" class="${S.tab==='opdr'?'on':''}">Opdrachten<span class="tel">${done}/${w.opdr.length}</span></button></div>`;
  let sim='';
  if(S.tab==='uitleg'){
    t+=w.uitleg+`<div class="vb"><div class="vbkop">Voorbeeld</div><div class="vgl">${vgl(w.vb.r)}</div><div class="vbvraag" style="margin-top:6px">${w.vb.v}</div>${w.vb.s.map((x,i)=>`<div class="vbstap"><div class="n">${i+1}</div><div class="b">${x}</div></div>`).join('')}</div><button class="btn" data-a="tab" data-v="opdr">Naar de opdrachten</button>`;
    sim=`<div class="simkop"><b>Voorbeeld</b></div><div class="kader proces"><div class="vgl groot">${vgl(w.vb.r)}</div></div>${S.wp>0?`<div class="legenda">Evenwichtsvoorwaarde:</div>${kHTML(w.vb.r)}`:''}`;
  } else {const r=opdr();t+=r.t;sim=r.sim}
  $('#main').innerHTML=`<div class="wp"><div class="tekst">${t}</div><div class="simkol">${sim}</div></div>`;
}
function opdr(){
  const w=W(),o=O(),k=key(),nDone=S.steps[k]||0;
  let t=`<div class="oknop">${w.opdr.map((x,i)=>`<div class="dot ${i===oi()?'on':''} ${S.prog[S.wp+'-'+i]?'goed':''} ${x.ster?'ster':''}" data-a="opd" data-v="${i}">${i+1}</div>`).join('')}<span class="rechts">${o.ster?'★ uitdaging':''}</span></div>
  <div class="opdkop">Opdracht ${oi()+1} ${o.ster?'<span class="st">★</span>':''} · ${esc(o.naam)}</div>`;
  if(S.prog[k])t+=`<div class="klaarbanner">Deze opdracht is af.</div>`;
  t+=`<div class="kader proces"><div class="vgl">${vgl(o.r)}</div>${o.intro?`<div style="margin-top:6px">${o.intro}</div>`:''}</div>`;
  t+=o.steps.map((s,i)=>stap(s,i,nDone,o,k)).join('');
  // rechterkolom: BOE-schema met afgeronde rijen
  const c=cols(o.r);const rows={};o.steps.forEach((s,i)=>{if(s.t==='rij'&&i<nDone)rows[s.rij]=s});
  const showBOE=S.wp>0;
  let sim=`<div class="simkop"><b>${showBOE?'BOE-schema':'Evenwichtsvoorwaarde'}</b><span>${esc(o.naam)}</span></div><div class="kader proces"><div class="vgl groot">${vgl(o.r)}</div></div>`;
  if(showBOE){
    sim+=`<table class="boe"><tr><th></th>${c.map(f=>`<th>[${F[f]}]</th>`).join('')}</tr>${['B','O','E'].map(r=>`<tr><td class="rl">${r}</td>${c.map((f,j)=>{const s=rows[r];return s?`<td class="ok">${s.mode==='x'?fmtX(s.a[j],r):fmtV(s.a[j],r)}</td>`:'<td class="leeg">…</td>'}).join('')}</tr>`).join('')}</table>
    <div class="legenda">Concentraties in mol/L. De rijen vullen zich zodra je ze goed hebt.${(rows.O&&rows.O.mode==='x')?' De O-rij werkt hier met x-termen.':rows.O?' De O-rij werkt hier met waarden.':''}</div>`;
    sim+=`<div class="legenda" style="margin-top:8px">Evenwichtsvoorwaarde:</div>${kHTML(o.r)}`;
  } else if(S.prog[k]) sim+=kHTML(o.r);
  else sim+=`<div class="legenda">Bouw de evenwichtsvoorwaarde links op. Hier verschijnt hij als hij klopt.</div>`;
  return {t,sim};
}
function fmtV(v,r){if(r==='O'&&v>0)return '+'+n(v);return n(v).replace('-','−')}
function fmtX(v,r){let s=String(v).replace('.',',').replace(/-/g,' − ');if(r==='O'&&!/^\s*−/.test(s))s='+'+s;return s.trim()}
function stap(s,i,nDone,o,k){
  const st=i<nDone?'goed':i===nDone?'':'dicht';const tk=k+'-'+i;const cur=T[tk]||{};
  const c=cols(o.r);
  let title=s.t==='kexpr'?'Geef de evenwichtsvoorwaarde.':s.t==='rij'?`Vul de ${s.rij}-rij in${s.mode==='x'?' met x-termen':''}${s.rij==='B'||s.mode==='x'?'':' (in mol/L)'}.`:s.v;
  let h=`<div class="stap ${st}"><div class="n">${i+1}</div><div class="inh"><div class="vr">${title}</div>`;
  if(i<nDone){
    if(s.t==='kexpr')h+=kHTML(o.r);
    if(s.t==='rij')h+=`<div class="fb goed">${c.map((f,j)=>`[${F[f]}]: ${s.mode==='x'?fmtX(s.a[j],s.rij):fmtV(s.a[j],s.rij)}`).join(' · ')}</div>`;
    if(s.t==='getal')h+=`<div class="uitw">${s.w}</div>`;
    if(s.t==='keuze')h+=`<div class="fb goed">${s.o[s.a]}</div>`;
    return h+'</div></div>';
  }
  h+='<div class="inv">';
  if(s.t==='kexpr'){const all=[...RX[o.r].L,...RX[o.r].R];
    h+=`<div class="kbouw">${all.map(([f,cf,p],j)=>`<span><b>${F[f]}</b>(${p})</span><select class="sel" id="kp-${j}"><option value="">plaats…</option><option value="t" ${cur['p'+j]==='t'?'selected':''}>teller</option><option value="n" ${cur['p'+j]==='n'?'selected':''}>noemer</option><option value="w" ${cur['p'+j]==='w'?'selected':''}>weglaten</option></select><label class="legenda">exponent <input id="ke-${j}" inputmode="numeric" value="${esc(cur['e'+j]||'')}"></label>`).join('')}</div>
    <button class="btn" data-a="check" data-i="${i}">Controleer</button>`}
  if(s.t==='rij'){h+=`<table class="boe"><tr><th></th>${c.map(f=>`<th>[${F[f]}]</th>`).join('')}</tr><tr><td class="rl">${s.rij}</td>${c.map((f,j)=>`<td><input id="r-${j}" value="${esc((cur.v||[])[j]||'')}" placeholder="${s.mode==='x'?(s.rij==='O'?'bijv. -2x':'bijv. 0,50-x'):''}"></td>`).join('')}</tr></table>
    <button class="btn" data-a="check" data-i="${i}">Controleer</button>`}
  if(s.t==='getal')h+=`<div class="rij"><input class="in" id="g-${i}" inputmode="decimal" placeholder="bijv. 1,45·10^-2" value="${esc(cur.txt||'')}">${s.u?`<span>${s.u}</span>`:''}<button class="btn" data-a="check" data-i="${i}">Controleer</button></div><div class="legenda" style="margin-top:4px">Machten van tien typ je als 1,45·10^-2 of 1,45e-2.</div>${cur.tries>=2&&!cur.showW?`<button class="btn g klein" style="margin-top:6px" data-a="showw" data-i="${i}">Toon de uitwerking</button>`:''}${cur.showW?`<div class="uitw">${s.w}</div>`:''}`;
  if(s.t==='keuze')h+=`<div class="opties">${s.o.map((x,j)=>j).sort((a,b)=>((a*7+i*3)%5)-((b*7+i*3)%5)).map(j=>`<button class="optie ${cur.v===j?'aan':''}" data-a="kies" data-i="${i}" data-v="${j}">${s.o[j]}</button>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  h+='</div>';if(cur.fb)h+=`<div class="fb ${cur.fb[0]}">${cur.fb[1]}</div>`;
  return h+'</div></div>';
}
function check(i){
  const o=O(),k=key(),s=o.steps[i],tk=k+'-'+i,cur=T[tk]=T[tk]||{};let ok=false,msg='Nog niet goed.';
  if(s.t==='kexpr'){const all=[...RX[o.r].L,...RX[o.r].R];const nL=RX[o.r].L.length;let wrong=[];
    all.forEach(([f,cf,p],j)=>{const pos=$('#kp-'+j).value,ex=$('#ke-'+j).value.trim();cur['p'+j]=pos;cur['e'+j]=ex;
      const want=(p==='s'||p==='l')?'w':(j<nL?'n':'t');
      if(pos!==want)wrong.push(want==='w'?`${F[f]}(${p}) hoort niet in de evenwichtsvoorwaarde.`:`${F[f]} staat aan de verkeerde kant van de breuk.`);
      else if(want!=='w'&&(parseInt(ex||'1')!==cf))wrong.push(`De exponent van ${F[f]} klopt niet: kijk naar de coëfficiënt.`)});
    ok=!wrong.length;msg=wrong[0]||''}
  if(s.t==='rij'){const c=cols(o.r);const v=c.map((_,j)=>$('#r-'+j).value);cur.v=v;
    if(v.some(x=>!x.trim())){cur.fb=['hint','Vul alle vakjes in. Een stof die niet verandert of nog niet aanwezig is, krijgt 0.'];render();return}
    const bad=[];c.forEach((f,j)=>{if(s.mode==='x'){if(!sameX(v[j],String(s.a[j])))bad.push(f)}else{const x=parseNum(v[j]);const a=s.a[j];
      const okv=Math.abs(a)<1e-12?Math.abs(x)<1e-9:Math.abs(x-a)/Math.abs(a)<0.006;if(!okv)bad.push(f);
      if(okv&&s.rij==='O'&&a<0&&!/^\s*[-−]/.test(v[j]))bad.push(f)}});
    ok=!bad.length;
    const signHint=s.rij==='O'&&o.steps[i].a.some((a,j)=>!sameSign(v[j],a));
    msg=`Nog niet goed bij ${[...new Set(bad)].map(f=>'['+F[f]+']').join(', ')}.`+(signHint?' Let op het teken: wat verdwijnt krijgt een minteken.':s.rij==='O'?' Gebruik de molverhouding uit de reactievergelijking.':s.rij==='E'?' E = B + O.':'')+(s.h&&!ok?' Tip: '+s.h:'')}
  if(s.t==='getal'){const inp=$('#g-'+i);cur.txt=inp.value;const x=parseNum(inp.value);
    if(isNaN(x)){cur.fb=['hint','Dit getal kan ik niet lezen.'];render();return}
    ok=Math.abs(x-s.a)/Math.abs(s.a)<=0.012;if(!ok){cur.tries=(cur.tries||0)+1;msg='Nog niet goed.'+(s.h?' Tip: '+s.h:' Controleer of je de evenwichtsvoorwaarde goed hebt ingevuld.')}}
  if(s.t==='keuze'){if(cur.v==null){cur.fb=['hint','Kies eerst een antwoord.'];render();return}ok=cur.v===s.a;msg='Nog niet goed. Vergelijk Q met K.'}
  if(ok){cur.fb=null;S.steps[k]=i+1;if(i+1>=o.steps.length)S.prog[k]=true;save()}else cur.fb=['fout',msg];
  render();
}
function sameSign(txt,a){if(typeof a!=='number')return true;const neg=/^\s*[-−]/.test(txt||'');return a<0?neg:!neg}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'wp':S.wp=+v;S.tab='uitleg';T={};save();window.scrollTo(0,0);break;
    case 'tab':S.tab=v;save();window.scrollTo(0,0);break;
    case 'opd':S.opd[S.wp]=+v;T={};save();break;
    case 'beamer':document.body.classList.toggle('beamer');return;
    case 'wis':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Zeker weten? Klik nogmaals';return}S.prog={};S.steps={};T={};save();break;
    case 'kies':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};T[tk].v=+v;T[tk].fb=null;break}
    case 'check':check(+el.dataset.i);return;
    case 'showw':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};T[tk].showW=true;break}
    default:return}
  render()});
render();
window.__boe={WP,S:()=>S,check,render,parseX,sameX,cols,RX};
}
