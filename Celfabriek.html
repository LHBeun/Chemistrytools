<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celfabriek</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}
aside nav a .kl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:0 5px;margin-left:6px;background:#3b5064;color:#cfd9e2;vertical-align:1px}
aside nav a.on .kl{background:#4c6378}
body.beamer .vgl{font-size:22px}

/* Binas 48 */
.modal{position:fixed;inset:0;background:rgba(20,26,32,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.modal.open{display:flex}
.modal .doos{background:var(--vel);border-radius:14px;max-width:860px;width:100%;padding:20px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .kop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.modal .kop h3{font-family:var(--serif);font-size:22px;flex:1;font-weight:600}
.b48zoek{font-size:14px;border:1px solid var(--rand2);border-radius:8px;padding:6px 10px;width:220px}
table.b48{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
table.b48 th{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--grijs);text-align:left;padding:4px 8px;border-bottom:2px solid #8fb3d1}
table.b48 td{padding:3px 8px;border-bottom:1px solid #cfe0ee;white-space:nowrap}
table.b48 td.pijl{text-align:center;color:var(--grijs);width:30px}
table.b48 td.v{text-align:right;font-variant-numeric:tabular-nums;width:70px}
table.b48 tr.licht td{background:#fbf1da}
.b48noot{font-size:12.5px;color:var(--inkt2);margin-top:10px;line-height:1.55}
.b48kop{font-size:12.5px;color:var(--inkt2);margin-bottom:8px}

/* ladder */
.ladder{position:relative}
.ladchip{position:absolute;transform:translateY(-50%);border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:1px 10px;font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none}
.ladchip:hover{border-color:#b9ad93}
.ladchip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.ladchip.sterk{box-shadow:0 0 0 3px #e2a84b}
.ladchip small{color:var(--grijs);margin-left:5px;font-size:11.5px}
.ladchip.aan small{color:#cfd9e2}

/* kaarten halfreacties */
.hkaart{background:#fff;border:1px solid var(--rand);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.hkaart .vgl{flex:1;font-size:17px;text-align:left}
.hkaart .lab{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--goud);width:78px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--rand2);background:#fff;cursor:pointer;font-size:16px;line-height:1}
.stepper b{min-width:30px;text-align:center;font-size:15px}
.ebalk{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.ebalk .bar{height:14px;background:#efe9dc;border-radius:7px;overflow:hidden}
.ebalk .bar i{display:block;height:100%;border-radius:7px;transition:width .3s}
.totaal{background:#fff;border:1px solid var(--rand);border-radius:11px;padding:12px 14px;font-size:17px;font-family:var(--serif);line-height:1.9}
.totaal s{color:#b4473a;text-decoration-thickness:2px}

/* balanscontrole */
table.bal{border-collapse:collapse;font-size:14px;background:#fff}
table.bal th,table.bal td{border:1px solid var(--rand);padding:3px 10px;text-align:center}
table.bal td.ok{background:var(--goedbg);color:#255c3d;font-weight:700}
table.bal td.nok{background:var(--foutbg);color:#7c2c22;font-weight:700}
.miniin{font-family:var(--mono);font-size:14px;border:1px solid var(--rand2);border-radius:8px;padding:6px 9px;width:100%}
.knoppen{display:flex;flex-wrap:wrap;gap:6px}
.uitleg-sm{font-size:12.5px;color:var(--grijs);line-height:1.5}
table.vgltab{border-collapse:collapse;margin:6px 0 12px;font-size:14.5px;background:var(--vel)}
table.vgltab td{border:1px solid var(--rand);padding:5px 10px;vertical-align:top;color:var(--inkt2)}
table.vgltab td:first-child{color:var(--grijs);font-size:13px;white-space:nowrap}
.breuk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.breuk>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.breuk>span:last-child{padding:0 3px}
.reken{line-height:2.6}

/* spel */
.kas{background:#1b2732;border:1px solid #3b5064;border-radius:10px;padding:8px 12px;margin:-12px 0 18px;display:flex;align-items:baseline;gap:10px;position:relative}
.kas span{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8aa0b3}
.kas b{font-family:var(--serif);font-size:22px;color:#f1d08f;font-weight:600;font-variant-numeric:tabular-nums}
.kas i{font-style:normal;font-size:13px;font-weight:700;position:absolute;right:12px;top:10px;opacity:0;transition:opacity .3s,transform .9s}
.kas i.plus{color:#7fd1a0}.kas i.min{color:#f0a294}
.kas i.toon{opacity:1;transform:translateY(-8px)}
aside nav a .ster3{display:block;font-size:11.5px;color:#e2a84b;letter-spacing:1px}
.klant{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--rand);border-radius:14px;padding:14px 16px;margin:4px 0 16px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
.klant .av{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;letter-spacing:.5px}
.klant .wie{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--grijs);font-weight:700}
.klant .wie b{color:var(--inkt)}
.klant .zegt{font-family:var(--serif);font-size:17px;line-height:1.5;margin-top:3px;color:var(--inkt)}
.klant .loon{margin-left:auto;flex:none;text-align:right;font-size:12px;color:var(--grijs)}
.klant .loon b{display:block;font-family:var(--serif);font-size:20px;color:var(--goud)}
.afrekening{background:var(--goedbg);border:1px solid #bfdcc9;border-radius:12px;padding:12px 16px;margin:8px 0;font-size:15px;display:flex;align-items:center;gap:14px}
.afrekening .st{font-size:26px;color:#e2a84b;letter-spacing:2px}
.afrekening.nul{background:#f3efe6;border-color:var(--rand)}
.gegeven{background:var(--vel);border:1px dashed var(--rand2);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px;color:var(--inkt2)}
.gegeven b{color:var(--inkt)}
table.dt{border-collapse:collapse;font-size:14px;background:#fff;margin:6px 0 12px}
table.dt th,table.dt td{border:1px solid var(--rand);padding:4px 10px;text-align:left}
table.dt th{background:#f6f1e6;font-weight:600}
table.dt td.r{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Celfabriek</h1>
    <div class="sub">6 vwo · batterijen, accu's en brandstofcellen</div>
    <div class="kas" id="kas"><span>Kas</span><b id="kasw">€ 500</b><i id="kasdelta"></i></div>
    <nav id="nav"></nav>
    <div class="voet">
      <button id="binasknop">Binas tabel 48</button>
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Spel opnieuw beginnen</button>
      <div class="klein">Een fout kost € 10, een hint € 5 en het antwoord tonen € 30. Een tevreden klant betaalt.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="b48modal"><div class="doos">
  <div class="kop"><h3>Binas tabel 48 · standaardelektrodepotentialen</h3><input class="b48zoek" id="b48zoek" placeholder="zoek, bijv. Cu2+ of MnO4"><button class="btn g klein" id="b48dicht">Sluiten ✕</button></div>
  <div id="b48inh"></div>
</div></div>
<script>
'use strict';
/* =====================================================================
   Hulpjes
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ggd = (a, b) => b ? ggd(b, a % b) : a;
const kgv = (a, b) => a / ggd(a, b) * b;
const lerp = (a, b, t) => a + (b - a) * t;
const komma = (x, d) => x.toFixed(d).replace('.', ',').replace('-', '−');
const vTxt = v => v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',');

/* =====================================================================
   Binas tabel 48 (overgenomen uit de Binas van de klas)
   oxidator | reductor | V0 | voetnoot
   ===================================================================== */
const T48_RUW = [
  ['F2(g) + 2 e-', '2 F-', '+2,87', ''],
  ['O3(g) + 2 H+ + 2 e-', 'H2O(l) + O2(g)', '+2,08', ''],
  ['H2O2 + 2 H+ + 2 e-', '2 H2O(l)', '+1,78', ''],
  ['N2O(g) + 2 H+ + 2 e-', 'N2(g) + H2O(l)', '+1,77', ''],

function norm(s){
  const sup = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-' };

function leesGetal(s){

  $('#b48inh').innerHTML = `<div class="b48kop">De reacties vinden plaats in oplossing; alle ionconcentraties steeds 1,00 mol L<sup>−1</sup>. Bij deeltjes zonder toestandsaanduiding moet steeds (aq) worden gelezen.</div>

    ${rijen.map(r => `<tr class="${licht.includes(r.i) ? 'licht' : ''}"><td>${r.ox.map(x => termHTML(x, true)).join(' + ')}</td><td class="pijl">⇌</td><td>${r.red.map(x => termHTML(x, true)).join(' + ')}${noot(r)}</td><td class="v">${r.vt.replace('-', '−')}</td></tr>`).join('')}</table>

}

function wet(x, sig = 3){
  if (!isFinite(x)) return '';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -2 && e <= sig - 1) return x.toFixed(Math.max(0, sig - 1 - e)).replace('.', ',').replace('-', '−');
  let m = x / Math.pow(10, e), ee = e; let ms = m.toPrecision(sig); if (Math.abs(parseFloat(ms)) >= 10){ ee++; ms = (x / Math.pow(10, ee)).toPrecision(sig); }
  return ms.replace('.', ',').replace('-', '−') + '·10<sup>' + (ee < 0 ? '−' + -ee : ee) + '</sup>';
}

function spanningStap(vr, doel, o = {}){
  return { type:'getal', vr, eenheid:'V', ph:'bijv. 0,75', hint:o.hint, check: v => {
    const g = leesGetal(v); if (!g) return { ok:false, msg:'Typ een getal, bijvoorbeeld <code>0,75</code>.' };

    if (Math.abs(g.w - d) < 0.006) return { ok:true };
    if (Math.abs(g.w + d) < 0.006) return { ok:false, msg:'Je hebt het teken omgedraaid: V<sub>0</sub> van de oxidator min V<sub>0</sub> van de reductor.' };
    return { ok:false, msg: o.foutTip || 'Nog niet goed. Zoek beide waarden op in Binas tabel 48 en trek af: V<sub>0</sub>(oxidator) − V<sub>0</sub>(reductor).' };
  }, antwoord: o.antwoord, auto: () => komma(doel(), 2) };
}

const reken = (vr, doel, o) => ({ type:'getal', vr, eenheid: o.eenheid || '', ph: o.ph, hint: o.hint, check: v => { const r = (o.extra && o.extra(v)) || null; if (r) return r; if (o.sig){ const g = leesGetal(v); if (g && g.sig === o.sig && Number(g.w.toPrecision(o.sig)) === Number(doel().toPrecision(o.sig))) return { ok:true }; } return checkGetal(v, doel(), Object.assign({ tol: o.sig === 2 ? 0.05 : 0.01 }, o)); }, antwoord: () => o.antwoord(), bijGoed: o.bijGoed, auto: () => doel().toPrecision(o.sig || 4) });

function draad(c, pts, kleur = '#4a4f55'){ c.save(); c.strokeStyle = kleur; c.lineWidth = 2.6; c.lineJoin = 'round'; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) c.lineTo(p[0], p[1]); c.stroke(); c.restore(); }
function langsPad(pts, f){
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++){ const l = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(l); tot += l; }
  let d = ((f % 1) + 1) % 1 * tot;
  for (let i = 0; i < seg.length; i++){ if (d <= seg[i]){ const t = d / seg[i]; return [lerp(pts[i][0], pts[i+1][0], t), lerp(pts[i][1], pts[i+1][1], t)]; } d -= seg[i]; }
  return pts[pts.length - 1];
}
function meter(c, x, y, txt, aan){
  c.save(); c.fillStyle = '#fffdf8'; c.strokeStyle = '#24323f'; c.lineWidth = 2;
  c.beginPath(); c.roundRect(x - 52, y - 24, 104, 48, 10); c.fill(); c.stroke();
  c.fillStyle = aan ? '#1d2a35' : '#e9e3d6'; c.beginPath(); c.roundRect(x - 42, y - 15, 84, 30, 6); c.fill();
  c.font = '600 18px ' + getComputedStyle(document.body).fontFamily; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = aan ? '#8ff0b5' : '#8a8478'; c.fillText(txt, x, y + 1);
  c.restore();
}
function rrect(c, x, y, w, h, r, fill, stroke, lw = 1.5){ c.save(); c.beginPath(); c.roundRect(x, y, w, h, r); if (fill){ c.fillStyle = fill; c.fill(); } if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); } c.restore(); }
function strip(c, x, y, w, h, kleur, label){ rrect(c, x, y, w, h, 2, kleur, 'rgba(0,0,0,.35)', 1); if (label) tekst(c, label, x + w / 2, y - 10, { px:12, vet:true, kleur:'#3e3b35' }); }
function pool(c, x, y, plus){ c.save(); c.fillStyle = plus ? '#b4473a' : '#3b6fa8'; c.beginPath(); c.arc(x, y, 10, 0, Math.PI * 2); c.fill(); tekst(c, plus ? '+' : '−', x, y + 0.5, { px:15, vet:true, kleur:'#fff' }); c.restore(); }

    <p>Lithium is aantrekkelijk: het is het lichtste metaal en de sterkste reductor uit Binas 48. Maar daardoor reageert lithium ook met water. In een Li-ion-accu zit daarom geen water, maar een organisch oplosmiddel met een opgelost lithiumzout.</p>`,
  voorbeelden:[{ vraag:'Bereken de theoretische energiedichtheid van een loodaccu.',
    stappen:[`Totaalreactie: ${vglHTML(V('Pb + PbO2 + 4 H+ + 2 SO4^2- -> 2 PbSO4 + 2 H2O'))}, met n = 2 en ΔV<sub>0</sub> = 2,05 V. De H<sup>+</sup> en SO<sub>4</sub><sup>2−</sup> komen uit 2 H<sub>2</sub>SO<sub>4</sub>.`,
      `E = n · F · ΔV<sub>0</sub> = 2 × 9,649·10<sup>4</sup> ${Cmol} × 2,05 V = 3,96·10<sup>5</sup> ${Jmol}`,
      `Massa beginstoffen: M(Pb) + M(PbO<sub>2</sub>) + 2 × M(H<sub>2</sub>SO<sub>4</sub>) = (207,2 + 239,2 + 2 × 98,08) ${gmol} = 642,6 ${gmol} = 0,6426 ${kgmol}`,
      `${breuk('3,96·10<sup>5</sup> ' + Jmol, '0,6426 ' + kgmol)} = 6,16·10<sup>5</sup> ${Jkg} = ${breuk('6,16·10<sup>5</sup> ' + Jkg, '3600 ' + eenh('J', 'Wh'))} = <b>171 ${Whkg}</b>`] }],
  maakSerie(){
    const k = schud(KLANT5);
    const k3 = { klant:k[2], beloning:170, vraag:'Waarom zit er in jullie Li-ion-accu geen gewone zoutoplossing in water? Dat is toch veel goedkoper?',
      stappen:[ keuze('Leg uit waarom er geen water in een Li-ion-accu mag.', [
          'Lithium is een veel sterkere reductor dan water. Het lithium zou met het water reageren, waarbij waterstof ontstaat.',
          'Water geleidt de stroom niet, dus de accu zou geen stroom leveren.',
          'Water bevriest in de winter, waardoor de accu kapotgaat.',
          'Li<sup>+</sup>-ionen lossen niet op in water.'], [0], 'Vergelijk in ' + b48link() + ' de V<sub>0</sub> van Li<sup>+</sup>/Li met die van water als oxidator.'),
        vglS('Geef de reactievergelijking van lithium met water.', V('2 Li + 2 H2O -> 2 Li+ + 2 OH- + H2'), 'Gebruik de regel 2 H<sub>2</sub>O + 2 e<sup>−</sup> ⇌ H<sub>2</sub> + 2 OH<sup>−</sup>.', { ph:'vergelijking' }),
        keuze('Wat gebruik je in plaats van een oplossing in water? Kies alle eigenschappen die de elektrolyt moet hebben.', [
          'Er moeten ionen in kunnen bewegen.', 'Hij mag niet reageren met lithium.', 'Hij moet elektronen geleiden.', 'Hij moet een sterke oxidator zijn.', 'Hij moet water bevatten.'], [0, 1],
          'Wat doet een elektrolyt in een cel? En wat mag er niet gebeuren met de reductor?', { chips:true }) ] };
    const st = { klant:{ naam:'Telefoon Fabriek', wat:'smartphones' }, ster:true, beloning:220,
      vraag:'Jullie rekenen 584 Wh/kg voor een Li-ion-accu, maar mijn telefoonaccu haalt maar ongeveer 250 Wh/kg. Hoe kan dat?',
      stappen:[ keuze('Kies alle redenen waarom de werkelijke energiedichtheid lager is dan de theoretische.', [
          'Er zit massa in de accu die niet reageert: behuizing, oplosmiddel, scheidingswand en stroomgeleiders.',
          'Het grafiet (C<sub>6</sub>) en het kobaltoxide worden in de praktijk niet volledig gebruikt.',
          'Tijdens gebruik is de spanning lager dan de bronspanning.',

    return [klantLi(k[0]), klantNiCd(k[1]), k3, st];
  }
});

/* =====================================================================
   Level 6 — De brandstofcel
   ===================================================================== */
registreer('CH3OH', 0);
const SIM6 = {
  init(host){
    this.milieu = 'zuur'; this.eta = null; this.t = 0;
    host.innerHTML = `<div class="simkop"><b>Werkbank</b><span>waterstof-zuurstofcel</span></div>
      <div class="ctrl"><label><input type="radio" name="s6m" value="zuur" checked> zuur milieu</label><label><input type="radio" name="s6m" value="basisch"> basisch milieu</label></div>
      <div class="doek" id="s6doek"></div><div class="uitkomst" id="s6uit"></div>`;
    this.c = maakCanvas($('#s6doek'), 600, 330);
    $$('[name=s6m]').forEach(r => r.onchange = () => { this.milieu = r.value; this.tekst(); });
    this.tekst();
  },
  tekst(){
    $$('[name=s6m]').forEach(r => r.checked = r.value === this.milieu);
    this.verberg = this.milieu === 'basisch' && !this.basischGezien;
    $('#s6uit').innerHTML = (this.milieu === 'zuur' ? 'Zuur milieu: H<sup>+</sup>-ionen gaan door het membraan naar de positieve elektrode. Daar ontstaat het water.' : 'Basisch milieu: OH<sup>−</sup>-ionen gaan door de elektrolyt naar de negatieve elektrode.' + (this.verberg ? ' Waar ontstaat het water? Dat zoek je uit bij een klant.' : ' Daar ontstaat het water.'))
      + (this.eta ? `<div style="margin-top:6px">Rendement: <b>${komma(this.eta, 1)}%</b> elektrische energie, de rest komt vrij als warmte.</div>` : '');
  },
  update(dt){ this.t += dt; },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    const zuur = this.milieu === 'zuur';
    rrect(c, 140, 120, 320, 150, 10, '#fffdf8', '#24323f', 2);
    rrect(c, 160, 130, 26, 130, 4, '#3d3d3f'); rrect(c, 414, 130, 26, 130, 4, '#3d3d3f');
    rrect(c, 290, 130, 20, 130, 3, zuur ? '#e9d79a' : '#cfe0ee');
    tekst(c, zuur ? 'membraan' : 'kaliloog', 300, 284, { px:11.5 });
    tekst(c, 'H₂', 70, 170, { px:20, vet:true, serif:true, kleur:'#3b6fa8' }); tekst(c, 'O₂', 530, 170, { px:20, vet:true, serif:true, kleur:'#b4473a' });
    for (let j = 0; j < 5; j++){ const f = (this.t * 0.35 + j / 5) % 1;
      bol(c, 90 + f * 70, 200 + 10 * Math.sin(j * 2), 6, '#8fb3d1', '', 1 - f * 0.6);
      bol(c, 510 - f * 70, 200 + 10 * Math.sin(j * 3), 7, '#e59a8c', '', 1 - f * 0.6); }
    for (let j = 0; j < 4; j++){ const f = (this.t * 0.3 + j / 4) % 1, x = zuur ? 200 + f * 200 : 400 - f * 200;
      tekst(c, zuur ? 'H⁺' : 'OH⁻', x, 160 + j * 25, { px:12, vet:true, kleur: zuur ? '#b4473a' : '#3b6fa8' }); }
    const wx = zuur ? 470 : 130;
    if (!this.verberg) for (let j = 0; j < 3; j++){ const f = (this.t * 0.4 + j / 3) % 1; bol(c, wx, 270 + f * 45, 5, '#7fb6e0', '', 1 - f); }
    if (!this.verberg) tekst(c, 'H₂O', wx + (zuur ? 28 : -28), 305, { px:12, vet:true });
    pool(c, 173, 100, false); pool(c, 427, 100, true);
    draad(c, [[173, 90], [173, 45], [250, 45]]); draad(c, [[350, 45], [427, 45], [427, 90]]);
    rrect(c, 250, 22, 100, 46, 10, '#fbe7a8', '#24323f', 2); tekst(c, 'motor', 300, 45, { px:13, vet:true });
    for (let j = 0; j < 5; j++){ const [x, y] = langsPad([[173, 90], [173, 45], [427, 45], [427, 90]], (this.t * 0.25 + j / 5) % 1); if (Math.abs(x - 300) > 54) elektron(c, x, y); }
    if (this.eta){ const w = 300; rrect(c, 150, 312, w, 12, 6, '#f0c9b8'); rrect(c, 150, 312, w * this.eta / 100, 12, 6, '#3f8f63'); }
  },
  opdracht(o){ this.milieu = o && o.milieu ? o.milieu : 'zuur'; this.eta = o && o.toonEta ? o.toonEta : (!o ? 83.0 : null); this.tekst(); },
  stapGoed(o){ const s = PER_WP.brand.st[PER_WP.brand.serie.indexOf(o)]; if (s && s.klaar && o.eta) o.toonEta = o.eta; if (s && s.klaar && o.milieu === 'basisch') this.basischGezien = true; this.opdracht(o); }
};
const KLANT6 = [{ naam:'Busbedrijf Groen', wat:'stadsbussen' }, { naam:'Havenbedrijf Kade', wat:'heftrucks' }, { naam:'Rederij Schoon Water', wat:'veerboten' }];
WPS.push({
  id:'brand', titel:'De brandstofcel', par:'halfreacties, rendement', nKlant:4, sim:SIM6,
  uitleg: () => `<p>In een <b>brandstofcel</b> worden de reductor en de oxidator continu van buiten aangevoerd. De cel raakt dus niet leeg zolang je brandstof toevoert. Een waterstof-zuurstofcel heeft als enige product water.</p>
    <ul><li>Waterstof is de reductor (negatieve elektrode), zuurstof is de oxidator (positieve elektrode).</li>
    <li>Welke halfreacties je gebruikt, hangt af van het milieu: zuur of basisch. Zoek ze op in ${b48link()}.</li>
    <li>De totaalreactie is in beide gevallen: ${vglHTML(V('2 H2 + O2 -> 2 H2O'))}</li></ul>
    <h3>Rendement van een brandstofcel</h3>
    <p>Als je waterstof verbrandt, komt per mol H<sub>2</sub> 2,86·10<sup>5</sup> J vrij (de vormingswarmte van H<sub>2</sub>O(l), Binas 57). De brandstofcel zet een deel daarvan om in elektrische energie:</p>
    <div class="kader" style="text-align:center;font-size:17px">E<sub>elektrisch</sub> = n · F · U &nbsp;&nbsp;&nbsp; rendement = ${breuk('E<sub>elektrisch</sub>', 'E<sub>verbranding</sub>')} × 100%</div>
    <p>Hierin is U de spanning waarbij de cel werkt. Die is in de praktijk lager dan ΔV<sub>0</sub>.</p>`,
  voorbeelden:[{ vraag:'Een brandstofcel in zuur milieu werkt bij 1,23 V. Geef de halfreacties en bereken het rendement.',
    stappen:[`Negatieve elektrode: ${vglHTML(V('H2 -> 2 H+ + 2 e-'))}<br>Positieve elektrode: ${vglHTML(V('O2 + 4 H+ + 4 e- -> 2 H2O'))}`,
      `ΔV<sub>0</sub> = +1,23 V − 0,00 V = 1,23 V. Per mol H<sub>2</sub> gaan er 2 mol elektronen door de draad, dus n = 2.`,
      `E<sub>elektrisch</sub> = 2 × 9,649·10<sup>4</sup> ${Cmol} × 1,23 V = 2,37·10<sup>5</sup> J per mol H<sub>2</sub>.`,
      `rendement = ${breuk('2,37·10<sup>5</sup> J', '2,86·10<sup>5</sup> J')} × 100% = <b>83,0%</b>. Dit is het maximum. Bij een lagere spanning wordt het rendement lager.`],
    bijStap(){ SIM6.milieu = 'zuur'; SIM6.eta = 83.0; SIM6.tekst(); } }],
  maakSerie(){
    const k = schud(KLANT6);
    const k1 = { klant:k[0], beloning:200, milieu:'basisch', vraag:'Onze bussen krijgen een brandstofcel met kaliloog als elektrolyt. Welke reacties vinden daarin plaats, en waar ontstaat het water?',
      stappen:[ vglS('Geef de halfreactie bij de negatieve elektrode.', V('H2 + 2 OH- -> 2 H2O + 2 e-'), 'In basisch milieu zijn er veel OH<sup>−</sup>-ionen. Zoek de regel met H<sub>2</sub> en OH<sup>−</sup> in Binas 48.', { halfreactie:true }),
        vglS('Geef de halfreactie bij de positieve elektrode.', V('O2 + 2 H2O + 4 e- -> 4 OH-'), 'Zoek de regel met O<sub>2</sub> in basisch milieu.', { halfreactie:true }),
        spanningStap('Bereken de bronspanning.', () => 1.23, { hint:'Gebruik de V<sub>0</sub>-waarden van de twee regels die je net gebruikte.', antwoord: () => '+0,40 V − (−0,83 V) = 1,23 V' }),
        keuze('Bij welke elektrode moet het water worden afgevoerd?', ['Bij de negatieve elektrode.', 'Bij de positieve elektrode.', 'Bij beide elektroden evenveel.', 'Nergens: het water blijft in de kaliloog.'], [0],
          'Bij welke halfreactie staat er netto H<sub>2</sub>O na de pijl? Kijk of je de halfreacties zo optelt dat de elektronen wegvallen.') ] };
    const U = kies([0.70, 0.75, 0.80]), Ee = 2 * FAR * U, eta = Ee / 2.86e5 * 100;
    const k2 = { klant:k[1], beloning:200, milieu:'zuur', eta,
      vraag:`Onze brandstofcel werkt in de praktijk bij ${V2(U)} V. Hoeveel procent van de energie in de waterstof wordt stroom?`,
      gegeven:`Vormingswarmte van H<sub>2</sub>O(l): −2,86·10<sup>5</sup> ${Jmol} (Binas 57). F = 9,649·10<sup>4</sup> ${Cmol}.`,
      stappen:[ { type:'getal', vr:'Hoeveel mol elektronen gaan er door de draad per mol H<sub>2</sub>?', ph:'n', hint:'Kijk naar de halfreactie van H<sub>2</sub> bij de negatieve elektrode.', check: v => { const g = leesGetal(v); if (!g) return { ok:false, msg:'Typ een getal.', gratis:true }; if (g.w === 4) return { ok:false, msg:'4 mol elektronen hoort bij 2 mol H<sub>2</sub> (of 1 mol O<sub>2</sub>). De vraag is per mol H<sub>2</sub>.' }; return g.w === 2 ? { ok:true } : { ok:false, msg:'Kijk naar de halfreactie van H<sub>2</sub>.' }; }, antwoord: () => '2 mol', auto: () => '2' },
        reken('Bereken de elektrische energie per mol H<sub>2</sub>.', () => Ee, { eenheid:'J', hint:'E = n · F · U, met de spanning waarbij de cel werkt.',
          extra: v => { const g = leesGetal(v); const id = 2 * FAR * 1.23; if (g && Math.abs(g.w - id) / id < 0.01) return { ok:false, msg:'Dit is de energie bij 1,23 V. Deze cel werkt bij een lagere spanning.' }; return null; },
          antwoord: () => `2 × 9,649·10<sup>4</sup> ${Cmol} × ${V2(U)} V = ${wet(Ee)} J` }),
        reken('Bereken het rendement. Noteer je antwoord in het juiste aantal significante cijfers.', () => eta, { eenheid:'%', sig:2, hint:`rendement = ${breuk('E<sub>elektrisch</sub>', 'E<sub>verbranding</sub>')} × 100%`, antwoord: () => `${breuk(wet(Ee) + ' J', '2,86·10<sup>5</sup> J')} × 100% = ${komma(eta, 0)}%` }) ] };
    const Eid = 2 * FAR * 1.23, zonder = Eid / (MM.H2 / 1000), met = Eid / ((MM.H2 + MM.O2 / 2) / 1000);
    const k3 = { klant:k[2], beloning:200, milieu:'zuur',
      vraag:'Voor een veerboot telt elke kilo. Hoeveel energie levert een kilogram waterstof in een brandstofcel, en hoe verhoudt dat zich tot een Li-ion-accu?',
      gegeven:`Neem aan dat de cel bij 1,23 V werkt. M(H<sub>2</sub>) = 2,016 ${gmol}. Li-ion-accu (theoretisch): 2,10·10<sup>6</sup> ${Jkg}.`,
      stappen:[ reken('Bereken de elektrische energie per kg waterstof.', () => zonder, { eenheid:Jkg, hint:`Per mol H<sub>2</sub>: E = 2 · F · 1,23 V. Deel door de massa van 1 mol H<sub>2</sub> in kg.`,
          extra: v => { const g = leesGetal(v); if (g && Math.abs(g.w - met) / met < 0.01) return { ok:false, msg:'Je hebt de zuurstof meegeteld. De klant vraagt naar een kilogram waterstof.' }; return null; },
          antwoord: () => `${breuk(wet(Eid) + ' J', '2,016·10<sup>−3</sup> kg')} = ${wet(zonder)} ${Jkg}` }),
        keuze('Bij de Li-ion-accu telde je alle beginstoffen mee. Leg uit of je bij de brandstofcel de zuurstof ook moet meetellen.', [
          'Nee: de zuurstof komt uit de lucht. De boot hoeft die niet mee te nemen.',
          'Ja: zuurstof is een beginstof, dus die moet je altijd meetellen.',
          'Nee: zuurstof heeft geen massa omdat het een gas is.',
          'Ja: zonder zuurstof ontstaat er geen water.'], [0], 'Wat moet de boot zelf meenemen, en wat haalt hij uit de omgeving?'),
        reken('Hoeveel keer zoveel energie per kg levert waterstof dan de Li-ion-accu? Noteer je antwoord in het juiste aantal significante cijfers.', () => zonder / 2.10e6, { eenheid:'keer', sig:2, hint:'Deel de twee energiedichtheden op elkaar.', antwoord: () => `${breuk(wet(zonder) + ' ' + Jkg, '2,10·10<sup>6</sup> ' + Jkg)} = ${wet(zonder / 2.10e6, 2)}` }) ] };
    const st = { klant:{ naam:'Campingwinkel Buiten', wat:'kampeerspullen' }, ster:true, beloning:240, milieu:'zuur',
      vraag:'Waterstof opslaan is lastig. Kan een brandstofcel ook op methanol (CH<sub>3</sub>OH) werken? Bij het opwekken ontstaat dan koolstofdioxide.',
      stappen:[ keuze('Leg uit waarom methanol makkelijker mee te nemen is dan waterstof.', [
          'Methanol is bij kamertemperatuur een vloeistof; waterstof is bij kamertemperatuur een gas en moet onder hoge druk of sterk gekoeld worden opgeslagen.',
          'Methanol is een sterkere reductor dan waterstof.',
          'Methanol heeft een kleinere molaire massa dan waterstof.',
          'Methanol reageert niet met zuurstof.'], [0], 'Denk aan de fase van de stoffen bij kamertemperatuur.'),
        vglS('Geef de halfreactie bij de negatieve elektrode in zuur milieu.', V('CH3OH + H2O -> CO2 + 6 H+ + 6 e-'), 'Methanol wordt CO<sub>2</sub>. Maak eerst C kloppend, dan O met H<sub>2</sub>O, dan H met H<sup>+</sup>, en tot slot de lading met elektronen.', { halfreactie:true }) ] };
    return [k1, k2, k3, st];
  }
});

/* ---------- start ---------- */
let tVorig = 0;
function lus(t){
  const dt = Math.min(0.05, (t - tVorig) / 1000 || 0); tVorig = t;
  if (SIM){ SIM.update && SIM.update(dt); SIM.draw && SIM.draw(); }
  requestAnimationFrame(lus);
}
$('#beamerknop').onclick = () => document.body.classList.toggle('beamer');
$('#resetknop').onclick = () => { if (confirm('Kas, sterren en voortgang wissen?')){ STAAT.voortgang = { kas:500, st:{} }; bewaar(STAAT.voortgang); for (const k in PER_WP) delete PER_WP[k]; open(STAAT.wp); } };
open(0);
requestAnimationFrame(lus);
</script>
