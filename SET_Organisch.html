<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set! Organische stoffen</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 18px}
.lijn{display:flex;gap:4px;background:#1b2731;border-radius:10px;padding:4px;margin-bottom:18px}
.lijn button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:13.5px;font-weight:700;background:transparent;color:#9fb2c3;cursor:pointer}
.lijn button.on{background:var(--goud2);color:var(--nacht)}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(520px,680px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:780px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:20px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul,.tekst ol{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.proces{border-left-color:#5d7387}
.vgl{font-family:var(--serif);font-size:17px;margin-top:6px;color:var(--inkt)}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:220px;color:var(--inkt)}
input.in:focus,textarea.in:focus,select.sel:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
textarea.in{font-family:var(--sans);font-size:14.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;width:100%;min-height:74px;background:#fff;color:var(--inkt)}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.chip.x{padding:3px 6px 3px 12px}
.chip.x b{margin-left:6px;font-weight:700;color:var(--grijs)}
.opties{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.model{background:var(--hint);border-radius:8px;padding:8px 11px;font-size:14px;color:#5b4210;margin-top:8px}
.model b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}
.uitw{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14.5px;color:var(--inkt2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;overflow:hidden}
.doek svg{display:block;width:100%;height:auto}
.legenda{font-size:12.5px;color:var(--grijs);line-height:1.5}
.bouw{display:grid;gap:10px}
.bouw .vak{background:var(--vel);border:1px solid var(--rand);border-radius:11px;padding:12px 14px}
.bouw h4{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
.strlijst{list-style:none;margin:0!important}
.strlijst li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rand2);font-size:14px}
.strlijst li:first-child{border-top:0}
.nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkt);font-size:12px;font-weight:700;margin-right:6px;flex:none}
.stroomkeuze{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stroomkeuze button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand2);background:#fff;font-weight:700;cursor:pointer;color:var(--inkt)}
.stroomkeuze button.on{background:var(--goud2);border-color:var(--goud2)}
.stroomkeuze button.goed{border-color:var(--goed);color:var(--goed)}
.stroomkeuze button.fout{border-color:var(--fout);color:var(--fout)}
body.beamer .wp{zoom:1.25}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wp{grid-template-columns:1fr}.simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}.tekst{padding:24px 20px 30px}}
@media (prefers-reduced-motion:no-preference){.nieuw{animation:verschijn .6s ease-out}@keyframes verschijn{from{opacity:0}to{opacity:1}}}

.tafel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tafel.drie{grid-template-columns:repeat(3,minmax(0,1fr))}
.kaart{background:#fff;border:2px solid var(--rand2);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;cursor:pointer;user-select:none;position:relative;transition:transform .12s}
.kaart:hover{border-color:#b9ad93}
.kaart.vast{cursor:default;background:#fbf8f1}
.kaart.sel{border-color:var(--goud2);box-shadow:0 0 0 3px var(--goud2) inset;transform:translateY(-2px)}
.kaart.goed{border-color:var(--goed);box-shadow:0 0 0 3px var(--goed) inset}
.kaart.fout{border-color:var(--fout);box-shadow:0 0 0 3px var(--fout) inset}
.kaart.start{border-color:#24323f;box-shadow:0 0 0 3px #24323f inset}
.kaart.hint{box-shadow:0 0 0 3px #6aa0d8 inset}
.kaart svg{width:100%;max-width:150px;height:auto}
.kaart .naam{font-family:var(--serif);font-size:17px;text-align:center;line-height:1.3;word-break:break-word;padding:8px}
.kaart .ondernaam{font-size:12.5px;color:var(--grijs);text-align:center;margin-top:2px}
.kaart .lbl{position:absolute;top:6px;left:9px;font-size:11px;font-weight:700;color:var(--grijs);letter-spacing:1px}
.plus{display:grid;place-items:center;font-size:28px;color:var(--grijs)}
.hulp{border-collapse:collapse;font-size:14px;background:#fff;margin:4px 0 6px}
.hulp th,.hulp td{border:1px solid var(--rand2);padding:4px 10px;text-align:center}
.hulp th{background:#f3ead6}
.kgroep{margin-bottom:10px}
.kgroep b{display:block;font-size:13px;color:var(--inkt2);margin-bottom:4px}
.teller{font-size:13.5px;color:var(--grijs)}
.schakel{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--inkt2);cursor:pointer;margin:6px 0}
.schakel input{width:18px;height:18px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Set!</h1>
    <div class="sub">Organische stoffen herkennen en combineren · 4V/5V</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button data-a="beamer">Beamerstand</button>
      <button data-a="wis">Voortgang wissen</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

 "db": 1, "hal": 2, "haltypes": ["Cl", "Cl"]}, {"naam": "cyclohepta-1,3-dieen", "smiles": "C1=CCCCC=C1", "vorm": "cyclisch", "ctot": 7, "db": 2, "hal": 0, "haltypes": []}, {"naam": "5-broomcyclohepta-1,3-dieen", "smiles": "BrC1C=CC=CCC1", "vorm": "cyclisch", "ctot": 7, "db": 2, "hal": 1, "haltypes": ["Br"]}, {"naam": "5,5-dibroomcyclohepta-1,3-dieen", "smiles": "BrC1(Br)C=CC=CCC1", "vorm": "cyclisch", "ctot": 7, "db": 2, "hal": 2, "haltypes": ["Br", "Br"]}];
function drawStructure(card){
  const {vorm, ctot, db, haltypes} = card;
  const W=180, H=180;
  let svg = `<svg viewBox="-22 -22 ${W+44} ${H+44}" xmlns="http://www.w3.org/2000/svg">`;
  const stroke = 'stroke="#1f2a24" stroke-width="2.4" fill="none" stroke-linecap="round"';

  function doubleLine(x1,y1,x2,y2,offx,offy){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>` +
           `<line x1="${x1+offx}" y1="${y1+offy}" x2="${x2+offx}" y2="${y2+offy}" ${stroke}/>`;
  }
  function haloLabel(x,y,dx,dy,text){
    const vx=dx, vy=dy-5, L=Math.hypot(vx,vy)||1, ux=vx/L, uy=vy/L;
    const lx=x+ux*26, ly=y+uy*26;
    return `<line x1="${x}" y1="${y}" x2="${(x+ux*17).toFixed(1)}" y2="${(y+uy*17).toFixed(1)}" ${stroke}/>`+
      `<text x="${lx.toFixed(1)}" y="${(ly+5).toFixed(1)}" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1f2a24" text-anchor="middle">${text}</text>`;
  }

  if(vorm==='cyclisch'){
    const n = ctot, R = 58, cx=W/2, cy=H/2+4;
    const pts = [];
    for(let i=0;i<n;i++){
      const ang = -Math.PI/2 + i*2*Math.PI/n;
      pts.push([cx+R*Math.cos(ang), cy+R*Math.sin(ang)]);
    }
    for(let i=0;i<n;i++){
      const [x1,y1]=pts[i], [x2,y2]=pts[(i+1)%n];
      const isDouble = (i===0 && db>=1) || (i===2 && db===2);
      if(isDouble){
        const mx=(x1+x2)/2, my=(y1+y2)/2;
        const nx=(cx-mx), ny=(cy-my);
        const len=Math.hypot(nx,ny); const offx=nx/len*6, offy=ny/len*6;
        svg += doubleLine(x1,y1,x2,y2, offx, offy);
      } else {
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
      }
    }
    // halogens on last vertex (index n-1, adjacent to vertex 0)
    const [hx,hy] = pts[n-1];
    const outAng = Math.atan2(hy-cy, hx-cx);
    if(haltypes.length===1){
      svg += haloLabel(hx,hy, 16*Math.cos(outAng), 16*Math.sin(outAng)+5, haltypes[0]);
    } else if(haltypes.length===2){
      svg += haloLabel(hx,hy, 16*Math.cos(outAng-0.75), 16*Math.sin(outAng-0.75)+5, haltypes[0]);
      svg += haloLabel(hx,hy, 16*Math.cos(outAng+0.75), 16*Math.sin(outAng+0.75)+5, haltypes[1]);
    }
  } else {
    // lineair or vertakt: zigzag chain
    const n = vorm==='vertakt' ? ctot-1 : ctot;
    const dx = 140/(n-1||1), startx=20, y0=100, amp=22;
    const pts=[];
    for(let i=0;i<n;i++){
      pts.push([startx+i*dx, y0 + (i%2===0?amp:-amp)]);
    }
    for(let i=0;i<n-1;i++){
      const [x1,y1]=pts[i], [x2,y2]=pts[i+1];
      const isDouble = (i===0 && db>=1) || (i===2 && db===2);
      if(isDouble){
        svg += doubleLine(x1,y1,x2,y2, 0, (y1<y2? -6:6));
      } else {
        svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
      }
    }
    if(vorm==='vertakt'){
      // branch (methyl) off vertex index 1
      const [bx,by] = pts[1];
      const bty = by - amp*1.4;
      svg += `<line x1="${bx}" y1="${by}" x2="${bx}" y2="${bty}" ${stroke}/>`;
    }
    const [hx,hy] = pts[n-1];
    if(haltypes.length===1){
      svg += haloLabel(hx,hy, 14, hy<y0?-12:16, haltypes[0]);
    } else if(haltypes.length===2){
      svg += haloLabel(hx,hy, 4, -16, haltypes[0]);
      svg += haloLabel(hx,hy, 18, 14, haltypes[1]);
    }
  }
  svg += '</svg>';
  return svg;
}

const isSet=(cs,traits)=>traits.every(t=>{const v=cs.map(c=>c[t]);return v.every(x=>x===v[0])||new Set(v).size===3});

  vb:{tri:['hexaan','cyclohexeen','2-methylpenta-1,3-dieen'],s:['Kaart A: 6 C-atomen, 0 dubbele bindingen, lineair. Kaart B: 6 C-atomen, 1 dubbele binding, cyclisch.','C-atomen: 6 en 6, gelijk. De derde heeft er ook 6.','Dubbele bindingen: 0 en 1, verschillend. De derde heeft er 2.','Vorm: lineair en cyclisch, verschillend. De derde is vertakt.','Gezocht: 6 C-atomen, 2 dubbele bindingen, vertakt. Dat is kaart C rechts.']}},
 {k:'Eén kaart gegeven',t:'Eén kaart gegeven',n:4,opdr:['Ronde 1','Ronde 2','Ronde 3','★ Acht kaarten op tafel'],
  uitleg:`<p>Nu krijg je één kaart. Op tafel liggen andere kaarten, en precies twee daarvan vormen samen met jouw kaart een set.</p>
  <div class="kader"><b>Aanpak:</b> neem een kaart van tafel en bedenk met de truc uit werkplaats 2 welke derde kaart erbij hoort. Ligt die op tafel? Dan heb je de set. Zo niet, probeer de volgende kaart.</div>`,
  vb:{s:['Gegeven (links): 5 C-atomen, 0 dubbele bindingen, cyclisch.','Probeer een kaart van tafel (midden): 7 C-atomen, 1 dubbele binding, lineair. De derde moet dan zijn: 6 C-atomen, 2 dubbele bindingen, vertakt.','Ligt die kaart op tafel (rechts)? Dan is dit de set.']}},
 {k:'Kenmerken uit de naam',t:'Kenmerken uit de naam',n:5,opdr:['Ronde 1: korte namen','Ronde 2: met plaatsnummers','Ronde 3: zonder leesschema','★ Met halogeenatomen'],
  uitleg:`<p>Je hoeft een naam niet eerst uit te tekenen om de kenmerken te weten. Je kunt ze direct uit de naam aflezen met dit <b>leesschema</b>:</p>

 {k:'Vrij spel ★',t:'Vrij spel',n:5,opdr:['Basis: 9 kaarten','★ Gevorderd: 4 kenmerken'],
  uitleg:`<p>Nu het echte spel. Er liggen negen kaarten op tafel. Eén kaart is gemarkeerd als <b>startkaart</b>: die hoort bij een set. Zoek de twee kaarten die erbij horen, net als in werkplaats 3. Vind er vijf.</p>
  <div class="kader">Selecteer drie kaarten. Is het een set, dan worden ze vervangen en krijg je een nieuwe startkaart. Zo niet, dan zie je per kenmerk wat er niet klopt.</div>
  <p>In de gevorderde versie komt er een vierde kenmerk bij: <b>het aantal halogeenatomen</b> (0, 1 of 2; F, Cl en Br tellen alle drie mee). Er liggen dan twaalf kaarten, en één kaart toont een <b>naam</b> in plaats van een structuur. Gebruik daarvoor het leesschema uit werkplaats 4.</p>`,

/* ============ STATE ============ */
const KEY='set-v3';let S={wp:0,tab:'uitleg',opd:{},prog:{}};
try{const t=JSON.parse(localStorage.getItem(KEY));if(t&&t.prog)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let G=null; // huidige ronde
const W=()=>WP[S.wp];const oi=()=>Math.min(S.opd[S.wp]||0,W().opdr.length-1);const key=()=>S.wp+'-'+oi();
const ster=()=>W().opdr[oi()].startsWith('★');

function kaartHTML(c,o={}){
  const toonStr=o.vorm?o.vorm==='s':(c._v==='s');
  const body=toonStr?drawStructure(c):`<div class="naam">${esc(c.naam)}</div>`;
  return `<div class="kaart ${o.cls||''}" ${o.act?`data-a="${o.act}" data-v="${o.idx}"`:''}>${o.lbl?`<span class="lbl">${o.lbl}</span>`:''}${body}</div>`;
}
const vis=c=>({...c,_v:'s'});
const niveau=n=>(/\d/.test(n)?1:0)+(/methyl/.test(n)?1:0)+(/dieen/.test(n)?1:0);
const naamPool=()=>{const r=oi(),vb=WP[3].vb.c;let p=(r===3?CARDS:CARDS.filter(c=>c.hal===0)).filter(c=>c.naam!==vb);
  if(r===0)p=p.filter(c=>niveau(c.naam)===0);else if(r===1)p=p.filter(c=>niveau(c.naam)<=2);return p};

/* ============ RONDES ============ */
function nieuweRonde(){
  const w=S.wp,st=ster();G={wp:w,o:oi(),done:0,fb:null,sel:[],hint:null};
  if(w===0){G.traits=st?['ctot','db','vorm','hal']:BASIS;G.card=vis(rnd(pool(G.traits)))}
  if(w===1)maakAf();
  if(w===2)eenGegeven();
  if(w===3){G.traits=st?['ctot','db','vorm','hal']:BASIS;G.card={...rnd(naamPool()),_v:'n'}}
  if(w===4){G.traits=oi()===1?['ctot','db','vorm','hal']:BASIS;G.board=[];G.start=null;vulBord()}
}
function volgende(){const w=S.wp;G.fb=null;G.sel=[];G.ans={};G.hint=null;
  if(w===0)G.card=vis(rnd(pool(G.traits)));
  if(w===3){let c;do{c=rnd(naamPool())}while(G.card&&c.naam===G.card.naam);G.card={...c,_v:'n'}}
  if(w===1)maakAf();if(w===2)eenGegeven()}
function maakAf(){
  let a,b;do{a=rnd(pool(BASIS));b=rnd(pool(BASIS))}while(a===b);
  const c=third(a,b,BASIS);const opts=[c];
  const vars=[];BASIS.forEach(t=>TR[t].v.filter(v=>v!==c[t]).forEach(v=>{const o={...c,[t]:v};const f=find(o,BASIS);if(f&&f!==a&&f!==b)vars.push(f)}));
  shuffle(vars).slice(0,3).forEach(x=>opts.push(x));
  G.a=vis(a);G.b=vis(b);G.c=c;G.opts=shuffle(opts).map(vis);G.ans={};
}
function eenGegeven(){
  const n=ster()?8:6;
  for(let tries=0;tries<500;tries++){
    const a=rnd(pool(BASIS));let b;do{b=rnd(pool(BASIS))}while(b===a);const c=third(a,b,BASIS);
    const tafel=[b,c];
    while(tafel.length<n){const x=rnd(pool(BASIS));if(x===a||tafel.includes(x))continue;
      // geen tweede set met a
      if(tafel.some(y=>third(a,x,BASIS)===y))continue;tafel.push(x)}
    G.a=vis(a);G.tafel=shuffle(tafel).map(vis);G.oplossing=[b,c].map(x=>x.naam);return;
  }
}
function vulBord(){
  const n=G.traits.length===4?12:9;
  const used=new Set(G.board.map(c=>c.naam));
  for(let tries=0;tries<400;tries++){
    const bord=G.board.slice();const u=new Set(used);
    while(bord.length<n){const x=rnd(pool(G.traits));if(u.has(x.naam))continue;u.add(x.naam);bord.push(vis(x))}
    if(eenSet(bord)){G.board=bord;kiesStart();naamKaart();return}
  }
}
function setsMet(bord,i){const r=[];for(let j=0;j<bord.length;j++)for(let k=j+1;k<bord.length;k++)if(j!==i&&k!==i&&isSet([bord[i],bord[j],bord[k]],G.traits))r.push([i,j,k]);return r}
function kiesStart(){const i=G.board.findIndex(c=>c.naam===G.start);if(i>=0&&setsMet(G.board,i).length)return;
  const s=eenSet(G.board);G.start=G.board[rnd(s)].naam}
function naamKaart(){if(G.traits.length!==4){G.board.forEach(c=>c._v='s');return}
  if(G.board.some(c=>c._v==='n'))return;const kand=G.board.filter(c=>c.naam!==G.start&&!/cyclo/.test(c.naam)&&((c.hal===0&&niveau(c.naam)===0)||(c.hal===1&&niveau(c.naam)===1)));const reserve=G.board.filter(c=>c.naam!==G.start&&c.hal<=1&&niveau(c.naam)<=2);if(kand.length)rnd(kand)._v='n';else if(reserve.length)rnd(reserve)._v='n'}
function eenSet(bord){for(let i=0;i<bord.length;i++)for(let j=i+1;j<bord.length;j++)for(let k=j+1;k<bord.length;k++)if(isSet([bord[i],bord[j],bord[k]],G.traits))return[i,j,k];return null}

/* ============ RENDER ============ */
function render(){
  $('#nav').innerHTML=WP.map((w,i)=>{const d=w.opdr.filter((_,j)=>S.prog[i+'-'+j]).length;return `<a data-a="wp" data-v="${i}" class="${S.wp===i?'on':''} ${d===w.opdr.length?'klaar':''}"><i>${d===w.opdr.length?'✓':i+1}</i><span>${w.k}<small>${d} van ${w.opdr.length} rondes</small></span></a>`}).join('');
  const w=W();const d=w.opdr.filter((_,j)=>S.prog[S.wp+'-'+j]).length;
  let t=`<div class="kicker">Werkplaats ${S.wp+1}</div><h2>${w.t}</h2><div class="tabs"><button data-a="tab" data-v="uitleg" class="${S.tab==='uitleg'?'on':''}">Uitleg en voorbeeld</button><button data-a="tab" data-v="opdr" class="${S.tab==='opdr'?'on':''}">Oefenen<span class="tel">${d}/${w.opdr.length}</span></button></div>`;
  let sim='';
  if(S.tab==='uitleg'){
    t+=w.uitleg;
    if(w.vb)t+=`<div class="vb"><div class="vbkop">Voorbeeld</div>${w.vb.s.map((x,i)=>`<div class="vbstap"><div class="n">${i+1}</div><div class="b">${x}</div></div>`).join('')}</div>`;
    t+=`<button class="btn" data-a="tab" data-v="opdr">Naar het oefenen</button>`;
    const C=nm=>CARDS.find(c=>c.naam===nm);
    if(S.wp===0)sim=`<div class="simkop"><b>Voorbeeld</b></div><div class="tafel drie"><div></div>${kaartHTML(C(w.vb.c),{vorm:'s',cls:'vast'})}<div></div></div>`;
    if(S.wp===1)sim=`<div class="simkop"><b>Voorbeeld</b></div><div class="tafel drie">${w.vb.tri.map((n,i)=>kaartHTML(C(n),{vorm:'s',lbl:'ABC'[i],cls:i===2?'goed':'vast'})).join('')}</div>`;
    if(S.wp===2)sim=`<div class="simkop"><b>Voorbeeld</b></div><div class="tafel drie">${['cyclopentaan','hept-1-een','2-methylpenta-1,3-dieen'].map((n,i)=>kaartHTML(C(n),{vorm:'s',cls:'goed'})).join('')}</div><div class="legenda">C-atomen 5, 7, 6 · dubbele bindingen 0, 1, 2 · vorm cyclisch, lineair, vertakt: alles verschillend, dus een set.</div>`;
    if(S.wp===3)sim=`<div class="simkop"><b>Voorbeeld</b></div><div class="tafel drie"><div></div>${kaartHTML(C(w.vb.c),{vorm:'n',cls:'vast'})}<div></div></div><div class="legenda">Uitgetekend ziet deze stof er zo uit:</div><div class="tafel drie"><div></div>${kaartHTML(C(w.vb.c),{vorm:'s',cls:'vast'})}<div></div></div><div class="legenda">Dat tekenen hoeft niet: het leesschema geeft de kenmerken direct.</div>`;
    if(S.wp===4)sim=`<div class="simkop"><b>Zo ziet een set eruit</b></div><div class="tafel drie">${['hexaan','hex-1-een','hexa-1,3-dieen'].map((n,i)=>kaartHTML(C(n),{vorm:'s',cls:'goed'})).join('')}</div><div class="legenda">C-atomen gelijk (6), dubbele bindingen verschillend (0, 1, 2), vorm gelijk (lineair).</div>`;
  } else {
    if(!G||G.wp!==S.wp||G.o!==oi())nieuweRonde();
    const r=oefen();t+=r.t;sim=r.sim;
  }
  $('#main').innerHTML=`<div class="wp"><div class="tekst">${t}</div><div class="simkol">${sim}</div></div>`;
}
function kop(){const w=W();return `<div class="oknop">${w.opdr.map((x,i)=>`<div class="dot ${i===oi()?'on':''} ${S.prog[S.wp+'-'+i]?'goed':''} ${x.startsWith('★')?'ster':''}" data-a="opd" data-v="${i}">${i+1}</div>`).join('')}<span class="rechts">${ster()?'★ uitdaging':''}</span></div>
  <div class="opdkop">${esc(w.opdr[oi()])}</div>${S.prog[key()]?'<div class="klaarbanner">Deze ronde is af. Je mag doorgaan met oefenen.</div>':''}`}
const fbHTML=()=>G.fb?`<div class="fb ${G.fb[0]}">${G.fb[1]}</div>`:'';
const telHTML=n=>`<div class="teller">${Math.min(G.done,n)} van ${n} goed</div>`;
const naamToggle=()=>'';
function oefen(){
  const w=W();let t=kop(),sim='';
  if(S.wp===0||S.wp===3){
    const tr=G.traits,schema=S.wp===3&&oi()<2;
    t+=`<p>Bepaal de ${tr.length===4?'vier':'drie'} kenmerken van de kaart rechts.${S.wp===3?' Lees ze uit de naam; tekenen hoeft niet.':''}</p>${tr.map(x=>`<div class="kgroep"><b>${TR[x].n}</b><div class="chips">${TR[x].v.map(v=>`<span class="chip ${G.ans&&G.ans[x]===v?'aan':''}" data-a="ans" data-t="${x}" data-v="${v}">${v}</span>`).join('')}</div></div>`).join('')}
    <div class="rij"><button class="btn" data-a="checkK">Controleer</button>${telHTML(w.n)}</div>${fbHTML()}`;
    sim=`<div class="simkop"><b>Kaart</b></div><div class="tafel drie"><div></div>${kaartHTML(G.card,{cls:'vast'})}<div></div></div>`;
    if(schema)sim+=`<div class="simkop"><b>Leesschema</b></div><table class="hulp"><tr><td>C-atomen</td><td>stam + zijtak (pent 5, hex 6, hept 7, methyl 1)</td></tr><tr><td>Dubbele bindingen</td><td>-aan 0 · -een 1 · -dieen 2</td></tr><tr><td>Vorm</td><td>cyclo- = cyclisch · methyl = vertakt · anders lineair</td></tr></table>`;
    else if(S.wp===3)sim+=`<div class="legenda">Het leesschema is nu weg: probeer het uit je hoofd.</div>`;
  }
  if(S.wp===1){
    const hulp=!ster();
    t+=`<p>Welke kaart maakt de set af?</p>${hulp?`<table class="hulp"><tr><th>Kenmerk</th><th>Kaart C moet hebben</th></tr>${BASIS.map(tr=>`<tr><td>${TR[tr].n}</td><td><select class="sel" data-a="hulp" data-t="${tr}"><option value="">…</option>${TR[tr].v.map(v=>`<option ${G.ans&&String(G.ans[tr])===String(v)?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</table><div class="legenda">Lees per kenmerk A en B af: gelijk, dan C ook; verschillend, dan C de overgebleven waarde.</div><div class="rij" style="margin:6px 0"><button class="btn g klein" data-a="checkHulp">Check hulptabel</button></div>`:''}
    <div class="rij"><button class="btn" data-a="checkAf" ${G.sel.length!==1?'disabled':''}>Controleer mijn keuze</button>${telHTML(w.n)}</div>${fbHTML()}${naamToggle()}`;
    sim=`<div class="simkop"><b>Gegeven</b></div><div class="tafel drie">${kaartHTML(G.a,{cls:'vast',lbl:'A',help:true})}${kaartHTML(G.b,{cls:'vast',lbl:'B',help:true})}<div class="kaart vast plus">C = ?</div></div>
    <div class="simkop"><b>Kies kaart C</b></div><div class="tafel">${G.opts.map((c,i)=>kaartHTML(c,{act:'kies1',idx:i,cls:G.sel.includes(i)?(G.res?G.res:'sel'):'',help:true})).join('')}</div>`;
  }
  if(S.wp===2){
    t+=`<p>Kies de <b>twee</b> kaarten van tafel die samen met de gegeven kaart een set vormen.</p><div class="rij"><button class="btn" data-a="checkEen" ${G.sel.length!==2?'disabled':''}>Controleer</button>${telHTML(w.n)}</div>${fbHTML()}${naamToggle()}`;
    sim=`<div class="simkop"><b>Gegeven kaart</b></div><div class="tafel drie"><div></div>${kaartHTML(G.a,{cls:'vast',help:true})}<div></div></div><div class="simkop"><b>Tafel</b></div><div class="tafel">${G.tafel.map((c,i)=>kaartHTML(c,{act:'kies2',idx:i,cls:G.sel.includes(i)?'sel':'',help:true})).join('')}</div>`;
  }
  if(S.wp===4){
    t+=`<p>Vind ${w.n} sets. De omlijnde <b>startkaart</b> hoort bij een set. ${G.traits.length===4?'Let op: nu telt ook het aantal halogeenatomen mee.':''}</p><div class="rij"><button class="btn" data-a="checkSet" ${G.sel.length!==3?'disabled':''}>Controleer set</button><button class="btn g" data-a="hint">Hint</button>${telHTML(w.n)}</div>${fbHTML()}`;
    sim=`<div class="simkop"><b>Tafel</b><span>${G.traits.map(t=>TR[t].n.toLowerCase()).join(' · ')}</span></div><div class="tafel">${G.board.map((c,i)=>kaartHTML(c,{act:'kies3',idx:i,lbl:c.naam===G.start?'start':'',cls:(G.sel.includes(i)?'sel ':'')+(c.naam===G.start?'start ':'')+(G.hint===i?'hint':'')})).join('')}</div>`;
  }
  return{t,sim};
}
function goed(msg){G.done++;const w=W();if(G.done>=w.n&&!S.prog[key()]){S.prog[key()]=true;save();msg+=' Deze ronde is af!'}G.fb=['goed',msg]}

/* ============ ACTIES ============ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(el.tagName==='SELECT')return;
  switch(a){
    case 'wp':S.wp=+v;S.tab='uitleg';G=null;save();window.scrollTo(0,0);break;
    case 'tab':S.tab=v;save();break;
    case 'opd':S.opd[S.wp]=+v;G=null;save();break;
    case 'beamer':document.body.classList.toggle('beamer');return;
    case 'wis':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Zeker weten? Klik nogmaals';return}S.prog={};G=null;save();break;
    case 'naamtoggle':S.naam=el.checked;save();break;
    case 'ans':{G.ans=G.ans||{};const t=el.dataset.t;G.ans[t]=t==='vorm'?v:+v;G.fb=null;break}
    case 'checkK':{const c=G.card,tr=G.traits;if(!G.ans||tr.some(t=>G.ans[t]==null)){G.fb=['hint','Kies bij elk kenmerk een waarde.'];break}
      const bad=tr.filter(t=>G.ans[t]!==c[t]);
      if(!bad.length){goed('Goed!');const d=G.done,f=G.fb;volgende();G.done=d;G.fb=f;G.ans={}}
      else G.fb=['fout',bad.map(t=>t==='ctot'?'Het aantal C-atomen klopt niet. Tel ook de C-atomen in een zijtak mee.':t==='db'?(c._v==='n'?'Het aantal dubbele bindingen klopt niet. Kijk naar -aan, -een of -dieen.':'Het aantal dubbele bindingen klopt niet. Tel de dubbele strepen.'):t==='hal'?'Het aantal halogeenatomen klopt niet.'+(c._v==='n'?' Let op di- (= 2).':' Tel F, Cl en Br.'):'De vorm klopt niet. Een ring is cyclisch; een zijtak maakt een keten vertakt.').join(' ')];
      break}
    case 'kies1':G.sel=[+v];G.res=null;G.fb=null;break;
    case 'checkHulp':{const bad=BASIS.filter(t=>{const want=G.a[t]===G.b[t]?G.a[t]:TR[t].v.find(x=>x!==G.a[t]&&x!==G.b[t]);return String(G.ans[t])!==String(want)});
      G.fb=bad.length?['fout',`Nog niet goed bij: ${bad.map(t=>TR[t].n.toLowerCase()).join(', ')}. Zijn A en B daar gelijk of verschillend?`]:['goed','De hulptabel klopt. Zoek nu de kaart met precies deze kenmerken.'];break}
    case 'checkAf':{const c=G.opts[G.sel[0]];
      if(c.naam===G.c.naam){goed('Goed, dit maakt de set af!');const d=G.done,f=G.fb;volgende();G.done=d;G.fb=f}
      else{G.res='fout';G.fb=['fout',why([G.a,G.b,c],BASIS).join(' ')]}break}
    case 'kies2':{const i=+v;G.sel=G.sel.includes(i)?G.sel.filter(x=>x!==i):[...G.sel,i].slice(-2);G.fb=null;break}
    case 'checkEen':{const cs=G.sel.map(i=>G.tafel[i]);
      if(isSet([G.a,...cs],BASIS)){goed('Goed, dat is de set!');const d=G.done,f=G.fb;volgende();G.done=d;G.fb=f}
      else G.fb=['fout',why([G.a,...cs],BASIS).join(' ')];break}
    case 'kies3':{const i=+v;G.sel=G.sel.includes(i)?G.sel.filter(x=>x!==i):[...G.sel,i].slice(-3);G.fb=null;break}
    case 'hint':{const i=G.board.findIndex(c=>c.naam===G.start);const s=setsMet(G.board,i)[0];G.hint=s?s[1]:null;G.fb=['hint','Nog een kaart van de set met de startkaart is blauw omlijnd.'];break}
    case 'checkSet':{const cs=G.sel.map(i=>G.board[i]);
      if(isSet(cs,G.traits)){goed('Set gevonden!');G.board=G.board.filter((_,i)=>!G.sel.includes(i));G.sel=[];G.hint=null;vulBord()}
      else G.fb=['fout',why(cs,G.traits).join(' ')];break}
