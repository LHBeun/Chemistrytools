<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokschema's</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 18px}
.lijn{display:flex;gap:4px;background:#1b2731;border-radius:10px;padding:4px;margin-bottom:18px}
.lijn button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:13.5px;font-weight:700;background:transparent;color:#9fb2c3;cursor:pointer}
.lijn button.on{background:var(--goud2);color:var(--nacht)}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(520px,680px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:780px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:20px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul,.tekst ol{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.proces{border-left-color:#5d7387}
.vgl{font-family:var(--serif);font-size:17px;margin-top:6px;color:var(--inkt)}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:220px;color:var(--inkt)}
input.in:focus,textarea.in:focus,select.sel:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
textarea.in{font-family:var(--sans);font-size:14.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;width:100%;min-height:74px;background:#fff;color:var(--inkt)}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.chip.x{padding:3px 6px 3px 12px}
.chip.x b{margin-left:6px;font-weight:700;color:var(--grijs)}
.opties{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.model{background:var(--hint);border-radius:8px;padding:8px 11px;font-size:14px;color:#5b4210;margin-top:8px}
.model b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}
.uitw{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14.5px;color:var(--inkt2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;overflow:hidden}
.doek svg{display:block;width:100%;height:auto}
.legenda{font-size:12.5px;color:var(--grijs);line-height:1.5}
.bouw{display:grid;gap:10px}
.bouw .vak{background:var(--vel);border:1px solid var(--rand);border-radius:11px;padding:12px 14px}
.bouw h4{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
.strlijst{list-style:none;margin:0!important}
.strlijst li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rand2);font-size:14px}
.strlijst li:first-child{border-top:0}
.nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkt);font-size:12px;font-weight:700;margin-right:6px;flex:none}
.stroomkeuze{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stroomkeuze button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand2);background:#fff;font-weight:700;cursor:pointer;color:var(--inkt)}
.stroomkeuze button.on{background:var(--goud2);border-color:var(--goud2)}
.stroomkeuze button.goed{border-color:var(--goed);color:var(--goed)}
.stroomkeuze button.fout{border-color:var(--fout);color:var(--fout)}
body.beamer .wp{zoom:1.25}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wp{grid-template-columns:1fr}.simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}.tekst{padding:24px 20px 30px}}
@media (prefers-reduced-motion:no-preference){.nieuw{animation:verschijn .6s ease-out}@keyframes verschijn{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Blokschema's</h1>
    <div class="sub">Processen lezen, aanvullen, tekenen en doorrekenen</div>
    <div class="lijn" id="lijn"></div>
    <nav id="nav"></nav>
    <div class="voet">
      <button data-a="beamer">Beamerstand</button>
      <button data-a="wis">Voortgang wissen</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
{
/* ======================= STOFFEN ======================= */
const ST = {
  N2:'N₂',H2:'H₂',NH3:'NH₃',CO:'CO',CO2:'CO₂',CH3OH:'CH₃OH',CH4:'CH₄',H2O:'H₂O',C2H4:'C₂H₄',C2H5OH:'C₂H₅OH',O2:'O₂',
  abs:'absorptievloeistof',vet:'vet',meoh:'methanol',bd:'biodiesel',glyc:'glycerol',glucose:'glucose',
  water:'water',zout:'zout',zand:'zand',slib:'slib',geur:'geur- en smaakstoffen',kdik:'koffiedik',olie:'olie',
  zuurstof:'zuurstof',zetmeel:'zetmeel',gist:'gist',etoh:'ethanol',co2n:'koolstofdioxide',
  gas:'gas',benz:'benzine',kero:'kerosine',dies:'diesel',res:'residu'
};
const B=(id,x,y,w=90,h=60)=>({id,x,y,w,h});
const L=(n,f,t,pts,st)=>({n,f,t,pts,st});

/* ======================= PROCESSEN ======================= */
const P = {
koffie:{naam:'Koffie zetten',lijn:'4',
  tekst:'Gemalen koffie (stroom 1) en heet water (stroom 2) komen in een koffiezetapparaat met een filter (S1). In S1 lossen de geur- en smaakstoffen op in het water. Het koffiedik lost niet op en blijft in het filter achter. De koffie loopt via stroom 3 de kan in.',
  blocks:[B('S1',260,150)],
  streams:[L(1,'IN','S1',[[70,165],[260,165]],['kdik','geur']),L(2,'IN','S1',[[70,195],[260,195]],['water']),
    L(3,'S1','UIT',[[350,180],[560,180]],['water','geur']),L(4,'S1','UIT',[[305,210],[305,310]],['kdik'])],afl:[]},
zee:{naam:'Zout uit zeewater',lijn:'4',
  tekst:'Zeewater met wat zand (stroom 1) wordt door een fijn doek geleid (S1). Het zand blijft op het doek achter. Het heldere zeewater gaat naar S2. Daar wordt het verwarmd tot al het water verdampt is. De waterdamp wordt afgevoerd en het zout blijft achter.',
  blocks:[B('S1',180,150),B('S2',390,150)],
  streams:[L(1,'IN','S1',[[30,180],[180,180]],['water','zout','zand']),L(2,'S1','UIT',[[225,210],[225,310]],['zand']),
    L(3,'S1','S2',[[270,180],[390,180]],['water','zout']),L(4,'S2','UIT',[[435,150],[435,70],[600,70]],['water']),
    L(5,'S2','UIT',[[480,180],[600,180]],['zout'])],afl:['olie','glucose'],
  w1:[{t:'keuze',v:'Geef aan welke scheidingsmethode in S1 wordt toegepast.',o:['filtreren','indampen','bezinken','extraheren','destilleren'],a:0},
      {t:'keuze',v:'Op welk verschil in stofeigenschap berust de scheiding in S2?',o:['kookpunt','deeltjesgrootte','dichtheid','oplosbaarheid','adsorptievermogen'],a:0},
      {t:'stoffen',n:3,v:'Geef aan welke stof(fen) zich in stroom 3 bevinden.'}],
  w3:{hide:{block:'S2'},qs:[{t:'keuze',v:'In de ontbrekende ruimte wordt het zout uit het heldere zeewater gewonnen. Welke scheidingsmethode wordt daar toegepast?',o:['indampen','filtreren','bezinken','extraheren','adsorberen'],a:0},
      {t:'stoffen',n:4,v:'Geef aan welke stof(fen) zich in stroom 4 bevinden.'}]}},
drink:{naam:'Drinkwater uit rivierwater',lijn:'4',
  tekst:'Rivierwater (stroom 1) stroomt eerst langzaam door een groot bassin (S1), waar het zand naar de bodem zakt. Daarna gaat het water door een dikke laag fijn zand (S2), die de zwevende deeltjes (slib) tegenhoudt. In S3 stroomt het water langs korrels actieve kool, waaraan opgeloste geur- en smaakstoffen blijven hechten. Het schone water verlaat S3 via stroom 7.',
  blocks:[B('S1',100,150),B('S2',280,150),B('S3',460,150)],
  streams:[L(1,'IN','S1',[[10,180],[100,180]],['water','zand','slib','geur']),L(2,'S1','UIT',[[145,210],[145,310]],['zand']),
    L(3,'S1','S2',[[190,180],[280,180]],['water','slib','geur']),L(4,'S2','UIT',[[325,210],[325,310]],['slib']),
    L(5,'S2','S3',[[370,180],[460,180]],['water','geur']),L(6,'S3','UIT',[[505,210],[505,310]],['geur']),
    L(7,'S3','UIT',[[550,180],[630,180]],['water'])],afl:['zout','zuurstof'],
  w1:[{t:'keuze',v:'Geef aan welke scheidingsmethode in S1 wordt toegepast.',o:['bezinken','filtreren','adsorberen','indampen','destilleren'],a:0},
      {t:'keuze',v:'Op welke stofeigenschap berust de scheiding in S3?',o:['adsorptievermogen','kookpunt','deeltjesgrootte','dichtheid','oplosbaarheid'],a:0},
      {t:'stoffen',n:5,v:'Geef aan welke stof(fen) zich in stroom 5 bevinden.'}],
  w3:{hide:{block:'S3'},qs:[{t:'keuze',v:'Geef aan welke scheidingsmethode in de ontbrekende ruimte wordt toegepast.',o:['adsorberen','bezinken','filtreren','destilleren','indampen'],a:0},
      {t:'stoffen',n:7,v:'Geef aan welke stof(fen) zich in stroom 7 bevinden.'}]}},
aard:{naam:'Aardolie scheiden',lijn:'4',
  tekst:'Aardolie wordt verhit en onderin een destillatietoren (S1) geleid (stroom 1). Onderin de toren is het heet, bovenin is het koel. Op verschillende hoogtes worden fracties afgetapt (stroom 2 tot en met 6). Een fractie is een mengsel van stoffen met ongeveer hetzelfde kookpunt.',
  blocks:[B('S1',280,30,90,300)],
  streams:[L(1,'IN','S1',[[60,290],[280,290]],['gas','benz','kero','dies','res']),L(2,'S1','UIT',[[370,55],[600,55]],['gas']),
    L(3,'S1','UIT',[[370,115],[600,115]],['benz']),L(4,'S1','UIT',[[370,175],[600,175]],['kero']),
    L(5,'S1','UIT',[[370,235],[600,235]],['dies']),L(6,'S1','UIT',[[370,305],[600,305]],['res'])],afl:['water','zout'],
  w1:[{t:'keuze',v:'De fracties zijn gas, benzine, kerosine, diesel en residu. Geef aan welke fractie het laagste kookpunt heeft.',o:['gas','benzine','kerosine','diesel','residu'],a:0},
      {t:'stromen',v:'Geef aan via welke stroom de fractie met het hoogste kookpunt de toren verlaat.',a:[6]},
      {t:'open',v:'Leg uit waarom de toren onderin heter moet zijn dan bovenin.',m:'Fracties met een hoog kookpunt moeten al onderin condenseren, en fracties met een laag kookpunt moeten tot bovenin gasvormig blijven. Daarvoor moet de temperatuur van onder naar boven afnemen: op elke hoogte condenseert de fractie waarvan het kookpunt daar boven de temperatuur ligt.'}]},
eth4:{naam:'Ethanol uit suiker',lijn:'4',
  tekst:'Een oplossing van glucose in water (stroom 1) en gist (stroom 2) worden in R1 geleid. Daar wordt alle glucose omgezet in ethanol en koolstofdioxide. Het gas ontwijkt bovenin. Het mengsel dat R1 verlaat, gaat naar S1, waar de gistcellen worden tegengehouden. In S2 wordt het mengsel verwarmd. De damp die ontstaat, wordt bovenin afgevoerd en gekoeld.',
  vgl:'glucose → ethanol + koolstofdioxide',
  blocks:[B('R1',100,150),B('S1',280,150),B('S2',460,150)],
  streams:[L(1,'IN','R1',[[10,165],[100,165]],['glucose','water']),L(2,'IN','R1',[[10,195],[100,195]],['gist']),
    L(3,'R1','UIT',[[145,150],[145,60]],['co2n']),L(4,'R1','S1',[[190,180],[280,180]],['etoh','water','gist']),
    L(5,'S1','UIT',[[325,210],[325,310]],['gist']),L(6,'S1','S2',[[370,180],[460,180]],['etoh','water']),
    L(7,'S2','UIT',[[505,150],[505,60],[630,60]],['etoh']),L(8,'S2','UIT',[[505,210],[505,310]],['water'])],afl:['zuurstof','zetmeel'],
  w1:[{t:'stoffen',n:4,v:'Geef aan welke stof(fen) zich in stroom 4 bevinden.'},
      {t:'keuze',v:'Op welk verschil in stofeigenschap berust de scheiding in S2?',o:['kookpunt','deeltjesgrootte','dichtheid','adsorptievermogen','oplosbaarheid'],a:0},
      {t:'open',v:'Leg uit welke stof S2 via stroom 7 verlaat.',m:'Ethanol heeft een lager kookpunt (78 °C) dan water (100 °C). Bij verwarmen verdampt dus vooral ethanol: die verlaat S2 bovenin via stroom 7 (met nog een beetje water).'}],
  w3:{hide:{block:'S1'},qs:[{t:'keuze',v:'Geef aan welke scheidingsmethode in de ontbrekende ruimte wordt toegepast.',o:['filtreren','destilleren','indampen','bezinken','extraheren'],a:0},
      {t:'stoffen',n:6,v:'Geef aan welke stof(fen) zich in stroom 6 bevinden.'}]}},
etheen:{naam:'Ethanol uit etheen',lijn:'56',
  tekst:'Etheen (stroom 1) en water (stroom 2) worden in reactor R1 geleid. Daar reageert een deel ervan tot ethanol. Het mengsel dat R1 verlaat, wordt in S1 afgekoeld. Ethanol en water condenseren en worden afgevoerd; etheen blijft gasvormig en wordt teruggevoerd en samengevoegd met stroom 1.',
  vgl:'C₂H₄ + H₂O → C₂H₅OH',
  blocks:[B('R1',200,150),B('S1',400,150)],
  streams:[L(1,'IN','R1',[[60,165],[200,165]],['C2H4']),L(2,'IN','R1',[[60,195],[200,195]],['H2O']),
    L(3,'R1','S1',[[290,180],[400,180]],['C2H4','H2O','C2H5OH']),L(4,'S1','UIT',[[490,180],[600,180]],['C2H5OH','H2O']),
    L(5,'S1','R1',[[445,150],[445,90],[170,90],[170,165]],['C2H4'])],afl:[]},
amm:{naam:'Ammoniak',lijn:'56',

const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function uitleg(wp,lijn){
  const vb=lijn==='4'?'koffie':'etheen';
  const blokken=lijn==='4'
    ?'<li><b>S</b> is een <b>scheidingsruimte</b>: daar worden stoffen van elkaar gescheiden. Er vindt geen reactie plaats.</li><li><b>R</b> is een <b>reactor</b>: daar vindt een chemische reactie plaats.</li>'
    :'<li><b>R</b> is een <b>reactor</b>: daar vindt een chemische reactie plaats.</li><li><b>S</b> is een <b>scheidingsruimte</b>: daar worden stoffen van elkaar gescheiden, zonder reactie.</li>';
  const U={
  1:{t:`<p>Een blokschema laat in één oogopslag zien hoe een proces verloopt. Je leest het met een paar vaste afspraken.</p>
     <div class="kader"><ul style="margin-bottom:0">${blokken}<li>Een <b>pijl</b> is een <b>stofstroom</b>. Het nummer hoort bij die stroom.</li><li>Een pijl die terugloopt naar een eerdere ruimte, is <b>hergebruik</b>.</li></ul></div>
     <h3>Zo pak je het aan</h3><ol><li>Lees de tekst bij het schema en zoek bij elke zin het blok waar die zin over gaat.</li><li>Volg de stoffen: wat gaat er in een ruimte in, wat gebeurt er, en wat gaat eruit?</li></ol>`,
     vb:lijn==='4'?{v:'Geef aan welke stof(fen) zich in stroom 3 bevinden.',s:['Stroom 3 verlaat S1 en loopt de kan in: het is de koffie.','Volgens de tekst lossen de geur- en smaakstoffen op in het water.','Het koffiedik lost niet op en blijft in het filter: dat zit dus niet in stroom 3, maar in stroom 4.','Antwoord: water en geur- en smaakstoffen.']}
                  :{v:'Geef aan welke stoffen zich in stroom 3 bevinden.',s:['Stroom 3 loopt van R1 naar S1: het is het mengsel dat de reactor verlaat.','In R1 ontstaat ethanol, C₂H₅OH.','Volgens de tekst reageert maar een deel van het etheen en water. C₂H₄ en H₂O zitten dus ook in stroom 3.','Antwoord: C₂H₄, H₂O en C₂H₅OH.']}},
  2:{t:`<p>Bij elke stroom horen stoffen. Die kun je afleiden met drie regels.</p>
     <div class="kader"><ol style="margin-bottom:0"><li>In een <b>scheidingsruimte</b> verdwijnen geen stoffen en ontstaan er geen stoffen. Elke stof die erin gaat, komt er via een van de uitgaande stromen weer uit.</li><li>Alleen in een <b>reactor</b> veranderen stoffen: beginstoffen verdwijnen en reactieproducten ontstaan.</li><li>Beginstoffen die in overmaat zijn of niet volledig reageren, zitten óók in de stroom die de reactor verlaat.</li></ol></div>
     <p>Kies in het schema rechts een stroom (of met de nummerknoppen) en zet de stoffen erbij. Een stof kan in meerdere stromen zitten. Niet elke stof uit de lijst hoort in het proces.</p>`,
     vb:lijn==='4'?{v:'Zet bij elke stroom de stoffen.',s:['Stroom 1 en 2 zijn de invoer: gemalen koffie (koffiedik en geur- en smaakstoffen) en water.','S1 is een scheidingsruimte: alles wat erin gaat, komt eruit. De opgeloste stoffen gaan met het water mee (stroom 3).','Het koffiedik blijft achter in het filter (stroom 4). Controle: elke stof uit stroom 1 en 2 komt terug in stroom 3 of 4.']}
                  :{v:'Zet bij elke stroom de stoffen.',s:['Stroom 1: C₂H₄. Stroom 2: H₂O.','R1 is een reactor die niet alles omzet: in stroom 3 zitten C₂H₅OH én de overgebleven C₂H₄ en H₂O.','S1 scheidt op kookpunt: C₂H₅OH en H₂O condenseren (stroom 4), C₂H₄ gaat terug (stroom 5). Controle: elke stof uit stroom 3 komt terug in stroom 4 of 5.']}},
  3:{t:`<p>Bij aanvullen ontbreekt er iets in het schema: een ruimte of een stroom. Loop het schema na met deze controlevragen:</p>
     <div class="kader"><ol style="margin-bottom:0"><li>Komt elke grondstof uit de tekst het proces binnen?</li><li>Verlaat elk product (en elk afvalproduct) het proces?</li><li>Gaat elke stof die een ruimte binnenkomt, er ook weer uit?</li><li>Blijven er beginstoffen over die niet gereageerd hebben? Dan ligt hergebruik voor de hand.</li></ol></div>`,
     vb:lijn==='4'?{v:'In het schema van het koffiezetten ontbreekt stroom 4. Geef aan welke stroom dat is.',s:['Controlevraag 3: in S1 komen koffiedik, geur- en smaakstoffen en water binnen.','Via stroom 3 gaan alleen water en de opgeloste stoffen eruit. Het koffiedik moet er dus nog ergens uit.','Antwoord: een stroom uit S1 naar buiten, met koffiedik.']}
                  :{v:'In het schema van ethanol uit etheen ontbreekt stroom 5. Geef aan welke stroom dat is.',s:['Controlevraag 3: in S1 komen C₂H₄, H₂O en C₂H₅OH binnen, maar via stroom 4 gaan alleen C₂H₅OH en H₂O eruit.','Controlevraag 4: C₂H₄ is een beginstof die niet volledig reageert. Die is te waardevol om weg te gooien.','Antwoord: een stroom van S1 terug naar R1 (of naar stroom 1), met C₂H₄.']}},
  4:{t:`<p>Nu teken je het schema zelf, vanuit de tekst. Gebruik dit stappenplan:</p>
     <div class="kader"><ol style="margin-bottom:0"><li>Haal uit de tekst welke ruimtes er zijn (R en S) en zet ze in de volgorde van het proces.</li><li>Teken de invoerstromen.</li><li>Teken de stromen tussen de ruimtes.</li><li>Teken de afvoerstromen.</li><li>Kijk of er hergebruik is.</li><li>Zet bij elke stroom de stoffen.</li></ol></div>
     <p>Een stroom die wordt teruggevoerd naar een invoerstroom, teken je hier naar de ruimte waar die invoerstroom heen gaat. Controleer je schema daarna met de regels uit werkplaats 2.</p>`,
     vb:lijn==='4'?{v:'Teken het schema van het koffiezetten.',s:['Ruimtes: één scheidingsruimte, S1 (het filter).','Invoer: van buiten naar S1, met koffiedik, geur- en smaakstoffen en water.','Afvoer: van S1 naar buiten met water en geur- en smaakstoffen, en van S1 naar buiten met koffiedik.','Geen hergebruik. Controle: alles wat S1 binnenkomt, gaat er ook weer uit.']}
                  :{v:'Teken het schema van ethanol uit etheen.',s:['Ruimtes: reactor R1 en scheidingsruimte S1.','Invoer: van buiten naar R1, met C₂H₄ en H₂O.','Tussen de ruimtes: van R1 naar S1, met C₂H₄, H₂O en C₂H₅OH.','Afvoer: van S1 naar buiten met C₂H₅OH en H₂O. Hergebruik: van S1 naar R1, met C₂H₄.']}},
  5:{t:`<p>Bij een continu proces stroomt er per uur steeds evenveel in en uit. Daarmee kun je rekenen.</p>
     <div class="kader"><ul style="margin-bottom:0"><li><b>Massabalans:</b> trek een denkbeeldige grens om (een deel van) de fabriek. Er verdwijnt geen massa: de massa die er per uur in gaat, gaat er per uur ook uit.</li><li><b>Omzetting per doorgang:</b> in een reactor reageert vaak maar een deel van wat er binnenkomt. Door hergebruik reageert uiteindelijk wel alle verse grondstof.</li><li><b>Atoomeconomie</b> = ${fr('massa gewenst product','massa alle beginstoffen')} × 100%, met de massa’s volgens de reactievergelijking.</li></ul></div>`,
     vb:{v:'Bij ethanol uit etheen wordt per uur 1,000 kmol etheen vers ingevoerd. Per doorgang reageert 5,0% van het etheen dat R1 binnenkomt. Bereken hoeveel kg etheen per uur wordt teruggevoerd.',s:['Door het hergebruik reageert uiteindelijk alle verse etheen: 1,000 kmol per uur.',`Dat is 5,0% van wat R1 binnenkomt: n(in R1) = ${fr('1,000 kmol','0,050')} = 20 kmol per uur.`,'Teruggevoerd: 20 − 1,000 = 19 kmol per uur.','M(C₂H₄) = 2 × 12,01 + 4 × 1,008 = 28,05 g/mol, dus m = 19 kmol × 28,05 kg/kmol = 5,3·10² kg per uur (2 significante cijfers, door 5,0%).']}}
  };
  return {...U[wp],vbP:vb};
}

function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return(h>>>0)/4294967296}}
function shuf(arr,seed){const r=seeded(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(pid){const p=P[pid];const s=new Set();p.streams.forEach(x=>x.st.forEach(y=>s.add(y)));(p.afl||[]).forEach(y=>s.add(y));return shuf([...s],pid+'pool')}
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));

/* ======================= SCHEMA (SVG) ======================= */
function segMid(pts){let best=null,bl=-1;for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(l>bl){bl=l;best=[(a[0]+b[0])/2,(a[1]+b[1])/2,a[1]===b[1],l]}}return best}
function arrowPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ')}
function schemaSVG(blocks,streams,o={}){
  const id='m'+Math.random().toString(36).slice(2,7);
  let s=`<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Blokschema">
  <defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b2a27"/></marker></defs>`;
  for(const l of streams){if((o.hideS||[]).includes(l.n))continue;
    s+=`<path d="${arrowPath(l.pts)}" fill="none" stroke="#2b2a27" stroke-width="2" marker-end="url(#${id})" ${o.reveal===l.n?'class="nieuw"':''}/>`}
  for(const b of blocks){
    if(o.hideB===b.id){s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="#fffdf8" stroke="#a0701f" stroke-width="2" stroke-dasharray="6 5"/><text x="${b.x+b.w/2}" y="${b.y+b.h/2+7}" text-anchor="middle" font-size="22" font-weight="700" fill="#a0701f">?</text>`;continue}
    s+=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="4" fill="#fff" stroke="#2b2a27" stroke-width="2" ${o.reveal===b.id?'class="nieuw"':''}/><text x="${b.x+b.w/2}" y="${b.y+b.h/2+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2a27">${b.id}</text>`;
  }
  for(const l of streams){if((o.hideS||[]).includes(l.n))continue;
    const [mx,my,hor,len]=segMid(l.pts);
    const sel=o.sel===l.n,res=o.res&&o.res[l.n];
    const stroke=res==='goed'?'#3f8f63':res==='fout'?'#b4473a':sel?'#e2a84b':'#2b2a27';
    const fill=sel?'#e2a84b':'#fff';
    s+=`<g ${o.click?`data-a="kiesstroom" data-n="${l.n}" style="cursor:pointer"`:''}><circle cx="${mx}" cy="${my}" r="12" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${mx}" y="${my+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">${l.n}</text></g>`;
    const txt=o.labels?o.labels(l):null;
    if(txt){const parts=txt.split(', ');const lines=(hor&&txt.length*6.8>len-8)||(!hor&&parts.length>2)?parts:[txt];
      const tx=hor?mx:mx+16;const y0=hor?my-17-(lines.length-1)*14:my+4-(lines.length-1)*7;
      s+=`<text x="${tx}" y="${y0}" text-anchor="${hor?'middle':'start'}" font-size="12.5" fill="${res==='fout'?'#b4473a':'#3e3b35'}" stroke="#fbf8f1" stroke-width="4" paint-order="stroke">${lines.map((t,j)=>`<tspan x="${tx}" ${j?'dy="14"':''}>${esc(t)}</tspan>`).join('')}</text>`}
  }
  return s+'</svg>';
}
const stTxt=arr=>arr.map(x=>ST[x]).join(', ');

/* ======================= BOUWER (W4) ======================= */
function builtGeom(b){
  const n=b.blocks.length;if(!n)return{blocks:[],streams:[]};
  const w=86,h=56,gap=n>1?Math.min(185,(640-150-w)/(n-1)):0,x0=n>1?80:(640-w)/2;
  const pos={},idx={};b.blocks.forEach((bl,i)=>{pos[bl.id]={id:bl.id,x:Math.round(x0+i*gap),y:150,w,h};idx[bl.id]=i});
  const inC={},outC={},fwd={},back={c:0},bel={c:0};const streams=[];
  b.streams.forEach((st,i)=>{
    let pts;const A=pos[st.f],Bb=pos[st.t];
    if(st.f==='IN'){const kk=inC[st.t]=(inC[st.t]||0)+1;
      const j=idx[st.t]===0?kk-2:kk-1;
      pts=(idx[st.t]===0&&kk===1)?[[Bb.x-70,Bb.y+h/2],[Bb.x,Bb.y+h/2]]:[[Bb.x+12+j*22,Bb.y-62],[Bb.x+12+j*22,Bb.y]];}
    else if(st.t==='UIT'){const kk=outC[st.f]=(outC[st.f]||0)+1;
      if(idx[st.f]===n-1&&kk===1)pts=[[A.x+w,A.y+h/2],[A.x+w+64,A.y+h/2]];
      else{const j=idx[st.f]===n-1?kk-2:kk-1;pts=[[A.x+12+j*20,A.y+h],[A.x+12+j*20,A.y+h+66]]}}
    else if(idx[st.f]<idx[st.t]){
      if(idx[st.t]===idx[st.f]+1){const kk=fwd[st.f]=(fwd[st.f]||0)+1;const y=A.y+h/2+(kk-1)*14;pts=[[A.x+w,y],[Bb.x,y]]}
      else{const yb=A.y+h+40+(bel.c++)*14;pts=[[A.x+w-10,A.y+h],[A.x+w-10,yb],[Bb.x+10,yb],[Bb.x+10,Bb.y+h]]}}
    else{const yt=A.y-34-(back.c++)*16;pts=[[A.x+w-14,A.y],[A.x+w-14,yt],[Bb.x+w-14,yt],[Bb.x+w-14,Bb.y]]}
    streams.push({n:i+1,pts,st:st.st});
  });
  return{blocks:Object.values(pos),streams};
}
function modelPairs(pid){const m={};for(const l of P[pid].streams){const key=l.f+'>'+l.t;m[key]=m[key]||new Set();l.st.forEach(x=>m[key].add(x))}return m}
function checkBuilt(pid){
  const b=S.w4[pid];const p=P[pid];const msgs=[];
  const cnt=(arr,ch)=>arr.filter(x=>x.id[0]===ch).length;
  const mR=cnt(p.blocks,'R'),mS=cnt(p.blocks,'S'),sR=cnt(b.blocks,'R'),sS=cnt(b.blocks,'S');
  if(mR!==sR)msgs.push(`Het aantal reactoren klopt nog niet.`);
  if(mS!==sS)msgs.push(`Het aantal scheidingsruimtes klopt nog niet.`);
  const m=modelPairs(pid);const s={};
  for(const st of b.streams){const key=st.f+'>'+st.t;s[key]=s[key]||new Set();st.st.forEach(x=>s[key].add(x))}
  const nm=x=>x==='IN'?'buiten':x==='UIT'?'buiten':x;
  for(const key of Object.keys(m)){const[f,t]=key.split('>');
    if(!s[key])msgs.push(f==='IN'?`Er ontbreekt nog een stroom die het proces binnenkomt.`:t==='UIT'?`Er ontbreekt nog een stroom die uit ${f} naar buiten gaat.`:`Er ontbreekt nog een stroom die uit ${f} komt.`);
    else if(!sameSet([...m[key]],[...s[key]]))msgs.push(`De stoffen in de stroom van ${nm(f)} naar ${nm(t)} kloppen nog niet.`)}
  for(const key of Object.keys(s))if(!m[key]){const[f,t]=key.split('>');msgs.push(`De stroom van ${nm(f)} naar ${nm(t)} hoort niet in dit proces.`)}
  return msgs;
}

/* ======================= GETAL PARSEN ======================= */
function parseNum(txt){
  let t=String(txt).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g,c=>'^'+({'⁰':0,'¹':1,'²':2,'³':3,'⁴':4,'⁵':5,'⁶':6,'⁷':7,'⁸':8,'⁹':9,'⁻':'-'}[c])).replace(/\^\^/g,'^').replace(/\^(-?)\^/g,'^$1');
  t=t.replace(/(\^-?)\^?/g,'$1');
  const m=t.match(/^(-?\d*\.?\d+)(?:[·*x×]10\^?(-?\d+))?$/i);
  if(m)return parseFloat(m[1])*(m[2]?Math.pow(10,+m[2]):1);
  const e=Number(t.replace(/[·×]/g,'*').replace(/\*10\^/,'e'));return isNaN(e)?NaN:e;
}

    h+=`<div class="rij"><input class="in" id="num-${i}" inputmode="decimal" placeholder="bijv. 3,4·10^3" value="${esc(cur.txt||'')}"><span>${q.u}</span><button class="btn" data-a="check" data-k="${key}" data-i="${i}">Controleer</button></div>
      <div class="legenda" style="margin-top:4px">Machten van tien typ je als 3,4·10^3 of 3,4e3.</div>
      ${cur.tries>=2&&!cur.showW?`<button class="btn g klein" style="margin-top:6px" data-a="showw" data-k="${tk}">Toon de uitwerking</button>`:''}
      ${cur.showW?`<div class="uitw">${q.w}</div>`:''}`}
  h+='</div>';
  if(cur.fb)h+=`<div class="fb ${cur.fb[0]}">${cur.fb[1]}</div>`;
  return h+'</div></div>';
}

/* ======================= ACTIES ======================= */
function finishStep(key,i,total,pid){S.steps[key]=i+1;if(i+1>=total)S.prog[key]=true;save()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  const pid=curP();
  switch(a){
    case 'lijn':S.lijn=v;S.tab='uitleg';T={};save();break;
    case 'wp':S.wp=+v;S.tab='uitleg';T={};save();window.scrollTo(0,0);break;
    case 'tab':S.tab=v;save();window.scrollTo(0,0);break;
    case 'opd':S.opd[S.lijn+S.wp]=+v;T={};save();break;
    case 'beamer':document.body.classList.toggle('beamer');return;
    case 'wis':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Zeker weten? Klik nogmaals';return}S.prog={};S.steps={};S.w2={};S.w4={};T={};save();el.dataset.c='';el.textContent='Voortgang wissen';break;
    case 'kies':{const t=T[el.dataset.k]=T[el.dataset.k]||{};t.v=+v;t.fb=null;break}
    case 'multi':{const t=T[el.dataset.k]=T[el.dataset.k]||{};const val=el.dataset.num?+v:v;t.v=t.v||[];t.v=t.v.includes(val)?t.v.filter(x=>x!==val):[...t.v,val];t.fb=null;break}
    case 'check':{
      const key=el.dataset.k,i=+el.dataset.i;const p=P[pid];const qs=S.wp===1?p.w1:S.wp===3?p.w3.qs:p.w5.qs;const q=qs[i];const tk=key+'-'+i;const t=T[tk]=T[tk]||{};
      let ok=false,msg='';
      if(q.t==='keuze'){if(t.v==null){t.fb=['hint','Kies eerst een antwoord.'];break}ok=t.v===q.a;msg=ok?'':'Nog niet goed. Lees de tekst bij het schema nog eens.'}
      if(q.t==='stoffen'){const ans=p.streams.find(l=>l.n===q.n).st;const sel=t.v||[];
        if(!sel.length){t.fb=['hint','Kies eerst een of meer stoffen.'];break}
        ok=sameSet(ans,sel);msg=ok?'':sel.some(x=>!ans.includes(x))?'Er staat een stof bij die niet in deze stroom zit.':'Je mist nog een stof. Denk aan regel 1 en 3 uit werkplaats 2.'}
      if(q.t==='stromen'){const sel=t.v||[];if(!sel.length){t.fb=['hint','Kies eerst een of meer stromen.'];break}
        ok=sameSet(q.a,sel);msg=ok?'':sel.some(x=>!q.a.includes(x))?'Je hebt een stroom gekozen waarin deze stof niet zit.':'Je mist nog een stroom. Volg de stof door het hele schema.'}
      if(q.t==='getal'){const inp=$('#num-'+i);t.txt=inp.value;const x=parseNum(inp.value);
        if(isNaN(x)){t.fb=['hint','Dit getal kan ik niet lezen. Typ bijvoorbeeld 3,4·10^3.'];break}
        ok=Math.abs(x-q.a)/Math.abs(q.a)<=q.tol;t.tries=(t.tries||0)+(ok?0:1);
        if(!ok){const r=x/q.a;msg=(Math.abs(r-1000)<20||Math.abs(r-0.001)<0.00002)?'Je zit er een factor 1000 naast. Kijk naar de eenheden (kg of g, kmol of mol).':'Nog niet goed. Tip: '+q.h}}
      if(ok){t.fb=null;finishStep(key,i,qs.length,pid)}else t.fb=['fout',msg];
      break}
    case 'openshow':{const t=T[el.dataset.k]=T[el.dataset.k]||{};const ta=$('#open-'+el.dataset.i);t.txt=ta?ta.value:'';
      if(!t.txt.trim()){t.fb=['hint','Schrijf eerst je eigen antwoord op, dan pas vergelijken.'];break}t.fb=null;t.show=true;break}
    case 'opendone':{const key=el.dataset.k,i=+el.dataset.i;const p=P[pid];const qs=S.wp===1?p.w1:S.wp===3?p.w3.qs:p.w5.qs;finishStep(key,i,qs.length,pid);break}
    case 'showw':{const t=T[el.dataset.k]=T[el.dataset.k]||{};t.showW=true;break}
    case 'kiesstroom':T.w2sel=+el.dataset.n;break;
    case 'w2stof':{const a=S.w2[pid]=S.w2[pid]||{};const sel=T.w2sel||1;a[sel]=a[sel]||[];a[sel]=a[sel].includes(v)?a[sel].filter(x=>x!==v):[...a[sel],v];T.w2res=null;T.w2fb=null;save();break}
    case 'w2check':{const p=P[pid];const a=S.w2[pid]||{};const r={};let good=0;
      for(const l of p.streams){const ok=sameSet(l.st,a[l.n]||[]);r[l.n]=ok?'goed':'fout';if(ok)good++}
      T.w2res={pid,r};const all=good===p.streams.length;
      T.w2fb={pid,ok:all,m:all?'Alle stromen kloppen. Elke stof die een scheidingsruimte binnenkomt, gaat er ook weer uit.':`${good} van de ${p.streams.length} stromen kloppen. De rode stromen kloppen nog niet.`};
      if(all){S.prog[k(pid)]=true;save()}break}
    case 'addB':{const b=S.w4[pid];let nr=1;while(b.blocks.some(x=>x.id===v+nr))nr++;b.blocks.push({id:v+nr});T.w4fb=null;save();break}
    case 'delB':{const b=S.w4[pid];b.blocks=b.blocks.filter(x=>x.id!==v);b.streams=b.streams.filter(s=>s.f!==v&&s.t!==v);T.w4fb=null;save();break}
    case 'w4stof':{T.w4f=T.w4f||{};readW4();const st=T.w4f.st||[];T.w4f.st=st.includes(v)?st.filter(x=>x!==v):[...st,v];break}
    case 'addS':{readW4();const f=T.w4f;const b=S.w4[pid];T.w4msg='';
      if(f.f===f.t){T.w4msg='Een stroom moet van de ene naar een andere ruimte lopen.';break}
      if(f.f==='IN'&&f.t==='UIT'){T.w4msg='Een stroom van buiten naar buiten gaat niet door het proces.';break}
      if(!(f.st||[]).length){T.w4msg='Kies eerst de stoffen in deze stroom.';break}
      b.streams.push({f:f.f,t:f.t,st:f.st.slice()});T.w4f={f:f.f,t:f.t,st:[]};T.w4fb=null;save();break}
    case 'delS':{S.w4[pid].streams.splice(+v,1);T.w4fb=null;save();break}
    case 'w4check':{const msgs=checkBuilt(pid);const ok=!msgs.length;
      T.w4fb={pid,ok,m:ok?'Je schema klopt! Rechts staat ter vergelijking het modelschema.':msgs.slice(0,3).join('<br>')+(msgs.length>3?`<br>(en nog ${msgs.length-3} punt${msgs.length-3>1?'en':''})`:'')};
      if(ok){S.prog[k(pid)]=true;save()}break}
    default:return;
  }
  render();
});
function readW4(){const f=$('#w4f'),t=$('#w4t');T.w4f=T.w4f||{};if(f)T.w4f.f=f.value;if(t)T.w4f.t=t.value}
document.addEventListener('change',e=>{if(e.target.id==='w4f'||e.target.id==='w4t')readW4()});
document.addEventListener('input',e=>{const m=e.target.id&&e.target.id.match(/^(open|num)-(\d+)$/);if(m){const tk=k(curP())+'-'+m[2];T[tk]=T[tk]||{};T[tk].txt=e.target.value}});

render();
window.__bs={P,S:()=>S,T:()=>T,render,checkBuilt,parseNum,builtGeom};
}
</script>
