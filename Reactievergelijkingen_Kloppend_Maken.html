<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reactievergelijkingen oefenen</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f7f8fa; --border:#dfe3e8;
  --text:#1f2933; --muted:#64707d; --primary:#1c6fae; --primary-soft:#e5f1fa;
  --good:#2f9e57; --good-soft:#e5f6ea; --bad:#c94b4b; --bad-soft:#fbe9e7; --warn:#a15c00; --warn-soft:#fff6e0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
h1{font-size:1.3rem;}
.sub{color:var(--muted);font-size:.9rem;}
.scores{display:flex;gap:1.2rem;font-size:.9rem;}
.scores span b{font-size:1rem;}
main{max-width:980px;margin:0 auto;padding:1.5rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:1.2rem;}
h2{font-size:1.1rem;margin-bottom:.6rem;}
h3{font-size:.95rem;margin:1rem 0 .5rem;}
.keuzes{display:flex;flex-wrap:wrap;gap:.6rem;}
.keuze{border:1.5px solid var(--border);border-radius:10px;padding:.7rem 1rem;cursor:pointer;background:var(--surface);min-width:120px;}
.keuze.sel{border-color:var(--primary);background:var(--primary-soft);}
.keuze b{display:block;font-size:1rem;}
.keuze small{color:var(--muted);font-size:.8rem;}
.soorten label{display:flex;align-items:flex-start;gap:.6rem;border:1px solid var(--border);border-radius:8px;padding:.55rem .8rem;margin-bottom:.4rem;cursor:pointer;background:var(--surface2);font-size:.92rem;}
.soorten small{color:var(--muted);display:block;}
button{font:inherit;cursor:pointer;border-radius:8px;padding:.6rem 1.1rem;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:600;}
button.sec{background:var(--surface2);color:var(--text);border-color:var(--border);}
button:disabled{opacity:.45;cursor:not-allowed;}
.rij{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;align-items:center;}
.beschrijving{font-size:1.02rem;line-height:1.55;margin:.3rem 0 1rem;}
.meta{color:var(--muted);font-size:.85rem;}
.vergelijking{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:1rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;}
.term{display:flex;align-items:center;gap:.25rem;border:1.5px solid transparent;border-radius:8px;padding:.2rem;}
.term.goed{border-color:var(--good);background:var(--good-soft);}
.term.fout{border-color:var(--bad);background:var(--bad-soft);}
.coef{width:2.6rem;text-align:center;font-size:1.1rem;padding:.35rem;border:1px solid #b9c1ca;border-radius:6px;}
.form{width:8.5rem;font-size:1.05rem;padding:.35rem .5rem;border:1px solid #b9c1ca;border-radius:6px;font-family:inherit;}
.formvast{font-size:1.15rem;padding:0 .2rem;}
.plus,.pijl{font-size:1.2rem;color:var(--muted);}
.pijl{font-size:1.4rem;padding:0 .3rem;}
.fb{margin-top:1rem;padding:.9rem 1rem;border-radius:10px;font-size:.95rem;line-height:1.55;display:none;}
.fb.goed{display:block;background:var(--good-soft);border:1px solid #b8e0c6;}
.fb.fout{display:block;background:var(--bad-soft);border:1px solid #f0c3bd;}
.fb.info{display:block;background:var(--warn-soft);border:1px solid #f0d9a8;}
.balans{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
.balans span{border:1px solid var(--border);border-radius:6px;padding:.15rem .5rem;font-size:.85rem;background:#fff;}
.telling{margin-top:.8rem;border-collapse:collapse;font-size:.92rem;}
.telling th,.telling td{border:1px solid var(--border);padding:.25rem .8rem;text-align:center;background:#fff;}
.telling th{background:var(--surface2);font-weight:600;}
.telling td.ok{color:var(--good);font-weight:600;} .telling td.nok{color:var(--bad);font-weight:600;}
.schakel{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;color:var(--muted);margin-top:.7rem;cursor:pointer;}
.balans span.ok{border-color:#9fd4b2;} .balans span.nok{border-color:#e6a49b;color:var(--bad);}
.model{font-size:1.1rem;margin-top:.5rem;}
.uitleg{font-size:.85rem;color:var(--muted);margin-top:.5rem;}
.voortgang{height:6px;background:var(--surface2);border-radius:3px;margin-top:1rem;overflow:hidden;}
.voortgang div{height:100%;background:var(--primary);}
.rapport-rij{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:.45rem 0;font-size:.92rem;gap:1rem;}
.st-goed{color:var(--good);} .st-hint{color:var(--warn);} .st-fout{color:var(--bad);}
</style>
<style id="huisstijl">
:root{--hs-acc:#1F5FBF;--hs-acc-d:#174a96;--hs-soft:#E8F0FC;--hs-given:#F3F7FD;--hs-ok:#1A7F37;--hs-ok-soft:#E4F4E8;
--hs-err:#C62828;--hs-err-soft:#FDECEC;--hs-key:#FFF0A0;--hs-muted:#595959;--hs-line:#D5DCE8;--hs-bg:#F6F8FB;--hs-card:#fff;
--hs-text:#1d2330;--hs-font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{background:var(--hs-bg)!important;color:var(--hs-text)}
body{font-family:var(--hs-font)!important}
.hs-header{display:block!important;background:var(--hs-acc)!important;color:#fff;margin-bottom:18px;padding:0!important;border:none!important;border-radius:0!important}
.hs-header .hs-wrap{max-width:var(--hs-max,1100px);margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hs-header h1{margin:0!important;padding:0!important;font-size:1.5rem!important;font-weight:650!important;color:#fff!important;text-align:left!important;letter-spacing:.2px;font-family:var(--hs-font)!important}
.hs-header h1{flex:1 1 auto}
.hs-header button{flex:0 0 auto;width:auto!important;margin:0!important;box-shadow:none!important;font-weight:500!important;font-family:var(--hs-font)!important;font-size:.95rem;cursor:pointer;border-radius:7px;padding:6px 14px!important;border:1.5px solid #fff!important;background:transparent!important;color:#fff!important}
.hs-header button:hover{background:rgba(255,255,255,.15)}
body.hs-beamer>*:not(.hs-header):not(.hs-own):not(script):not(.hs-nozoom){zoom:1.3}
.hs-own{background:var(--hs-acc)!important;color:#fff!important;border:none!important}
.hs-own h1{color:#fff!important;font-family:var(--hs-font)!important}
.hs-own .sub,.hs-own .subtitle{color:rgba(255,255,255,.85)!important}
.hs-own>button:last-child{font:inherit;font-size:.95rem;cursor:pointer;border-radius:7px;padding:6px 14px;border:1.5px solid #fff;background:transparent;color:#fff;margin-left:auto;flex:0 0 auto}
.hs-own>button:last-child:hover{background:rgba(255,255,255,.15)}

:root{--bg:#F6F8FB;--border:#D5DCE8;--surface2:#F3F7FD;--text:#1d2330;--muted:#595959;--primary:#1F5FBF;--primary-soft:#E8F0FC;--good:#1A7F37;--good-soft:#E4F4E8;--bad:#C62828;--bad-soft:#FDECEC}
.hs-own .scores span,.hs-own .scores b{color:#fff!important}
</style>
</head>
<body>
<header>
  <div><h1>Reactievergelijkingen oefenen</h1><div class="sub">Kloppend maken en opstellen — 3 t/m 6 vwo</div></div>
  <div class="scores" id="scores" style="display:none">
    <span class="st-goed">goed: <b id="sc-goed">0</b></span>
    <span class="st-hint">met hint: <b id="sc-hint">0</b></span>
    <span class="st-fout">fout: <b id="sc-fout">0</b></span>
  </div>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   REACTIES
   Notatie in de data: coëfficiënt, formule, lading met ^ (Cu^2+, NO3^-), toestand tussen haakjes.
   klas = vanaf welke klas de reactie past; soort = reactiesoort (zie SOORTEN).
   ===================================================================== */
const SOORTEN = {
  verbranden: {klas:3, naam:'Verbranden', uitleg:'stoffen reageren met zuurstof'},
  ontleden:   {klas:3, naam:'Ontleden', uitleg:'één stof valt uiteen in andere stoffen'},
  vormen:     {klas:3, naam:'Vorming uit elementen en andere vormingsreacties', uitleg:'twee of meer stoffen vormen één nieuwe stof'},

  zouten:     {klas:4, naam:'Zouten oplossen en indampen', uitleg:'ionen in oplossing'},
  neerslag:   {klas:4, naam:'Neerslagreacties', uitleg:'ionen vormen samen een vast zout'},
  metalen:    {klas:4, naam:'Metalen met zuurstof of niet-metalen', uitleg:'er ontstaat een zout'},
  zoutontl:   {klas:4, naam:'Zouten ontleden en elektrolyse', uitleg:'bijv. kalk branden, aluminiumproductie'},
  zuurbase:   {klas:5, naam:'Zuur-base', uitleg:'met H₃O⁺ en OH⁻'},
  redox:      {klas:5, naam:'Redox', uitleg:'elektronenoverdracht, met H⁺ volgens Binas 48'},
  organisch:  {klas:6, naam:'Organische reacties', uitleg:'additie, substitutie, verestering, hydrolyse'},
};
const R = [
  // ---------------- 3V: verbranden ----------------
  ['verbranden',3,'CH4(g) + 2 O2(g) -> CO2(g) + 2 H2O(l)','Methaan verbrandt volledig: methaan reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'2 C2H6(g) + 7 O2(g) -> 4 CO2(g) + 6 H2O(l)','Ethaan (C₂H₆) verbrandt volledig: ethaan reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'C3H8(g) + 5 O2(g) -> 3 CO2(g) + 4 H2O(l)','Propaan (C₃H₈) verbrandt volledig: propaan reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'2 C4H10(g) + 13 O2(g) -> 8 CO2(g) + 10 H2O(l)','Butaan (C₄H₁₀) verbrandt volledig: butaan reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'C2H6O(l) + 3 O2(g) -> 2 CO2(g) + 3 H2O(l)','Alcohol (ethanol) verbrandt volledig: ethanol reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'C6H12O6(s) + 6 O2(g) -> 6 CO2(g) + 6 H2O(l)','In je lichaam wordt glucose "verbrand": glucose reageert met zuurstof tot koolstofdioxide en water.'],
  ['verbranden',3,'2 CH4(g) + 3 O2(g) -> 2 CO(g) + 4 H2O(l)','Onvolledige verbranding: methaan reageert met te weinig zuurstof tot koolstofmono-oxide en water.'],
  ['verbranden',3,'2 H2(g) + O2(g) -> 2 H2O(l)','Waterstof verbrandt: waterstof reageert met zuurstof tot water.'],
  ['verbranden',3,'C(s) + O2(g) -> CO2(g)','Koolstof verbrandt: koolstof reageert met zuurstof tot koolstofdioxide.'],
  ['verbranden',3,'S(s) + O2(g) -> SO2(g)','Zwavel verbrandt: zwavel reageert met zuurstof tot zwaveldioxide.'],
  ['verbranden',3,'4 NH3(g) + 3 O2(g) -> 2 N2(g) + 6 H2O(l)','Ammoniak verbrandt: ammoniak reageert met zuurstof tot stikstof en water.'],
  ['verbranden',3,'CS2(l) + 3 O2(g) -> CO2(g) + 2 SO2(g)','Koolstofdisulfide verbrandt: koolstofdisulfide reageert met zuurstof tot koolstofdioxide en zwaveldioxide.'],
  // ---------------- 3V: ontleden ----------------
  ['ontleden',3,'2 H2O(l) -> 2 H2(g) + O2(g)','Elektrolyse van water: water wordt ontleed in waterstof en zuurstof.'],
  ['ontleden',3,'2 H2O2(l) -> 2 H2O(l) + O2(g)','Waterstofperoxide (H₂O₂) ontleedt in water en zuurstof.'],
  ['ontleden',3,'2 NH3(g) -> N2(g) + 3 H2(g)','Ammoniak wordt ontleed in stikstof en waterstof.'],
  ['ontleden',3,'2 HgO(s) -> 2 Hg(l) + O2(g)','Lavoisier verhitte kwikoxide (HgO): het ontleedt in kwik en zuurstof.'],
  ['ontleden',3,'C6H12O6(s) -> 6 C(s) + 6 H2O(l)','Glucose verkoolt bij sterk verhitten: het ontleedt in koolstof en water.'],
  ['ontleden',3,'N2H4(l) -> N2(g) + 2 H2(g)','Hydrazine (N₂H₄) wordt ontleed in stikstof en waterstof.'],
  ['ontleden',3,'2 HCl(g) -> H2(g) + Cl2(g)','Waterstofchloride wordt ontleed in waterstof en chloor.'],
  // ---------------- 3V: vormen ----------------
  ['vormen',3,'N2(g) + 3 H2(g) -> 2 NH3(g)','Stikstof reageert met waterstof tot ammoniak.'],
  ['vormen',3,'H2(g) + Cl2(g) -> 2 HCl(g)','Waterstof reageert met chloor tot waterstofchloride.'],
  ['vormen',3,'N2(g) + O2(g) -> 2 NO(g)','In een automotor reageert stikstof met zuurstof tot stikstofmono-oxide.'],
  ['vormen',3,'2 NO(g) + O2(g) -> 2 NO2(g)','Stikstofmono-oxide reageert met zuurstof tot stikstofdioxide.'],

  ['vormen',3,'C(s) + 2 S(s) -> CS2(l)','Koolstof reageert met zwavel tot koolstofdisulfide.'],

  ['overig3',3,'CO(g) + H2O(g) -> CO2(g) + H2(g)','Koolstofmono-oxide reageert met stoom tot koolstofdioxide en waterstof.'],
  // ---------------- 4V: zouten oplossen en indampen ----------------
  ['zouten',4,'NaCl(s) -> Na^+(aq) + Cl^-(aq)','Natriumchloride (keukenzout) lost op in water.'],
  ['zouten',4,'CaCl2(s) -> Ca^2+(aq) + 2 Cl^-(aq)','Calciumchloride lost op in water.'],
  ['zouten',4,'Al2(SO4)3(s) -> 2 Al^3+(aq) + 3 SO4^2-(aq)','Aluminiumsulfaat lost op in water.'],
  ['zouten',4,'K3PO4(s) -> 3 K^+(aq) + PO4^3-(aq)','Kaliumfosfaat lost op in water.'],
  ['zouten',4,'(NH4)2SO4(s) -> 2 NH4^+(aq) + SO4^2-(aq)','Ammoniumsulfaat (kunstmest) lost op in water.'],
  ['zouten',4,'Fe(NO3)3(s) -> Fe^3+(aq) + 3 NO3^-(aq)','IJzer(III)nitraat lost op in water.'],
  ['zouten',4,'2 Na^+(aq) + CO3^2-(aq) -> Na2CO3(s)','Een oplossing van natriumcarbonaat wordt ingedampt: er ontstaat vast natriumcarbonaat.'],
  ['zouten',4,'Mg^2+(aq) + 2 Cl^-(aq) -> MgCl2(s)','Een oplossing van magnesiumchloride wordt ingedampt: er ontstaat vast magnesiumchloride.'],
  // ---------------- 4V: neerslag ----------------
  ['neerslag',4,'Ag^+(aq) + Cl^-(aq) -> AgCl(s)','Zilverionen en chloride-ionen vormen een neerslag van zilverchloride.'],
  ['neerslag',4,'Ba^2+(aq) + SO4^2-(aq) -> BaSO4(s)','Bariumionen en sulfaationen vormen een neerslag van bariumsulfaat.'],
  ['neerslag',4,'Pb^2+(aq) + 2 I^-(aq) -> PbI2(s)','Lood(II)ionen en jodide-ionen vormen een gele neerslag van lood(II)jodide.'],
  ['neerslag',4,'Ca^2+(aq) + CO3^2-(aq) -> CaCO3(s)','Calciumionen en carbonaationen vormen een neerslag van calciumcarbonaat.'],
  ['neerslag',4,'Fe^3+(aq) + 3 OH^-(aq) -> Fe(OH)3(s)','IJzer(III)ionen en hydroxide-ionen vormen een neerslag van ijzer(III)hydroxide.'],
  ['neerslag',4,'Cu^2+(aq) + 2 OH^-(aq) -> Cu(OH)2(s)','Koper(II)ionen en hydroxide-ionen vormen een blauwe neerslag van koper(II)hydroxide.'],
  ['neerslag',4,'3 Ca^2+(aq) + 2 PO4^3-(aq) -> Ca3(PO4)2(s)','Calciumionen en fosfaationen vormen een neerslag van calciumfosfaat.'],
  ['neerslag',4,'Mg^2+(aq) + 2 OH^-(aq) -> Mg(OH)2(s)','Magnesiumionen en hydroxide-ionen vormen een neerslag van magnesiumhydroxide.'],
  ['neerslag',4,'2 Ag^+(aq) + CO3^2-(aq) -> Ag2CO3(s)','Zilverionen en carbonaationen vormen een neerslag van zilvercarbonaat.'],
  // ---------------- 4V: metalen ----------------
  ['metalen',4,'2 Mg(s) + O2(g) -> 2 MgO(s)','Magnesium verbrandt: magnesium reageert met zuurstof tot magnesiumoxide.'],
  ['metalen',4,'4 Al(s) + 3 O2(g) -> 2 Al2O3(s)','Aluminium reageert met zuurstof tot aluminiumoxide.'],
  ['metalen',4,'4 Fe(s) + 3 O2(g) -> 2 Fe2O3(s)','IJzer reageert met zuurstof tot ijzer(III)oxide.'],
  ['metalen',4,'2 Cu(s) + O2(g) -> 2 CuO(s)','Koper reageert met zuurstof tot koper(II)oxide.'],
  ['metalen',4,'4 Na(s) + O2(g) -> 2 Na2O(s)','Natrium reageert met zuurstof tot natriumoxide.'],

  ['metalen',4,'2 Fe(s) + 3 Cl2(g) -> 2 FeCl3(s)','IJzer reageert met chloor tot ijzer(III)chloride.'],
  ['metalen',4,'2 Al(s) + 3 Br2(l) -> 2 AlBr3(s)','Aluminium reageert met broom tot aluminiumbromide.'],

  ['zoutontl',4,'2 NaHCO3(s) -> Na2CO3(s) + H2O(g) + CO2(g)','Bakpoeder: natriumwaterstofcarbonaat ontleedt bij verwarmen in natriumcarbonaat, water en koolstofdioxide.'],
  ['zoutontl',4,'CuCO3(s) -> CuO(s) + CO2(g)','Koper(II)carbonaat ontleedt bij verwarmen in koper(II)oxide en koolstofdioxide.'],
  ['zoutontl',4,'2 NaCl(l) -> 2 Na(l) + Cl2(g)','Elektrolyse van gesmolten natriumchloride: er ontstaan natrium en chloor.'],

  // ---------------- 5V: zuur-base ----------------
  ['zuurbase',5,'H3O^+(aq) + OH^-(aq) -> 2 H2O(l)','Een sterk zuur (H₃O⁺) reageert met een sterke base (OH⁻) tot water.'],
  ['zuurbase',5,'2 H3O^+(aq) + CO3^2-(aq) -> 3 H2O(l) + CO2(g)','Zoutzuur reageert met een oplossing van natriumcarbonaat: H₃O⁺ en carbonaationen reageren tot water en koolstofdioxide.'],
  ['zuurbase',5,'H3O^+(aq) + HCO3^-(aq) -> 2 H2O(l) + CO2(g)','H₃O⁺ reageert met waterstofcarbonaationen tot water en koolstofdioxide.'],
  ['zuurbase',5,'H3O^+(aq) + NH3(aq) -> NH4^+(aq) + H2O(l)','H₃O⁺ reageert met ammoniak tot ammoniumionen en water.'],
  ['zuurbase',5,'CH3COOH(aq) + OH^-(aq) -> CH3COO^-(aq) + H2O(l)','Azijnzuur (ethaanzuur, CH₃COOH) reageert met hydroxide-ionen tot ethanoaationen en water.'],
  ['zuurbase',5,'NH4^+(aq) + OH^-(aq) -> NH3(aq) + H2O(l)','Ammoniumionen reageren met hydroxide-ionen tot ammoniak en water.'],
  ['zuurbase',5,'Mg(OH)2(s) + 2 H3O^+(aq) -> Mg^2+(aq) + 4 H2O(l)','Vast magnesiumhydroxide reageert met H₃O⁺ tot magnesiumionen en water.'],
  ['zuurbase',5,'CaCO3(s) + 2 H3O^+(aq) -> Ca^2+(aq) + 3 H2O(l) + CO2(g)','Marmer (calciumcarbonaat) reageert met H₃O⁺ tot calciumionen, water en koolstofdioxide.'],
  ['zuurbase',5,'CaO(s) + 2 H3O^+(aq) -> Ca^2+(aq) + 3 H2O(l)','Calciumoxide reageert met H₃O⁺ tot calciumionen en water.'],
  ['zuurbase',5,'H3PO4(aq) + 3 OH^-(aq) -> PO4^3-(aq) + 3 H2O(l)','Fosforzuur (H₃PO₄) reageert volledig met hydroxide-ionen tot fosfaationen en water.'],
  ['zuurbase',5,'NH3(aq) + H2O(l) -> NH4^+(aq) + OH^-(aq)','Ammoniak reageert als base met water tot ammoniumionen en hydroxide-ionen.'],

/* =====================================================================
   FORMULES LEZEN
   ===================================================================== */
function samenstelling(f){
  const stack=[{}]; let i=0;
  while(i<f.length){
    const ch=f[i];
    if(ch==='('){ stack.push({}); i++; }
    else if(ch===')'){ const top=stack.pop(); i++; let n=''; while(i<f.length&&/\d/.test(f[i])) n+=f[i++]; const k=n?parseInt(n):1; const cur=stack[stack.length-1]; for(const e in top) cur[e]=(cur[e]||0)+top[e]*k; }
    else if(/[A-Z]/.test(ch)){ let el=ch; i++; if(i<f.length&&/[a-z]/.test(f[i])) el+=f[i++]; let n=''; while(i<f.length&&/\d/.test(f[i])) n+=f[i++]; const cur=stack[stack.length-1]; cur[el]=(cur[el]||0)+(n?parseInt(n):1); }
    else return null;   // onbekend teken
  }
  return stack.length===1 ? stack[0] : null;
}
// Een deeltje uit de data: "Cu^2+(aq)" -> {f:'Cu', lading:2, fase:'aq'}
function leesData(term){
  let m = term.match(/^(\d+)\s+(.*)$/); let c = 1; if(m){ c=parseInt(m[1]); term=m[2]; }
  let fase=''; const fm = term.match(/\((s|l|g|aq)\)$/); if(fm){ fase=fm[1]; term=term.slice(0,-fm[0].length); }
  let lading=0; const lm = term.match(/\^(\d*)([+-])$/); if(lm){ lading=(lm[1]?parseInt(lm[1]):1)*(lm[2]==='+'?1:-1); term=term.slice(0,-lm[0].length); }
  return {c, f:term, lading, fase, sam:samenstelling(term)};
}
const REACTIES = R.map(([soort,klas,vgl,woorden],i)=>{
  const [l,r] = vgl.split('->').map(s=>s.trim().split(' + ').map(t=>leesData(t.trim())));
  return {id:i, soort, klas, woorden, links:l, rechts:r};
});
// Wat een leerling intypt: subscript-cijfers, superscript, (aq) enzovoort mogen.
const SUB='₀₁₂₃₄₅₆₇₈₉', SUP='⁰¹²³⁴⁵⁶⁷⁸⁹';
function leesInvoer(s){
  s = s.replace(/\s/g,'').replace(/[₀₁₂₃₄₅₆₇₈₉]/g,ch=>SUB.indexOf(ch)).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+[...m].map(ch=>SUP.indexOf(ch)).join('')).replace(/⁺/g,'+').replace(/[⁻−]/g,'-');
    s = s.replace(/\((s|l|g|aq)\)$/i,'');
  const opties = [];
  let m = s.match(/^(.*)\^(\d*)([+-])$/);
  if(m){ opties.push({f:m[1], lading:(m[2]?parseInt(m[2]):1)*(m[3]==='+'?1:-1)}); }
  else if((m = s.match(/^(.*?)([+-])$/))){
    const kern = m[1], teken = m[3] || m[2], sgn = m[2]==='+'?1:-1;
    opties.push({f:kern, lading:sgn});                                      // NO3- : lading 1-
    const d = kern.match(/^(.+)(\d)$/); if(d) opties.push({f:d[1], lading:parseInt(d[2])*sgn}); // Cu2+ : lading 2+
  } else opties.push({f:s, lading:0});
  return opties.map(o=>({...o, sam:samenstelling(o.f)})).filter(o=>o.sam);
}
function zelfdeDeeltje(invoerOpties, verwacht){
  return invoerOpties.some(o=>o.lading===verwacht.lading && gelijkeSam(o.sam, verwacht.sam));
}
function gelijkeSam(a,b){ const ks=new Set([...Object.keys(a),...Object.keys(b)]); for(const k of ks) if((a[k]||0)!==(b[k]||0)) return false; return true; }
// Weergave: subscripts en lading als superscript
function html(d, metFase){
  let s = d.f.replace(/(\d+)/g,'<sub>$1</sub>');
  if(d.lading){ const n=Math.abs(d.lading); s += `<sup>${n>1?n:''}${d.lading>0?'+':'−'}</sup>`; }
  if(metFase && d.fase) s += `<span style="color:var(--muted);font-size:.85em">(${d.fase})</span>`;
  return s;
}
function vergelijkingHTML(r, metFase=true){
  const kant = ds=>ds.map(d=>(d.c>1?d.c+' ':'')+html(d,metFase)).join(' + ');
  return kant(r.links)+' → '+kant(r.rechts);
}

let klas=null, gekozenSoorten=new Set(), modus='makkelijk', aantal=10, telAan=true;
let sessie=[], idx=0, huidig=null, hintGebruikt=false, beoordeeld=false, resultaten=[];
const app = document.getElementById('app');

function startScherm(){
  document.getElementById('scores').style.display='none';
  const soortenHTML = klas ? Object.entries(SOORTEN).filter(([k,s])=>s.klas<=klas).map(([k,s])=>`
      <label><input type="checkbox" data-soort="${k}" ${gekozenSoorten.has(k)?'checked':''}>
      <span><b>${s.naam}</b> <small>${s.uitleg} · ${REACTIES.filter(r=>r.soort===k).length} reacties</small></span></label>`).join('') : '';
  const beschikbaar = REACTIES.filter(r=>gekozenSoorten.has(r.soort)).length;
  app.innerHTML = `
  <div class="card">
    <h2>1. In welke klas zit je?</h2>
    <div class="keuzes">${[3,4,5,6].map(k=>`<div class="keuze ${klas===k?'sel':''}" onclick="kiesKlas(${k})"><b>${k} vwo</b><small>${{3:'molecuulformules',4:'+ zouten en ionen',5:'+ zuur-base en redox',6:'+ organische reacties'}[k]}</small></div>`).join('')}</div>
    ${klas ? `<h3>2. Welke reacties wil je oefenen?</h3><div class="soorten">${soortenHTML}</div>

    <div class="keuzes">
      <div class="keuze ${modus==='makkelijk'?'sel':''}" onclick="kiesModus('makkelijk')"><b>Kloppend maken</b><small>De formules staan er al, jij vult de coëfficiënten in.</small></div>
      <div class="keuze ${modus==='moeilijk'?'sel':''}" onclick="kiesModus('moeilijk')"><b>Opstellen</b><small>Je leest de reactie in woorden en vult zelf formules én coëfficiënten in.</small></div>
    </div>
    <h3>4. Hoeveel reacties?</h3>
    <div class="keuzes">${[5,10,15,20].map(n=>`<div class="keuze ${aantal===n?'sel':''}" onclick="kiesAantal(${n})"><b>${n}</b><small>${n>beschikbaar?'(max. '+beschikbaar+')':''}</small></div>`).join('')}</div>
    <div class="rij"><button onclick="startSessie()" ${beschikbaar?'':'disabled'}>Start</button></div>` : ''}
  </div>`;
  app.querySelectorAll('[data-soort]').forEach(c=>c.addEventListener('change',()=>{ c.checked?gekozenSoorten.add(c.dataset.soort):gekozenSoorten.delete(c.dataset.soort); startScherm(); }));
}
function kiesKlas(k){ klas=k; telAan = (k===3); gekozenSoorten = new Set(Object.keys(SOORTEN).filter(s=>SOORTEN[s].klas<=k)); startScherm(); }
function kiesModus(m){ modus=m; startScherm(); }
function kiesAantal(n){ aantal=n; startScherm(); }

function startSessie(){
  const pool = REACTIES.filter(r=>gekozenSoorten.has(r.soort));
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  sessie = pool.slice(0, Math.min(aantal, pool.length)); idx=0; resultaten=[];
  document.getElementById('scores').style.display='flex'; updateScores();
  toonReactie();
}

function toonReactie(){
  huidig = sessie[idx]; hintGebruikt=false; beoordeeld=false;
  const vak = (d, kant, i)=>`<div class="term" id="t-${kant}-${i}"><input class="coef" id="c-${kant}-${i}" placeholder=" " autocomplete="off">` +
     (modus==='makkelijk' ? `<span class="formvast">${html(d,false)}</span>` : `<input class="form" id="f-${kant}-${i}" placeholder="formule" autocomplete="off">`) + `</div>`;
  const kantHTML = (ds,kant)=>ds.map((d,i)=>vak(d,kant,i)).join('<span class="plus">+</span>');
  app.innerHTML = `
  <div class="card">
    <div class="meta">Reactie ${idx+1} van ${sessie.length} · ${SOORTEN[huidig.soort].naam}</div>
    <div class="beschrijving">${huidig.woorden}</div>
    <div class="vergelijking">${kantHTML(huidig.links,'l')}<span class="pijl">→</span>${kantHTML(huidig.rechts,'r')}</div>
    <label class="schakel"><input type="checkbox" id="telSchakel" ${telAan?'checked':''}> atomen tellen</label>
    <div id="telling"></div>
    <div class="uitleg">${modus==='makkelijk'?'Vul de kleinste gehele getallen in. Een 1 mag je leeg laten.':'Vul formules en coëfficiënten in. Ionen schrijf je als Cu2+, NO3- of Cu^2+. Toestandsaanduidingen zoals (aq) mogen, maar hoeven niet.'}</div>
    <div class="rij">
      <button class="sec" id="hintBtn" onclick="hint()">Hint</button>
      <button id="checkBtn" onclick="controleer()">Controleer</button>
      <button class="sec" id="nextBtn" onclick="volgende()" disabled>Volgende →</button>
    </div>
    <div class="fb" id="fb"></div>
    <div class="voortgang"><div style="width:${idx/sessie.length*100}%"></div></div>
  </div>`;
  const eerste = app.querySelector('input'); if(eerste) eerste.focus();
  app.querySelectorAll('.coef,.form').forEach(inp=>inp.addEventListener('input',updateTelling));
  document.getElementById('telSchakel').addEventListener('change',e=>{ telAan=e.target.checked; updateTelling(); });
  updateTelling();
  app.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ beoordeeld ? volgende() : controleer(); } }));
}

// Telling die meeloopt: per atoomsoort (en lading) links en rechts, op basis van wat er nu is ingevuld.
function updateTelling(){
  const box = document.getElementById('telling'); if(!box) return;
  if(!telAan){ box.innerHTML=''; return; }
  const volgorde = []; [...huidig.links,...huidig.rechts].forEach(d=>Object.keys(d.sam).forEach(e=>{ if(!volgorde.includes(e)) volgorde.push(e); }));
  let onleesbaar = false;
  const tel = (ds,kant)=>{ const t={}; let q=0;
    ds.forEach((d,i)=>{
      const cRaw = document.getElementById(`c-${kant}-${i}`).value.trim();
      const c = cRaw==='' ? 1 : (/^\d+$/.test(cRaw) ? parseInt(cRaw) : NaN);
      let deel;
      if(modus==='makkelijk') deel = d;
      else { const fRaw = document.getElementById(`f-${kant}-${i}`).value.trim(); if(!fRaw) return;
        const opties = leesInvoer(fRaw); if(!opties.length){ onleesbaar=true; return; }
        deel = opties.find(o=>[...huidig.links,...huidig.rechts].some(v=>v.lading===o.lading && gelijkeSam(v.sam,o.sam))) || opties.find(o=>/^[A-Z][a-z]?$/.test(o.f)) || opties[0]; }
      if(isNaN(c)) return;
      for(const e in deel.sam){ t[e]=(t[e]||0)+deel.sam[e]*c; if(!volgorde.includes(e)) volgorde.push(e); }
      q += (deel.lading||0)*c;
    }); return {t,q}; };
  const L = tel(huidig.links,'l'), Rr = tel(huidig.rechts,'r');
  const metLading = [...huidig.links,...huidig.rechts].some(d=>d.lading) || L.q || Rr.q;
  const rij = (naam,a,b)=>{ const ok=a===b; return `<tr><th>${naam}</th><td>${a}</td><td class="${ok?'ok':'nok'}">${b} ${ok?'✓':'✗'}</td></tr>`; };
  const fmtQ = q=> q>0?q+'+':(q<0?(-q)+'−':'0');
  box.innerHTML = `<table class="telling"><tr><th>atoom</th><th>links</th><th>rechts</th></tr>` +
    volgorde.filter(e=>(L.t[e]||0)||(Rr.t[e]||0)).map(e=>rij(e,L.t[e]||0,Rr.t[e]||0)).join('') +
    (metLading ? `<tr><th>lading</th><td>${fmtQ(L.q)}</td><td class="${L.q===Rr.q?'ok':'nok'}">${fmtQ(Rr.q)} ${L.q===Rr.q?'✓':'✗'}</td></tr>` : '') +
    `</table>` + (onleesbaar ? `<div class="uitleg">Een formule kan (nog) niet gelezen worden en telt niet mee.</div>` : '') +
    (modus==='moeilijk' ? `<div class="uitleg">Alleen ingevulde formules tellen mee.</div>` : '');
}
function leesVakken(){
  const lees = (ds,kant)=>ds.map((d,i)=>{
    const cRaw = document.getElementById(`c-${kant}-${i}`).value.trim();
    const c = cRaw==='' ? 1 : (/^\d+$/.test(cRaw) ? parseInt(cRaw) : NaN);
    const fRaw = modus==='makkelijk' ? null : document.getElementById(`f-${kant}-${i}`).value.trim();
    return {c, cRaw, fRaw, opties: modus==='makkelijk' ? [{f:d.f, lading:d.lading, sam:d.sam}] : leesInvoer(fRaw||'')};
  });
  return {l: lees(huidig.links,'l'), r: lees(huidig.rechts,'r')};
}

// Koppel de ingevulde formules (in willekeurige volgorde) aan de verwachte deeltjes.
function koppel(invoer, verwacht){
  const n = verwacht.length, gebruikt = new Array(n).fill(false), koppeling = new Array(invoer.length).fill(-1);
  const zoek = k=>{
    if(k===invoer.length) return true;
    for(let j=0;j<n;j++){ if(!gebruikt[j] && zelfdeDeeltje(invoer[k].opties, verwacht[j])){ gebruikt[j]=true; koppeling[k]=j; if(zoek(k+1)) return true; gebruikt[j]=false; koppeling[k]=-1; } }
    return false;
  };
  if(zoek(0)) return koppeling;
  // geen volledige koppeling: markeer wat los wél klopt
  return invoer.map(inv=>verwacht.findIndex(v=>zelfdeDeeltje(inv.opties,v)));
}

function controleer(){
  if(beoordeeld) return;
  const inv = leesVakken();
  const alle = [...inv.l, ...inv.r];
  if(modus==='moeilijk' && alle.some(v=>!v.fRaw)){ melding('info','Vul eerst alle formules in.'); return; }
  if(alle.some(v=>isNaN(v.c) || v.c<1)){ melding('info','Coëfficiënten zijn hele getallen (1 mag je leeg laten).'); return; }
  const kl = koppel(inv.l, huidig.links), kr = koppel(inv.r, huidig.rechts);
  const formulesOk = kl.every(x=>x>=0) && kr.every(x=>x>=0) && new Set(kl).size===kl.length && new Set(kr).size===kr.length;
  // balans: atomen en lading, op basis van de verwachte deeltjes waar de formule klopt
  const tel = (vakken, kopp, verwacht)=>{ const t={}; let q=0; vakken.forEach((v,i)=>{ const d = kopp[i]>=0 ? verwacht[kopp[i]] : (v.opties[0]||null); if(!d) return; for(const e in d.sam) t[e]=(t[e]||0)+d.sam[e]*v.c; q += (d.lading||0)*v.c; }); return {t,q}; };
  const L = tel(inv.l, kl, huidig.links), Rr = tel(inv.r, kr, huidig.rechts);
  const elems = [...new Set([...Object.keys(L.t), ...Object.keys(Rr.t)])];
  let balansOk = elems.every(e=>(L.t[e]||0)===(Rr.t[e]||0)) && L.q===Rr.q;
  let balansHTML = '<div class="balans">' + elems.map(e=>{ const ok=(L.t[e]||0)===(Rr.t[e]||0); return `<span class="${ok?'ok':'nok'}">${e}: ${L.t[e]||0} → ${Rr.t[e]||0}</span>`; }).join('');
  if(L.q || Rr.q) balansHTML += `<span class="${L.q===Rr.q?'ok':'nok'}">lading: ${L.q} → ${Rr.q}</span>`;
  balansHTML += '</div>';
  // vakjes kleuren
  [['l',inv.l,kl],['r',inv.r,kr]].forEach(([kant,vakken,kopp])=>vakken.forEach((v,i)=>{
    const el = document.getElementById(`t-${kant}-${i}`); el.classList.remove('goed','fout');
    if(modus==='moeilijk') el.classList.add(kopp[i]>=0 ? 'goed':'fout');
  }));
  const coefs = [...inv.l.map(v=>v.c), ...inv.r.map(v=>v.c)];
  const ggd = coefs.reduce((a,b)=>{ while(b){ [a,b]=[b,a%b]; } return a; });
  const model = `<div class="model">${vergelijkingHTML(huidig)}</div>`;
  let status;
  if(formulesOk && balansOk && ggd===1){
    status = hintGebruikt ? 'hint' : 'goed';
    melding('goed', `<b>Goed! De vergelijking klopt.</b>${balansHTML}${model}`);
  } else if(formulesOk && balansOk){
    melding('info', `<b>Bijna! De vergelijking klopt, maar gebruik de kleinste gehele getallen.</b> Alle coëfficiënten kun je nog door ${ggd} delen. Pas aan en controleer opnieuw.${balansHTML}`);
    return;
  } else if(formulesOk){
    status = 'fout';
    melding('fout', `<b>De formules kloppen, maar de vergelijking is nog niet kloppend.</b> Tel per atoomsoort${L.q||Rr.q?' en de lading':''} links en rechts.${balansHTML}`);
  } else {
    status = 'fout';
    melding('fout', `<b>${modus==='moeilijk'?'Niet alle formules kloppen (rood omrand).':''}</b> Let op hoofdletters, indices, haakjes en ladingen.${balansHTML}`);
  }
  const bestaand = resultaten.find(x=>x.id===huidig.id);
  if(!bestaand) resultaten.push({id:huidig.id, status});
  if(status!=='fout'){ beoordeeld = true; document.getElementById('checkBtn').disabled=true; document.getElementById('hintBtn').disabled=true; }
  else { document.getElementById('checkBtn').textContent = 'Opnieuw controleren'; melding('fout', document.getElementById('fb').innerHTML + `<div class="rij"><button class="sec" onclick="toonAntwoord()">Toon antwoord</button></div>`); }
  document.getElementById('nextBtn').disabled = false;
  updateScores();
}
function toonAntwoord(){
  beoordeeld = true;
  document.getElementById('checkBtn').disabled=true; document.getElementById('hintBtn').disabled=true;
  melding('info', `<b>Antwoord:</b><div class="model">${vergelijkingHTML(huidig)}</div>`);
}
function melding(soort, h){ const fb=document.getElementById('fb'); fb.className='fb '+soort; fb.innerHTML=h; }

function hint(){
  if(beoordeeld || hintGebruikt) return;
  hintGebruikt = true; document.getElementById('hintBtn').disabled = true;
  if(modus==='moeilijk'){
    // eerst een lege formule invullen
    const vakken = [...huidig.links.map((d,i)=>['l',i,d]), ...huidig.rechts.map((d,i)=>['r',i,d])];
    const leeg = vakken.filter(([k,i])=>!document.getElementById(`f-${k}-${i}`).value.trim());
    const [k,i,d] = (leeg.length ? leeg : vakken)[Math.floor(Math.random()*(leeg.length||vakken.length))];
    const el = document.getElementById(`f-${k}-${i}`); el.value = d.f + (d.lading ? (Math.abs(d.lading)>1?Math.abs(d.lading):'') + (d.lading>0?'+':'-') : '');
    melding('info','Hint: één formule is ingevuld.');
  } else {
    // de grootste coëfficiënt invullen
    const vakken = [...huidig.links.map((d,i)=>['l',i,d]), ...huidig.rechts.map((d,i)=>['r',i,d])].sort((a,b)=>b[2].c-a[2].c);
    const [k,i,d] = vakken[0]; document.getElementById(`c-${k}-${i}`).value = d.c;
    melding('info','Hint: de grootste coëfficiënt is ingevuld. Begin bij de atoomsoort die in de minste stoffen voorkomt.');
  }
}
function volgende(){ idx++; if(idx>=sessie.length) rapport(); else toonReactie(); }
function updateScores(){
  document.getElementById('sc-goed').textContent = resultaten.filter(r=>r.status==='goed').length;
  document.getElementById('sc-hint').textContent = resultaten.filter(r=>r.status==='hint').length;
  document.getElementById('sc-fout').textContent = resultaten.filter(r=>r.status==='fout').length;
}
function rapport(){
  const goed = resultaten.filter(r=>r.status==='goed').length;
  const rijen = sessie.map((r,i)=>{ const st=(resultaten.find(x=>x.id===r.id)||{status:'fout'}).status;
    return `<div class="rapport-rij"><span>${i+1}. ${vergelijkingHTML(r,false)}</span><span class="st-${st}">${{goed:'✓ in één keer goed',hint:'goed met hint',fout:'✗ niet in één keer goed'}[st]}</span></div>`; }).join('');
  const foutSoorten = [...new Set(sessie.filter(r=>(resultaten.find(x=>x.id===r.id)||{}).status==='fout').map(r=>SOORTEN[r.soort].naam))];
  app.innerHTML = `<div class="card"><h2>Klaar! ${goed} van de ${sessie.length} in één keer goed.</h2>
    ${foutSoorten.length?`<p class="uitleg">Oefen nog eens met: ${foutSoorten.join(', ')}.</p>`:''}
    <div style="margin-top:1rem">${rijen}</div>
    <div class="rij"><button onclick="startSessie()">Nog een ronde</button><button class="sec" onclick="startScherm()">Andere instellingen</button></div></div>`;
}
startScherm();
</script>


<script id="huisstijl-js">
window.HS_CFG={"own": "body>header"};
(function(){
  var cfg=window.HS_CFG||{};
  var b=document.createElement('button'); b.type='button'; b.textContent='Beamerstand'; b.title='Alles groter, voor op het digibord';
  b.onclick=function(){document.body.classList.toggle('hs-beamer'); window.dispatchEvent(new Event('resize'));};
  var hd;
  if(cfg.own){ hd=document.querySelector(cfg.own); hd.classList.add('hs-own'); hd.appendChild(b); }
  else {
    var h=cfg.title?null:document.querySelector(cfg.sel||'h1');
    hd=document.createElement('header'); hd.className='hs-header';
    var w=document.createElement('div'); w.className='hs-wrap'; hd.appendChild(w);
    var t=document.createElement('h1'); t.innerHTML=cfg.title||(h?h.innerHTML:document.title); w.appendChild(t);
    w.appendChild(b); if(h) h.remove();
    var cs=getComputedStyle(document.body);
    var px=function(a,b){return '-'+(parseFloat(cs[a])+parseFloat(cs[b]))+'px';};
    hd.style.margin=px('paddingTop','marginTop')+' '+px('paddingRight','marginRight')+' 18px '+px('paddingLeft','marginLeft');
    document.body.insertBefore(hd, document.body.firstChild);
  }
  // zwevende elementen (tooltips) niet mee-zoomen in beamerstand
  document.querySelectorAll('body *').forEach(function(e){ if(e!==hd && !hd.contains(e) && getComputedStyle(e).position==='fixed'){ e.classList.add('hs-nozoom'); document.body.appendChild(e); } });
  // komma als decimaalteken in alles wat op het scherm komt
  var dec=function(s){ return String(s).replace(/(\d)\.(\d)/g,'$1,$2'); };
  var C=CanvasRenderingContext2D.prototype, ft=C.fillText, st=C.strokeText, mt=C.measureText;
  C.fillText=function(t,x,y,m){ return m===undefined?ft.call(this,dec(t),x,y):ft.call(this,dec(t),x,y,m); };
  C.strokeText=function(t,x,y,m){ return m===undefined?st.call(this,dec(t),x,y):st.call(this,dec(t),x,y,m); };
  C.measureText=function(t){ return mt.call(this,dec(t)); };
  var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1};
  var fix=function(root){ var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), n;
    while((n=w.nextNode())){ if(n.parentNode && SKIP[n.parentNode.nodeName]) continue; var v=n.nodeValue, d=dec(v); if(d!==v) n.nodeValue=d; } };
  fix(document.body);
  new MutationObserver(function(ms){ ms.forEach(function(m){ if(m.type==='characterData'){ if(!SKIP[m.target.parentNode&&m.target.parentNode.nodeName]){ var d=dec(m.target.nodeValue); if(d!==m.target.nodeValue) m.target.nodeValue=d; } } else m.addedNodes.forEach(function(a){ if(a.nodeType===3){ if(a.parentNode&&!SKIP[a.parentNode.nodeName]){ var d=dec(a.nodeValue); if(d!==a.nodeValue) a.nodeValue=d; } } else if(a.nodeType===1 && !SKIP[a.nodeName]) fix(a); }); }); })
    .observe(document.body,{childList:true,subtree:true,characterData:true});
  // invoer met komma accepteren
  var pf=window.parseFloat; window.parseFloat=function(x){ return pf(typeof x==='string'?x.replace(',','.'):x); };
})();
</script>
