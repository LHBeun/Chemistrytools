<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Het Lab</title>
<style>
/* VOICE: coöperatief onderzoeksspel, rustig en helder, spanning via geld en tijd
   IDEA: het dashboard van een klein onderzoeksinstituut aan de rand van een vijver
   PICTURE: vijver met sloot, akker en algen; in het spel de eigen meetgrafiek
   COLOUR and TYPE: vijverteal dominant, papier als ondergrond, algengroen als accent, rood voor gevaar; één sans-serif
   LAYOUT: bovenbalk met ronde/budget/aan zet; drie kolommen instituut, rol aan zet, onderzoek */
:root{color-scheme:light dark;
--bg:light-dark(#eef2ef,#0e1a1c);--paper:light-dark(#ffffff,#152427);--paper2:light-dark(#f5f8f6,#1b2e31);
--ink:light-dark(#152427,#e6efeb);--muted:light-dark(#566866,#9db1ad);--line:light-dark(#d3ddd9,#2b4044);
--pond:light-dark(#17605c,#4cb3a8);--pondsoft:light-dark(#dcefec,#1d3b3b);--algae:light-dark(#4f7f22,#9ccc65);
--warn:light-dark(#b23a28,#ff8a70);--warnsoft:light-dark(#fbe6e1,#3a2320);--gold:light-dark(#7a5a0e,#e5c46b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:750}h3{font-size:17px;font-weight:700}
p{margin:0 0 .7em}
button,select,input{font:inherit;font-size:16px}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;min-height:44px}
button:hover:not(:disabled){border-color:var(--pond)}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--pond);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--pond);color:#fff;border-color:var(--pond);font-weight:700}
.btn-warn{border-color:var(--warn);color:var(--warn)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--paper);color:var(--ink);width:100%}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:90px}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.hidden{display:none!important}
/* start */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center}
.hero svg{width:100%;height:auto;display:block;border-radius:18px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.lead{font-size:18px;max-width:60ch}
/* setup */
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);cursor:pointer}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.on{border-color:var(--pond);background:var(--pondsoft)}
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.assign{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--pond);color:#fff}
.top .in{max-width:1320px;margin:0 auto;padding:10px clamp(12px,3vw,32px);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top b{font-size:20px}
.stat{display:flex;flex-direction:column;line-height:1.15}.stat span{font-size:13px;opacity:.85}.stat strong{font-size:19px;white-space:nowrap}
.turn{margin-left:auto;background:rgba(255,255,255,.14);border-radius:10px;padding:6px 12px}
.turn strong{font-size:18px}
.top button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3);display:block}.dots i.done{background:#fff}.dots i.now{background:#ffd76a}
/* game grid */
.game{display:grid;grid-template-columns:270px minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media(max-width:1100px){.game{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.side{grid-column:1/-1}}
@media(max-width:700px){.game{grid-template-columns:1fr}.side{order:3}}
.side .card+.card,.col .card+.card{margin-top:14px}
.meter{height:12px;border-radius:6px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--pond)}
.meter.low i{background:var(--warn)}
.roles{list-style:none;padding:0;margin:0}
.roles li{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;font-size:15px}
.roles li.act{background:var(--pondsoft);font-weight:700}
.roles li small{color:var(--muted);font-weight:400}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:2px 9px;background:var(--paper2);border:1px solid var(--line)}
.tag.bad{background:var(--warnsoft);border-color:var(--warn);color:var(--warn)}
.tag.good{background:var(--pondsoft);border-color:var(--pond);color:var(--pond)}
.rolehead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.badge{width:46px;height:46px;border-radius:12px;background:var(--pond);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.task{background:var(--paper2);border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:12px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
legend{font-weight:700;padding:0 4px;font-size:15px}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.chk input{width:18px;height:18px;flex:none}
.xbtns{display:flex;flex-wrap:wrap;gap:6px}
.xbtns button{min-width:64px}
.xbtns button.sel{background:var(--pond);color:#fff;border-color:var(--pond)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.vals{font-variant-numeric:tabular-nums}
.vals span{display:inline-block;margin:0 6px 2px 0;padding:1px 6px;border-radius:6px;background:var(--paper2)}
.vals span.cal{background:var(--warnsoft);color:var(--warn)}
.fig{position:relative;height:280px;margin-top:10px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.feed{border-left:4px solid var(--pond);padding:8px 12px;background:var(--pondsoft);border-radius:0 10px 10px 0;margin-bottom:8px}
.feed.bad{border-color:var(--warn);background:var(--warnsoft)}
.log{max-height:260px;overflow:auto;font-size:14px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:6px 12px;min-height:38px;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bron{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--paper2)}
.bron b{display:block;font-size:14px;color:var(--muted);font-weight:600}
.skill{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,15,16,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--paper);color:var(--ink);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.evkind{font-size:14px;font-weight:700;color:var(--pond)}
.evkind.neg{color:var(--warn)}.evkind.pos{color:var(--algae)}.evkind.dil{color:var(--gold)}
.cardart{height:8px;border-radius:4px;background:var(--pond);margin-bottom:14px}
.cardart.neg{background:var(--warn)}.cardart.pos{background:var(--algae)}.cardart.dil{background:var(--gold)}
@media(prefers-reduced-motion:no-preference){.modal{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}}
.end-hero{padding:28px;border-radius:18px;background:var(--pond);color:#fff;margin-bottom:16px}
.end-hero.lost{background:var(--warn)}
.study{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

{

const lin = (pts)=>x=>{for(let i=0;i<pts.length-1;i++){const[a,ya]=pts[i],[b,yb]=pts[i+1];if(x<=b)return ya+(yb-ya)*(x-a)/(b-a)}return pts[pts.length-1][1]};

const DECK_BASE = ['verstoring','ijkfout','stuk','verontreinigd','incident','storing','evaluatie','audit','bezuiniging','talent','stagiair','uni','subsidie','artikel','waarneming','media','rustig'];
const KIND_LABEL = {neg:'Tegenslag',pos:'Kans',fin:'Financier',dil:'Dilemma'};

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const k = n=>{const v=Math.round(n*10)/10;return '€'+(Number.isInteger(v)?v:v.toFixed(1).replace('.',','))+'k'};
const num = (v,d)=>v.toFixed(d).replace('.',',');
const gauss = ()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const F = id=>FACTORS.find(f=>f.id===id);
const xval = (f,x)=>{if(f.labels)return f.labels[x];const s=num(x,Number.isInteger(x)?0:2);return s.includes(',')?s.replace(/0+$/,'').replace(/,$/,''):s};
const xlab = (f,x)=>xval(f,x)+(f.labels||!f.eenheid?'':' '+f.eenheid);
const SAVE_KEY='hetlab-v1';

let S = null;          // game state
let ui = {screen:'start', tab:'data', tx:null, reps:3, inst:null, setup:null};

function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

const has = id=>S.skills.includes(id);
function hasRole(r){
  if(CORE.includes(r)||S.chosen.includes(r))return true;
  return !!(S.guest&&S.guest.role===r&&S.round<=S.guest.until);
}
function playerFor(r){
  if(S.assign[r])return S.assign[r];
  if(S.guest&&S.guest.role===r)return S.guest.player+' (gast)';
  return '';
}
function turnOrder(){return ['leider',...['pm','kwal','lit'].filter(hasRole),'tech','analist']}
function cur(){return turnOrder()[S.turnIdx]}
function active(){return S.active!=null?S.studies[S.active]:null}
function log(t,kind=''){S.log.push({r:S.round,t,kind})}
function spend(n,why){S.budget=Math.round((S.budget-n)*10)/10;S.ledger.push({r:S.round,d:-n,why});}
function earn(n,why){S.budget=Math.round((S.budget+n)*10)/10;S.ledger.push({r:S.round,d:n,why});}
function measCost(f){let c=1;if(has('werkplan'))c-=0.5;if(f&&f.veld&&has('veld'))c-=0.5;return Math.max(0.5,c)}
function fixedCost(){return S.fixed-(has('lobby')?1:0)}
function availLevels(){
  let lv=S.owned.slice();
  if(S.fx.stuk===S.round&&!has('onderhoud')&&lv.length>1)lv=lv.filter(l=>l!==Math.max(...lv));
  if(S.fx.leenTot>=S.round&&!lv.includes(3))lv.push(3);
  return lv.sort();
}

/* ================= NEW GAME ================= */
function newGame(cfg){
  const deck=shuffle(DECK_BASE);
  if(cfg.level===3)deck.splice(1+Math.floor(Math.random()*3),0,'sponsor');
  S={v:1,level:cfg.level,players:cfg.players,chosen:cfg.chosen,assign:cfg.assign,round:1,maxRounds:8,
     budget:40,fixed:4,expertise:0,skills:[],owned:[1],cal:{},deck,fx:{},studies:[],active:null,turnIdx:0,
     slots:9,slotsUsed:0,freeUsed:0,bronnen:[],hints:[],lastPub:0,oproep:null,sponsored:false,guest:null,
     log:[],ledger:[],over:null,event:null};
  log('Ronde 1: het instituut krijgt een startsubsidie van €40k.');
  startTurnPhase();
}

/* ================= ROUND FLOW ================= */
function computeSlots(){
  let s=9;if(has('efficient'))s+=3;
  if(S.fx.stagVan&&S.round>=S.fx.stagVan&&S.round<=S.fx.stagTot)s+=3;
  if(S.fx.storing===S.round)s-=3;
  if(S.fx.incident===S.round)s-=5;
  S.slots=Math.max(0,s);S.slotsUsed=0;S.freeUsed=0;
}
function startTurnPhase(){computeSlots();S.turnIdx=0;S.event=null;save();render()}
function endTurn(){
  S.turnIdx++;
  if(S.turnIdx>=turnOrder().length){endRound();return}
  ui.tx=null;save();render();
}
function endRound(){
  const fc=fixedCost();spend(fc,'Vaste lasten');log(`Vaste lasten betaald: ${k(fc)}.`);
  if(S.oproep&&S.round>=S.oproep.tot){log('De subsidie-oproep is verlopen.');S.oproep=null}
  if(checkBudget())return;
  if(S.round>=S.maxRounds){finish(false,'De subsidieperiode is voorbij zonder eindrapport. De financiering stopt.');return}
  S.round++;S.turnIdx=0;ui.tx=null;ui.mx=null;
  if(S.guest&&S.round>S.guest.until){log(`De gastonderzoeker (${ROLES[S.guest.role].naam}) vertrekt.`);S.guest=null}
  drawEvent();
}
function checkBudget(){
  if(S.budget<0){finish(false,'Het budget is op. De gemeente zet de financiering stop.');return true}
  return false;
}
function drawEvent(){
  if(!S.deck.length)S.deck=shuffle(DECK_BASE);
  const id=S.deck.shift();
  S.event={id,stage:'show',msg:''};
  resolveEvent(id);
  save();render();
}
function resolveEvent(id){
  const E=S.event;const st=active();
  const say=m=>{E.msg=m;log(EVENTS[id].titel+': '+m,EVENTS[id].kind)};
  switch(id){
    case 'verstoring': if(hasRole('kwal'))say('De kwaliteitsbewaker houdt de omstandigheden constant. Geen effect.');
      else{S.fx.verstoord=S.round;say('Metingen deze ronde krijgen extra spreiding, omdat de temperatuur niet constant is.')} break;
    case 'ijkfout':{const lv=Math.max(...S.owned);S.cal[lv]=1.5;say(`De ${INST[lv].naam} meet voortaan 1,5 mg/L te hoog, tot het instrument geijkt is. Herhalen helpt hier niet.`);break}
    case 'stuk': if(has('onderhoud')||S.owned.length<2)say(S.owned.length<2?'Gelukkig hebben jullie alleen teststrips. Geen effect.':'Dankzij preventief onderhoud is alles op tijd gerepareerd.');
      else{S.fx.stuk=S.round;say(`De ${INST[Math.max(...S.owned)].naam} is deze ronde niet beschikbaar.`)} break;
    case 'verontreinigd':
      if(has('opgeruimd'))say('In een opgeruimd lab valt de verontreinigde fles meteen op. Geen effect.');
      else if(st){const before=st.meas.length;st.meas=st.meas.filter(m=>m.r!==S.round-1);const n=before-st.meas.length;say(n?`${n} metingen van de vorige ronde zijn ongeldig en verwijderd.`:'Er waren geen metingen van de vorige ronde. Geen effect.')}
      else say('Er liep geen onderzoek. Geen effect.'); break;
    case 'incident':{let ok=false;if(hasRole('veilig'))ok=has('cultuur')||Math.random()<0.5;
      if(ok)say('De veiligheidscoördinator heeft het lab goed op orde: het incident wordt voorkomen.');
      else{S.fx.incident=S.round;say('Opruimen kost tijd: deze ronde 5 meetslots minder.'+(hasRole('veilig')?'':' (Een veiligheidscoördinator had dit kunnen voorkomen.)'))} break}
    case 'storing': S.fx.storing=S.round;say('Deze ronde 3 meetslots minder.');break;
    case 'evaluatie': if(S.round-S.lastPub>2){spend(5,'Tussentijdse evaluatie');say('Er is te lang niets gepubliceerd. Korting: −€5k.')}else say('De gemeente is tevreden over de voortgang.');break;
    case 'audit': if(S.sponsored){spend(10,'Audit');say('De commissie ontdekt de sponsoring door de kunstmestfabrikant: belangenverstrengeling. Boete: −€10k.')}else{earn(2,'Audit');say('De audit is doorstaan. De gemeente geeft een kleine bonus: +€2k.')}break;
    case 'bezuiniging': S.fixed+=1;say(`De vaste lasten zijn nu ${k(S.fixed)} per ronde.`);break;
    case 'talent':{const opts=KEUZE.filter(r=>!hasRole(r)&&!(ROLES[r].minLvl>S.level));
      if(!opts.length){say('Alle rollen zijn al bezet. Zij geeft wat goede tips, maar vertrekt weer.')}else{E.stage='choose';E.opts=opts;E.msg=''} break}
    case 'stagiair': S.fx.stagVan=S.round+1;S.fx.stagTot=S.round+2;say(`In ronde ${S.round+1} en ${S.round+2} heeft de meettechnicus +3 meetslots.`);break;
    case 'uni': S.fx.leenTot=S.round+1;say(`In ronde ${S.round} en ${S.round+1} kunnen jullie met een zuurstofmeter meten.`);break;
    case 'subsidie':{const done=S.studies.filter(s=>s.status==='gepubliceerd').map(s=>s.f);
      const opts=FACTORS.filter(f=>!done.includes(f.id)&&(!f.needs||hasRole(f.needs)));
      if(!opts.length){say('Er is geen passend onderwerp meer. Jammer.')}else{const f=opts[Math.floor(Math.random()*opts.length)];E.stage='choose';E.f=f.id;E.msg=''} break}
    case 'artikel':{const b=BRONNEN.find(b=>b.ok&&!S.bronnen.includes(b.id));if(b){S.bronnen.push(b.id);say('Er is een nieuwe bron toegevoegd. Lees hem in het tabblad Bronnen.')}else say('Niets nieuws te vinden.');break}
    case 'waarneming':{const st2=S.studies.find(s=>groups(s).some(g=>g.n>=3));
      if(st2){const h=st2.f==='kunst'?'Het water in de emmers met kunstmest is na een paar dagen groen geworden: er zijn veel algen gegroeid.':'Bij het monsternemen valt op dat het water bij de inlaat van de sloot groener is dan midden in de vijver.';
        if(!S.hints.includes(h))S.hints.push(h);say(h+' (Toegevoegd bij Bronnen.)')}
      else say('Er is nog nergens herhaald gemeten. Niemand neemt iets bijzonders waar.');break}
    case 'media': if(S.studies.some(s=>s.status==='gepubliceerd')){earn(4,'Media-aandacht');say('Een lezer doneert €4k aan het onderzoek.')}else say('Zonder publicaties is er nog niets te melden. Geen effect.');break;
    case 'rustig': say('Geen effect.');break;
    case 'sponsor': E.stage='choose';E.msg='';break;
    case 'onthulling': spend(20,'Onthulling sponsoring');say('Het vertrouwen van de gemeente is weg: −€20k.');break;
  }
}
function chooseEvent(val){
  const E=S.event,id=E.id;
  const say=m=>{E.msg=m;E.stage='show';log(EVENTS[id].titel+': '+m,EVENTS[id].kind)};
  if(id==='talent'){const [role,player]=val;S.guest={role,player,until:S.round+1};say(`${player} speelt in ronde ${S.round} en ${S.round+1} ook de ${ROLES[role].naam.toLowerCase()}.`)}
  if(id==='subsidie'){if(val){S.oproep={f:E.f,tot:S.round+2};say(`Oproep aangenomen: publiceer vóór het einde van ronde ${S.round+2} over "${F(E.f).naam.toLowerCase()}" voor €10k extra.`)}else say('Het team slaat de oproep af en blijft bij het eigen plan.')}
  if(id==='sponsor'){if(val){S.sponsored=true;earn(15,'Sponsoring');S.deck.splice(Math.min(S.deck.length,1+Math.floor(Math.random()*2)),0,'onthulling');say('Het team neemt het geld aan: +€15k.')}else say('Het team bedankt vriendelijk: onafhankelijk onderzoek gaat voor.')}
  save();render();
}
function closeEvent(){if(checkBudget())return;startTurnPhase()}

/* ================= STUDIES ================= */
function startStudy(fid,hyp,controls){
  const f=F(fid);const needed=f.controls.map(c=>c.id);
  const st={n:S.studies.length+1,f:fid,hyp,controls,missing:needed.filter(id=>!controls.includes(id)),meas:[],status:'actief',r:S.round,res:null};
  S.studies.push(st);S.active=S.studies.length-1;
  log(`Deelonderzoek ${st.n} gestart: ${f.naam.toLowerCase()} (hypothese: ${hypTxt(hyp)}).`);
  save();render();
}
const hypTxt=h=>({stijgt:'het zuurstofgehalte stijgt',daalt:'het zuurstofgehalte daalt',geen:'geen invloed'}[h]);
function stopStudy(){const st=active();if(!st)return;st.status='gestopt';S.active=null;log(`Deelonderzoek ${st.n} is stopgezet.`);save();render()}
function measure(x,reps,lv){
  const st=active();const f=F(st.f);let done=0;
  for(let i=0;i<reps;i++){
    if(S.slotsUsed>=S.slots)break;
    const free=has('routine')&&S.freeUsed<3;const c=free?0:measCost(f);
    if(S.budget<c)break;
    if(free)S.freeUsed++;else spend(c,'Metingen');
    S.slotsUsed++;
    let v=f.truth(x)+gauss()*INST[lv].sigma;
    for(const id of st.missing){const c2=f.controls.find(c=>c.id===id);v+=c2.oneSided?Math.random()*c2.b:(Math.random()-.5)*2*c2.b}
    if(S.fx.verstoord===S.round&&!hasRole('kwal'))v+=(Math.random()-.5)*2;
    const cal=!!S.cal[lv];if(cal)v+=S.cal[lv];
    v=Math.max(0,v);
    st.meas.push({x,lv,v,s:num(v,INST[lv].dec),r:S.round,cal});done++;
  }
  if(done)log(`${done} meting${done>1?'en':''} bij ${xlab(f,x)} met ${INST[lv].naam}.`);
  save();render();
}
function groups(st){
  const m={};for(const q of st.meas){(m[q.x]=m[q.x]||[]).push(q)}
  return Object.keys(m).map(Number).sort((a,b)=>a-b).map(x=>{const a=m[x];const mean=a.reduce((s,q)=>s+q.v,0)/a.length;
    const dec=Math.min(...a.map(q=>INST[q.lv].dec));const sig=Math.max(...a.map(q=>INST[q.lv].sigma));
    const se=Math.sqrt(a.reduce((s,q)=>s+INST[q.lv].sigma**2,0))/a.length;
    return {x,n:a.length,mean,meanDisp:a.reduce((s,q)=>s+parseFloat(q.s.replace(',','.')),0)/a.length,dec,sig,se,list:a}});
}
function evidence(st){
  const f=F(st.f);const g=groups(st);
  if(g.length<2)return {shows:'onduidelijk',why:['Er is maar bij één waarde van de onafhankelijke variabele gemeten. Meet bij minstens twee verschillende waarden.'],g};
  const lo=g[0],hi=g[g.length-1];
  const nmin=Math.min(lo.n,hi.n);const sig=Math.max(lo.sig,hi.sig);
  const thr=2*Math.sqrt(lo.se**2+hi.se**2);const d=hi.mean-lo.mean;
  const cover=(hi.x-lo.x)/(f.xs[f.xs.length-1]-f.xs[0]);
  if(Math.abs(d)>thr)return {shows:d>0?'stijgt':'daalt',g,thr,d,cover};
  const why=[];
  if(cover<0.5)why.push('Het meetbereik is te smal: een eventuele invloed valt binnen zo’n klein bereik niet op.');
  if(thr>0.5)why.push(sig>=0.3&&nmin>=3?'De metingen zijn te onnauwkeurig om een eventuele invloed op te merken. Een nauwkeuriger instrument helpt.':'De verschillen zijn niet groter dan de spreiding van de metingen. Meet vaker of nauwkeuriger.');
  if(!why.length)return {shows:'geen',g,thr,d,cover};
  return {shows:'onduidelijk',why,g,thr,d,cover};
}
function realLimits(st){
  const f=F(st.f);const ev=evidence(st);const g=ev.g;const out=new Set();
  if(g.length&&((g[g.length-1].x-g[0].x)/(f.xs[f.xs.length-1]-f.xs[0]))<1)out.add('bereik');
  if(g.length&&Math.min(...g.map(q=>q.n))<3)out.add('herhaal');
  if(st.meas.some(q=>q.lv===1))out.add('inst');
  if(!f.veld)out.add('lab');
  return out;
}
function publish(form){
  const st=active();const f=F(st.f);const ev=evidence(st);
  const R={kind:'',msgs:[],claim:form.claim,steun:form.steun};
  const fail=(m)=>{R.kind='afgewezen';R.msgs.push(...[].concat(m));};
  // 1 ongeldige opzet
  if(st.missing.length){fail(`De opzet was ongeldig: ${st.missing.map(id=>f.controls.find(c=>c.id===id).naam).join(' en ')} ${st.missing.length>1?'zijn':'is'} niet constant gehouden. Daardoor zegt de data weinig over de invloed van ${f.xnaam}.`)}
  // 2 systematische fout
  else if(st.meas.some(q=>q.cal)){fail('Een deel van de metingen is gedaan met een verkeerd geijkt instrument. Dat is een systematische fout: herhalen helpt daar niet tegen, ijken wel. Verwijder die metingen of ijk eerst.')}
  else{
    const goodSteun=form.claim===st.hyp?'ondersteund':'weerlegd';
    if(form.steun!==goodSteun){fail(`De hypothese was "${hypTxt(st.hyp)}". Als de data laten zien: "${hypTxt(form.claim)}", dan is de hypothese ${goodSteun}, niet ${form.steun}.`)}
    else if(ev.shows==='onduidelijk'){R.kind='onvoldoende';R.msgs.push(...ev.why)}
    else if(form.claim!==ev.shows){fail(`De conclusie past niet bij de data. Kijk nog eens naar de gemiddelden bij de laagste en de hoogste waarde van ${f.xnaam}.`)}
    else if(form.claim!==f.effect){R.kind='onvoldoende';R.msgs.push('De financier herhaalt jullie metingen en vindt een ander resultaat. Waarschijnlijk was het toeval: meet vaker of nauwkeuriger.')}
    else if(S.level>=2&&ev.g.length<3){R.kind='onvoldoende';R.msgs.push('Om het type verband te bepalen zijn metingen bij minstens drie verschillende waarden nodig.')}
    else if(S.level>=2&&form.verband!==f.verband){fail(`Het verband klopt niet met de data. ${form.verband==='recht'?'Bij een recht evenredig verband gaat de lijn door de oorsprong.':form.verband==='omgekeerd'?'Bij omgekeerd evenredig wordt de afstand tussen de punten steeds kleiner en blijft het product van x en y gelijk.':form.verband==='geen'?'De data laten wel een duidelijke verandering zien.':'Kijk of de punten op een rechte lijn liggen.'}`)}
    else if(S.level>=3){
      const hi=ev.g[ev.g.length-1];const txt=(form.sigval||'').trim().replace(',','.');const val=parseFloat(txt);
      const decIn=txt.includes('.')?txt.split('.')[1].length:0;
      const sigN=d=>{const s=num(hi.meanDisp,d).replace(',','');return s.replace(/^0+/,'').length};
      if(isNaN(val)){fail('Er is geen gemiddelde ingevuld.')}
      else if(decIn>hi.dec){fail(`Overclaimen: het gemiddelde bij ${xlab(f,hi.x)} is met meer significante cijfers genoteerd dan het instrument toelaat. Gebruik ${sigN(hi.dec)} significante cijfers.`)}
      else if(decIn<hi.dec){fail(`Het gemiddelde is met te weinig significante cijfers genoteerd. Jullie metingen laten ${sigN(hi.dec)} significante cijfers toe.`)}
      else if(Math.abs(val-hi.meanDisp)>0.5*Math.pow(10,-hi.dec)+1e-9){fail(`Het ingevulde gemiddelde bij ${xlab(f,hi.x)} klopt niet. Reken het nog eens na.`)}
    }
  }
  if(!R.kind){
    R.kind='succes';let gain=12;const extra=[];
    if(has('overtuigend')){gain+=3;extra.push('overtuigend +€3k')}
    if(has('schrijf')){gain+=2;extra.push('heldere schrijfstijl +€2k')}
    earn(gain,'Publicatie');S.expertise+=2;
    R.msgs.push(`De publicatie is geaccepteerd.${f.effect==='geen'?' Een factor uitsluiten is net zo waardevol als een invloed aantonen.':''} Verlenging van de financiering: +${k(gain)}${extra.length?' ('+extra.join(', ')+')':''}, +2 expertise.`);
    if(S.oproep&&S.oproep.f===st.f){const b=10+(has('subsidiejager')?5:0);earn(b,'Subsidie-oproep');R.msgs.push(`De subsidie-oproep is gehaald: +${k(b)}.`);S.oproep=null}
    if(hasRole('rapp')&&S.level>=2&&form.beperking){
      const real=realLimits(st);
      if(real.has(form.beperking)){earn(3,'Discussie');R.msgs.push('De rapporteur benoemt een echte beperking in de discussie: +€3k.')}
      else R.msgs.push(form.beperking==='hyp'?'Discussie: een weerlegde hypothese is geen beperking van het onderzoek, maar gewoon een resultaat.':'Discussie: dit is geen beperking van de resultaten.');
    }
    st.status='gepubliceerd';S.lastPub=S.round;S.active=null;
  } else if(R.kind==='afgewezen'){
    spend(4,'Afgewezen publicatie');st.status='afgewezen';S.active=null;R.msgs.push('De financier verliest wat vertrouwen: −€4k. Het deelonderzoek is afgesloten; jullie kunnen het opnieuw opzetten.');
  }
  st.res={kind:R.kind,claim:form.claim,steun:form.steun,verband:form.verband,msgs:R.msgs.slice(),r:S.round};
  log(`Publicatie deelonderzoek ${st.n}: ${R.kind}.`,R.kind==='succes'?'pos':R.kind==='afgewezen'?'neg':'');
  save();
  openModal(feedbackHTML(R));
  if(R.kind==='afgewezen')checkBudget();
}
function evidencePreview(){
  const st=active();const ev=evidence(st);
  const m=ev.shows==='onduidelijk'?ev.why.join(' '):'Het verschil tussen de laagste en hoogste meetwaarde is groter dan de spreiding. Er is genoeg bewijs voor een conclusie.';
  openModal(`<div class="cardart"></div><h2>Bewijscheck</h2><p>${esc(m)}</p><p class="small muted">Deze check zegt niets over welke conclusie juist is: dat moeten jullie zelf uit de data halen.</p><div class="row"><button class="btn-main" data-act="closeModal">Terug</button></div>`);
}

/* ================= EINDRAPPORT ================= */
function submitReport(ids){
  const pub=S.studies.filter(s=>s.status==='gepubliceerd');
  const bewijs=id=>pub.some(s=>s.f===id&&s.res&&s.res.claim!=='geen');
  const missing=ids.filter(id=>!bewijs(id));
  if(missing.length){const n=missing.map(id=>(F(id)||EXTRA_OORZAKEN.find(e=>e.id===id)).naam.toLowerCase());
    finish(false,`Het eindrapport noemt oorzaken zonder bewijs uit eigen gepubliceerd onderzoek (${n.join(', ')}). De gemeente keurt het rapport af en stopt de financiering.`);return}
  if(ids.length===1&&ids[0]==='kunst'){finish(true,'Kunstmest uit de akker zorgt voor sterke algengroei. ’s Nachts verbruiken de algen zuurstof, net als de afbraak van dode algen. Daardoor zakt het zuurstofgehalte ’s ochtends onder de 4 mg/L. De gemeente gaat met de boeren in gesprek over een bufferstrook langs de sloot.');return}
  let m='Het eindrapport wijst niet de juiste oorzaak aan.';
  if(ids.includes('temp'))m+=' Temperatuur heeft wel invloed op het zuurstofgehalte, maar daarmee zakt het niet onder de 4 mg/L: bij 25 °C lost nog ruim 8 mg/L op.';
  if(ids.includes('plek')&&!ids.includes('kunst'))m+=' De meetplek laat zien wáár het probleem zit, maar niet wat het veroorzaakt.';
  finish(false,m+' De financiering wordt stopgezet.');
}

function drawGraph(){
  const svg=$('#graph');const st=active();if(!svg||!st)return;
  const f=F(st.f);
  const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
    const L=44,Rm=14,T=12,B=40;const x0=f.xs[0],x1=f.xs[f.xs.length-1];const pad=(x1-x0)*0.06;
    const X=x=>L+(x-(x0-pad))/((x1+pad)-(x0-pad))*(W-L-Rm);const Y=y=>T+(1-y/12)*(H-T-B);
    let s='';
    for(let y=0;y<=12;y+=2)s+=`<line x1="${L}" x2="${W-Rm}" y1="${Y(y)}" y2="${Y(y)}" stroke="currentColor" stroke-opacity=".12"/><text x="${L-8}" y="${Y(y)+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".7">${y}</text>`;
    f.xs.forEach(x=>{s+=`<text x="${X(x)}" y="${H-B+18}" text-anchor="middle" font-size="12" fill="currentColor" opacity=".7">${esc(xval(f,x))}</text>`});
    s+=`<line x1="${L}" x2="${W-Rm}" y1="${Y(4)}" y2="${Y(4)}" stroke="var(--warn)" stroke-dasharray="6 5" stroke-width="1.5"/>`;
    s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="currentColor" stroke-opacity=".5"/><line x1="${L}" x2="${W-Rm}" y1="${H-B}" y2="${H-B}" stroke="currentColor" stroke-opacity=".5"/>`;
    s+=`<text x="${(L+W-Rm)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="currentColor">${esc(f.xnaam)}${f.eenheid?' ('+esc(f.eenheid)+')':''}</text>`;
    s+=`<text x="12" y="${T+(H-T-B)/2}" transform="rotate(-90 12 ${T+(H-T-B)/2})" text-anchor="middle" font-size="12" fill="currentColor">zuurstof (mg/L)</text>`;
    const cnt={};st.meas.forEach(m=>{const i=cnt[m.x]=(cnt[m.x]||0)+1;const jit=((i%5)-2)*3;
      s+=`<circle cx="${X(m.x)+jit}" cy="${Y(Math.min(12,parseFloat(m.s.replace(',','.'))))}" r="4.5" fill="${m.cal?'var(--warn)':'var(--pond)'}" fill-opacity=".8"/>`});
    svg.innerHTML=s;};
  draw();if(window._ro)window._ro.disconnect();window._ro=new ResizeObserver(draw);window._ro.observe(svg);
}

function autoAssign(){
  const s=ui.setup;const pl=s.players.map(p=>p.trim()).filter(Boolean);const roles=[...CORE,...s.chosen];
  if(!pl.length)return;
  roles.forEach((r,i)=>{if(!pl.includes(s.assign[r]))s.assign[r]=pl[i%pl.length]});
  const used=new Set(roles.map(r=>s.assign[r]));
  if(pl.some(p=>!used.has(p)))roles.forEach((r,i)=>s.assign[r]=pl[i%pl.length]);
}

function openReport(){
  const pub=S.studies.filter(s=>s.status==='gepubliceerd');
  const opts=[...FACTORS.filter(f=>!f.needs||hasRole(f.needs)).map(f=>({id:f.id,naam:f.naam})),...EXTRA_OORZAKEN];
  if(pub.length<3){openModal(`<div class="cardart"></div><h2>Eindrapport</h2><p>De gemeente wil pas een eindrapport als er minstens 3 deelonderzoeken gepubliceerd zijn. Jullie hebben er nu ${pub.length}.</p><div class="row"><button class="btn-main" data-act="closeModal">Terug</button></div>`);return}
  openModal(`<div class="cardart"></div><h2>Eindrapport</h2><p><strong>Welke factor zorgt ervoor dat het zuurstofgehalte onder de 4 mg/L zakt?</strong></p>
  <p class="small muted">Elke oorzaak die jullie noemen, moet onderbouwd zijn met eigen gepubliceerd onderzoek. Een fout rapport betekent het einde van de financiering.</p>
  <fieldset><legend>Oorzaak of oorzaken</legend>${opts.map(o=>`<label class="chk"><input type="checkbox" name="oorzaak" value="${o.id}"> ${esc(o.naam)}</label>`).join('')}</fieldset>
  <p id="reportmsg" class="small" style="color:var(--warn)"></p>
  <div class="row"><button data-act="closeModal">Nog niet</button><button class="btn-main" data-act="sendReport">Indienen</button></div>`);
}
function openMenu(){
  let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}
  openModal(`<div class="cardart"></div><h2>Opslaan</h2><p>Het spel wordt na elke actie automatisch opgeslagen in deze browser. Op een andere laptop verder? Kopieer dan deze code en laad hem daar via “Spel laden met code”.</p>
  <textarea id="savecode" readonly>${esc(code)}</textarea><div class="row" style="margin-top:8px"><button data-act="copyCode">Code kopiëren</button><span id="copied" class="small muted"></span></div>
  <div class="row" style="margin-top:16px"><button class="btn-main" data-act="closeModal">Verder spelen</button><button data-act="quit">Naar startscherm</button></div>`);
}

render();
window.__lab={get S(){return S},render,newGame,measure,publish,evidence,startStudy,groups,endTurn,submitReport,ui};
}
