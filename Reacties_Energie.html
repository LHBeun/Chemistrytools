<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reacties en energie</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}
aside .kc{display:flex;gap:6px}aside .kc input{flex:1;min-width:0;background:#1b2731;border:1px solid #4b6074;color:#fff;border-radius:8px;padding:7px 9px;font-size:13px;text-transform:uppercase}
aside .kc button{flex:none}aside .kcinfo{font-size:12px;color:#e2a84b}
aside .voet button.inlever{border-color:#e2a84b;color:#f3d08f}
.inleverpaneel textarea{width:100%;min-height:110px;font-family:var(--mono,monospace);font-size:12.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px;background:#fff;word-break:break-all}
.inleverpaneel .deel{margin:10px 0}.inleverpaneel .deel b{display:block;margin-bottom:4px}
.exitband{background:#fdf3dc;border:1px solid #e9cf95;border-radius:10px;padding:9px 13px;margin:0 0 12px;font-size:14.5px}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
a.btn{display:inline-block;text-decoration:none}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* breuken en eenheden */
.br{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 2px;font-size:.92em}
.br>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px 1px}.br>span:last-child{padding:1px 3px 0}
input.in.getal{flex:0 0 150px}.eenheid{font-size:15px;color:var(--inkt2)}
.typtip .br{font-size:.85em}
/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}

@media (max-width:1180px){
  .wp{grid-template-columns:1fr}
  .simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
}
@media print{aside,.simkol{display:none}.wp{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Reacties en energie</h1>
    <div class="sub">3 vwo · hoofdstuk 4</div>
    <nav id="nav"></nav>
    <div class="voet">
      <div class="kc"><input id="kcin" placeholder="klascode (optioneel)" autocomplete="off"><button id="kcknop">Gebruik</button></div>
      <div class="kcinfo" id="kcinfo"></div>
      <button id="inleverknop" class="inlever">Inleveren: maak je code</button>
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Voortgang wissen</button>
      <div class="klein">L.H. Beun · rekenen met exacte atoommassa's</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ggd = (a, b) => b ? ggd(b, a % b) : a;
function norm(s){
  const sup = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-' };
  const sub = { '₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9' };
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g, c => sup[c]).replace(/[₀-₉]/g, c => sub[c])
          .replace(/[−–—]/g, '-').replace(/→|=>|-->|⟶/g, '->').replace(/\^/g, '').replace(/\s+/g, '');
}

/* =====================================================================
   Scheikundehulpen: formules, vergelijkingen, getallen
   ===================================================================== */
const AM = { H:1.008, C:12.01, N:14.01, O:16.00, S:32.06, Cl:35.45, Br:79.90, Ag:107.9, Hg:200.6, Cu:63.55, Na:22.99 };
const ELEMENTEN = new Set(['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca','Fe','Cu','Zn','Br','Ag','I','Hg','Pb','Au','Sn','Ti','Cr','Mn','Ni','Co','Ba']);
/* 'C2H6O' -> {C:2, H:6, O:1}; null als het geen geldige formule is */
function telAtomen(f){
  let i = 0;
  function groep(){
    const o = {};
    while (i < f.length && f[i] !== ')'){
      if (f[i] === '('){ i++; const g = groep(); if (f[i] !== ')') throw 0; i++; const m = f.slice(i).match(/^\d+/); const n = m ? +m[0] : 1; if (m) i += m[0].length; for (const k in g) o[k] = (o[k] || 0) + g[k] * n; continue; }
      const m = f.slice(i).match(/^([A-Z][a-z]?)(\d*)/);
      if (!m || !ELEMENTEN.has(m[1])) throw 0;
      i += m[0].length; o[m[1]] = (o[m[1]] || 0) + (m[2] ? +m[2] : 1);
    }
    return o;
  }
  try { const o = groep(); return i === f.length && Object.keys(o).length ? o : null; } catch (e){ return null; }
}
const samenst = o => Object.keys(o).sort().map(k => k + o[k]).join('');
const molmassa = f => Object.entries(telAtomen(f)).reduce((s, [k, n]) => s + AM[k] * n, 0);
const fHTML = f => `<span class="f">${f.replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>')}</span>`;
const nl = (x, d = 2) => Number(x).toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: false });
const sig = (x, n = 3) => { if (!x) return '0'; const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)))); return nl(x, d); };
/* breuk met breukstreep (ook voor samengestelde eenheden) */
const br = (t, n) => `<span class="br"><span>${t}</span><span>${n}</span></span>`;
const EH = { gmol: br('g', 'mol'), molL: br('mol', 'L'), gL: br('g', 'L') };
function amLijst(f){ return [...new Set(Object.keys(telAtomen(f)))].sort((a, b) => 'CHONS'.indexOf(a) - 'CHONS'.indexOf(b)).map(k => `${k} = ${nl(AM[k], AM[k] < 2 ? 3 : 2)}`).join(' · '); }

/* ---------- reactievergelijkingen met moleculen ---------- */
function leesMolVgl(invoer){
  const s = norm(invoer).replace(/\((s|l|g|aq)\)/g, '');
  if (!s.includes('->')) return { fout:'pijl' };
  const d = s.split('->'); if (d.length !== 2) return { fout:'pijlen' };
  const kant = t => {
    if (!t) return { leeg:true };
    const uit = [];
    for (const term of t.split('+')){
      const m = term.match(/^(\d*)([A-Z(].*)$/);
      if (!m) return { onleesbaar: term || '+' };
      const n = m[1] ? +m[1] : 1; if (!n) return { onleesbaar: term };
      const o = telAtomen(m[2]); if (!o) return { onleesbaar: m[2] };
      uit.push({ n, f:m[2], o, s: samenst(o) });
    }
    return uit;
  };
  const L = kant(d[0]), R = kant(d[1]);
  for (const k of [L, R]){ if (k.leeg) return { fout:'leeg' }; if (k.onleesbaar) return { fout:'formule', wat:k.onleesbaar }; }
  return { L, R };
}
const TWEEATOMIG = { O:'zuurstof', H:'waterstof', N:'stikstof', Cl:'chloor', Br:'broom' };
/* verw: { L:[[n, f], ...], R:[...] }; o.alleenStoffen: coëfficiënten niet controleren */
function checkMolVgl(invoer, verw, o = {}){
  if (!invoer.trim()) return { ok:false, msg:'Typ eerst een vergelijking.' };
  const v = leesMolVgl(invoer);
  if (v.fout === 'pijl') return { ok:false, msg:'Er ontbreekt een pijl. Typ de pijl als <code>-></code>.' };
  if (v.fout === 'pijlen') return { ok:false, msg:'Gebruik precies één pijl.' };
  if (v.fout === 'leeg') return { ok:false, msg:'Zet aan beide kanten van de pijl stoffen.' };
  if (v.fout === 'formule') return { ok:false, msg:`Ik kan <code>${String(v.wat).replace(/</g, '&lt;')}</code> niet lezen als formule. Let op hoofdletters en kleine letters: Co is kobalt, CO is koolstofmono-oxide.` };
  const verwS = kant => kant.map(([n, f]) => ({ n, f, s: samenst(telAtomen(f)), o: telAtomen(f) }));
  const EL = verwS(verw.L), ER = verwS(verw.R);
  const set = arr => [...new Set(arr.map(x => x.s))].sort().join('|');
  const zelfde = (a, b) => set(a) === set(b);
  if (!zelfde(v.L, EL) || !zelfde(v.R, ER)){
    if (zelfde(v.L, ER) && zelfde(v.R, EL)) return { ok:false, msg:'De stoffen kloppen, maar ze staan aan de verkeerde kant van de pijl.' };
    const verwF = EL.concat(ER).map(x => x.f);
    const hl = v.L.concat(v.R).find(x => !EL.concat(ER).some(y => y.s === x.s) && verwF.some(f => f.toUpperCase() === x.f.toUpperCase()));
    if (hl){ const f = verwF.find(f => f.toUpperCase() === hl.f.toUpperCase()); return { ok:false, msg:`Let op hoofdletters en kleine letters: bedoel je ${fHTML(f)}? Een kleine letter hoort bij hetzelfde symbool (Co is kobalt).` }; }
    for (const x of v.L.concat(v.R)){
      const el = Object.keys(x.o); if (el.length === 1 && x.o[el[0]] === 1 && TWEEATOMIG[el[0]] && EL.concat(ER).some(y => y.s === el[0] + '2'))
        return { ok:false, msg:`Schrijf ${TWEEATOMIG[el[0]]} als ${fHTML(el[0] + '2')}: de moleculen van ${TWEEATOMIG[el[0]]} zijn opgebouwd uit twee atomen.` };
    }
    if (o.verbranding && !v.L.some(x => x.s === 'O2')) return { ok:false, msg:'Een verbranding is een reactie met zuurstof. Zuurstof hoort dus voor de pijl.' };
    if (o.ontleding && v.L.length > 1) return { ok:false, msg:'Bij een ontleding staat er maar één stof voor de pijl.' };

/* verbranding: CxHyOzSw + b O2 -> x CO2 + y/2 H2O + w SO2 (kleinste gehele getallen) */
function verbrandVgl(f, onvolledig = false){

/* ---------- getallen ---------- */

function keuzeStap(vr, opties, o = {}){

function chipsStap(vr, opties, o = {}){

    check: v => {

/* items: [{ lab, g, fb }], cats: [{ v, t }] */
function selectsStap(vr, items, cats, o = {}){

/* waarde: goede antwoord; o: { eh (eenheid, html), tol, fouten:[[waarde, melding]], antw (uitwerking), hint } */
function getalStap(vr, waarde, o = {}){
  const tol = o.tol || 0.015;
  const bij = (x, w) => Math.abs(x - w) <= Math.abs(w) * tol;
  return { type:'getal', vr, eh: o.eh || '', hint: o.hint || '', ph: 'getal',
    check: v => {

      const x = leesGetal(v);
      if (isNaN(x)) return { ok:false, msg:'Typ alleen een getal, bijvoorbeeld <code>0,25</code>. De eenheid staat er al achter.' };
      if (bij(x, waarde)) return { ok:true, msg: o.goedMsg };
      for (const [w, m] of (o.fouten || [])) if (w && bij(x, w)) return { ok:false, msg:m };
      if (bij(x * 1000, waarde) || bij(x / 1000, waarde)) return { ok:false, msg:'Je zit er een factor 1000 naast. Controleer de eenheden: mL of L, g of mg?' };
      return { ok:false, msg: o.fout || 'Nog niet goed. Controleer je berekening.' };

function tekstStap(vr, o){ return { type:'tekst', vr, ph: o.ph || '', hint: o.hint || '', check: o.check, antwoord: () => o.antw, goed: () => o.goedTyp }; }

/* zelfde serie voor iedereen met dezelfde klascode */

      <div class="ctrl"><label>Reactie <select class="sel" id="e_pre">${Object.entries(SIME_PRESET).map(([k, p]) => `<option value="${k}">${p ? p.naam : 'eigen diagram'}</option>`).join('')}</select></label>
        <label><input type="checkbox" id="e_pijl" checked> pijlen</label></div>
      <div class="doek" id="e_doek"></div>
      <div class="ctrl" style="flex-direction:column;align-items:stretch;gap:4px">
        <label>beginstoffen <input type="range" id="e_b" min="5" max="90" style="flex:1"></label>
        <label>reactieproducten <input type="range" id="e_e" min="5" max="90" style="flex:1"></label>
        <label>geactiveerde toestand <input type="range" id="e_t" min="15" max="100" style="flex:1"></label></div>
      <div class="waarneming" id="e_w"></div>`;
    this.c = maakCanvas($('#e_doek'), 600, 340);
    $('#e_pre').onchange = e => { const p = SIME_PRESET[e.target.value]; if (p) this.zet(p.b, p.e, p.t); };
    $('#e_pijl').onchange = e => { this.pijlen = e.target.checked; };
    ['b', 'e', 't'].forEach(k => $('#e_' + k).oninput = ev => { this[k] = +ev.target.value; if (k !== 't') this.t = Math.max(this.t, Math.max(this.b, this.e) + 6); else this.t = Math.max(this.t, Math.max(this.b, this.e) + 6); $('#e_pre').value = 'eigen'; this.sync(); });
    this.lezen = null; this.sync();
  },
  zet(b, e, t){ this.b = b; this.e = e; this.t = Math.max(t, Math.max(b, e) + 6); this.sync(); },
  sync(){
    ['b', 'e', 't'].forEach(k => { const el = $('#e_' + k); if (el){ el.value = this[k]; el.disabled = !!this.lezen; } });
    const w = $('#e_w'); if (!w) return;
    if (this.lezen) w.innerHTML = 'Lees het diagram af. De schuifjes staan vast.';
    else if (this.opd) w.innerHTML = 'Stel het diagram in met de schuifjes.';
    else w.innerHTML = this.e < this.b - 2 ? 'De reactieproducten liggen lager dan de beginstoffen: er komt energie vrij. De reactie is <b>exotherm</b>.' : this.e > this.b + 2 ? 'De reactieproducten liggen hoger dan de beginstoffen: er is energie nodig. De reactie is <b>endotherm</b>.' : 'Beginstoffen en reactieproducten liggen even hoog.';
  },
  opdracht(o){
    this.opd = !!o;
    if (o && o.sim && o.sim.lezen){ this.lezen = o.sim.lezen; this.b = o.sim.lezen.b; this.e = o.sim.lezen.e; this.t = o.sim.lezen.t; }
    else { const was = this.lezen; this.lezen = null; if (was) this.zet(50, 50, 75); }
    if (o && o.sim && o.sim.start) this.zet(...o.sim.start);
    if ($('#e_pre')) $('#e_pre').value = 'eigen';
    this.sync();
  },
  y(v){ return 312 - v * 2.75; },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    const yb = this.y(this.b), ye = this.y(this.e), yt = this.y(this.t);
    /* assen */
    c.strokeStyle = '#3e3b35'; c.lineWidth = 2; c.beginPath(); c.moveTo(60, 18); c.lineTo(60, 314); c.lineTo(580, 314); c.stroke();
    c.beginPath(); c.moveTo(54, 28); c.lineTo(60, 16); c.lineTo(66, 28); c.fill();
    c.save(); c.translate(30, 170); c.rotate(-Math.PI / 2); tekst(c, 'energie', 0, 0, { px:13, vet:true }); c.restore();

    /* niveaus */
    c.strokeStyle = '#2b2a27'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(80, yb); c.lineTo(190, yb); c.stroke();
    c.beginPath(); c.moveTo(440, ye); c.lineTo(560, ye); c.stroke();
    /* kromme */
    c.strokeStyle = '#a0701f'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(190, yb);
    c.bezierCurveTo(250, yb, 270, yt, 315, yt); c.bezierCurveTo(360, yt, 380, ye, 440, ye); c.stroke();
    c.setLineDash([4, 4]); c.strokeStyle = '#9b9585'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(150, yt); c.lineTo(480, yt); c.stroke();
    c.beginPath(); c.moveTo(190, yb); c.lineTo(560, yb); c.stroke();
    c.setLineDash([]);
    tekst(c, 'beginstoffen', 135, yb - 12, { px:12.5, vet:true });
    tekst(c, 'reactieproducten', 500, ye + (ye > yb ? -12 : 16), { px:12.5, vet:true });
    tekst(c, 'geactiveerde toestand', 315, yt - 12, { px:12, i:true, kleur:'#6b665c' });
    const pijl = (x, y1, y2, kleur, lab) => {
      if (Math.abs(y2 - y1) < 4) return;
      c.strokeStyle = kleur; c.fillStyle = kleur; c.lineWidth = 2.2; c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y2); c.stroke();
      const d = y2 > y1 ? 1 : -1; c.beginPath(); c.moveTo(x, y2); c.lineTo(x - 6, y2 - 10 * d); c.lineTo(x + 6, y2 - 10 * d); c.fill();
      if (lab) tekst(c, lab, x + 14, (y1 + y2) / 2, { px:13, vet:true, kleur, al:'left' });
    };

      const L = this.lezen.lab;  /* { ea:'A', de:'B', terug:'C' } */

    } else if (this.pijlen){
      pijl(220, yb, yt, '#2f6fa8', 'activeringsenergie'); pijl(520, yb, ye, '#b4473a', 'reactie-energie');
    }
  }
};

  stof:'glucose', m:9, V:250, toon:false,
  init(host){
    host.innerHTML = `<div class="simkop"><b>Een oplossing maken</b><span>model</span></div>
      <div class="ctrl"><label>Stof <select class="sel" id="c_stof">${Object.entries(SIMC_STOF).map(([k, s]) => `<option value="${k}">${s.naam}</option>`).join('')}</select></label>
        <label>Maatkolf <select class="sel" id="c_V">${[100, 250, 500, 1000].map(v => `<option value="${v}">${v} mL</option>`).join('')}</select></label></div>
      <div class="ctrl"><label>Massa <input type="range" id="c_m" min="0" max="40" step="0.1" style="width:220px"> <span id="c_mw"></span></label></div>
      <div class="doek" id="c_doek"></div>
      <div class="ctrl"><label><input type="checkbox" id="c_toon"> toon de concentratie</label></div>
      <div class="waarneming" id="c_w"></div>`;
    this.c = maakCanvas($('#c_doek'), 600, 330);

    $('#c_V').onchange = e => { this.V = +e.target.value; this.nieuw(); };

    this.nieuw();
  },
  cMol(){ return this.m / molmassa(SIMC_STOF[this.stof].f) / (this.V / 1000); },
  nieuw(){
    const N = Math.min(140, Math.round(this.cMol() * 110));
    this.deel = Array.from({ length:N }, () => ({ x: rnd(-1, 1), y: rnd(-1, 1), a: rnd(0, 6.3), vx: rnd(-1, 1), vy: rnd(-1, 1) })).filter(d => d.x * d.x + d.y * d.y < 0.85);
    while (this.deel.length < N){ const d = { x: rnd(-0.9, 0.9), y: rnd(-0.9, 0.9), a: rnd(0, 6.3), vx: rnd(-1, 1), vy: rnd(-1, 1) }; if (d.x * d.x + d.y * d.y < 0.85) this.deel.push(d); }
    this.sync();
  },
  opdracht(o){ this.opd = !!o; if (o && o.sim){ Object.assign(this, o.sim); this.nieuw(); } this.sync(); },
  sync(){
    if (!$('#c_stof')) return;
    $('#c_stof').value = this.stof; $('#c_V').value = this.V; $('#c_m').value = this.m; $('#c_mw').textContent = nl(this.m, 1) + ' g';
    $('#c_toon').checked = this.toon && !this.opd; $('#c_toon').disabled = !!this.opd;
    const s = SIMC_STOF[this.stof], M = molmassa(s.f), gl = this.m / (this.V / 1000);
    let h = `${nl(this.m, 1)} g ${s.naam} (${fHTML(s.f)}), opgelost tot ${this.V} mL oplossing.`;
    if (this.opd) h += ' <span style="color:var(--grijs)">Tijdens de opdrachten staat de concentratie verborgen.</span>';
    else if (this.toon) h += `<br>Concentratie: <b>${sig(gl, 3)} ${EH.gL}</b> = <b>${sig(this.cMol(), 3)} ${EH.molL}</b> (molaire massa ${nl(M, 2)} ${EH.gmol}).`;
    $('#c_w').innerHTML = h;
  },
  update(dt){ for (const d of this.deel || []){ d.x += d.vx * dt * 0.08; d.y += d.vy * dt * 0.08; d.a += dt; if (d.x * d.x + d.y * d.y > 0.85){ d.vx *= -1; d.vy *= -1; d.x *= 0.98; d.y *= 0.98; } } },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H); const s = SIMC_STOF[this.stof];

async function comprimeer(t){
  const bytes = new TextEncoder().encode(t);
  let uit = bytes, soort = 'J';
  if (window.CompressionStream){ try { uit = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); soort = 'D'; } catch (e){ uit = bytes; soort = 'J'; } }
  let s = ''; for (let i = 0; i < uit.length; i += 8192) s += String.fromCharCode.apply(null, uit.subarray(i, i + 8192));
  return soort + btoa(s);
}
async function maakCode(wpId){
  const ev = LOG.ev.filter(e => !wpId || e[1] === wpId);
  const keys = [], ctx = [];
  const kev = ev.map(e => { const key = e[1] + '|' + e[2]; let i = keys.indexOf(key); if (i < 0){ i = keys.length; keys.push(key); ctx.push(LOG.ctx[key] || null); } return [e[0], i, e[3], e[4], e[5], e[6], e[7], e[8]]; });
  const pakket = { v:2, tool:'RE', tn:'Reacties en energie', wpn: Object.fromEntries(WPS.map(w => [w.id, w.titel])), kc: STAAT.klascode || '', t0: LOG.t0, keys, ctx, ev: kev };
  const body = await comprimeer(JSON.stringify(pakket));
  const chk = (hashStr(body) % 46656).toString(36).toUpperCase().padStart(3, '0');
  const MAX = 3900, n = Math.max(1, Math.ceil(body.length / MAX)), delen = [];
  for (let i = 0; i < n; i++) delen.push(`RE1-${chk}-${i + 1}/${n}-` + body.slice(i * MAX, (i + 1) * MAX));
  return { delen, aantal: ev.filter(e => e[5] === 'c').length };
}
