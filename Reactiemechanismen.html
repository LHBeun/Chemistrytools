<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactiemechanismen</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* niveau */
.niveau{display:flex;gap:4px;margin:-14px 0 22px}
.niveau button{flex:1;background:transparent;border:1px solid #4b6074;color:#b9c7d3;border-radius:7px;padding:5px;font-weight:700;font-size:13px;cursor:pointer}
.niveau button.aan{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
/* moleculen */
svg.mol{display:block;max-width:100%;height:auto}
.molkader{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:8px 10px;margin:8px 0;overflow-x:auto}
.molrij{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.molrij .plus{font-size:22px;color:var(--grijs)}
.molnaam{font-size:12.5px;color:var(--grijs);text-align:center;margin-top:2px}
/* tekenveld */
.tv{background:#fff;border:1px solid var(--rand2);border-radius:10px;overflow:hidden}
.tvbalk{display:flex;flex-wrap:wrap;gap:4px;padding:7px;background:#f7f2e6;border-bottom:1px solid var(--rand)}
.tvk{border:1px solid var(--rand2);background:#fff;border-radius:7px;padding:4px 10px;font-family:Georgia,serif;font-size:15px;cursor:pointer;min-width:34px;color:var(--inkt)}
.tvk[data-a],.tvk[data-t="gum"]{font-family:var(--sans);font-size:13px}
.tvk.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.tvsep{width:1px;background:var(--rand2);margin:0 4px}
.tvdoek{overflow:auto;max-height:340px}
.tvsvg{display:block;touch-action:none;cursor:crosshair;background:#fffdf8}
.tvuitleg{font-size:12px;color:var(--grijs);padding:5px 9px;border-top:1px solid var(--rand)}
input.getal{max-width:200px;flex:0 1 200px}
.eenheid{font-size:15px;color:var(--inkt2)}
.formule{font-family:var(--serif);font-size:17px;margin:6px 0}
.breuk{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}
.breuk>span:first-child{border-bottom:1.3px solid currentColor;padding:0 4px}
.breuk>span:last-child{padding:0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px}
.kv b{font-family:var(--serif);font-size:18px;font-weight:600}
table.data{border-collapse:collapse;font-size:14px;background:#fff;margin:6px 0}
table.data th,table.data td{border:1px solid var(--rand2);padding:3px 10px;text-align:right}
table.data th{background:#f7f2e6;font-weight:600}
.reeksen{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.reeksen label{display:flex;gap:8px;align-items:center}
.reeksen i{display:inline-block;width:14px;height:4px;border-radius:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 12px}
.info b{font-weight:600}
.schuif{display:flex;align-items:center;gap:8px;font-size:13.5px}
.schuif input{width:150px}
/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}


/* mechanismen */
.mvkop{display:flex;flex-direction:column;gap:1px}
.mvtitel{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--inkt)}
.mvstof{font-size:13.5px;color:var(--grijs)}
.mvstof span{color:var(--goud);font-weight:600}
.mvdoek{padding:10px;background:#fffdf8}
svg.mech{display:block;width:100%;height:auto;margin:0 auto;user-select:none}
svg.mech .klik{cursor:pointer}
svg.mech g.at.klik:hover circle:first-child{fill:#f3ead6}
svg.mech g.bd.klik:hover line:first-child{stroke:#f3ead6}
.foutje{color:#7c2c22}
.prevkop{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--fout);margin-bottom:4px}
.doek.prev{padding:8px;background:#fdf6f4;border-color:#efd3cd}
.legenda .lg{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.legenda .lg i{display:inline-block;width:16px;height:3px;border-radius:2px}
.simtip{font-size:13.5px;color:var(--grijs);font-style:italic}
.pijlsoort{display:inline-flex;gap:4px;margin-left:6px}
svg.edsvg{display:block;width:100%;height:auto}
svg.edsvg .klik{cursor:pointer}
#eddoek{padding:6px 8px}

@media (max-width:1180px){
  .wp{grid-template-columns:1fr}
  .simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
}
@media print{aside,.simkol{display:none}.wp{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Reactiemechanismen</h1>
    <div class="sub">5 vwo · elektronenpijlen, stappen en snelheid</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Voortgang wissen</button>
      <div class="klein">De energiediagrammen en snelheidsconstanten zijn een model: de vorm klopt, de getallen zijn niet gemeten.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function laad(){ try { return JSON.parse(localStorage.getItem('reactiemechanismen-v1')) || {}; } catch (e){ return {}; } }
function bewaar(o){ try { localStorage.setItem('reactiemechanismen-v1', JSON.stringify(o)); } catch (e){} }
const nl = (x, d = 2) => Number(x).toLocaleString('nl-NL', { maximumFractionDigits: d, minimumFractionDigits: d });
const sig = (x, n = 3) => { if (!x) return '0'; const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)))); return nl(x, d); };
const breuk = (t, n) => `<span class="breuk"><span>${t}</span><span>${n}</span></span>`;

/* =====================================================================
   Elektronen-boekhouding
   Een toestand (scene) is een verzameling atomen en bindingen.
   atoom: { el, x, y, ne (niet-bindende elektronen), t (label) }
   binding: { a, b, e (aantal elektronen in de binding: 2, 4 of 6) }
   Lading = valentie-elektronen − ne − bindingen.
   ===================================================================== */
const VE = { H:1, B:3, C:4, N:5, O:6, F:7, Cl:7, Br:7 };
const MAXE = { H:2 };
const KLEUR = { C:'#2b2a27', H:'#2b2a27', O:'#c0392b', N:'#2c55a8', Cl:'#2e8b57', Br:'#8a4b1f', F:'#5a9a3c', B:'#a0701f' };
const RICHTING = { n:[0,-1], s:[0,1], e:[1,0], w:[-1,0], ne:[0.71,-0.71], nw:[-0.71,-0.71], se:[0.71,0.71], sw:[-0.71,0.71] };

class Sc {
  constructor(){ this.at = []; this.bd = []; this.t = {}; }
  A(el, x, y, q = 0, t, hp){ this.at.push({ el, x, y, q, t, hp }); const i = this.at.length - 1; if (t) this.t[t] = i; return i; }
  B(a, b, o = 1){ this.bd.push({ a: this.i(a), b: this.i(b), e: 2 * o }); return this; }
  i(x){ if (typeof x === 'number') return x; if (!(x in this.t)) throw new Error('onbekend label ' + x); return this.t[x]; }
  /* vul ontbrekende H-atomen aan op C, N en O (in vrije richtingen) */
  vulH(){
    const n0 = this.at.length;
    for (let i = 0; i < n0; i++){
      const a = this.at[i]; if (!['C','N','O'].includes(a.el) || a.geenH) continue;
      const nodig = { C:4, N:3, O:2 }[a.el] + (a.el === 'C' ? -Math.abs(a.q) : a.q) - this.orde(i);
      if (nodig <= 0) continue;
      const bezet = this.bd.filter(b => b.a === i || b.b === i).map(b => { const o = this.at[b.a === i ? b.b : b.a]; return Math.atan2(o.y - a.y, o.x - a.x); });
      const pref = a.hp || ['n','s','e','w'];
      let k = 0;
      for (const r of pref){
        if (k >= nodig) break;
        const [dx, dy] = RICHTING[r], hoek = Math.atan2(dy, dx);
        if (bezet.some(h => Math.abs(Math.atan2(Math.sin(h - hoek), Math.cos(h - hoek))) < 0.6)) continue;
        const h = this.A('H', a.x + dx * 1.5, a.y + dy * 1.5, 0, a.t ? a.t + '_' + r : undefined);
        this.bd.push({ a: i, b: h, e: 2 }); bezet.push(hoek); k++;
      }
      if (k < nodig) throw new Error('te weinig ruimte voor H aan ' + a.el + ' ' + (a.t || i));
    }
    return this;
  }
  orde(i){ return this.bd.filter(b => b.a === i || b.b === i).reduce((s, b) => s + b.e / 2, 0); }
  klaar(){
    this.at.forEach((a, i) => { a.ne = VE[a.el] - this.orde(i) - a.q; if (a.ne < 0) throw new Error('negatief ne bij ' + a.el); delete a.q; delete a.hp; delete a.geenH; });
    return this;
  }
}
function lading(sc, i){ return VE[sc.at[i].el] - sc.at[i].ne - sc.bd.filter(b => b.a === i || b.b === i).reduce((s, b) => s + b.e / 2, 0); }
function kloon(sc){ const c = new Sc(); c.at = sc.at.map(a => Object.assign({}, a)); c.bd = sc.bd.map(b => Object.assign({}, b)); c.t = Object.assign({}, sc.t); return c; }
function zoekB(sc, a, b){ return sc.bd.find(x => (x.a === a && x.b === b) || (x.a === b && x.b === a)); }

/* pijl: { van:{t:'lp'|'bd', a, b}, naar:{t:'at', a} | {t:'nb', a, b}, half, eind }
   eind = het atoom waar de pijlpunt bij staat (voor het tekenen) */
function pasToe(sc, pijlen){
  const r = kloon(sc), fouten = [];
  for (const p of pijlen){
    const n = p.half ? 1 : 2;
    if (p.van.t === 'lp') r.at[p.van.a].ne -= n;
    else { const b = zoekB(r, p.van.a, p.van.b); if (!b){ fouten.push('pijl vanaf een binding die er niet meer is'); continue; } b.e -= n; }
    if (p.naar.t === 'at') r.at[p.naar.a].ne += n;
    else { let b = zoekB(r, p.naar.a, p.naar.b); if (!b){ b = { a: p.naar.a, b: p.naar.b, e: 0 }; r.bd.push(b); } b.e += n; }
  }
  r.at.forEach((a, i) => { if (a.ne < 0) fouten.push(`Uit het ${a.el}-atoom vertrekken meer elektronen dan het heeft.`); });
  r.bd.forEach(b => { if (b.e < 0) fouten.push('Uit een binding vertrekken meer elektronen dan erin zitten.'); else if (b.e % 2) fouten.push('Er blijft een binding met één elektron over. Gebruik voor een radicaalreactie halve pijlen aan beide kanten.'); });
  r.bd = r.bd.filter(b => b.e > 0);
  return { r, fouten };
}
function elektronenOm(sc, i){ return sc.at[i].ne + sc.bd.filter(b => b.a === i || b.b === i).reduce((s, b) => s + b.e, 0); }
function octetFout(sc){
  for (let i = 0; i < sc.at.length; i++){
    const a = sc.at[i], e = elektronenOm(sc, i), max = MAXE[a.el] || 8;
    if (e > max) return `Het ${a.el}-atoom${a.el === 'H' ? '' : ''} krijgt ${e} elektronen om zich heen; dat kan niet (maximaal ${max}). Dan moet er ook een binding van dit atoom breken: mist er een pijl?`;
  }
  return null;
}

/* ---------- isomorfie (gelabelde graaf, mag uit losse deeltjes bestaan) ---------- */
function kleuren(sc){
  const n = sc.at.length, buren = sc.at.map(() => []);
  sc.bd.forEach(b => { buren[b.a].push([b.b, b.e]); buren[b.b].push([b.a, b.e]); });
  let k = sc.at.map(a => a.el + ':' + a.ne);
  for (let r = 0; r < 5; r++) k = k.map((c, i) => c + '(' + buren[i].map(([j, e]) => e + k[j]).sort().join(',') + ')');
  return { k, buren };
}
function gelijk(s1, s2){
  if (s1.at.length !== s2.at.length || s1.bd.length !== s2.bd.length) return false;
  const K1 = kleuren(s1), K2 = kleuren(s2);
  if (K1.k.slice().sort().join('|') !== K2.k.slice().sort().join('|')) return false;
  const n = s1.at.length, map = new Array(n).fill(-1), gebruikt = new Array(n).fill(false);
  const be = (s, a, b) => { const x = zoekB(s, a, b); return x ? x.e : 0; };
  const volg = [...Array(n).keys()];
  function zoek(i){
    if (i === n) return true;
    const a = volg[i];
    for (let b = 0; b < n; b++){
      if (gebruikt[b] || K1.k[a] !== K2.k[b]) continue;
      let ok = true;
      for (const [j, e] of K1.buren[a]) if (map[j] >= 0 && be(s2, b, map[j]) !== e){ ok = false; break; }
      if (!ok) continue;
      map[a] = b; gebruikt[b] = true;
      if (zoek(i + 1)) return true;
      map[a] = -1; gebruikt[b] = false;
    }
    return false;
  }
  return zoek(0);
}

/* ---------- mechanismen: toestanden afleiden ---------- */
function pijlUitSpec(sc, p){
  const i = x => sc.i(x);
  const o = { half: !!p.half };
  if (p.lp){ o.van = { t:'lp', a: i(p.lp) }; o.naar = { t:'nb', a: i(p.lp), b: i(p.naar) }; o.eind = i(p.naar); }
  else if (p.bd){
    const [a, b] = p.bd.map(i); o.van = { t:'bd', a, b };
    const d = i(p.naar);
    if (d === a || d === b) o.naar = { t:'at', a: d };
    else o.naar = { t:'nb', a: d, b: i(p.met) };
    o.eind = d;
  }
  else if (p.rad){ o.van = { t:'lp', a: i(p.rad) }; o.naar = { t:'nb', a: i(p.rad), b: i(p.naar) }; o.eind = i(p.naar); o.half = true; }
  return o;
}
function verplaats(sc, st, voor){
  /* zet: atoom naar plek; schuif: het deeltje waar het atoom in zat vóór de stap (of erna, als het dan los is) */
  for (const [t, [dx, dy]] of Object.entries(st.schuif || {})){
    const i = sc.i(t), na = deeltje(sc, i), vr = deeltje(voor, i);
    const deel = na.length <= vr.length ? na : vr;
    deel.forEach(j => { sc.at[j].x += dx; sc.at[j].y += dy; });
  }
  for (const [t, [x, y]] of Object.entries(st.zet || {})){ const a = sc.at[sc.i(t)]; a.x = x; a.y = y; }
}
function deeltje(sc, i){
  const gezien = new Set([i]), stapel = [i];
  while (stapel.length){ const a = stapel.pop(); sc.bd.forEach(b => { const o = b.a === a ? b.b : b.b === a ? b.a : -1; if (o >= 0 && !gezien.has(o)){ gezien.add(o); stapel.push(o); } }); }
  return [...gezien];
}
function voegToe(sc, maak){
  const extra = maak(); const off = sc.at.length;
  extra.at.forEach(a => sc.at.push(Object.assign({}, a)));
  extra.bd.forEach(b => sc.bd.push({ a: b.a + off, b: b.b + off, e: b.e }));
  for (const [t, i] of Object.entries(extra.t)) sc.t[t] = i + off;
}
/* bereid een mechanisme voor: scenes[0..n], per stap de modelpijlen */
function bereid(m){
  if (m._klaar) return m;
  const scenes = [m.start()];
  m.stappen.forEach((st, k) => {
    const sc = scenes[k];
    st._pijlen = st.pijlen.map(p => pijlUitSpec(sc, p));
    st._gegeven = (st.gegeven || []).map(j => st._pijlen[j]);
    const { r, fouten } = pasToe(sc, st._pijlen);
    if (fouten.length || octetFout(r)) throw new Error(m.titel + ' stap ' + (k + 1) + ': ' + (fouten[0] || octetFout(r)));
    st._doel = kloon(r);
    [...(st.alt || []), ...(st.fout || [])].forEach(al => {
      al._pijlen = al.pijlen.map(p => pijlUitSpec(sc, p));
      al._doel = pasToe(sc, al._pijlen).r;
    });
    verplaats(r, st, sc);
    if (st.erbij) voegToe(r, st.erbij);
    scenes.push(r);
  });
  m.scenes = scenes; m._klaar = true;
  return m;
}

/* ---------- moleculen bouwen ---------- */
function water(x, y, hp = ['w','e'], t = 'W', q = 0){ const s = new Sc(); s.A('O', x, y, q, t, hp); return s.vulH().klaar(); }

/* =====================================================================
   Tekenen (SVG)
   ===================================================================== */
const U = 30;            /* pixels per eenheid */
function slots(sc, i){
  const a = sc.at[i];
  const hoeken = sc.bd.filter(b => b.a === i || b.b === i).map(b => { const o = sc.at[b.a === i ? b.b : b.a]; return Math.atan2(o.y - a.y, o.x - a.x); });
  const vrij = [], namen = ['n','e','s','w','ne','se','sw','nw'];
  for (const r of namen){
    const [dx, dy] = RICHTING[r], h = Math.atan2(dy, dx);
    if (hoeken.some(x => Math.abs(Math.atan2(Math.sin(x - h), Math.cos(x - h))) < 0.75)) continue;
    vrij.push(r);
  }
  return vrij;
}
function lpPlekken(sc, i){
  const a = sc.at[i], nlp = Math.floor(a.ne / 2), rad = a.ne % 2;
  let vrij = slots(sc, i);
  const ortho = vrij.filter(r => r.length === 1), diag = vrij.filter(r => r.length === 2);
  const volg = [...ortho, ...diag];
  const uit = [];
  for (let k = 0; k < nlp + rad && k < volg.length; k++) uit.push({ r: volg[k], rad: k >= nlp });
  return uit;
}
function bounds(sc){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  sc.at.forEach(a => { x0 = Math.min(x0, a.x); x1 = Math.max(x1, a.x); y0 = Math.min(y0, a.y); y1 = Math.max(y1, a.y); });
  return { x0: x0 - 1.4, x1: x1 + 1.4, y0: y0 - 1.4, y1: y1 + 1.4 };
}
function pijlPad(sc, p){
  const A = sc.at;
  let s;
  if (p.van.t === 'lp'){
    const a = A[p.van.a], e = A[p.eind];
    const pl = lpPlekken(sc, p.van.a);
    let best = null, bd = 1e9;
    for (const q of pl){ const [dx, dy] = RICHTING[q.r]; const px = a.x + dx * 0.62, py = a.y + dy * 0.62; const d = Math.hypot(px - e.x, py - e.y); if (d < bd){ bd = d; best = [px, py]; } }
    s = best || [a.x, a.y - 0.6];
  } else {
    const a = A[p.van.a], b = A[p.van.b];
    s = [(a.x + b.x) / 2, (a.y + b.y) / 2];
  }
  const e = A[p.eind];
  if (p.van.t === 'bd' && p.naar.t === 'at'){
    /* binding breekt: boogje van de binding naar boven/onder het atoom */
    const a = A[p.van.a], b = A[p.van.b], o = A[p.van.a === p.eind ? p.van.b : p.van.a];
    const ux = (e.x - o.x), uy = (e.y - o.y), l = Math.hypot(ux, uy) || 1;
    let nx = -uy / l, ny = ux / l; if (ny > 0 || (Math.abs(ny) < 0.05 && nx < 0)){ nx = -nx; ny = -ny; }
    const eind = [e.x + nx * 0.62 - ux / l * 0.12, e.y + ny * 0.62 - uy / l * 0.12];
    const c = [(s[0] + eind[0]) / 2 + nx * 0.75, (s[1] + eind[1]) / 2 + ny * 0.75];
    return { s, c, e: eind };
  }
  const vx = s[0] - e.x, vy = s[1] - e.y, l = Math.hypot(vx, vy) || 1;
  const eind = [e.x + vx / l * 0.55, e.y + vy / l * 0.55];
  const mx = (s[0] + eind[0]) / 2, my = (s[1] + eind[1]) / 2;
  const dx = eind[0] - s[0], dy = eind[1] - s[1], L = Math.hypot(dx, dy) || 1;
  let nx = dy / L, ny = -dx / L;
  if (ny > 0 || (Math.abs(ny) < 0.05 && nx < 0)){ nx = -nx; ny = -ny; }
  const bol = Math.max(0.7, Math.min(1.6, L * 0.38));
  const c = [mx + nx * bol, my + ny * bol];
  return { s, c, e: eind };
}
function svgPijl(sc, p, kl, extra = ''){
  const { s, c, e } = pijlPad(sc, p);
  const P = v => (v[0] * U).toFixed(1) + ',' + (v[1] * U).toFixed(1);
  /* pijlpunt */
  const tx = e[0] - c[0], ty = e[1] - c[1], tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl;
  const k = 0.34, b = 0.17;
  const p1 = [e[0] - ux * k + uy * b, e[1] - uy * k - ux * b], p2 = [e[0] - ux * k - uy * b, e[1] - uy * k + ux * b];
  const punt = p.half ? `<path d="M${P(e)} L${P(p1)}" stroke="${kl}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
                      : `<path d="M${P(e)} L${P(p1)} L${P(p2)} Z" fill="${kl}"/>`;
  return `<g class="pijl" ${extra}><path d="M${P(s)} Q${P(c)} ${P(e)}" stroke="transparent" stroke-width="12" fill="none"/><path d="M${P(s)} Q${P(c)} ${P(e)}" stroke="${kl}" stroke-width="2.2" fill="none"/>${punt}</g>`;
}
function svgScene(sc, o = {}){
  const bb = o.bb || bounds(sc);
  const A = sc.at;
  let h = '';
  /* bindingen */
  sc.bd.forEach((b, j) => {
    const a = A[b.a], c = A[b.b];
    const dx = c.x - a.x, dy = c.y - a.y, l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    const r1 = a.el === 'H' && false ? 0.3 : 0.38, r2 = 0.38;
    const x1 = a.x + ux * r1, y1 = a.y + uy * r1, x2 = c.x - ux * r2, y2 = c.y - uy * r2;
    const n = b.e / 2, off = 0.13;
    let lijnen = '';
    for (let k = 0; k < n; k++){
      const s = (k - (n - 1) / 2) * off * 2;
      lijnen += `<line x1="${((x1 - uy * s) * U).toFixed(1)}" y1="${((y1 + ux * s) * U).toFixed(1)}" x2="${((x2 - uy * s) * U).toFixed(1)}" y2="${((y2 + ux * s) * U).toFixed(1)}" stroke="#2b2a27" stroke-width="1.6"/>`;
    }
    const sel = o.sel && o.sel.t === 'bd' && ((o.sel.a === b.a && o.sel.b === b.b) || (o.sel.a === b.b && o.sel.b === b.a));
    h += `<g class="bd ${o.klik ? 'klik' : ''} ${sel ? 'sel' : ''}" data-a="${b.a}" data-b="${b.b}"><line x1="${(x1 * U).toFixed(1)}" y1="${(y1 * U).toFixed(1)}" x2="${(x2 * U).toFixed(1)}" y2="${(y2 * U).toFixed(1)}" stroke="${sel ? '#e2a84b' : 'transparent'}" stroke-width="${sel ? 9 : 13}" stroke-linecap="round" opacity="${sel ? 0.55 : 1}"/>${lijnen}</g>`;
  });
  /* atomen */
  A.forEach((a, i) => {
    const q = lading(sc, i), kl = KLEUR[a.el] || '#2b2a27';
    const x = a.x * U, y = a.y * U;
    const gemarkeerd = o.marks && o.marks.has(i), kies = o.kies && o.kies.includes(i), sel = o.sel && o.sel.t === 'lp' && o.sel.a === i;
    let g = `<g class="at ${o.klik ? 'klik' : ''}" data-i="${i}">`;
    g += `<circle cx="${x}" cy="${y}" r="${0.5 * U}" fill="${gemarkeerd ? '#f6e3bf' : kies ? '#dfeaf7' : 'transparent'}" stroke="${gemarkeerd ? '#a0701f' : kies ? '#2c55a8' : 'none'}" stroke-width="1.6"/>`;
    if (sel) g += `<circle cx="${x}" cy="${y}" r="${0.75 * U}" fill="none" stroke="#e2a84b" stroke-width="3" opacity=".8"/>`;
    g += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${a.el.length > 1 ? 16 : 17}" fill="${kl}" font-family="Segoe UI, system-ui, Arial, sans-serif">${a.el}</text>`;
    for (const pl of lpPlekken(sc, i)){
      const [dx, dy] = RICHTING[pl.r], px = (a.x + dx * 0.6) * U, py = (a.y + dy * 0.6) * U, qx = -dy * 0.15 * U, qy = dx * 0.15 * U;
      if (pl.rad) g += `<circle cx="${px}" cy="${py}" r="2.6" fill="#2b2a27"/>`;
      else g += `<circle cx="${px + qx}" cy="${py + qy}" r="2.2" fill="#2b2a27"/><circle cx="${px - qx}" cy="${py - qy}" r="2.2" fill="#2b2a27"/>`;
    }
    if (q){
      const vrij = slots(sc, i), lps = lpPlekken(sc, i).map(p => p.r);
      const kand = ['ne','nw','se','sw','n','e'].find(r => vrij.includes(r) && !lps.includes(r)) || 'ne';
      const [dx, dy] = RICHTING[kand];
      const cx = (a.x + dx * 0.95) * U, cy = (a.y + dy * 0.95) * U;
      g += `<circle cx="${cx}" cy="${cy}" r="6" fill="#fff" stroke="${q > 0 ? '#2c55a8' : '#c0392b'}" stroke-width="1.2"/><text x="${cx}" y="${cy + 0.5}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="${q > 0 ? '#2c55a8' : '#c0392b'}">${q > 0 ? '+' : '−'}</text>`;
    }
    if (o.delta && o.delta[i]){
      const vrij = slots(sc, i), lps = lpPlekken(sc, i).map(p => p.r);
      const kand = ['sw','se','nw','ne','s','n'].find(r => vrij.includes(r) && !lps.includes(r)) || 'sw';
      const [dx, dy] = RICHTING[kand];
      g += `<text x="${(a.x + dx * 0.8) * U}" y="${(a.y + dy * 0.8) * U}" text-anchor="middle" dominant-baseline="central" font-size="12" font-style="italic" fill="${o.delta[i] === '+' ? '#2c55a8' : '#c0392b'}">δ${o.delta[i] === '+' ? '+' : '−'}</text>`;
    }
    h += g + '</g>';
  });
  /* pijlen */
  (o.pijlen || []).forEach((p, k) => { h += svgPijl(sc, p.p, p.kl, p.klik ? `data-p="${k}" style="cursor:pointer"` : ''); });
  const W = (bb.x1 - bb.x0) * U, H = (bb.y1 - bb.y0) * U;
  return `<svg class="mech" viewBox="${(bb.x0 * U).toFixed(0)} ${(bb.y0 * U).toFixed(0)} ${W.toFixed(0)} ${H.toFixed(0)}" style="max-height:${o.maxh || 420}px">${h}</svg>`;
}

/* =====================================================================
   Bibliotheek van mechanismen
   pijl-specificatie:  { lp:'X', naar:'Y' }            vrij paar van X → nieuwe binding X–Y
                       { bd:['X','Y'], naar:'Y' }      binding X–Y → elektronenpaar naar Y
                       { bd:['X','Y'], naar:'Z', met:'X' }  binding X–Y → nieuwe binding Z–X
                       { rad:'X', naar:'Y' }           radicaal-elektron van X → binding X–Y (halve pijl)
                       half:true                       halve pijl (één elektron)
   ===================================================================== */
const MECH = {};

/* ---------- substitutie in één stap ---------- */

    s.A('O', -4, 0, -1, 'O', ['w']); s.A('C', 0, 0, 0, 'C', ['n','s','w']); s.A('Br', 2, 0, 0, 'Br'); s.B('C','Br');

/* ---------- substitutie via een carbokation ---------- */
function tertButyl(halo, ethyl){
  const s = new Sc();
  s.A('C', 0, 0, 0, 'C'); s.A(halo, 2, 0, 0, 'X');
  s.A('C', 0, -2, 0, 'Ca', ['n','ne','nw']); s.A('C', 0, 2, 0, 'Cb', ['s','se','sw']);
  s.B('C','X').B('C','Ca').B('C','Cb');
  if (ethyl){ s.A('C', -2, 0, 0, 'Cc'); s.A('C', -4, 0, 0, 'Cd', ['n','s','w']); s.B('C','Cc').B('Cc','Cd'); }
  else { s.A('C', -2, 0, 0, 'Cc', ['w','nw','sw']); s.B('C','Cc'); }
  return s.vulH().klaar();
}
function sn1(halo, ethyl, vb){

    stappen:[
      { label:'De C–' + halo + '-binding breekt: er ontstaat een carbokation',

        zet:{ X:[6.5, -2.5] }, erbij: () => water(3.5, 0, ['n','e'], 'W1') },

        pijlen:[{ lp:'W1', naar:'C' }], gegeven: vb ? [] : [],

      { label:'Een tweede watermolecuul neemt een H⁺ over: er ontstaat een alcohol en H₃O⁺',
        pijlen:[{ lp:'W2', naar:'W1_e' }, { bd:['W1','W1_e'], naar:'W1' }] }
    ]

}
MECH.sn1_vb = sn1('Br', false, true);

/* ---------- additie aan een dubbele binding ---------- */
function hbr(s, x, y){ s.A('H', x, y, 0, 'H'); s.A('Br', x, y - 2, 0, 'Br'); s.B('H','Br'); }

/* ---------- ★ eliminatie (zuurgekatalyseerd) ---------- */
function eliminatie(ethyl){
  return {
    titel:'Eliminatie', stof: ethyl ? '2-methylbutaan-2-ol + H₃O⁺' : '2-methylpropaan-2-ol + H₃O⁺',
    start(){ const s = new Sc();
      s.A('C', 0, 0, 0, 'C'); s.A('O', 2, 0, 0, 'O', ['s']); s.B('C','O');
      s.A('C', 0, -2, 0, 'Ca', ['n','ne','nw']); s.A('C', 0, 2, 0, 'Cb', ['s','se','sw']); s.B('C','Ca').B('C','Cb');
      if (ethyl){ s.A('C', -2, 0, 0, 'Cc', ['n','s']); s.A('C', -4, 0, 0, 'Cd', ['n','s','w']); s.B('C','Cc').B('Cc','Cd'); }
      else { s.A('C', -2, 0, 0, 'Cc', ['w','nw','sw']); s.B('C','Cc'); }
      s.A('O', 5, -1.5, 1, 'W', ['n','e']); s.A('H', 3.5, -1.5, 0, 'Hz'); s.B('W','Hz');
      return s.vulH().klaar(); },
    stappen:[
      { label:'De OH-groep neemt een H⁺ op van H₃O⁺',
        pijlen:[{ lp:'O', naar:'Hz' }, { bd:['W','Hz'], naar:'W' }],
        zet:{ Hz:[3.5, 0] }, schuif:{ W: ethyl ? [-9, -2] : [-1.5, -2] } },
      { label:'Water laat los: er ontstaat een carbokation',
        pijlen:[{ bd:['C','O'], naar:'O' }], schuif:{ O:[2.5, 0] } },
      { label:'Een watermolecuul neemt een H⁺ op van een C-atoom naast het positieve C-atoom: er ontstaat een dubbele binding',
        pijlen: ethyl ? [{ lp:'W', naar:'Cc_n' }, { bd:['Cc','Cc_n'], naar:'C', met:'Cc' }]
                      : [{ lp:'W', naar:'Ca_ne' }, { bd:['Ca','Ca_ne'], naar:'C', met:'Ca' }],
        alt: ethyl ? [{ ok:true, pijlen:[{ lp:'W', naar:'Ca_nw' }, { bd:['Ca','Ca_nw'], naar:'C', met:'Ca' }], msg:'Goed: zo ontstaat 2-methylbut-1-een.' }] : [] }
    ]
  };
}

/* =====================================================================
   Simulatie 1: mechanismen tekenen en bekijken
   ===================================================================== */
function mechBB(m){
  if (m._bb) return m._bb;
  let bb = null;
  m.scenes.forEach(s => { const b = bounds(s); bb = bb ? { x0: Math.min(bb.x0, b.x0), x1: Math.max(bb.x1, b.x1), y0: Math.min(bb.y0, b.y0), y1: Math.max(bb.y1, b.y1) } : b; });
  bb.y0 -= 0.6;
  return (m._bb = bb);
}
const MV = {
  m: null, ms: 0, sc: null, pijlen: [], sel: null, kiesMet: null, half: false, mode: 'vb', toonModel: false,
  marks: new Set(), delta: null, preview: null, vbLijst: [], vbKey: null, vbStap: 0, vbPijl: false, o: null, st: null, melding: '',
  init(host){
    this.host = host;
    host.innerHTML = `<div class="simkop"><b>Mechanisme</b><span>elektronenpijlen op deeltjesniveau</span></div>
      <div id="mvkop" class="mvkop"></div>
      <div class="doek mvdoek" id="mvdoek"></div>
      <div class="ctrl" id="mvctrl"></div>
      <div class="waarneming" id="mvmeld"></div>
      <div id="mvprev"></div>
      <div class="legenda" id="mvleg"></div>`;
    this.render();
  },
  zetMech(key){ this.m = bereid(MECH[key]); this.key = key; },
  /* ---------- uitleg: voorbeelden bekijken ---------- */
  voorbeelden(lijst){ this.vbLijst = lijst; if (!lijst.includes(this.vbKey)) this.vbKey = lijst[0]; this.mode = 'vb'; this.zetMech(this.vbKey); this.vbStap = 0; this.vbPijl = false; this.pijlen = []; this.preview = null; this.melding = ''; this.render(); },
  vbNaar(stap, pijl){ this.vbStap = stap; this.vbPijl = pijl; this.render(); },
  /* ---------- opdrachten ---------- */
  opdracht(o, st){
    this.o = o; this.st = st; this.preview = null; this.melding = ''; this.sel = null; this.kiesMet = null; this.pijlen = []; this.toonModel = false;
    if (!o){
      const w = WPS[STAAT.wp];
      if (w.vbMol){ this.o = { mv:{ mol: w.vbMol, titel: w.vbMol, delta: delta({ C:'+', O:'−', O_e:'+' }) } }; this.st = { stap:0, klaar: !!this.toonDelta }; this.vbAlleen = true; this.richtIn(); return; }
      this.vbAlleen = false; this.voorbeelden(w.vbMech || ['sn2_vb']); return;
    }
    this.vbAlleen = false;
    this.richtIn();
  },
  richtIn(){
    const o = this.o, st = this.st; if (!o || !o.mv) return;
    if (o.mv.mol){ this.m = null; this.sc = MOL[o.mv.mol](); this.mode = 'markeer'; if (!this._marksVoor || this._marksVoor !== o) { this.marks = new Set(); this._marksVoor = o; } this.delta = st.klaar && o.mv.delta ? o.mv.delta(this.sc) : null; this.render(); return; }
    const k = Math.min(st.stap, o.stappen.length - 1), stap = o.stappen[k];
    this.zetMech(o.mv.mech);
    if (o.mv.lezen){ this.mode = 'lezen'; this.ms = 0; this.render(); return; }
    if (stap.type === 'sim' && !st.klaar && !(k < st.stap)){ this.mode = 'teken'; this.ms = stap.mstap; this.half = false; }
    else { this.mode = 'klaar'; this.ms = this.m.stappen.length; }
    this.render();
  },
  stapGoed(o, k){
    const stap = o.stappen[k];
    if (stap.type === 'sim' && stap.mstap != null && this.m){ const ms = this.m.stappen[stap.mstap]; this.melding = ms.label ? '<b>Stap ' + (stap.mstap + 1) + ':</b> ' + ms.label + '.' : ''; }
    this.pijlen = []; this.preview = null; this.sel = null; this.kiesMet = null; this.toonModel = false; this.marks = new Set();
    if (this.o && this.o.mv && this.o.mv.mol && this.o.mv.delta && this.st.klaar) this.delta = this.o.mv.delta(this.sc);
    const st = this.st;
    setTimeout(() => this.richtIn(), 0);
  },
  controleer(){
    const m = this.m, ms = m.stappen[this.ms], sc = m.scenes[this.ms];
    if (!this.pijlen.length) return { ok:false, msg:'Teken eerst een of meer pijlen in de simulatie.' };
    const alle = [...ms._gegeven, ...this.pijlen];
    const { r, fouten } = pasToe(sc, alle);
    this.preview = null;
    if (fouten.length){ this.render(); return { ok:false, msg: fouten[0] }; }
    const of = octetFout(r); if (of){ this.render(); return { ok:false, msg: of }; }
    if (gelijk(r, ms._doel)) return { ok:true, msg: ms.goedMsg || 'Goed!' };
    for (const al of ms.alt || []) if (gelijk(r, al._doel)) return al.ok ? { ok:true, msg: al.msg } : { ok:false, msg: al.msg };
    for (const f of ms.fout || []) if (gelijk(r, f._doel)){ this.preview = r; this.render(); return { ok:false, msg: f.msg }; }
    this.preview = r; this.render();
    return { ok:false, msg:'Deze pijlen leveren niet de juiste volgende stap op. Onder de tekening staat wat jouw pijlen opleveren.' };
  },
  toon(){ this.toonModel = true; this.pijlen = []; this.preview = null; this.render(); },
  /* ---------- tekenen ---------- */
  render(){
    if (!this.host || !$('#mvdoek')) return;
    const kop = $('#mvkop'), doek = $('#mvdoek'), ctrl = $('#mvctrl'), meld = $('#mvmeld'), leg = $('#mvleg'), prev = $('#mvprev');
    prev.innerHTML = '';
    if (this.mode === 'markeer'){
      kop.innerHTML = `<div class="mvtitel">Wijs atomen aan</div><div class="mvstof">${this.o.mv.titel || ''}</div>`;
      doek.innerHTML = svgScene(this.sc, { klik:true, marks: this.marks, delta: this.delta, maxh: 300 });
      ctrl.innerHTML = `<button class="btn g klein" id="mvwis">Wis keuze</button>`;
      $('#mvwis').onclick = () => { this.marks.clear(); this.render(); };
      meld.innerHTML = this.delta ? 'De partiële ladingen staan nu in de tekening.' : 'Klik op een atoom om het aan of uit te zetten.';
      leg.innerHTML = 'Volledige structuurformules, met vrije elektronenparen op O, N en de halogenen.';
      if (this.vbAlleen){ ctrl.innerHTML = ''; meld.innerHTML = this.delta ? 'De partiële ladingen staan in de tekening.' : 'Volg het voorbeeld links.'; return; }
      $$('#mvdoek .at').forEach(g => g.onclick = () => { const i = +g.dataset.i; this.marks.has(i) ? this.marks.delete(i) : this.marks.add(i); this.render(); });
      return;
    }
    const m = this.m; if (!m) return;
    const bb = mechBB(m);
    let sc, pijlen = [], titelStap = '', label = '';

      else this.melding = '<span class="foutje">Laat de pijl eindigen bij een atoom, niet bij een binding. Bij een nieuwe binding wijst de pijl naar het atoom waarmee de binding ontstaat.</span>';

  }

/* =====================================================================
   Simulatie 2: energiediagrammen
   ===================================================================== */
const DIAG = {
  sn2:  { titel:'Substitutie in één stap', p:[['begin',0],['ot',9],['eind',-3]] },
  sn1:  { titel:'Substitutie via een carbokation', p:[['begin',0],['ot',10],['tp',6.2],['ot',7.6],['eind',-2.4]] },
  add:  { titel:'Additie van HBr aan etheen', p:[['begin',0],['ot',8],['tp',4.2],['ot',5.3],['eind',-4.5]] },
  elim: { titel:'Eliminatie (zuurgekatalyseerd)', p:[['begin',0],['ot',2.6],['tp',1.2],['ot',9.4],['tp',6.4],['ot',7.4],['eind',1.6]] },
};
const PNAAM = { begin:'beginstoffen', ot:'overgangstoestand', tp:'tussenproduct', eind:'reactieproducten' };
const ED = {
  keuze: new Set(), labels: false, keys: ['add'], kiesbaar: false, o: null, st: null,
  init(host){
    this.host = host;
    host.innerHTML = `<div class="simkop"><b>Energiediagram</b><span>energie tijdens het reactieverloop</span></div><div id="edkop"></div><div class="doek" id="eddoek"></div><div class="ctrl" id="edctrl"></div><div class="waarneming" id="edmeld"></div>`;
    this.render();
  },
  opdracht(o, st){
    this.o = o; this.st = st; this.keuze = new Set();
    if (!o){ this.keys = [this.vbKey || 'add']; this.kiesbaar = false; this.labels = true; this.vb = true; }
    else { this.vb = false; this.keys = o.ed.keys; this.kiesbaar = !!o.ed.kies; this.labels = false; }
    this.render();
  },
  stapGoed(o, k){ if (k === o.stappen.length - 1 || o.ed.labelsNa === k) this.labels = true; this.keuze = new Set(); setTimeout(() => this.render(), 0); },
  svg(key, naam, w, h){
    const d = DIAG[key], n = d.p.length;
    const Emin = Math.min(...d.p.map(x => x[1])) - 1.5, Emax = Math.max(...d.p.map(x => x[1])) + 1.5;
    const L = 44, R = w - 14, T = 18, B = h - 30;
    const X = i => L + 30 + i * (R - L - 60) / (n - 1), Y = E => B - (E - Emin) / (Emax - Emin) * (B - T);
    let pad = `M${L + 6},${Y(d.p[0][1])} L${X(0)},${Y(d.p[0][1])}`;
    for (let i = 0; i < n - 1; i++){ const x0 = X(i), x1 = X(i + 1), xm = (x0 + x1) / 2; pad += ` C${xm},${Y(d.p[i][1])} ${xm},${Y(d.p[i + 1][1])} ${x1},${Y(d.p[i + 1][1])}`; }
    pad += ` L${R - 4},${Y(d.p[n - 1][1])}`;
    let s = `<svg viewBox="0 0 ${w} ${h}" class="edsvg">`;
    s += `<line x1="${L}" y1="${T - 6}" x2="${L}" y2="${B + 2}" stroke="#2b2a27" stroke-width="1.4"/><line x1="${L - 2}" y1="${B + 2}" x2="${R}" y2="${B + 2}" stroke="#2b2a27" stroke-width="1.4"/>`;
    s += `<path d="M${L - 4},${T} L${L},${T - 8} L${L + 4},${T}" fill="none" stroke="#2b2a27" stroke-width="1.4"/><path d="M${R - 8},${B - 2} L${R},${B + 2} L${R - 8},${B + 6}" fill="none" stroke="#2b2a27" stroke-width="1.4"/>`;
    s += `<text x="${L - 10}" y="${(T + B) / 2}" font-size="12" fill="#7a756b" text-anchor="middle" transform="rotate(-90 ${L - 10} ${(T + B) / 2})">energie</text><text x="${(L + R) / 2}" y="${h - 8}" font-size="12" fill="#7a756b" text-anchor="middle">reactieverloop</text>`;
    if (naam) s += `<text x="${L + 10}" y="${T + 4}" font-size="15" font-weight="700" fill="#2b2a27">${naam}</text>`;
    s += `<path d="${pad}" fill="none" stroke="#1F5FBF" stroke-width="2.6"/>`;
    d.p.forEach(([type, E], i) => {
      const x = X(i), y = Y(E), aan = this.keuze.has(key + ':' + i);
      const klik = this.kiesbaar && type !== 'begin' && type !== 'eind';
      if (this.labels){
        const boven = type === 'ot';
        s += `<text x="${x}" y="${boven ? y - 12 : y + 20}" font-size="11.5" fill="${type === 'ot' ? '#a0701f' : type === 'tp' ? '#2e8b57' : '#3e3b35'}" text-anchor="middle">${PNAAM[type]}</text>`;
      }

    });
    return s + '</svg>';
  },
  render(){
    if (!$('#eddoek')) return;
    const twee = this.keys.length > 1;
    $('#edkop').innerHTML = twee ? '' : `<div class="mvtitel">${DIAG[this.keys[0]].titel}</div>`;
    $('#eddoek').innerHTML = this.keys.map((k, j) => this.svg(k, twee ? 'Diagram ' + 'AB'[j] : '', 600, twee ? 230 : 320)).join('');
    $$('#eddoek .edpt.klik').forEach(c => c.onclick = () => { const k = c.dataset.k; this.keuze.has(k) ? this.keuze.delete(k) : this.keuze.add(k); this.render(); });

      $('#edmeld').innerHTML = 'Elke top is een overgangstoestand; elk dal tussen twee toppen is een tussenproduct.';
    } else {
      $('#edctrl').innerHTML = this.kiesbaar ? `<button class="btn g klein" id="edwis">Wis keuze</button>` : '';
      const w = $('#edwis'); if (w) w.onclick = () => { this.keuze.clear(); this.render(); };
      $('#edmeld').innerHTML = this.kiesbaar ? 'Klik op een punt van de lijn om het aan of uit te zetten.' : '';
    }
  },
  gekozen(){ return [...this.keuze]; }
};

/* =====================================================================
   Simulatie 3: kinetiek in een reactievat
   ===================================================================== */
const STOF = {
  bm: { naam:'broommethaan', stappen:1, k:0.30 },
  tb: { naam:'2-broom-2-methylpropaan', stappen:2, k1:0.030, k2:200 },
};
const CONC = [0.050, 0.10, 0.20];
const KIN = {
  c: { stof:'bm', RX:0.10, OH:0.10 }, metingen: [], run: null, t: 0,
  init(host){
    this.host = host;
    host.innerHTML = `<div class="simkop"><b>Reactievat</b><span>concentraties meten</span></div>
      <div class="ctrl"><label>Stof <select class="sel" id="kstof">${Object.entries(STOF).map(([k, s]) => `<option value="${k}">${s.naam}</option>`).join('')}</select></label></div>
      <div class="ctrl"><label>[RBr]<sub>0</sub> <select class="sel" id="krx">${CONC.map(c => `<option value="${c}">${nl(c, c < 0.1 ? 3 : 2)}</option>`).join('')}</select> ${breuk('mol', 'L')}</label>
        <label>[OH<sup>−</sup>]<sub>0</sub> <select class="sel" id="koh">${CONC.map(c => `<option value="${c}">${nl(c, c < 0.1 ? 3 : 2)}</option>`).join('')}</select> ${breuk('mol', 'L')}</label>
        <button class="btn klein" id="kmeet">Meet</button><button class="btn g klein" id="kwis">Wis metingen</button></div>
      <div class="vgl" id="kvgl"></div>
      <div class="doek"><canvas id="kdoek"></canvas></div>
      <div class="legenda" id="kleg"></div>
      <div id="ktabel"></div>`;
    const cv = $('#kdoek'), dpr = Math.max(1, window.devicePixelRatio || 1); cv.width = 600 * dpr; cv.height = 300 * dpr; this.g = cv.getContext('2d'); this.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    $('#kstof').value = this.c.stof; $('#krx').value = this.c.RX; $('#koh').value = this.c.OH;
    $('#kstof').onchange = e => { this.c.stof = e.target.value; this.run = null; this.render(); };
    $('#krx').onchange = e => { this.c.RX = +e.target.value; };
    $('#koh').onchange = e => { this.c.OH = +e.target.value; };
    $('#kmeet').onclick = () => this.meet();
    $('#kwis').onclick = () => { this.metingen = []; this.render(); };
    this.render();
  },
  opdracht(o){ if (o && o.kin){ this.c.stof = o.kin; if ($('#kstof')) $('#kstof').value = o.kin; this.run = null; this.render(); } },
  reken(stof, RX0, OH0){
    const s = STOF[stof], dt = 0.01, N = 6000, uit = [];
    let RX = RX0, OH = OH0, I = 0, P = 0;
    for (let n = 0; n <= N; n++){
      if (n % 30 === 0) uit.push([n * dt, RX, I, P]);
      if (s.stappen === 1){ const v = s.k * RX * OH; RX -= v * dt; OH -= v * dt; P += v * dt; }
      else { const v1 = s.k1 * RX, v2 = s.k2 * I * OH; RX -= v1 * dt; I += (v1 - v2) * dt; OH -= v2 * dt; P += v2 * dt; }
    }
    return uit;
  },
  meet(){
    const s = STOF[this.c.stof];
    const v0 = (s.stappen === 1 ? s.k * this.c.RX * this.c.OH : s.k1 * this.c.RX) * (1 + (Math.random() - 0.5) * 0.03);
    this.run = { stof: this.c.stof, data: this.reken(this.c.stof, this.c.RX, this.c.OH), t0: performance.now(), RX: this.c.RX, OH: this.c.OH };
    this.metingen.push({ stof: this.c.stof, RX: this.c.RX, OH: this.c.OH, v0 });
    this.render();
  },
  update(){},
  draw(){
    if (!this.g || !$('#kdoek')) return;
    const g = this.g, W = 600, H = 300, L = 58, R = W - 16, T = 16, B = H - 38;
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#fbf8f1'; g.fillRect(0, 0, W, H);
    const ymax = 0.2;
    const X = t => L + t / 60 * (R - L), Y = c => B - c / ymax * (B - T);
    g.strokeStyle = '#e3dccb'; g.lineWidth = 1; g.fillStyle = '#7a756b'; g.font = '12px Segoe UI, sans-serif'; g.textAlign = 'right';
    for (let c = 0; c <= ymax + 1e-9; c += 0.05){ g.beginPath(); g.moveTo(L, Y(c)); g.lineTo(R, Y(c)); g.stroke(); g.fillText(nl(c, 2), L - 6, Y(c) + 4); }
    g.textAlign = 'center';
    for (let t = 0; t <= 60; t += 10){ g.fillText(t, X(t), B + 16); }
    g.fillText('t (s)', (L + R) / 2, B + 32);
    g.save(); g.translate(14, (T + B) / 2); g.rotate(-Math.PI / 2); g.fillText('concentratie (mol/L)', 0, 0); g.restore();
    g.strokeStyle = '#2b2a27'; g.beginPath(); g.moveTo(L, T); g.lineTo(L, B); g.lineTo(R, B); g.stroke();
    if (!this.run) { g.fillStyle = '#7a756b'; g.font = 'italic 14px Georgia, serif'; g.fillText('Kies de concentraties en klik op Meet.', (L + R) / 2, (T + B) / 2); return; }
    const f = Math.min(1, (performance.now() - this.run.t0) / 2600), d = this.run.data, n = Math.max(2, Math.floor(d.length * f));
    const lijn = (idx, kl, schaal = 1, streep) => { g.strokeStyle = kl; g.lineWidth = 2.4; g.setLineDash(streep ? [6, 4] : []); g.beginPath(); for (let i = 0; i < n; i++){ const x = X(d[i][0]), y = Y(Math.min(ymax, d[i][idx] * schaal)); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); g.setLineDash([]); };
    lijn(1, '#1F5FBF'); lijn(3, '#1A7F37');
    if (STOF[this.run.stof].stappen === 2) lijn(2, '#D9822B', 100, true);
  },
  render(){
    if (!$('#ktabel')) return;
    const s = STOF[this.c.stof];
    $('#kvgl').innerHTML = s.stappen === 1 ? 'CH<sub>3</sub>Br + OH<sup>−</sup> → CH<sub>3</sub>OH + Br<sup>−</sup>' : '(CH<sub>3</sub>)<sub>3</sub>CBr + OH<sup>−</sup> → (CH<sub>3</sub>)<sub>3</sub>COH + Br<sup>−</sup>';
    $('#kleg').innerHTML = `<span class="lg"><i style="background:#1F5FBF"></i>[RBr]</span><span class="lg"><i style="background:#1A7F37"></i>[alcohol]</span>` + (s.stappen === 2 ? `<span class="lg"><i style="background:#D9822B"></i>[carbokation] × 100</span>` : '');
    const eh = 'mol/(L·s)';
    $('#ktabel').innerHTML = this.metingen.length ? `<div class="tabelkop">Metingen</div><table class="data"><tr><th>nr</th><th>stof</th><th>[RBr]<sub>0</sub> (${breuk('mol', 'L')})</th><th>[OH<sup>−</sup>]<sub>0</sub> (${breuk('mol', 'L')})</th><th>s<sub>0</sub> (${breuk('mol', 'L·s')})</th></tr>` +
      this.metingen.map((m, i) => `<tr><td>${i + 1}</td><td style="text-align:left">${STOF[m.stof].naam}</td><td>${nl(m.RX, m.RX < 0.1 ? 3 : 2)}</td><td>${nl(m.OH, m.OH < 0.1 ? 3 : 2)}</td><td>${wet(m.v0)}</td></tr>`).join('') + '</table><div class="legenda">s<sub>0</sub> = beginsnelheid: hoe snel [RBr] daalt op t = 0.</div>' : '';

function maakCanvas(host, w, h){

  c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = w + ' / ' + h;
  host.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.W = w; ctx.H = h; ctx.canvas_ = c;
  return ctx;
}

    h += `<div class="stap ${dicht ? 'dicht' : ''} ${goed ? 'goed' : ''}" data-k="${k}">${o.stappen.length > 1 ? `<span class="n">${goed ? '✓' : k + 1}</span>` : ''}<div class="inh">

      <div class="fb" id="fb${k}"></div></div></div>`;

}
const PIJLTIP = 'Pijl tekenen: klik eerst op de elektronen waar de pijl begint (een vrij elektronenpaar of een binding), daarna op het atoom waar de pijl naartoe gaat. Klik op een getekende pijl om hem weg te halen.';
const TEKENTIP = 'Tekenen: kies een atoomsoort en klik op het raster. Sleep vanaf een atoom om een binding met een nieuw of bestaand atoom te maken. Klik op een binding voor een dubbele binding. <b>+H aanvullen</b> zet ontbrekende H-atomen, maar je mag ze ook zelf zetten. <b>~</b> is een open binding: de keten gaat verder.';
const GETALTIP = 'Typ een getal met een komma, bijvoorbeeld <code>0,25</code> of <code>3,0·10^-3</code> (ook <code>3,0e-3</code>).';
const TYPTIP = 'Zo typ je (voorbeelden met titaan en chromaat): <code>Ti2(CrO4)3</code> · ion <code>Ti3+</code> of <code>CrO4 2-</code> · pijl <code>-></code> · toestand <code>(s)</code> <code>(aq)</code> <code>(l)</code> · coëfficiënt ervoor: <code>3 CrO4 2-(aq)</code>.';

function koppelOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];

      const tv = new Tekenveld($('#tv' + k), { breedte: st.breedte || 32, hoogte: st.hoogte || 13 });

    else if (inp){
      inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); };

      c.classList.toggle('aan');
    });
    $(`[data-ctl="${k}"]`).onclick = () => controleer(w, p, k);
    $(`[data-hint="${k}"]`).onclick = () => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = st.hint; };
    $(`[data-toon="${k}"]`).onclick = () => {
      s.getoond = true; st.toon && st.toon(); const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = 'Antwoord: ' + st.antwoord();
      setTimeout(() => stapGoed(w, p, k), 1400);

  });
}
function waardeVan(st, k){
  if (st.type === 'tekst') return $('#in' + k).value;
  if (st.type === 'chips') return $$(`#ch${k} .chip.aan`).map(c => +c.dataset.j);
  if (st.type === 'keuze') return $$(`#op${k} .optie.aan`).map(c => +c.dataset.j);
  if (st.type === 'selects') return st.selects.map((x, j) => $(`#se${k}_${j}`).value);

function controleer(w, p, k){

function stapGoed(w, p, k){

    check: v => {
      if (!v.length) return { ok:false, msg:'Kies een antwoord.' };
      const sel = v.map(j => opts[j]), goed = opts.filter(x => x.g);
      if (sel.length === goed.length && sel.every(x => x.g)) return { ok:true, msg: o.goedMsg };
      const fb = sel.find(x => !x.g && x.fb); if (fb) return { ok:false, msg: fb.fb };
      if (o.meer && sel.every(x => x.g)) return { ok:false, msg:'Je mist er nog een.' };
      return { ok:false, msg: o.fout || 'Nog niet goed.' };
    },
    antwoord: () => opts.filter(x => x.g).map(x => x.html).join('; ') };

function leesGetal(s){
  let t = String(s).trim().replace(/\s+/g, '').replace(/[×x*·]10\^?/i, 'e').replace(/10\^/, 'e');
  t = t.replace(',', '.');
  return /^-?\d*\.?\d+(e-?\d+)?$/i.test(t) ? parseFloat(t) : NaN;
}
function getalStap(vr, waarde, eenheid, uitleg, hint, tol = 0.03){

      if (Math.abs(x - waarde) <= Math.abs(waarde) * tol + 1e-12) return { ok:true, msg:'Goed! ' + uitleg };
      return { ok:false, msg:'Nog niet goed. ' + hint }; },

}

/* ================= 5. Mechanisme en kinetiek ================= */

/* ================= ★ 6. Snelheidsvergelijking ================= */
const ORDES = [[1,1],[1,0],[0,1],[2,0]];
const MECHTEKST = {
  '1,1':'A + B → I (langzaam); I → C (snel)', '1,0':'A → I (langzaam); I + B → C (snel)', '0,1':'B → I (langzaam); I + A → C (snel)',
  '2,0':'2 A → I (langzaam); I + B → C (snel)', een:'A + B → C (in één stap)'
};
const wordt = r => Math.abs(r - 1) < 0.01 ? 'blijft s<sub>0</sub> gelijk' : 'wordt s<sub>0</sub> ' + nl(r, 0) + ' keer zo groot';
function kEenheid(tot){ return tot === 1 ? breuk('1', 's') : tot === 2 ? breuk('L', 'mol·s') : breuk('L<sup>2</sup>', 'mol<sup>2</sup>·s'); }
function ordeOpdracht(nr){
  const [m, n] = kies(ORDES), k = +(kies([0.12, 0.25, 0.40, 0.60, 1.5, 2.4])).toFixed(2);
  const exp = [[0.10, 0.10], [0.20, 0.10], [0.10, 0.20]].map(([a, b]) => ({ a, b, s: k * Math.pow(a, m) * Math.pow(b, n) }));
  const tab = `<table class="data"><tr><th>exp.</th><th>[A] (${breuk('mol', 'L')})</th><th>[B] (${breuk('mol', 'L')})</th><th>s<sub>0</sub> (${breuk('mol', 'L·s')})</th></tr>${exp.map((e, i) => `<tr><td>${i + 1}</td><td>${nl(e.a, 2)}</td><td>${nl(e.b, 2)}</td><td>${wet(e.s)}</td></tr>`).join('')}</table>`;
  const ordeSel = l => ({ lab: l, opties:[{ v:'0', t:'0' }, { v:'1', t:'1' }, { v:'2', t:'2' }] });
  const opts = Object.entries(MECHTEKST).map(([key, t]) => ({ html: t, g: key === m + ',' + n || (key === 'een' && m === 1 && n === 1) }));
  const ratio = (x, y) => x / y;
  return { titel:'Orde bepalen ' + nr, vraag:'Voor de reactie A + B → C zijn deze beginsnelheden gemeten:' + tab + 'De snelheidsvergelijking is s = k·[A]<sup>m</sup>·[B]<sup>n</sup>.',
    stappen:[
      selStap('Leid de ordes m en n af.', [ordeSel('m ='), ordeSel('n =')], [m, n], 'Vergelijk experiment 1 met 2 (alleen [A] verdubbelt) en 1 met 3 (alleen [B] verdubbelt).',
        `m = ${m}: als [A] verdubbelt, ${wordt(ratio(exp[1].s, exp[0].s))}. n = ${n}: als [B] verdubbelt, ${wordt(ratio(exp[2].s, exp[0].s))}.`),
      getalStap('Bereken k met experiment 1. De eenheid staat erachter.', k, kEenheid(m + n), `k = ${breuk('s<sub>0</sub>', '[A]<sup>' + m + '</sup>·[B]<sup>' + n + '</sup>')} = ${nl(k, 2)}.`, 'Vul experiment 1 in: k = s<sub>0</sub> gedeeld door [A]<sup>m</sup>·[B]<sup>n</sup>.', 0.02),
      keuzeStap('Welke mechanismen passen bij deze snelheidsvergelijking? Kies alles wat van toepassing is.', opts, { meer:true, hint:'De deeltjes in de snelheidsbepalende stap bepalen de ordes.' })] };
}
WPS.push({
  id:'snelheid', titel:'Snelheidsvergelijking', par:'orde en mechanisme', ster:true, sim: KIN,
  uitleg: () => `
    <p>Met een <b>snelheidsvergelijking</b> beschrijf je hoe de beginsnelheid afhangt van de concentraties: s = k·[A]<sup>m</sup>·[B]<sup>n</sup>. De exponenten m en n heten de <b>orde</b> in A en in B; k is de snelheidsconstante.</p>
    <ul><li>Wordt s<sub>0</sub> twee keer zo groot als [A] verdubbelt? Dan is de orde in A 1.</li>
    <li>Vier keer zo groot? Dan is de orde 2. Blijft s<sub>0</sub> gelijk? Dan is de orde 0.</li></ul>
    <div class="kader">De ordes volgen uit de snelheidsbepalende stap: een deeltje dat daarin (of in een snelle stap ervóór) reageert, komt in de snelheidsvergelijking. Een deeltje dat pas na die stap reageert, heeft orde 0.</div>`,
  voorbeeld: {
    vraag:`Leid de snelheidsvergelijking af voor de reactie van broommethaan met OH<sup>−</sup> en bereken k. Gegeven: bij [RBr]<sub>0</sub> = [OH<sup>−</sup>]<sub>0</sub> = 0,10 ${ML} is s<sub>0</sub> = 3,0·10<sup>−3</sup> ${breuk('mol', 'L·s')}. Verdubbelen van [RBr]<sub>0</sub> of van [OH<sup>−</sup>]<sub>0</sub> verdubbelt s<sub>0</sub>.`,
    stappen:[
      'Verdubbelen van [RBr]<sub>0</sub> verdubbelt s<sub>0</sub>: orde 1 in RBr. Hetzelfde geldt voor OH<sup>−</sup>: orde 1.',
      'De snelheidsvergelijking is s = k·[RBr]·[OH<sup>−</sup>].',
      `k = ${breuk('s', '[RBr]·[OH<sup>−</sup>]')} = ${breuk('3,0·10<sup>−3</sup> ' + breuk('mol', 'L·s'), '0,10 ' + breuk('mol', 'L') + ' · 0,10 ' + breuk('mol', 'L'))} = 0,30 ${breuk('L', 'mol·s')}`
    ]
  },
  maakSerie(){
    return [ordeOpdracht(1),
      { titel:'Meten in het reactievat', kin:'tb', vraag:'Bepaal met metingen in het reactievat de ordes voor de reactie van 2-broom-2-methylpropaan met OH<sup>−</sup>. Verander telkens één concentratie.',
        stappen:[selStap('Leid de ordes af in s = k·[RBr]<sup>m</sup>·[OH<sup>−</sup>]<sup>n</sup>.', [{ lab:'m =', opties:[{ v:'0', t:'0' }, { v:'1', t:'1' }, { v:'2', t:'2' }] }, { lab:'n =', opties:[{ v:'0', t:'0' }, { v:'1', t:'1' }, { v:'2', t:'2' }] }], [1, 0],
          'Verdubbel eerst alleen [RBr]<sub>0</sub>, daarna alleen [OH<sup>−</sup>]<sub>0</sub>.', 'm = 1 en n = 0: s = k·[RBr]. OH<sup>−</sup> reageert pas na de snelheidsbepalende stap.'),
          getalStap('Bereken k uit een van je metingen. De eenheid staat erachter.', 0.030, kEenheid(1), `k = ${breuk('s<sub>0</sub>', '[RBr]')} ≈ 0,030.`, 'Bij orde 0 in OH<sup>−</sup> is k = s<sub>0</sub> gedeeld door [RBr]<sub>0</sub>.', 0.06)] },
      ordeOpdracht(2)];
  }
});
