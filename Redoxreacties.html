<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redoxreacties</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}
aside nav a .kl{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;border-radius:5px;padding:0 5px;margin-left:6px;background:#3b5064;color:#cfd9e2;vertical-align:1px}
aside nav a.on .kl{background:#4c6378}
body.beamer .vgl{font-size:22px}

/* Binas 48 */
.modal{position:fixed;inset:0;background:rgba(20,26,32,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 16px;overflow:auto}
.modal.open{display:flex}
.modal .doos{background:var(--vel);border-radius:14px;max-width:860px;width:100%;padding:20px 22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .kop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.modal .kop h3{font-family:var(--serif);font-size:22px;flex:1;font-weight:600}
.b48zoek{font-size:14px;border:1px solid var(--rand2);border-radius:8px;padding:6px 10px;width:220px}
table.b48{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
table.b48 th{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--grijs);text-align:left;padding:4px 8px;border-bottom:2px solid #8fb3d1}
table.b48 td{padding:3px 8px;border-bottom:1px solid #cfe0ee;white-space:nowrap}
table.b48 td.pijl{text-align:center;color:var(--grijs);width:30px}
table.b48 td.v{text-align:right;font-variant-numeric:tabular-nums;width:70px}
table.b48 tr.licht td{background:#fbf1da}
.b48noot{font-size:12.5px;color:var(--inkt2);margin-top:10px;line-height:1.55}
.b48kop{font-size:12.5px;color:var(--inkt2);margin-bottom:8px}

/* ladder */
.ladder{position:relative}
.ladchip{position:absolute;transform:translateY(-50%);border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:1px 10px;font-size:13.5px;cursor:pointer;white-space:nowrap;user-select:none}
.ladchip:hover{border-color:#b9ad93}
.ladchip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.ladchip.sterk{box-shadow:0 0 0 3px #e2a84b}
.ladchip small{color:var(--grijs);margin-left:5px;font-size:11.5px}
.ladchip.aan small{color:#cfd9e2}

/* kaarten halfreacties */
.hkaart{background:#fff;border:1px solid var(--rand);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.hkaart .vgl{flex:1;font-size:17px;text-align:left}
.hkaart .lab{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--goud);width:78px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:7px;border:1px solid var(--rand2);background:#fff;cursor:pointer;font-size:16px;line-height:1}
.stepper b{min-width:30px;text-align:center;font-size:15px}
.ebalk{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.ebalk .bar{height:14px;background:#efe9dc;border-radius:7px;overflow:hidden}
.ebalk .bar i{display:block;height:100%;border-radius:7px;transition:width .3s}
.totaal{background:#fff;border:1px solid var(--rand);border-radius:11px;padding:12px 14px;font-size:17px;font-family:var(--serif);line-height:1.9}
.totaal s{color:#b4473a;text-decoration-thickness:2px}

/* balanscontrole */
table.bal{border-collapse:collapse;font-size:14px;background:#fff}
table.bal th,table.bal td{border:1px solid var(--rand);padding:3px 10px;text-align:center}
table.bal td.ok{background:var(--goedbg);color:#255c3d;font-weight:700}
table.bal td.nok{background:var(--foutbg);color:#7c2c22;font-weight:700}
.miniin{font-family:var(--mono);font-size:14px;border:1px solid var(--rand2);border-radius:8px;padding:6px 9px;width:100%}
.knoppen{display:flex;flex-wrap:wrap;gap:6px}
.uitleg-sm{font-size:12.5px;color:var(--grijs);line-height:1.5}
table.vgltab{border-collapse:collapse;margin:6px 0 12px;font-size:14.5px;background:var(--vel)}
table.vgltab td{border:1px solid var(--rand);padding:5px 10px;vertical-align:top;color:var(--inkt2)}
table.vgltab td:first-child{color:var(--grijs);font-size:13px;white-space:nowrap}
.breuk{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}
.breuk>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.breuk>span:last-child{padding:0 3px}
.reken{line-height:2.6}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Redoxreacties</h1>
    <div class="sub">5 vwo · H10 &nbsp;·&nbsp; 6 vwo · elektrochemie</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button id="binasknop">Binas tabel 48</button>
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Voortgang wissen</button>
      <div class="klein">Tabel 48 overgenomen uit de Binas die de klas gebruikt.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="b48modal"><div class="doos">
  <div class="kop"><h3>Binas tabel 48 · standaardelektrodepotentialen</h3><input class="b48zoek" id="b48zoek" placeholder="zoek, bijv. Cu2+ of MnO4"><button class="btn g klein" id="b48dicht">Sluiten ✕</button></div>
  <div id="b48inh"></div>
</div></div>
<script>
'use strict';
/* =====================================================================
   Hulpjes
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ggd = (a, b) => b ? ggd(b, a % b) : a;
const kgv = (a, b) => a / ggd(a, b) * b;
const lerp = (a, b, t) => a + (b - a) * t;
const komma = (x, d) => x.toFixed(d).replace('.', ',').replace('-', '−');
const vTxt = v => v === 0 ? '0' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',');

/* =====================================================================
   Binas tabel 48 (overgenomen uit de Binas van de klas)
   oxidator | reductor | V0 | voetnoot
   ===================================================================== */
const T48_RUW = [
  ['F2(g) + 2 e-', '2 F-', '+2,87', ''],
  ['O3(g) + 2 H+ + 2 e-', 'H2O(l) + O2(g)', '+2,08', ''],
  ['H2O2 + 2 H+ + 2 e-', '2 H2O(l)', '+1,78', ''],
  ['N2O(g) + 2 H+ + 2 e-', 'N2(g) + H2O(l)', '+1,77', ''],
  ['Ce4+ + e-', 'Ce3+', '+1,72', ''],
  ['PbO2(s) + SO4^2- + 4 H+ + 2 e-', 'PbSO4(s) + 2 H2O(l)', '+1,69', ''],
  ['2 HClO + 2 H+ + 2 e-', 'Cl2(g) + 2 H2O(l)', '+1,61', ''],
  ['2 NO(g) + 2 H+ + 2 e-', 'N2O(g) + H2O(l)', '+1,59', ''],
  ['MnO4- + 8 H+ + 5 e-', 'Mn2+ + 4 H2O(l)', '+1,51', ''],
  ['Au3+ + 3 e-', 'Au(s)', '+1,50', ''],
  ['Mn2O3(s) + 6 H+ + 2 e-', '2 Mn2+ + 3 H2O(l)', '+1,49', ''],
  ['PbO2(s) + 4 H+ + 2 e-', 'Pb2+ + 2 H2O(l)', '+1,46', ''],
  ['ClO3- + 6 H+ + 6 e-', 'Cl- + 3 H2O(l)', '+1,45', ''],
  ['Cl2(g) + 2 e-', '2 Cl-', '+1,36', ''],
  ['Cr2O7^2- + 14 H+ + 6 e-', '2 Cr3+ + 7 H2O(l)', '+1,36', ''],
  ['O3(g) + H2O(l) + 2 e-', '2 OH- + O2(g)', '+1,24', ''],
  ['O2(g) + 4 H+ + 4 e-', '2 H2O(l)', '+1,23', ''],
  ['MnO2(s) + 4 H+ + 2 e-', 'Mn2+ + 2 H2O(l)', '+1,22', ''],
  ['Br2 + 2 e-', '2 Br-', '+1,09', ''],
  ['Br2(l) + 2 e-', '2 Br-', '+1,07', ''],
  ['AuCl4- + 3 e-', 'Au(s) + 4 Cl-', '+1,00', ''],
  ['HNO2 + H+ + e-', 'NO(g) + H2O(l)', '+0,98', ''],
  ['NO3- + 4 H+ + 3 e-', 'NO(g) + 2 H2O(l)', '+0,96', ''],
  ['H2O2 + 2 e-', '2 OH-', '+0,95', ''],
  ['NO3- + 3 H+ + 2 e-', 'HNO2 + H2O(l)', '+0,93', ''],
  ['Hg2+ + e-', 'Hg+', '+0,92', '1'],
  ['Cu2+ + I- + e-', 'CuI(s)', '+0,85', ''],
  ['Hg2+ + 2 e-', 'Hg(l)', '+0,85', ''],
  ['Ag+ + e-', 'Ag(s)', '+0,80', ''],
  ['Hg+ + e-', 'Hg(l)', '+0,80', '3'],
  ['NO3- + 2 H+ + e-', 'NO2(g) + H2O(l)', '+0,80', '2'],
  ['Fe3+ + e-', 'Fe2+', '+0,77', ''],
  ['O2(g) + 2 H+ + 2 e-', 'H2O2', '+0,70', ''],
  ['MnO4- + 2 H2O(l) + 3 e-', 'MnO2(s) + 4 OH-', '+0,60', ''],
  ['MnO4- + e-', 'MnO4^2-', '+0,56', ''],
  ['I2 + 2 e-', '2 I-', '+0,54', ''],
  ['I2(s) + 2 e-', '2 I-', '+0,54', ''],

function bol(c, x, y, r, kleur, label, alfa = 1){

  const g = c.createRadialGradient(x - r*0.35, y - r*0.4, r*0.15, x, y, r);
  g.addColorStop(0, mengKleur(kleur, 0.55)); g.addColorStop(0.75, kleur); g.addColorStop(1, kleur);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill();
  c.strokeStyle = 'rgba(40,35,30,.35)'; c.lineWidth = 1; c.stroke();
  if (label){ c.font = `700 ${Math.max(9, Math.min(14, r * 0.62))}px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = helder(kleur) > 0.6 ? '#2b2a27' : '#fff'; c.fillText(label, x, y + 0.5); }
  c.restore();
}
function elektron(c, x, y, alfa = 1){ c.save(); c.globalAlpha = alfa; c.fillStyle = '#f2c230'; c.strokeStyle = '#8a6a0c'; c.lineWidth = 1; c.beginPath(); c.arc(x, y, 4.2, 0, Math.PI*2); c.fill(); c.stroke();
  c.fillStyle = '#5a4306'; c.font = '700 8px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('−', x, y + 0.3); c.restore(); }
function maakCanvas(host, w, h){
  const c = document.createElement('canvas'), dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = w + ' / ' + h;
  host.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.W = w; ctx.H = h; return ctx;
}
const breuk = (t, n) => `<span class="breuk"><span>${t}</span><span>${n}</span></span>`;

/* ---------- opslag ---------- */
const OPSLAG = 'redox-v2';
function laad(){ try { return JSON.parse(localStorage.getItem(OPSLAG)) || {}; } catch (e){ return {}; } }
function bewaar(o){ try { localStorage.setItem(OPSLAG, JSON.stringify(o)); } catch (e){} }

/* =====================================================================
   Algemene opbouw: zijbalk, werkplaats, voorbeeld, opdrachten in stappen
   ===================================================================== */
const WPS = [];
const STAAT = { wp:0, tab:'uitleg', voortgang: laad() };
const PER_WP = {};
let SIM = null;

function renderNav(){
  $('#nav').innerHTML = WPS.map((w, i) => {
    const klaar = STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar;
    return `<a data-i="${i}" class="${i === STAAT.wp ? 'on' : ''} ${klaar ? 'klaar' : ''}"><i>${klaar ? '✓' : w.ster ? '★' : i + 1}</i><span>${w.titel}<small>${w.par}<span class="kl">${w.klas}</span></small></span></a>`;
  }).join('');
  $$('#nav a').forEach(a => a.onclick = () => open(+a.dataset.i));
}
function open(i){
  STAAT.wp = i; STAAT.tab = 'uitleg';
  const w = WPS[i];
  if (!PER_WP[w.id]) nieuweSerie(w);
  $('#main').innerHTML = `<div class="wp"><section class="tekst" id="tekst"></section><section class="simkol" id="simkol"></section></div>`;
  SIM = w.sim; SIM.init($('#simkol'));
  renderTekst(); renderNav();
  window.scrollTo(0, 0);
}
function nieuweSerie(w){
  const serie = w.maakSerie();
  PER_WP[w.id] = { serie, idx:0, st: serie.map(() => ({ stap:0, getoond:false, klaar:false, pogingen:{} })) };
}
function renderTekst(){
  const w = WPS[STAAT.wp], p = PER_WP[w.id];
  const nGoed = p.st.filter((s, k) => s.klaar && !s.getoond && !p.serie[k].ster).length, nTot = p.serie.filter(o => !o.ster).length;
  let h = `<div class="kicker">${w.ster ? 'Werkplaats ★ · verdieping' : 'Werkplaats ' + (STAAT.wp + 1) + ' · ' + w.par}</div><h2>${w.titel}</h2>
    <div class="tabs"><button data-t="uitleg" class="${STAAT.tab === 'uitleg' ? 'on' : ''}">Uitleg en voorbeeld</button>
    <button data-t="opd" class="${STAAT.tab === 'opd' ? 'on' : ''}">Opdrachten<span class="tel">${nGoed}/${nTot}</span></button></div>`;
  h += STAAT.tab === 'uitleg' ? w.uitleg() + renderVoorbeelden(w) : renderOpdracht(w, p);
  $('#tekst').innerHTML = h;
  $$('#tekst .tabs button').forEach(b => b.onclick = () => { STAAT.tab = b.dataset.t; renderTekst(); if (STAAT.tab === 'opd') zetOpdrachtInSim(); else SIM.opdracht && SIM.opdracht(null); });
  if (STAAT.tab === 'uitleg') koppelVoorbeelden(w); else koppelOpdracht(w, p);
}

/* ---------- uitgewerkte voorbeelden, stap voor stap ---------- */
function vbLijst(w){ return w.voorbeelden || (w.voorbeeld ? [w.voorbeeld] : []); }
function renderVoorbeelden(w){
  const lijst = vbLijst(w); w._vb = w._vb || lijst.map(() => 0);
  return lijst.map((vb, j) => {
    const n = w._vb[j];
    let h = `<div class="vb"><div class="vbkop">Voorbeeld${lijst.length > 1 ? ' ' + (j + 1) : ''}</div><div class="vbvraag">${vb.vraag}</div>`;
    for (let k = 0; k < n; k++) h += `<div class="vbstap"><span class="n">${k + 1}</span><div class="b">${vb.stappen[k]}</div></div>`;
    h += n < vb.stappen.length ? `<div class="verder"><button class="btn g klein" data-vb="${j}">${n ? 'Volgende stap' : 'Toon de uitwerking'} ▸</button></div>`
       : (j === lijst.length - 1 ? `<div class="verder"><button class="btn klein" id="naaropd">Naar de opdrachten ▸</button></div>` : '');
    return h + '</div>';
  }).join('');
}
function koppelVoorbeelden(w){
  $$('[data-vb]').forEach(b => b.onclick = () => { const j = +b.dataset.vb; w._vb[j]++; renderTekst(); const vb = vbLijst(w)[j]; vb.bijStap && vb.bijStap(w._vb[j]); });
  const o = $('#naaropd'); if (o) o.onclick = () => { STAAT.tab = 'opd'; renderTekst(); zetOpdrachtInSim(); window.scrollTo(0, 0); };
}

/* ---------- opdrachten ---------- */
function renderOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  const nTot = p.serie.filter(x => !x.ster).length;
  let h = '';
  if (STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar && p.st.every((x, k) => p.serie[k].ster || (x.klaar && !x.getoond)))
    h += `<div class="klaarbanner"><b>Werkplaats afgerond.</b> Probeer ook de ★-opdracht, of oefen met een nieuwe serie.</div>`;
  h += `<div class="oknop">` + p.serie.map((x, k) => {
    const st = p.st[k];
    return `<span class="dot ${k === p.idx ? 'on' : ''} ${st.klaar && !st.getoond ? 'goed' : ''} ${x.ster ? 'ster' : ''}" data-k="${k}" title="${x.titel}">${x.ster ? '★' : k + 1}</span>`;
  }).join('') + `<span class="rechts"><button class="btn g klein" id="nieuweserie">Nieuwe serie</button></span></div>`;
  h += `<div class="opdkop">${o.ster ? '<span class="st">★ </span>' : ''}Opdracht ${o.ster ? '★' : p.idx + 1}${o.ster ? '' : ' van ' + nTot} · ${o.titel}</div>`;
  if (o.vraag) h += `<div class="opdvraag">${o.vraag}</div>`;
  o.stappen.forEach((st, k) => {
    const dicht = k > s.stap, goed = k < s.stap || s.klaar;
    h += `<div class="stap ${dicht ? 'dicht' : ''} ${goed ? 'goed' : ''}" data-k="${k}">${o.stappen.length > 1 ? `<span class="n">${goed ? '✓' : k + 1}</span>` : ''}<div class="inh">
      <div class="vr">${st.vr}</div>${goed ? `<div class="antw">${st.antwoord()}</div>` : `<div class="inv">${invoerHTML(st, k)}</div>`}
      <div class="fb" id="fb${k}"></div></div></div>`;
  });
  if (s.klaar){
    const volgende = p.idx < p.serie.length - 1;
    h += `<div class="rij" style="margin-top:6px">${volgende ? `<button class="btn" id="volgende">Volgende opdracht ▸</button>` : ''}${o.naKlaar ? `<span class="waarneming">${o.naKlaar()}</span>` : ''}</div>`;
  }
  h += `<div class="typtip">${w.typtip || TYPTIP}</div>`;
  return h;
}
const TYPTIP = 'Zo typ je: ion <code>Fe3+</code> of <code>SO4 2-</code> · elektron <code>e-</code> · pijl <code>-></code> · coëfficiënt ervoor: <code>2 e-</code>, <code>4 H+</code>. Toestandsaanduidingen mogen, maar hoeven niet. Decimale getallen met een komma: <code>0,34</code>.';

function invoerHTML(st, k){
  const knoppen = `<button class="btn" data-ctl="${k}">Controleer</button><button class="btn g" data-hint="${k}">Hint</button><button class="btn g" data-toon="${k}" style="display:none">Toon antwoord</button>`;
  if (st.type === 'tekst') return `<div class="rij"><input class="in" id="in${k}" autocomplete="off" spellcheck="false" placeholder="${st.ph || ''}">${knoppen}</div><div class="voorbeeldweergave" id="vw${k}"></div>`;
  if (st.type === 'getal') return `<div class="rij"><input class="in" id="in${k}" autocomplete="off" spellcheck="false" placeholder="${st.ph || 'getal'}" style="flex:0 1 220px"><span style="font-size:15px">${st.eenheid || ''}</span>${knoppen}</div><div class="voorbeeldweergave" id="vw${k}"></div>`;
  if (st.type === 'chips') return `<div class="chips" id="ch${k}">${st.opties.map((x, j) => `<span class="chip" data-j="${j}">${x.html}</span>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'keuze') return `<div class="opties" id="op${k}">${st.opties.map((x, j) => `<button class="optie" data-j="${j}">${x.html}</button>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'selects') return `<div class="rij">${st.selects.map((s, j) => `<label style="font-size:14px">${s.lab} <select class="sel" id="se${k}_${j}"><option value="">kies…</option>${s.opties.map(x => `<option value="${x.v}">${x.t}</option>`).join('')}</select></label>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  return '';
}
function koppelOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  $$('.oknop .dot').forEach(d => d.onclick = () => { p.idx = +d.dataset.k; renderTekst(); zetOpdrachtInSim(); });
  $('#nieuweserie').onclick = () => { nieuweSerie(w); renderTekst(); zetOpdrachtInSim(); };
  const v = $('#volgende'); if (v) v.onclick = () => { p.idx++; renderTekst(); zetOpdrachtInSim(); };
  o.stappen.forEach((st, k) => {
    if (k !== s.stap || s.klaar) return;
    const inp = $('#in' + k);
    if (inp){
      inp.oninput = () => {
        const vw = $('#vw' + k), t = inp.value.trim();
        if (st.type === 'getal'){ const g = leesGetal(t); vw.innerHTML = t ? (g ? 'Zo lees ik het: <b>' + getalHTML(t) + '</b>' : 'Dit kan ik (nog) niet als getal lezen.') : ''; }
        else vw.innerHTML = t ? 'Zo lees ik het: <b>' + mooi(inp.value) + '</b>' : '';
        SIM.invoer && SIM.invoer(inp.value, st);
      };
      inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); };
      setTimeout(() => inp.focus({ preventScroll:true }), 30);
    }
    $$(`#ch${k} .chip`).forEach(c => c.onclick = () => c.classList.toggle('aan'));
    $$(`#op${k} .optie`).forEach(c => c.onclick = () => {
      if (!st.meer) $$(`#op${k} .optie`).forEach(x => x !== c && x.classList.remove('aan'));
      c.classList.toggle('aan');
    });
    $(`[data-ctl="${k}"]`).onclick = () => controleer(w, p, k);
    $(`[data-hint="${k}"]`).onclick = () => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = st.hint; };
    $(`[data-toon="${k}"]`).onclick = () => {
      s.getoond = true; const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = 'Antwoord: ' + st.antwoord();
      setTimeout(() => stapGoed(w, p, k), 1600);
    };
    if ((s.pogingen[k] || 0) >= 2) $(`[data-toon="${k}"]`).style.display = '';
  });
}
function waardeVan(st, k){
  if (st.type === 'tekst' || st.type === 'getal') return $('#in' + k).value;
  if (st.type === 'chips') return $$(`#ch${k} .chip.aan`).map(c => +c.dataset.j);
  if (st.type === 'keuze') return $$(`#op${k} .optie.aan`).map(c => +c.dataset.j);
  if (st.type === 'selects') return st.selects.map((x, j) => $(`#se${k}_${j}`).value);
}
function controleer(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx], st = o.stappen[k];
  const r = st.check(waardeVan(st, k));
  const fb = $('#fb' + k);
  if (r.ok){ st.bijGoed && st.bijGoed(waardeVan(st, k)); fb.className = 'fb toon goed'; fb.innerHTML = r.msg || 'Goed!'; setTimeout(() => stapGoed(w, p, k), 700); }
  else {
    s.pogingen[k] = (s.pogingen[k] || 0) + 1;
    fb.className = 'fb toon fout'; fb.innerHTML = r.msg;
    if (s.pogingen[k] >= 2) $(`[data-toon="${k}"]`).style.display = '';
  }
}
function stapGoed(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx];
  if (s.stap !== k) return;
  s.stap = k + 1;
  if (s.stap >= o.stappen.length) s.klaar = true;
  SIM.stapGoed && SIM.stapGoed(o, k);
  if (s.klaar){
    const nietSter = p.serie.map((x, j) => [x, p.st[j]]).filter(([x]) => !x.ster);
    if (nietSter.every(([, y]) => y.klaar && !y.getoond)){ STAAT.voortgang[w.id] = { klaar:true }; bewaar(STAAT.voortgang); renderNav(); }
  }
  renderTekst();
}
function zetOpdrachtInSim(){
  const w = WPS[STAAT.wp], p = PER_WP[w.id];
  SIM.opdracht && SIM.opdracht(STAAT.tab === 'opd' ? p.serie[p.idx] : null, STAAT.tab === 'opd' ? p.st[p.idx] : null);
}
/* invoer netjes weergeven */
function mooi(invoer){
  const v = leesVgl(invoer);
  if (!v.fout) return vglHTML(v, { st:true });
  const L = leesKant(norm(invoer)); if (L) return L.map(x => termHTML(x, true)).join(' + ');
  return norm(invoer).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/->/g, ' → ');
}
function getalHTML(t){ const g = leesGetal(t); if (!g) return ''; const e = g.w === 0 ? 0 : Math.floor(Math.log10(Math.abs(g.w)));
  return (Math.abs(e) >= 3) ? (g.w / Math.pow(10, e)).toPrecision(Math.max(1, g.sig)).replace('.', ',') + '·10<sup>' + (e < 0 ? '−' + -e : e) + '</sup>' : g.w.toPrecision(Math.max(1, g.sig)).replace('.', ','); }

/* ---------- veelgebruikte opdrachtbouwstenen ---------- */
const vglStap = (vr, verw, hint, o = {}) => ({ type:'tekst', vr, ph: o.ph || 'vergelijking', check: v => checkVgl(v, verw, o), antwoord: () => vglHTML(verw), hint, goed: () => vglTyp(verw) });
function keuze(vr, opties, goed, hint, o = {}){            /* opties: [html]; goed: [index] */
  const idx = schud(opties.map((h, j) => j));
  const opts = idx.map(j => ({ html: opties[j], j }));
  return { type: o.chips ? 'chips' : 'keuze', meer: !!o.meer, vr, opties: opts, hint,
    check: v => {
      const gekozen = v.map(x => opts[x].j).sort().join(','), juist = goed.slice().sort().join(',');
      if (!v.length) return { ok:false, msg: o.chips || o.meer ? 'Kies eerst één of meer antwoorden.' : 'Kies eerst een antwoord.' };
      if (gekozen === juist) return { ok:true, msg: o.goedMsg };
      if ((o.chips || o.meer) && v.every(x => goed.includes(opts[x].j))) return { ok:false, msg:'Wat je koos klopt, maar er zijn er nog meer.' };
      return { ok:false, msg: (o.foutMsg && o.foutMsg(v.map(x => opts[x].j))) || 'Nog niet goed.' };
    },
    antwoord: () => goed.map(j => opties[j]).join(', ') };
}
const getalStap = (vr, doel, o) => ({ type:'getal', vr, eenheid: o.eenheid || '', ph: o.ph, hint: o.hint, check: v => checkGetal(v, doel(), o), antwoord: () => o.antwoord() });

function renderB48(filter = '', licht = []){
  const f = norm(filter).toLowerCase();
  const rijen = T48.filter(r => !f || norm(T48_RUW[r.i][0] + T48_RUW[r.i][1]).toLowerCase().includes(f));
  const noot = r => r.noot ? ` <sup style="color:var(--goud)">▸${r.noot}</sup>` : '';
  $('#b48inh').innerHTML = `<div class="b48kop">De reacties vinden plaats in oplossing; alle ionconcentraties steeds 1,00 mol L<sup>−1</sup>. Bij deeltjes zonder toestandsaanduiding moet steeds (aq) worden gelezen.</div>
    <table class="b48"><tr><th>oxidator</th><th></th><th>reductor</th><th style="text-align:right">V<sub>0</sub> (V)</th></tr>
    ${rijen.map(r => `<tr class="${licht.includes(r.i) ? 'licht' : ''}"><td>${r.ox.map(x => termHTML(x, true)).join(' + ')}</td><td class="pijl">⇌</td><td>${r.red.map(x => termHTML(x, true)).join(' + ')}${noot(r)}</td><td class="v">${r.vt.replace('-', '−')}</td></tr>`).join('')}</table>
    <div class="b48noot">De vermelde waarden kunnen in enkele gevallen vrij sterk afwijken van gegevens uit andere bronnen. Meestal is de keuze van het milieu de oorzaak.<br>
    ${Object.entries(T48_NOTEN).map(([k, t]) => `▸${k} ${t.replace(/(\S+) -> (.*)/, (m, a, b) => m).replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>').replace(/\^(\d*[+-])/g, '<sup>$1</sup>').replace(/->/g, '⇌')}`).join('<br>')}</div>`;
}
function openB48(licht = []){ $('#b48zoek').value = ''; renderB48('', licht); $('#b48modal').classList.add('open'); }
$('#binasknop').onclick = () => openB48();
$('#b48dicht').onclick = () => $('#b48modal').classList.remove('open');
$('#b48modal').onclick = e => { if (e.target.id === 'b48modal') $('#b48modal').classList.remove('open'); };
$('#b48zoek').oninput = e => renderB48(e.target.value);
const b48link = (t = 'Binas tabel 48') => `<a href="#" onclick="openB48();return false" style="color:var(--goud);font-weight:600">${t}</a>`;

/* rij uit tabel 48 opzoeken op de tekst zoals in de gegevens */
function rij(ox, red){ const r = T48.find(x => T48_RUW[x.i][0] === ox && T48_RUW[x.i][1] === red); if (!r) throw new Error('rij ontbreekt: ' + ox + ' | ' + red); return r; }

   Werkplaats 1 — Redox herkennen (10.1)

  zet(m, o){ this.metaal = m; this.opl = o; $('#s1m').value = m; $('#s1o').value = o; this.reset(); },
  reset(){

    this.rooster = []; for (let k = 0; k < 4; k++) for (let r = 0; r < 9; r++) this.rooster.push({ x: 300 + k * 22, y: 85 + r * 22, s:'M' });

  },
  nieuwIon(id){ return { x: rnd(420, 560), y: rnd(70, 290), vx: rnd(-14, 14), vy: rnd(-14, 14), id, soort:'ox' }; },

  },
  update(dt){
    for (const p of this.ionen.concat(this.vrij)){
      p.vx += rnd(-30, 30) * dt; p.vy += rnd(-30, 30) * dt; p.vx *= 0.98; p.vy *= 0.98;
      p.x += p.vx * dt; p.y += p.vy * dt;

      if (p.x < minx){ p.x = minx; p.vx = Math.abs(p.vx); } if (p.x > 575){ p.x = 575; p.vx = -Math.abs(p.vx); }

  gebeurtenis(){

/* tussenstap controleren: stadium 2 = atomen behalve O en H, 3 = + O met H2O, 4 = + H met H+, 5 = + lading met e- */
function checkStadium(invoer, o, st){
  if (!invoer.trim()) return { ok:false, msg:'Typ eerst je halfreactie tot nu toe.' };
  const v = leesVgl(invoer);
  if (v.fout === 'pijl') return { ok:false, msg:'Er ontbreekt een pijl. Typ de pijl als <code>-></code>.' };
  if (v.fout) return { ok:false, msg:'Ik kan je invoer niet lezen. Controleer de formules en de ladingen.' };
  const mag = new Set([o.vk, o.nk]); if (st >= 3) mag.add('H2O'); if (st >= 4) mag.add('H+'); if (st >= 5) mag.add('e-');
  const alle = v.L.concat(v.R).map(x => x.k);
  const vreemd = alle.filter(k => !mag.has(k));
  if (vreemd.length){
    const t = { H2O:'water komt pas bij het kloppend maken van O', 'H+':'H<sup>+</sup> komt pas bij het kloppend maken van H', 'e-':'elektronen komen pas bij het kloppend maken van de lading', 'OH-':'gebruik eerst de methode voor zuur milieu (met H<sup>+</sup>)' };
    return { ok:false, msg:'In deze stap hoort hier nog niet bij: ' + vreemd.map(k => spHTML(k)).join(', ') + (t[vreemd[0]] ? ' (' + t[vreemd[0]] + ').' : '.') };
  }
  if (!v.L.some(x => x.k === o.vk) || !v.R.some(x => x.k === o.nk)) return { ok:false, msg:`Zet ${spHTML(o.vk)} voor de pijl en ${spHTML(o.nk)} na de pijl.` };
  const b = balans(v), eq = e => (b.L.a[e] || 0) === (b.R.a[e] || 0);
  const anders = b.el.filter(e => e !== 'O' && e !== 'H');
  if (!anders.every(eq)) return { ok:false, msg:'Maak eerst de atomen kloppend die geen O of H zijn: ' + anders.filter(e => !eq(e)).join(', ') + '.' };
  if (st >= 3 && !eq('O')) return { ok:false, msg:`Het aantal O-atomen klopt nog niet (links ${b.L.a.O || 0}, rechts ${b.R.a.O || 0}). Vul aan met H<sub>2</sub>O aan de kant met te weinig O.` };
  if (st >= 4 && !eq('H')) return { ok:false, msg:`Het aantal H-atomen klopt nog niet (links ${b.L.a.H || 0}, rechts ${b.R.a.H || 0}). Vul aan met H<sup>+</sup>.` };
  if (st >= 5 && b.L.q !== b.R.q) return { ok:false, msg:`De lading klopt nog niet (links ${b.L.q}, rechts ${b.R.q}). Vul aan met elektronen aan de kant met de hoogste lading.` };
  if (st === 5){ const r = checkVgl(invoer, V(o.zuur), { halfreactie:true }); if (!r.ok) return r; }
  else { const g = v.L.concat(v.R).reduce((a, x) => ggd(a, x.n), 0); if (g > 1) return { ok:false, msg:'Gebruik de kleinst mogelijke coëfficiënten.' }; }
  return { ok:true };
}

const M_VITC = 176.1, M_FE = 55.85;
const r4 = x => Math.round(x * 100) / 100;
const SIM6 = {
  init(host){
    host.innerHTML = `<div class="simkop"><b>Titratie</b><span>druppel voor druppel naar het eindpunt</span></div>
      <div class="ctrl"><label>Proef <select class="sel" id="s6m"><option value="direct">jood met thiosulfaat</option><option value="terug">vitamine C: terugtitratie</option><option value="perm">ijzer(II) met permanganaat</option></select></label></div>
      <div class="doek" id="s6doek"></div>
      <div class="ctrl"><button class="btn" data-v="1">+ 1,00 mL</button><button class="btn" data-v="0.1">+ 0,10 mL</button><button class="btn" data-v="0.05">+ 1 druppel</button>
        <button class="btn g" id="s6zm">Zetmeel toevoegen</button><button class="btn g" id="s6opn">Opnieuw</button></div>
      <div class="uitkomst" id="s6uit"></div>`;
    this.c = maakCanvas($('#s6doek'), 600, 330);
    $('#s6m').onchange = e => this.zet(e.target.value);
    $$('#simkol [data-v]').forEach(b => b.onclick = () => this.voeg(+b.dataset.v));
    $('#s6zm').onclick = () => { if (this.mode !== 'perm'){ this.zetmeel = true; this.tekstUit(); } };
    $('#s6opn').onclick = () => { this.Vb = 0; this.zetmeel = false; this.druppels = []; this.tekstUit(); };
    this.zet('direct');
  },
  zet(mode, par){
    this.mode = mode; $('#s6m').value = mode; this.Vb = 0; this.zetmeel = false; this.druppels = [];
    if (mode === 'direct'){ this.p = par || { Va:10.00, ct:0.1000, eq: r4(rnd(9.5, 16.5)) }; }
    if (mode === 'terug'){ this.p = par || maakVitC(); }
    if (mode === 'perm'){ this.p = par || maakFe(); }
    this.tekstUit();
  },
  voeg(v){ if (this.Vb + v > 50){ return; } this.Vb = Math.round((this.Vb + v) * 100) / 100; this.druppels.push({ y:0 }); this.tekstUit(); },
  frac(){ return Math.max(0, 1 - this.Vb / this.p.eq); },
  tekstUit(){
    const p = this.p, u = $('#s6uit');
    const titrant = this.mode === 'perm' ? `${komma(p.ct, 4)} M kaliumpermanganaat` : `${komma(p.ct, 4)} M natriumthiosulfaat`;
    let inh = '';
    if (this.mode === 'direct') inh = `${komma(p.Va, 2)} mL joodoplossing (onbekende concentratie)`;
    if (this.mode === 'terug') inh = `${komma(10, 2)} mL vitamine C-oplossing + ${komma(p.VI, 2)} mL ${komma(p.cI, 5)} M joodoplossing`;
    if (this.mode === 'perm') inh = `een aangezuurde oplossing van een ijzertablet (${komma(p.mt, 4)} g)`;
    $('#s6zm').style.display = this.mode === 'perm' ? 'none' : '';
    u.innerHTML = `In de erlenmeyer: ${inh}. In de buret: ${titrant}.<br><span class="groot">Buretstand: ${komma(this.Vb, 2)} mL</span> &nbsp;<span style="color:var(--grijs);font-size:13px">(beginstand 0,00 mL)${this.zetmeel ? ' · zetmeel toegevoegd' : ''}</span>`;
  },
  kleur(){
    const f = this.frac();
    if (this.mode === 'perm'){ const over = Math.max(0, this.Vb - this.p.eq); return over > 0 ? `rgba(200,60,150,${Math.min(0.55, 0.12 + over * 0.8)})` : 'rgba(235,225,160,.25)'; }
    if (this.zetmeel) return f > 0 ? `rgba(40,50,150,${Math.min(0.7, 0.18 + f * 4)})` : 'rgba(220,230,240,.18)';
    if (f <= 0) return 'rgba(220,230,240,.18)';
    const t = Math.min(1, f * 3);
    return `rgba(${Math.round(lerp(235, 150, t))},${Math.round(lerp(205, 85, t))},${Math.round(lerp(90, 35, t))},${lerp(0.25, 0.6, t).toFixed(2)})`;
  },
  update(dt){ for (const d of this.druppels) d.y += dt * 260; this.druppels = this.druppels.filter(d => d.y < 70); },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    /* statief */
    c.fillStyle = '#8a8476'; c.fillRect(120, 12, 6, 300); c.fillRect(90, 308, 200, 8); c.fillRect(120, 70, 150, 5);
    /* buret */
    const x = 270, top = 15, schaalTop = 30, schaalBot = 210, w = 22;
    const yv = v => schaalTop + v / 50 * (schaalBot - schaalTop);
    c.save(); c.fillStyle = this.mode === 'perm' ? 'rgba(130,30,110,.75)' : 'rgba(225,235,245,.6)'; c.fillRect(x - w / 2, yv(this.Vb), w, schaalBot - yv(this.Vb) + 12); c.restore();
    c.save(); c.strokeStyle = '#7d8a96'; c.lineWidth = 2; c.strokeRect(x - w / 2, top, w, schaalBot - top + 12);
    c.beginPath(); c.moveTo(x - w / 2, schaalBot + 12); c.lineTo(x - 3, schaalBot + 30); c.lineTo(x - 3, schaalBot + 44); c.moveTo(x + w / 2, schaalBot + 12); c.lineTo(x + 3, schaalBot + 30); c.lineTo(x + 3, schaalBot + 44); c.stroke();
    c.fillStyle = '#4a4a4a'; c.fillRect(x - 12, schaalBot + 26, 24, 6); c.restore();
    for (let v = 0; v <= 50; v += 1){ const y = yv(v); c.strokeStyle = '#5d5a52'; c.lineWidth = 1; c.beginPath(); c.moveTo(x + w / 2, y); c.lineTo(x + w / 2 + (v % 5 === 0 ? 9 : 4), y); c.stroke(); if (v % 10 === 0) tekst(c, String(v), x + w / 2 + 20, y, { px:10.5 }); }
    /* inzoom op de meniscus */
    const zx = 420, zy = 70, zr = 52;
    c.save(); c.beginPath(); c.arc(zx, zy, zr, 0, Math.PI * 2); c.fillStyle = '#fdfcf8'; c.fill(); c.clip();
    const sc = 40; /* px per mL */
    c.fillStyle = this.mode === 'perm' ? 'rgba(130,30,110,.75)' : 'rgba(200,220,240,.7)'; c.fillRect(zx - 22, zy, 44, zr);
    for (let v = Math.floor(this.Vb) - 2; v <= this.Vb + 2; v += 0.1){ const vv = Math.round(v * 10) / 10; if (vv < 0) continue; const y = zy + (vv - this.Vb) * sc; const hel = Math.abs(vv - Math.round(vv)) < 0.01;
      c.strokeStyle = '#3e3b35'; c.lineWidth = hel ? 1.6 : 0.8; c.beginPath(); c.moveTo(zx - 22, y); c.lineTo(zx - 22 + (hel ? 18 : 9), y); c.stroke(); if (hel) tekst(c, String(vv), zx + 10, y, { px:11 }); }
    c.restore(); c.strokeStyle = '#7d8a96'; c.lineWidth = 2; c.beginPath(); c.arc(zx, zy, zr, 0, Math.PI * 2); c.stroke();
    tekst(c, 'aflezen', zx, zy + zr + 12, { px:11, i:true });
    /* druppels */
    for (const d of this.druppels){ c.fillStyle = this.mode === 'perm' ? 'rgba(130,30,110,.8)' : 'rgba(150,180,210,.9)'; c.beginPath(); c.arc(x, schaalBot + 50 + d.y, 3, 0, Math.PI * 2); c.fill(); }
    /* erlenmeyer */
    const ex = x, ey = 250, eb = 90, eh = 70;
    c.save(); c.beginPath(); c.moveTo(ex - 10, ey); c.lineTo(ex - 10, ey + 14); c.lineTo(ex - eb / 2, ey + eh); c.lineTo(ex + eb / 2, ey + eh); c.lineTo(ex + 10, ey + 14); c.lineTo(ex + 10, ey);
    c.save(); c.clip(); c.fillStyle = this.kleur(); c.fillRect(ex - eb / 2, ey + 34, eb, eh); c.restore();
    c.strokeStyle = '#7d8a96'; c.lineWidth = 2.2; c.stroke(); c.restore();
  },
  opdracht(o){ if (o && o.tit) this.zet(o.tit.mode, o.tit.p); }
};
function maakVitC(){ const m = Math.round(rnd(450, 1000)) / 1000;  /* g vitamine C in een tablet */

  return { m, VI, cI, nI, ct, eq: r4(over * 2 / ct * 1000) }; }
function maakFe(){ const mFe = rnd(0.055, 0.072), mt = 0.5000, ct = 0.02000; return { mFe, mt, ct, eq: r4(mFe / M_FE / 5 / ct * 1000) }; }

const ELOPL = {
  KI:   { naam:'kaliumjodide-oplossing',   kat:'K+',   an:'I-',     ox:R.K,       red:R.I,  kl:null },
  KBr:  { naam:'kaliumbromide-oplossing',  kat:'K+',   an:'Br-',    ox:R.K,       red:R.Br, kl:null },
  CuSO4:{ naam:'koper(II)sulfaatoplossing',kat:'Cu2+', an:'SO4^2-', ox:MET.Cu.r,  red:null, kl:'rgba(70,150,210,.34)' },
  ZnSO4:{ naam:'zinksulfaatoplossing',     kat:'Zn2+', an:'SO4^2-', ox:MET.Zn.r,  red:null, kl:null },
  Na2SO4:{ naam:'natriumsulfaatoplossing', kat:'Na+',  an:'SO4^2-', ox:R.Na,      red:null, kl:null }
};
function elAnalyse(opl, eNeg, ePos){
  const o = ELOPL[opl];
  const oxK = [{ k:o.kat, r:o.ox }, { k:'H2O', r:R.H2Oox }].sort((a, b) => b.r.v - a.r.v);
  const redK = [{ k:'H2O', r:R.H2Ored }]; if (o.red) redK.push({ k:o.an, r:o.red }); if (ePos === 'Cu') redK.push({ k:'Cu', r:MET.Cu.r, elek:true });
  redK.sort((a, b) => a.r.v - b.r.v);
  const ox = oxK[0], red = redK[0];
  return { o, ox, red, oxK, redK, Umin: red.r.v - ox.r.v };
}
const SIM7 = {
  init(host){
    this.opl = 'KI'; this.eNeg = 'C'; this.ePos = 'C'; this.U = 0; this.fen = true; this.gas = false; this.t = 0; this.bel = [];
    host.innerHTML = `<div class="simkop"><b>Elektrolyse</b><span>een spanningsbron dwingt de reactie af</span></div>
      <div class="ctrl"><label>Oplossing <select class="sel" id="s7o">${Object.entries(ELOPL).map(([k, o]) => `<option value="${k}">${o.naam}</option>`).join('')}</select></label></div>
      <div class="ctrl"><label>Negatieve elektrode <select class="sel" id="s7n"><option value="C">koolstof</option><option value="Pt">platina</option><option value="Cu">koper</option></select></label>
        <label>Positieve elektrode <select class="sel" id="s7p"><option value="C">koolstof</option><option value="Pt">platina</option><option value="Cu">koper</option></select></label></div>
      <div class="ctrl"><label>Spanning <input type="range" id="s7u" min="0" max="6" step="0.05" value="0" style="width:200px"> <b id="s7uw">0,00 V</b></label>
        <label><input type="checkbox" id="s7f" checked> fenolftaleïne</label><label><input type="checkbox" id="s7g"> gas opvangen</label></div>
      <div class="doek" id="s7doek"></div>
      <div class="uitkomst" id="s7uit"></div>`;
    this.c = maakCanvas($('#s7doek'), 600, 320);
    $('#s7o').onchange = e => { this.opl = e.target.value; this.reset(); };
    $('#s7n').onchange = e => { this.eNeg = e.target.value; this.reset(); };
    $('#s7p').onchange = e => { this.ePos = e.target.value; this.reset(); };
    $('#s7u').oninput = e => { this.U = +e.target.value; $('#s7uw').textContent = komma(this.U, 2) + ' V'; this.tekstUit(); };
    $('#s7f').onchange = e => { this.fen = e.target.checked; };
    $('#s7g').onchange = e => { this.gas = e.target.checked; this.reset(); };
    this.reset();
  },
  zet(opl, n, p, gas){ this.opl = opl; this.eNeg = n || 'C'; this.ePos = p || 'C'; this.gas = !!gas; $('#s7o').value = opl; $('#s7n').value = this.eNeg; $('#s7p').value = this.ePos; $('#s7g').checked = this.gas; this.reset(); },
  reset(){ this.t = 0; this.bel = []; this.vH = 0; this.vO = 0; this.a = elAnalyse(this.opl, this.eNeg, this.ePos); this.tekstUit(); },
  aan(){ return this.U >= this.a.Umin - 1e-9; },
  tekstUit(){
    const a = this.a, u = $('#s7uit');
    const negHR = vglHTML({ L:a.ox.r.ox, R:a.ox.r.red }), posHR = vglHTML({ L:a.red.r.red, R:a.red.r.ox });
    u.innerHTML = this.aan()
      ? `<b>Negatieve elektrode</b> (sterkste oxidator ${spHTML(a.ox.k)}, ${vTxt(a.ox.r.v)} V): ${negHR}<br><b>Positieve elektrode</b> (sterkste reductor ${a.red.elek ? 'de koperelektrode' : spHTML(a.red.k)}, ${vTxt(a.red.r.v)} V): ${posHR}<br><span style="color:var(--grijs);font-size:13px">Minimale spanning: ${vTxt(a.red.r.v)} − (${vTxt(a.ox.r.v)}) = ${komma(a.Umin, 2)} V</span>`
      : `Er gebeurt (nog) niets: de spanning is te laag. Draai de spanning omhoog.`;
  },
  update(dt){
    if (!this.aan()) return;
    this.t = Math.min(this.t + dt * Math.min(2, 0.4 + (this.U - this.a.Umin)), 80);
    const a = this.a;
    if (a.ox.k === 'H2O' && Math.random() < dt * 14) this.bel.push({ x: this.xN + rnd(-8, 8), y: 280, r: rnd(2, 3.6) });
    if (a.red.k === 'H2O' && Math.random() < dt * 7) this.bel.push({ x: this.xP + rnd(-8, 8), y: 280, r: rnd(2, 3.6) });
    for (const b of this.bel) b.y -= dt * 60;
    this.bel = this.bel.filter(b => b.y > (this.gas ? 120 : 150));
    if (this.gas){ if (a.ox.k === 'H2O') this.vH += dt * 0.6; if (a.red.k === 'H2O') this.vO += dt * 0.3; }
  },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H); const a = this.a, aan = this.aan();
    const bx = 150, by = 120, bw = 300, bh = 180, niv = 150; this.xN = bx + 80; this.xP = bx + bw - 80;
    const v = Math.min(1, this.t / 30);
    let kl = a.o.kl || 'rgba(200,220,235,.22)'; if (a.o.kl && a.ox.k === 'Cu2+' && !(a.red.elek)) kl = a.o.kl.replace(/[\d.]+\)$/, m => (parseFloat(m) * (1 - 0.6 * v)).toFixed(2) + ')');
    vloeistofVlak(c, bx, by, bw, bh, niv, kl);
    /* lokale kleuren */
    const wolk = (x, kleur) => { const g = c.createRadialGradient(x, 250, 4, x, 250, 70); g.addColorStop(0, kleur); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(x - 75, by + bh - niv, 150, niv - 2); };
    if (aan && v > 0){
      if (this.fen && a.ox.k === 'H2O') wolk(this.xN, `rgba(225,70,160,${0.45 * v})`);
      if (a.red.k === 'I-') wolk(this.xP, `rgba(150,85,30,${0.55 * v})`);
      if (a.red.k === 'Br-') wolk(this.xP, `rgba(205,115,35,${0.5 * v})`);
      if (a.red.elek) wolk(this.xP, `rgba(70,150,210,${0.4 * v})`);
    }
    tekenBeker(c, bx, by, bw, bh);
    const elk = { C:'#3d3d3f', Pt:'#cfd3d8', Cu:'#c26b3e' };
    let wP = 18; if (aan && a.red.elek) wP *= (1 - 0.4 * v);
    c.fillStyle = elk[this.eNeg]; c.fillRect(this.xN - 9, 70, 18, 215);
    c.fillStyle = elk[this.ePos]; c.fillRect(this.xP - wP / 2, 70, wP, 215);
    if (aan && (a.ox.k === 'Cu2+' || a.ox.k === 'Zn2+') && v > 0){ c.save(); c.globalAlpha = 0.4 + 0.6 * v; c.fillStyle = a.ox.k === 'Cu2+' ? '#c26b3e' : '#9aa6b2'; c.fillRect(this.xN - 9 - 3 * v, 200, 18 + 6 * v, 85); c.restore(); }
    for (const b of this.bel){ c.save(); c.strokeStyle = 'rgba(90,110,130,.7)'; c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore(); }
    /* gasopvang */
    if (this.gas){
      for (const [x, vol, naam] of [[this.xN, this.vH, 'H₂'], [this.xP, this.vO, 'O₂']]){
        c.save(); c.strokeStyle = '#7d8a96'; c.lineWidth = 2; c.strokeRect(x - 16, 20, 32, 150);
        c.fillStyle = 'rgba(200,220,235,.35)'; c.fillRect(x - 15, 21 + Math.min(130, vol * 6), 30, 148 - Math.min(130, vol * 6)); c.restore();
        for (let k = 0; k <= 20; k += 5){ c.strokeStyle = '#5d5a52'; c.beginPath(); c.moveTo(x + 16, 21 + k * 6.5); c.lineTo(x + 22, 21 + k * 6.5); c.stroke(); }
        tekst(c, naam + ': ' + komma(Math.min(20, vol), 1) + ' mL', x, 12, { px:12, vet:true });
      }
    }
    /* bron */
    c.save(); c.strokeStyle = '#4a4a4a'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(this.xN, 70); c.lineTo(this.xN, this.gas ? 70 : 40); c.lineTo(270, this.gas ? 70 : 40); c.moveTo(330, this.gas ? 70 : 40); c.lineTo(this.xP, this.gas ? 70 : 40); c.lineTo(this.xP, 70); c.stroke(); c.restore();
    const yb = this.gas ? 70 : 40;
    c.save(); c.fillStyle = '#fff'; c.strokeStyle = '#4a4a4a'; c.lineWidth = 2; c.fillRect(270, yb - 16, 60, 32); c.strokeRect(270, yb - 16, 60, 32); c.restore();
    tekst(c, komma(this.U, 1) + ' V', 300, yb, { px:14, vet:true, kleur:'#2b2a27' });
    tekst(c, '−', 262, yb - 10, { px:16, vet:true, kleur:'#3b6fa8' }); tekst(c, '+', 338, yb - 10, { px:16, vet:true, kleur:'#b4473a' });
    tekst(c, 'negatief', this.xN, 310, { px:11.5, kleur:'#3b6fa8' }); tekst(c, 'positief', this.xP, 310, { px:11.5, kleur:'#b4473a' });
    tekst(c, a.o.naam, bx + bw / 2, by + bh + 14, { px:11.5, kleur:'#7a756b' });
  },
  opdracht(o){ if (o && o.el) this.zet(...o.el); }
};

               keuze('Wat neem je waar aan de positieve elektrode?', ['De koperelektrode wordt dunner.', 'Er ontstaan gasbelletjes.', 'Er slaat koper op neer.', 'Er gebeurt niets.'], [0], 'Wat gebeurt er met koperatomen die elektronen afstaan?')] };
    const opl5 = kies(['KBr', 'CuSO4', 'ZnSO4', 'Na2SO4']), a5 = elAnalyse(opl5, 'C', 'C');

    const w6 = kies([
      { opl:'KBr', t:'een kaliumbromide-oplossing met fenolftaleïne', goed:['gasbelletjes bij de negatieve elektrode', 'roze kleur bij de negatieve elektrode', 'oranjebruine kleur bij de positieve elektrode'], fout:['gasbelletjes bij de positieve elektrode', 'roze kleur bij de positieve elektrode', 'metaal slaat neer op de negatieve elektrode'] },

/* =====================================================================
   Werkplaats ★ — Verdieping: cel met neerslag, aflopend of evenwicht
   ===================================================================== */
const FAR = 9.649e4, RGAS = 8.314, TK = 298;
const Kvan = (n, dv) => Math.exp(n * FAR * dv / (RGAS * TK));
function wetHTML(x){ if (!isFinite(x) || x === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(x))); if (e >= -2 && e <= 3) return komma(x, e >= 2 ? 0 : 2 - Math.max(e, 0)); return komma(x / Math.pow(10, e), 1) + '·10<sup>' + (e < 0 ? '−' + -e : e) + '</sup>'; }
const KFORMULE = `K = e<sup style="font-size:.85em">${breuk('n·F·ΔV<sub>0</sub>', 'R·T')}</sup>`;
function checkK(v, K){
  const g = leesGetal(v); if (!g) return { ok:false, msg:'Typ K als getal, bijvoorbeeld <code>1,6·10^37</code>.' };
  if (g.w <= 0) return { ok:false, msg:'K is altijd positief.' };
  const d = Math.abs(Math.log(g.w) - Math.log(K));
  if (d <= 0.02 * Math.abs(Math.log(K)) + 0.06) return { ok:true };
  if (Math.abs(Math.log(g.w) + Math.log(K)) < 0.05 * Math.abs(Math.log(K)) + 0.06) return { ok:false, msg:'Je zit aan de verkeerde kant van 1: controleer het teken van ΔV<sub>0</sub>.' };
  return { ok:false, msg:'Nog niet goed. Reken eerst de exponent uit: n·F·ΔV<sub>0</sub> gedeeld door R·T. Gebruik T = 298 K.' };
}
const SIM8 = {
  init(host){
    this.n = 2; this.dv = 1.10;
    host.innerHTML = `<div class="simkop"><b>Evenwichtsconstante</b><span>K uit de bronspanning</span></div>
      <div class="ctrl"><label>ΔV<sub>0</sub> <input type="range" id="s8v" min="-0.6" max="1.2" step="0.01" value="1.10" style="width:220px"> <b id="s8vw"></b></label>
        <label>n <select class="sel" id="s8n">${[1,2,3,5,6].map(n => `<option value="${n}">${n}</option>`).join('')}</select></label></div>
      <div class="doek" id="s8doek"></div>
      <div class="uitkomst" id="s8uit"></div>`;
    this.c = maakCanvas($('#s8doek'), 600, 320);
    $('#s8n').value = this.n;
    $('#s8v').oninput = e => { this.dv = +e.target.value; this.tekstUit(); };
    $('#s8n').onchange = e => { this.n = +e.target.value; this.tekstUit(); };
    this.tekstUit();
  },
  zet(n, dv){ this.n = n; this.dv = dv; $('#s8n').value = n; $('#s8v').value = dv; this.tekstUit(); },
  tekstUit(){
    $('#s8vw').innerHTML = komma(this.dv, 2) + ' V';
    const x = this.n * FAR * this.dv / (RGAS * TK), K = Math.exp(x);
    $('#s8uit').innerHTML = `<div style="font-size:15px">${breuk('n·F·ΔV<sub>0</sub>', 'R·T')} = ${breuk(`${this.n} × 9,649·10<sup>4</sup> C mol<sup>−1</sup> × ${komma(this.dv, 2)} V`, '8,314 J mol<sup>−1</sup> K<sup>−1</sup> × 298 K')} = ${komma(x, 2)}</div>
      <div class="groot" style="margin-top:4px">K = e<sup>${komma(x, 2)}</sup> = ${wetHTML(K)}</div>
      <div style="color:var(--grijs);font-size:13px">${K > 1e4 ? 'Het evenwicht ligt sterk rechts: de reactie is praktisch aflopend.' : K < 1e-4 ? 'Het evenwicht ligt sterk links: er gebeurt praktisch niets.' : 'Er stelt zich een evenwicht in waarbij beginstoffen én producten aanwezig zijn.'}</div>`;
  },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    const x0 = 60, x1 = 580, y0 = 34, y1 = 290, vmin = -0.6, vmax = 1.2, lmin = -30, lmax = 60;
    const X = v => x0 + (v - vmin) / (vmax - vmin) * (x1 - x0), Y = l => y1 - (l - lmin) / (lmax - lmin) * (y1 - y0);
    c.strokeStyle = '#d6cdb8'; c.lineWidth = 1;
    for (let l = lmin; l <= lmax; l += 10){ c.beginPath(); c.moveTo(x0, Y(l)); c.lineTo(x1, Y(l)); c.stroke(); tekst(c, '10' + (l < 0 ? '⁻' : '') + String(Math.abs(l)).split('').map(d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join(''), x0 - 22, Y(l), { px:11 }); }
    for (let v = -0.6; v <= 1.21; v += 0.3){ c.beginPath(); c.moveTo(X(v), y1); c.lineTo(X(v), y1 + 5); c.stroke(); tekst(c, komma(v, 1), X(v), y1 + 14, { px:11 }); }
    tekst(c, 'ΔV₀ (V)', x1 - 20, y1 + 26, { px:11.5 }); tekst(c, 'K', x0 - 44, y0 - 22, { px:12, vet:true, al:'left' });
    c.save(); c.setLineDash([5, 4]); c.strokeStyle = '#a0701f'; c.beginPath(); c.moveTo(X(0.30), y0); c.lineTo(X(0.30), y1); c.stroke(); c.strokeStyle = '#7a756b'; c.beginPath(); c.moveTo(x0, Y(0)); c.lineTo(x1, Y(0)); c.stroke(); c.restore();
    tekst(c, 'vuistregel 0,30 V', X(0.30) + 4, y1 - 10, { px:11, kleur:'#a0701f', al:'left' }); tekst(c, 'K = 1', x1 - 4, Y(0) - 8, { px:11, al:'right' });
    for (const n of [1, 2, 5]){ c.save(); c.strokeStyle = n === this.n ? '#24323f' : 'rgba(36,50,63,.25)'; c.lineWidth = n === this.n ? 2.5 : 1.5; c.beginPath();
      let eerst = true; for (let v = vmin; v <= vmax; v += 0.01){ const l = n * FAR * v / (RGAS * TK) / Math.LN10; if (l < lmin || l > lmax){ eerst = true; continue; } if (eerst){ c.moveTo(X(v), Y(l)); eerst = false; } else c.lineTo(X(v), Y(l)); } c.stroke(); c.restore();
      const vl = Math.min(vmax, (lmax - 2) * Math.LN10 * RGAS * TK / (n * FAR)); tekst(c, 'n = ' + n, X(vl) - 10, Y(Math.min(lmax - 2, n * FAR * vl / (RGAS * TK) / Math.LN10)) + 4, { px:11, al:'right', kleur: n === this.n ? '#24323f' : '#9aa3ab' }); }
    const l = this.n * FAR * this.dv / (RGAS * TK) / Math.LN10;
    if (l >= lmin && l <= lmax){ c.fillStyle = '#e2a84b'; c.beginPath(); c.arc(X(this.dv), Y(l), 6, 0, Math.PI * 2); c.fill(); c.strokeStyle = '#a0701f'; c.stroke(); }
  },
  opdracht(o){ if (o && o.K) this.zet(o.K[0], o.K[1]); }
};

  voorbeelden: [
    { vraag:'Bereken K voor de Daniellcel (n = 2, ΔV<sub>0</sub> = 1,10 V).',

               `K = e<sup>85,7</sup> ≈ <b>1,6·10<sup>37</sup></b>: de reactie is aflopend.`], bijStap(){ SIM8.zet(2, 1.10); } },
    { vraag:`Bereken K voor ${vglHTML(V('Fe3+ + Ag -> Fe2+ + Ag+'), { ev:true })} (n = 1).`,
      stappen:[`ΔV<sub>0</sub> = V<sub>0</sub>(${spHTML('Fe3+')}) − V<sub>0</sub>(${spHTML('Ag')}) = +0,77 V − (+0,80 V) = −0,03 V`,
               `<div class="reken">${breuk('1 × 9,649·10<sup>4</sup> C mol<sup>−1</sup> × (−0,03 V)', '8,314 J mol<sup>−1</sup> K<sup>−1</sup> × 298 K')} = −1,17, dus K = e<sup>−1,17</sup> ≈ <b>0,31</b></div>Dit is een evenwicht. "Verloopt niet" betekent dus eigenlijk dat het evenwicht links ligt.`,
               `De vuistregel: bij ΔV<sub>0</sub> = 0,30 V is K ≈ 1·10<sup>5</sup> (n = 1) of ≈ 1·10<sup>10</sup> (n = 2). Daarom geldt 0,30 V als grens voor "aflopend". Bekijk het rechts in de grafiek.`],
      bijStap(n){ if (n <= 2) SIM8.zet(1, -0.03); else SIM8.zet(1, 0.30); } }
  ],
  typtip: 'Grote en kleine getallen typ je als <code>1,6·10^37</code> of <code>1,6e37</code>.',
  maakSerie(){
    const pbs = rij('PbSO4(s) + 2 e-', 'Pb(s) + SO4^2-');
    const o1 = { titel:'Lood in een sulfaatoplossing', vraag:'Een loodelektrode staat in een natriumsulfaatoplossing en is de negatieve elektrode van een cel. Welke regel uit tabel 48 gebruik je voor deze halfcel?',
      stappen:[keuze('Kies de regel:', [rijHTML(pbs) + ' <small>(−0,36 V)</small>', rijHTML(MET.Pb.r) + ' <small>(−0,13 V)</small>', rijHTML(rij('PbO2(s) + SO4^2- + 4 H+ + 2 e-', 'PbSO4(s) + 2 H2O(l)')) + ' <small>(+1,69 V)</small>'], [0], 'Wat gebeurt er met de Pb<sup>2+</sup>-ionen die ontstaan als er sulfaationen in de oplossing zitten? Kijk in tabel 45A.'),
               vglStap('Halfreactie bij de negatieve elektrode:', V('Pb + SO4^2- -> PbSO4 + 2 e-'), 'Draai de regel bij −0,36 V om.', { halfreactie:true, ph:'halfreactie' })] };
    const o2 = { titel:'Bronspanning met neerslag', vraag:'Deze loodhalfcel wordt gecombineerd met een koperelektrode in koper(II)sulfaatoplossing. Bereken de bronspanning.',
      stappen:[getalStap('ΔV<sub>0</sub> =', () => 0.34 - (-0.36), { eenheid:'V', tol:0.004, hint:'Gebruik −0,36 V voor de loodhalfcel.', antwoord: () => '+0,34 V − (−0,36 V) = 0,70 V' })] };
    const c3 = kies([[2, 1.10, 'de Daniellcel (zink en koper)'], [2, 1.56, 'een cel met zink en zilver'], [2, 0.47, 'een cel met lood en koper']]);
    const K3 = Kvan(c3[0], c3[1]);
    const o3 = { titel:'K berekenen', K:[c3[0], c3[1]], vraag:`Bereken K voor ${c3[2]}: n = ${c3[0]}, ΔV<sub>0</sub> = ${komma(c3[1], 2)} V, T = 298 K.`,
      stappen:[{ type:'getal', vr:'K =', ph:'bijv. 1,6·10^37', hint:`${KFORMULE}. Reken eerst de exponent uit.`, check: v => checkK(v, K3), antwoord: () => `exponent = ${komma(c3[0] * FAR * c3[1] / (RGAS * TK), 1)}, K ≈ ${wetHTML(K3)}` }] };
    const r4 = kies([[R.Fe3, MET.Ag.r, 'Fe3+ + Ag -> Fe2+ + Ag+', 1], [R.I, R.Fe3, '2 Fe2+ + I2 -> 2 Fe3+ + 2 I-', 2], [MET.Pb.r, R.Ni, 'Pb2+ + Ni -> Pb + Ni2+', 2]]);
    const dv4 = r4[0].v - r4[1].v, K4 = Kvan(r4[3], dv4);
    const o4 = { titel:'Een evenwicht', K:[r4[3], dv4], vraag:`Gegeven: ${vglHTML(V(r4[2]), { ev:true })}. Bereken ΔV<sub>0</sub> en K (T = 298 K).`,

    return [o1, o2, o3, o4, o5];
  }
});
