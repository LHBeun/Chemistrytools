<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enzymkinetiek</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* niveau */
.niveau{display:flex;gap:4px;margin:-14px 0 22px}
.niveau button{flex:1;background:transparent;border:1px solid #4b6074;color:#b9c7d3;border-radius:7px;padding:5px;font-weight:700;font-size:13px;cursor:pointer}
.niveau button.aan{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
/* moleculen */
svg.mol{display:block;max-width:100%;height:auto}
.molkader{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:8px 10px;margin:8px 0;overflow-x:auto}
.molrij{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.molrij .plus{font-size:22px;color:var(--grijs)}
.molnaam{font-size:12.5px;color:var(--grijs);text-align:center;margin-top:2px}
/* tekenveld */
.tv{background:#fff;border:1px solid var(--rand2);border-radius:10px;overflow:hidden}
.tvbalk{display:flex;flex-wrap:wrap;gap:4px;padding:7px;background:#f7f2e6;border-bottom:1px solid var(--rand)}
.tvk{border:1px solid var(--rand2);background:#fff;border-radius:7px;padding:4px 10px;font-family:Georgia,serif;font-size:15px;cursor:pointer;min-width:34px;color:var(--inkt)}
.tvk[data-a],.tvk[data-t="gum"]{font-family:var(--sans);font-size:13px}
.tvk.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.tvsep{width:1px;background:var(--rand2);margin:0 4px}
.tvdoek{overflow:auto;max-height:340px}
.tvsvg{display:block;touch-action:none;cursor:crosshair;background:#fffdf8}
.tvuitleg{font-size:12px;color:var(--grijs);padding:5px 9px;border-top:1px solid var(--rand)}
input.getal{max-width:200px;flex:0 1 200px}
.eenheid{font-size:15px;color:var(--inkt2)}
.formule{font-family:var(--serif);font-size:17px;margin:6px 0}
.breuk{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}
.breuk>span:first-child{border-bottom:1.3px solid currentColor;padding:0 4px}
.breuk>span:last-child{padding:0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14.5px}
.kv b{font-family:var(--serif);font-size:18px;font-weight:600}
table.data{border-collapse:collapse;font-size:14px;background:#fff;margin:6px 0}
table.data th,table.data td{border:1px solid var(--rand2);padding:3px 10px;text-align:right}
table.data th{background:#f7f2e6;font-weight:600}
.fitvak{margin-top:10px;padding:10px 12px;border:1px dashed #D9822B;border-radius:10px;background:#fdf6ec}
.fitkop{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:#b8641a;margin-bottom:4px}
.fitvak .inp{font:inherit;font-size:14px;padding:4px 7px;border:1px solid #d8cfbd;border-radius:6px;background:#fff}
.reeksen{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.reeksen label{display:flex;gap:8px;align-items:center}
.reeksen i{display:inline-block;width:14px;height:4px;border-radius:2px}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;background:#fff;border:1px solid var(--rand);border-radius:10px;padding:9px 12px}
.info b{font-weight:600}
.schuif{display:flex;align-items:center;gap:8px;font-size:13.5px}
.schuif input{width:150px}
/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}

@media (max-width:1180px){
  .wp{grid-template-columns:1fr}
  .simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
}
@media print{aside,.simkol{display:none}.wp{display:block}}
.leerdoelen{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:12px 16px 6px;margin:4px 0 6px}
.leerdoelen b{display:block;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud);margin-bottom:4px}
.leerdoelen ul{list-style:none;margin:0!important;padding:0}
.leerdoelen li{padding:4px 0 4px 26px;position:relative;color:var(--inkt2)}
.leerdoelen li::before{content:"";position:absolute;left:2px;top:9px;width:13px;height:13px;border:1.5px solid var(--goud2);border-radius:3px}
.leerdoelen li.ster::before{content:"★";border:0;color:var(--goud);top:3px;left:1px;font-size:14px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Enzymkinetiek</h1>
    <div class="sub">6 vwo · structuur, binding en snelheid</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Voortgang wissen</button>
      <div class="klein">Een model: de getallen zijn realistisch van grootte, maar niet van één bestaand enzym.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function laad(){ try { return JSON.parse(localStorage.getItem('enzymkinetiek-v2')) || {}; } catch (e){ return {}; } }
function bewaar(o){ try { localStorage.setItem('enzymkinetiek-v2', JSON.stringify(o)); } catch (e){} }
const nl = (x, d = 2) => Number(x).toLocaleString('nl-NL', { maximumFractionDigits: d, minimumFractionDigits: d });
const sig = (x, n = 3) => { if (!x) return '0'; const d = Math.max(0, n - 1 - Math.floor(Math.log10(Math.abs(x)))); return nl(x, d); };
const breuk = (t, n) => `<span class="breuk"><span>${t}</span><span>${n}</span></span>`;

/* =====================================================================
   Model
   E + S ⇄ ES → E + P
   - pH: binding vraagt Glu–COO⁻ (pKa 5,0) en Lys–NH₃⁺ (pKa 9,3) → Km;
         katalyse vraagt His zonder H⁺ (pKa 5,8) → Vmax
   - T: Arrhenius (Ea 50 kJ/mol) × aandeel gevouwen enzym (Tm 48 °C)
   - remmer: competitief → Km × (1 + [I]/Ki); niet-competitief → Vmax / (1 + [I]/Ki)
   ===================================================================== */
const MOD = { kcat37: 150, Km0: 30, Ea: 50000, Tm: 48, wT: 2.5, pKaGlu: 5.0, pKaLys: 9.3, pKaHis: 5.8, Ki: 5 };
const fGlu = pH => 1 / (1 + Math.pow(10, MOD.pKaGlu - pH));      /* aandeel –COO⁻ */
const fLys = pH => 1 / (1 + Math.pow(10, pH - MOD.pKaLys));      /* aandeel –NH₃⁺ */
const fHis = pH => 1 / (1 + Math.pow(10, MOD.pKaHis - pH));      /* aandeel His zonder extra H⁺ */
const arrh = T => Math.exp(-MOD.Ea / 8.314 * (1 / (T + 273.15) - 1 / 310.15));
const gevouwen = T => 1 / (1 + Math.exp((T - MOD.Tm) / MOD.wT));
function kinetiek(c){
  /* c: { pH, T, E (nM), remmer: 'geen'|'comp'|'noncomp', I (µM) } */
  const E = c.E / 1000;
  let Vmax = MOD.kcat37 * arrh(c.T) * gevouwen(c.T) * fHis(c.pH) * E;
  let Km = MOD.Km0 / (fGlu(c.pH) * fLys(c.pH));
  const f = 1 + c.I / MOD.Ki;
  if (c.remmer === 'comp') Km *= f;
  if (c.remmer === 'noncomp') Vmax /= f;
  return { Vmax, Km };
}
const snelheid = (S, k) => k.Vmax * S / (k.Km + S);
function ruis(){ let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); return 1 + 0.025 * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const S_REEKS = [5, 10, 20, 40, 80, 160, 320, 640];
const REMNAAM = { geen:'geen remmer', comp:'remmer A', noncomp:'remmer B', X:'remmer X' };
const KLEUREN = ['#1F5FBF', '#C62828', '#1A7F37', '#D9822B', '#6A3D9A', '#00838F', '#8C510A', '#C2185B'];

/* =====================================================================
   Simulatie: het enzym op deeltjesniveau + meten
   ===================================================================== */
const LAB = {
  c: { pH: 7, T: 37, E: 20, remmer: 'geen', I: 10 },
  reeksen: [], lb: false, remX: 'comp', tijd: 0, schat: { i: -1, V: NaN, K: NaN },
  init(host){
    host.innerHTML = `<div class="simkop"><b>Enzymlab</b><span>deeltjesniveau en metingen</span></div>
      <div class="ctrl">
        <span class="schuif">pH <input type="range" id="eph" min="3" max="11" step="0.1"><b id="ephw"></b></span>
        <span class="schuif">T <input type="range" id="et" min="0" max="75" step="1"><b id="etw"></b></span>
      </div>
      <div class="ctrl">
        <label>Remmer <select class="sel" id="erem"><option value="geen">geen</option><option value="comp">remmer A (lijkt op het substraat)</option><option value="noncomp">remmer B (bindt elders)</option><option value="X">onbekende remmer X</option></select></label>
        <span class="schuif" id="eIbox">[I] <input type="range" id="eI" min="0" max="40" step="1" style="width:100px"><b id="eIw"></b></span>
      </div>
      <div class="doek" id="edoek"></div>
      <div class="info" id="einfo"></div>
      <div class="ctrl" style="margin-top:4px"><button class="btn" id="emeet">Meet reeks</button><button class="btn g" id="ewis">Wis reeksen</button>
        <label style="margin-left:auto;font-size:13px"><input type="checkbox" id="elb"> ★ Lineweaver-Burk</label></div>
      <div class="doek" id="egraf"></div>
      <div class="reeksen" id="ereeks"></div>
      <div class="fitvak" id="efit"></div>

    this.cv = maakCanvas($('#edoek'), 600, 360);
    this.cg = maakCanvas($('#egraf'), 600, 330);
    const c = this.c;
    $('#eph').value = c.pH; $('#et').value = c.T; $('#erem').value = c.remmer; $('#eI').value = c.I; $('#elb').checked = this.lb;
    $('#eph').oninput = e => { c.pH = +e.target.value; this.stat(); };
    $('#et').oninput = e => { c.T = +e.target.value; this.stat(); };
    $('#erem').onchange = e => { c.remmer = e.target.value; this.stat(); };
    $('#eI').oninput = e => { c.I = +e.target.value; this.stat(); };
    $('#elb').onchange = e => { this.lb = e.target.checked; this.grafiek(); };
    $('#emeet').onclick = () => this.meet();
    $('#ewis').onclick = () => { this.reeksen = []; this.schat = { i: -1, V: NaN, K: NaN }; this.fitUI(); this.grafiek(); };

  },
  echteRemmer(){ return this.c.remmer === 'X' ? this.remX : this.c.remmer; },
  k(){ return kinetiek(Object.assign({}, this.c, { remmer: this.echteRemmer(), I: this.c.remmer === 'geen' ? 0 : this.c.I })); },
  label(){ const c = this.c; return `pH ${nl(c.pH, 1)} · ${c.T} °C · ${c.remmer === 'geen' ? 'geen remmer' : REMNAAM[c.remmer] + ' ' + c.I + ' µM'}`; },
  meet(){
    const k = this.k();
    const pts = S_REEKS.map(S => ({ S, v: snelheid(S, k) * ruis() }));
    this.reeksen.push({ label: this.label(), pts, k, kleur: KLEUREN[this.reeksen.length % KLEUREN.length], aan: true });
    if (this.reeksen.length > 8) this.reeksen.shift();

  },
  /* ---------- jouw schatting: Vmax en Km zelf fitten ---------- */
  fitUI(){
    const vak = $('#efit'); if (!vak) return;
    if (!this.reeksen.length){ vak.innerHTML = `<div class="fitkop">Jouw schatting</div><div class="legenda">Meet eerst een reeks met <b>Meet reeks</b>. Daarna schat je hier V<sub>max</sub> en K<sub>m</sub> en verschijnt jouw curve over de meetpunten.</div>`; return; }
    if (this.schat.i < 0 || this.schat.i >= this.reeksen.length) this.schat.i = this.reeksen.length - 1;
    const f = this.schat, r = this.reeksen[f.i], w = x => isNaN(x) ? '' : String(x).replace('.', ',');
    if (!r.fit) r.fit = { V: NaN, K: NaN };
    vak.innerHTML = `<div class="fitkop">Jouw schatting</div>
      <div class="ctrl"><label>Reeks <select class="sel" id="efr">${this.reeksen.map((r, i) => `<option value="${i}" ${i === f.i ? 'selected' : ''}>${r.label}</option>`).join('')}</select></label></div>
      <div class="ctrl"><label><span>V<sub>max</sub></span> <input class="inp" id="efv" style="width:80px" value="${w(r.fit.V)}"> µM/s</label>
        <label><span>K<sub>m</sub></span> <input class="inp" id="efk" style="width:80px" value="${w(r.fit.K)}"> µM</label></div>
      <div class="legenda">Pas V<sub>max</sub> en K<sub>m</sub> aan tot de gestreepte curve door de meetpunten van deze reeks gaat.</div>`;
    $('#efr').onchange = e => { f.i = +e.target.value; this.fitUI(); this.grafiek(); };
    const lees = s => { const t = String(s).trim().replace(',', '.'); return t === '' ? NaN : parseFloat(t); };
    $('#efv').oninput = e => { r.fit.V = lees(e.target.value); this.grafiek(); };
    $('#efk').oninput = e => { r.fit.K = lees(e.target.value); this.grafiek(); };
  },
  stat(){
    const c = this.c;
    $('#ephw').textContent = nl(c.pH, 1); $('#etw').textContent = c.T + ' °C'; $('#eIw').textContent = c.I + ' µM';
    $('#eIbox').style.opacity = c.remmer === 'geen' ? .4 : 1;
    const glu = fGlu(c.pH) > 0.5, lys = fLys(c.pH) > 0.5, his = fHis(c.pH) > 0.5, gv = gevouwen(c.T);
    $('#einfo').innerHTML = `
      <span>Glu (zijgroep)</span><b>${glu ? '–COO<sup>−</sup>: ionbinding met het substraat' : '–COOH: geen ionbinding meer'}</b>
      <span>Lys (zijgroep)</span><b>${lys ? '–NH<sub>3</sub><sup>+</sup>: ionbinding met het substraat' : '–NH<sub>2</sub>: geen ionbinding meer'}</b>
      <span>His (katalyse)</span><b>${his ? 'kan een H<sup>+</sup> opnemen: katalyse werkt' : 'heeft al een H<sup>+</sup>: katalyse werkt nauwelijks'}</b>
      <span>Gevouwen enzymen</span><b>${Math.round(gv * 100)} %${gv < 0.9 ? ' (de rest is gedenatureerd)' : ''}</b>`;
  },
  opdracht(o){ if (o && o.remX){ this.remX = o.remX; } },
  /* ---------- animatie ---------- */
  update(dt){
    this.tijd += dt;
    const c = this.c, k = this.k(), ref = kinetiek({ pH: 7, T: 37, E: 20, remmer: 'geen', I: 0 });
    const snel = 0.5 + arrh(c.T) * 0.6;
    if (!this.deeltjes.length) for (let i = 0; i < 5; i++) this.deeltjes.push(this.nieuwS(i));
    const gv = gevouwen(c.T), rem = this.echteRemmer(), bez = c.remmer === 'geen' ? 0 : c.I / (MOD.Ki + c.I);
    /* remmer in beeld */
    if (!this.remmer) this.remmer = { x: 80, y: 60, toestand: 'vrij', t: 0 };
    const R = this.remmer; R.t -= dt;
    if (c.remmer === 'geen'){ R.toestand = 'weg'; }
    else if (R.t <= 0){ R.t = 1.5 + Math.random() * 2; const wil = Math.random() < bez; R.toestand = wil ? 'gebonden' : 'vrij'; if (rem === 'comp' && this.bezet && wil) R.toestand = 'vrij'; }
    const kat = k.Vmax / (ref.Vmax * (c.remmer === 'X' || rem === 'noncomp' ? 1 : 1));
    for (const s of this.deeltjes){
      s.t += dt;
      if (s.fase === 'zwerf'){
        s.x += Math.cos(s.a) * 40 * snel * dt; s.y += Math.sin(s.a) * 40 * snel * dt; s.a += rnd(-1, 1) * dt * 2;
        if (s.x < 30 || s.x > 570) s.a = Math.PI - s.a; if (s.y < 25 || s.y > 80) s.a = -s.a;
        s.x = clamp(s.x, 30, 570); s.y = clamp(s.y, 25, 80);
        const vrijCentrum = !this.bezet && !(rem === 'comp' && R.toestand === 'gebonden');
        if (vrijCentrum && s.t > 1.2 && Math.random() < dt * 0.6){ s.fase = 'naar'; s.t = 0; this.bezet = s; }
      } else if (s.fase === 'naar'){
        const doel = this.pocket();
        const dy = doel.y + doel.diep * 0.5; s.x = lerp(s.x, doel.x, dt * 3); s.y = lerp(s.y, dy, dt * 3);
        if (Math.hypot(s.x - doel.x, s.y - dy) < 3){
          /* past het nog? bij denaturatie vaak niet */
          if (Math.random() > gv){ s.fase = 'weg'; s.t = 0; s.a = -Math.PI / 2 + rnd(-0.8, 0.8); this.bezet = null; }
          else { s.fase = 'vast'; s.t = 0; }
        }
      } else if (s.fase === 'vast'){
        const doel = this.pocket(); s.x = doel.x; s.y = doel.y + doel.diep * 0.5;
        /* loslaten: vaker bij zwakke binding (grote Km); omzetten: met kcat */
        const losKans = 0.25 * (k.Km / ref.Km) * snel, omzetKans = 0.55 * Math.max(0, kat) * (rem === 'noncomp' && R.toestand === 'gebonden' ? 0 : 1);
        if (Math.random() < losKans * dt){ s.fase = 'weg'; s.t = 0; s.a = -Math.PI / 2 + rnd(-0.8, 0.8); this.bezet = null; }
        else if (Math.random() < omzetKans * dt){ s.fase = 'product'; s.t = 0; this.bezet = null; this.flits = 0.6; }
      } else if (s.fase === 'weg' || s.fase === 'product'){
        s.x += Math.cos(s.a) * 70 * dt; s.y += Math.sin(s.a) * 70 * dt;
        if (s.y < 20 || s.t > 2.5){ Object.assign(s, this.nieuwS(0)); }
      }
    }
    this.flits = Math.max(0, (this.flits || 0) - dt);
  },
  nieuwS(i){ return { x: 60 + i * 120 + rnd(-20, 20), y: rnd(30, 75), a: rnd(0, 6.28), fase: 'zwerf', t: rnd(0, 1) }; },
  pocket(){
    const gv = gevouwen(this.c.T), d = 1 - gv, rem = this.echteRemmer();
    const smal = this.c.remmer !== 'geen' && rem === 'noncomp' && this.remmer && this.remmer.toestand === 'gebonden' ? 6 : 0;
    return { x: 300 + d * 30, y: 116 + d * 25, w: 74 - d * 40 - smal, diep: 64 - d * 40 };
  },
  draw(){
    const g = this.cv, c = this.c; g.clearRect(0, 0, g.W, g.H);
    const gv = gevouwen(c.T), d = 1 - gv, t = this.tijd, amp = 0.5 + c.T / 75 * 2.2;
    const P = this.pocket(), cx = 300, cy = 225, R0 = 150;
    /* enzym: gevouwen keten als oppervlak met een holte bovenaan */
    const punten = [];
    for (let i = 0; i <= 120; i++){
      const th = -Math.PI / 2 + i / 120 * Math.PI * 2;
      let r = R0 * (1 + 0.06 * Math.sin(3 * th + 0.7) + 0.04 * Math.sin(5 * th - 1.2)) + Math.sin(t * 4 + i) * amp * 0.6;
      r += d * 26 * Math.sin(7 * th + t * 0.9) + d * 18 * Math.sin(4 * th - 1);
      let x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r * 0.72;
      /* holte */
      const dx = x - P.x; if (Math.abs(dx) < P.w && y < cy){ const f = Math.cos(dx / P.w * Math.PI / 2); y += P.diep * f * f; }
      punten.push([x, y]);
    }
    g.save();
    g.beginPath(); punten.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    const gr = g.createLinearGradient(0, 130, 0, 330); gr.addColorStop(0, d > 0.5 ? '#e8d9c4' : '#dbe5f1'); gr.addColorStop(1, d > 0.5 ? '#cdb89c' : '#b9cbe2');
    g.fillStyle = gr; g.fill(); g.strokeStyle = '#3d4b5e'; g.lineWidth = 2; g.stroke();
    /* binnenin: de gevouwen keten (helices) */
    g.strokeStyle = 'rgba(61,75,94,.35)'; g.lineWidth = 3;
    for (let k = 0; k < 4; k++){ g.beginPath();
      for (let i = 0; i <= 40; i++){ const x = 200 + k * 62 + Math.sin(i * 0.9 + k) * (9 + d * 22), y = 200 + i * 2.4 + Math.cos(i * 0.5 + k * 2) * d * 20; i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke(); }
    g.restore();
    /* zijgroepen in het actieve centrum */
    const pH = c.pH, glu = fGlu(pH) > 0.5, lys = fLys(pH) > 0.5, his = fHis(pH) > 0.5;
    const gp = { x: P.x - P.w * 0.6, y: P.y + P.diep * 0.52 }, lp = { x: P.x + P.w * 0.6, y: P.y + P.diep * 0.52 }, hp = { x: P.x + d * 20, y: P.y + P.diep * 0.95 };
    const label = d < 0.35;
    const groep = (p, txt, kl, lab, lx, al) => { g.fillStyle = kl; g.beginPath(); g.arc(p.x, p.y, 10, 0, 7); g.fill(); g.strokeStyle = '#2b2a27'; g.lineWidth = 1; g.stroke();
      tekstC(g, lab, p.x, p.y + 1, { px: 8.5, kleur: '#fff', vet: true }); if (label) tekstC(g, txt, lx, p.y, { px: 13, kleur: kl === '#9a8f86' || kl === '#8f96a3' || kl === '#8fa394' ? '#6b655a' : kl, vet: true, al }); };
    groep(gp, glu ? 'Glu: –COO⁻' : 'Glu: –COOH', glu ? '#c0392b' : '#9a8f86', 'Glu', gp.x - 34, 'right');
    groep(lp, lys ? 'Lys: –NH₃⁺' : 'Lys: –NH₂', lys ? '#2c55a8' : '#8f96a3', 'Lys', lp.x + 34, 'left');
    groep(hp, his ? 'His' : 'His–H⁺', his ? '#2d8a47' : '#8fa394', 'His', hp.x + 54, 'left');
    /* remmer */
    const rem = this.echteRemmer(), R = this.remmer;
    if (c.remmer !== 'geen' && R){
      if (rem === 'comp'){
        const p = R.toestand === 'gebonden' && (!this.bezet || this.bezet.fase !== 'vast') ? { x: P.x, y: P.y + P.diep * 0.5 } : { x: 520, y: 60 };
        R.x = lerp(R.x, p.x, 0.08); R.y = lerp(R.y, p.y, 0.08);
        this.tekenS(g, R.x, R.y, '#e08a2a', false);
      } else {
        const p = R.toestand === 'gebonden' ? { x: cx + 158, y: cy + 10 } : { x: 540, y: 70 };
        R.x = lerp(R.x, p.x, 0.08); R.y = lerp(R.y, p.y, 0.08);
        g.fillStyle = '#e08a2a'; g.beginPath(); g.arc(R.x, R.y, 13, 0, 7); g.fill(); g.strokeStyle = '#2b2a27'; g.stroke();
        tekstC(g, 'I', R.x, R.y + 1, { px: 12, kleur: '#fff', vet: true });
      }
    }
    /* substraten en bindingen */
    for (const s of this.deeltjes){
      if (s.fase === 'product'){ this.tekenP(g, s.x, s.y, s.t); continue; }

        g.save(); g.setLineDash([3, 3]); g.lineWidth = 1.8;
        const lijn = (a, b, sterk) => { g.strokeStyle = sterk ? '#6a3d9a' : 'rgba(106,61,154,.35)'; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); };
        lijn(gp, { x: s.x - 22, y: s.y }, glu); lijn(lp, { x: s.x + 22, y: s.y }, lys);
        g.restore();
      }
    }
    if (this.flits > 0){ g.fillStyle = `rgba(255,220,90,${this.flits})`; g.beginPath(); g.arc(P.x, P.y + P.diep * 0.5, 30, 0, 7); g.fill(); }

    tekstC(g, 'substraat', 60, 18, { i: true, px: 11, al: 'left' });
    if (d > 0.3) tekstC(g, 'de keten ontvouwt: het actieve centrum raakt zijn vorm kwijt', 300, 348, { i: true, px: 12, kleur: '#8c510a' });
  },
  tekenS(g, x, y, kl, lad){
    g.fillStyle = kl; g.strokeStyle = '#2b2a27'; g.lineWidth = 1.2;
    g.beginPath(); g.roundRect(x - 22, y - 9, 44, 18, 7); g.fill(); g.stroke();
    if (lad){ tekstC(g, '+', x - 14, y, { px: 15, kleur: '#2c55a8', vet: true }); tekstC(g, '−', x + 14, y, { px: 16, kleur: '#c0392b', vet: true }); }
  },
  tekenP(g, x, y, t){
    const sp = Math.min(1, t * 2) * 16;
    g.fillStyle = '#9fd49a'; g.strokeStyle = '#2b2a27'; g.lineWidth = 1.2;
    g.beginPath(); g.roundRect(x - 22 - sp, y - 9, 20, 18, 6); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(x + 2 + sp, y - 9, 20, 18, 6); g.fill(); g.stroke();
  },
  /* ---------- grafiek ---------- */
  grafiek(){
    const g = this.cg; g.clearRect(0, 0, g.W, g.H);
    const lb = this.lb, rs = this.reeksen.filter(r => r.aan);
    const m = { l: 62, r: 16, t: 14, b: 46 }, W = g.W - m.l - m.r, H = g.H - m.t - m.b;
    let xmax, ymax;
    if (lb){ xmax = 0.21; ymax = Math.max(1, ...rs.flatMap(r => r.pts.map(p => 1 / p.v))) * 1.1; }
    else { xmax = 660; ymax = Math.max(0.5, ...rs.flatMap(r => r.pts.map(p => p.v))) * 1.15; }
    const stap = (v, n) => { const raw = v / n, p = Math.pow(10, Math.floor(Math.log10(raw))), q = raw / p; return (q < 1.5 ? 1 : q < 3 ? 2 : q < 7 ? 5 : 10) * p; };
    const xs = stap(xmax, 6), ys = stap(ymax, 5); xmax = Math.ceil(xmax / xs) * xs; ymax = Math.ceil(ymax / ys) * ys;
    const X = x => m.l + W * x / xmax, Y = y => m.t + H - H * y / ymax;
    const dec = s => Math.max(0, -Math.floor(Math.log10(s) + 1e-9));
    g.font = '11.5px system-ui, sans-serif'; g.lineWidth = 1;
    for (let x = 0; x <= xmax + 1e-9; x += xs){ g.strokeStyle = '#ece6d8'; g.beginPath(); g.moveTo(X(x), Y(0)); g.lineTo(X(x), Y(ymax)); g.stroke(); g.fillStyle = '#5d5a52'; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(nl(x, dec(xs)), X(x), Y(0) + 5); }
    for (let y = 0; y <= ymax + 1e-9; y += ys){ g.strokeStyle = '#ece6d8'; g.beginPath(); g.moveTo(X(0), Y(y)); g.lineTo(X(xmax), Y(y)); g.stroke(); g.fillStyle = '#5d5a52'; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(nl(y, dec(ys)), X(0) - 6, Y(y)); }
    g.strokeStyle = '#2b2a27'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(X(0), Y(ymax)); g.lineTo(X(0), Y(0)); g.lineTo(X(xmax), Y(0)); g.stroke();
    g.fillStyle = '#2b2a27'; g.font = '13px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'bottom';
    g.fillText(lb ? '1/[S] (1/µM)' : '[S] (µM)', X(xmax / 2), g.H - 4);
    g.save(); g.translate(14, Y(ymax / 2)); g.rotate(-Math.PI / 2); g.textBaseline = 'middle'; g.fillText(lb ? '1/v₀ (s/µM)' : 'v₀ (µM/s)', 0, 0); g.restore();
    if (!rs.length){ g.fillStyle = '#7a756b'; g.font = 'italic 13px Georgia, serif'; g.textAlign = 'center'; g.fillText('Kies de omstandigheden en klik op Meet reeks.', X(xmax / 2), Y(ymax / 2)); }
    g.save(); g.beginPath(); g.rect(m.l, m.t, W, H); g.clip();
    for (const r of rs){
      g.strokeStyle = r.kleur; g.lineWidth = 2; g.beginPath();
      if (!lb){ /* geen modelcurve: de leerling fit zelf */ }
      else if (lb){ for (let i = 0; i <= 60; i++){ const x = -0.02 + i / 60 * (xmax + 0.02), y = (r.k.Km / r.k.Vmax) * x + 1 / r.k.Vmax; i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)); } }
      else { for (let i = 0; i <= 120; i++){ const S = i / 120 * xmax, v = snelheid(S, r.k); i ? g.lineTo(X(S), Y(v)) : g.moveTo(X(S), Y(v)); } }
      if (lb){ g.globalAlpha = 0.55; g.stroke(); g.globalAlpha = 1; }
      g.fillStyle = r.kleur; for (const p of r.pts){ const x = lb ? 1 / p.S : p.S, y = lb ? 1 / p.v : p.v; g.beginPath(); g.arc(X(x), Y(y), 4, 0, 7); g.fill(); }
    }
    for (const r of rs){
      const q = r.fit; if (lb || !q || !(q.V > 0) || !(q.K > 0)) continue;
      g.setLineDash([7, 5]); g.strokeStyle = r.kleur; g.lineWidth = 2.4; g.beginPath();
      for (let i = 0; i <= 160; i++){ const S = i / 160 * xmax, v = q.V * S / (q.K + S); i ? g.lineTo(X(S), Y(v)) : g.moveTo(X(S), Y(v)); }
      g.stroke(); g.setLineDash([]);
    }
    const fr = this.reeksen[this.schat.i], f = fr && fr.fit;
    if (!lb && fr && fr.aan && f && f.V > 0 && f.K > 0){
      g.lineWidth = 1.3; g.strokeStyle = fr.kleur; g.setLineDash([3, 4]);
      g.beginPath(); g.moveTo(X(0), Y(f.V)); g.lineTo(X(xmax), Y(f.V)); g.stroke();
      g.strokeStyle = '#8a8f99'; g.beginPath(); g.moveTo(X(0), Y(f.V / 2)); g.lineTo(X(f.K), Y(f.V / 2)); g.lineTo(X(f.K), Y(0)); g.stroke();
      g.setLineDash([]);
      tekstC(g, 'Vmax', X(0) + 22, Y(f.V) - 9, { px: 11, kleur: fr.kleur });
      tekstC(g, 'Km', X(f.K), Y(0) - 9, { px: 11, kleur: '#5d5a52' });
    }
    g.restore();
    $('#ereeks').innerHTML = this.reeksen.map((r, i) => `<label><input type="checkbox" data-i="${i}" ${r.aan ? 'checked' : ''}><i style="background:${r.kleur}"></i>${r.label}</label>`).join('');
    $$('#ereeks input').forEach(c => c.onchange = () => { this.reeksen[+c.dataset.i].aan = c.checked; this.grafiek(); });
    const laatste = this.reeksen[this.reeksen.length - 1];
    $('#etabel').innerHTML = laatste ? `<div class="legenda">Meetwaarden van de laatste reeks (${laatste.label}):</div><table class="data"><tr><th>[S] (µM)</th>${laatste.pts.map(p => `<td>${p.S}</td>`).join('')}</tr><tr><th>v₀ (µM/s)</th>${laatste.pts.map(p => `<td>${sig(p.v, 3)}</td>`).join('')}</tr></table>` : '';
  }
};

const WPS = [];
const TEKENINGEN = {};
const STAAT = { wp:0, tab:'uitleg', voortgang: laad(), niveau: (() => { try { return localStorage.getItem('polymeren-niveau') || '5V'; } catch (e){ return '5V'; } })() };
const PER_WP = {};             /* per werkplaats: { serie, idx, st:[{stap, goed:[], getoond, pogingen}] } */
let SIM = null;

function maakCanvas(host, w, h){
  const c = document.createElement('canvas'), dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = w + ' / ' + h;
  host.appendChild(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); ctx.W = w; ctx.H = h; ctx.canvas_ = c;
  return ctx;
}

function zichtbaar(w){ return !w.alleen6 || STAAT.niveau === '6V'; }
function renderNav(){

function renderTekst(){

function renderVoorbeeld(w){

/* ---------- opdrachten ---------- */
function renderOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  const nTot = p.serie.filter(x => !x.ster).length;
  let h = '';
  if (STAAT.voortgang[w.id] && STAAT.voortgang[w.id].klaar && p.st.every((x, k) => p.serie[k].ster || (x.klaar && !x.getoond)))
    h += `<div class="klaarbanner"><b>Werkplaats afgerond.</b> Probeer ook de ★-opdrachten, of oefen met een nieuwe serie.</div>`;
  h += `<div class="oknop">` + p.serie.map((x, k) => {
    const st = p.st[k];
    return `<span class="dot ${k === p.idx ? 'on' : ''} ${st.klaar && !st.getoond ? 'goed' : ''} ${x.ster ? 'ster' : ''}" data-k="${k}" title="${x.titel}">${x.ster ? '★' : k + 1}</span>`;
  }).join('') + `<span class="rechts"><button class="btn g klein" id="nieuweserie">Nieuwe serie</button></span></div>`;
  h += `<div class="opdkop">${o.ster ? '<span class="st">★ </span>' : ''}Opdracht ${o.ster ? '★' : p.idx + 1}${o.ster ? '' : ' van ' + nTot} · ${o.titel}</div>`;
  if (o.vraag) h += `<div class="opdvraag">${o.vraag}</div>`;
  o.stappen.forEach((st, k) => {
    const dicht = k > s.stap, goed = k < s.stap || s.klaar;
    h += `<div class="stap ${dicht ? 'dicht' : ''} ${goed ? 'goed' : ''}" data-k="${k}">${o.stappen.length > 1 ? `<span class="n">${goed ? '✓' : k + 1}</span>` : ''}<div class="inh">
      <div class="vr">${st.vr}</div>${goed ? `<div class="antw">${st.antwoord()}</div>` : `<div class="inv">${invoerHTML(st, k)}</div>`}
      <div class="fb" id="fb${k}"></div></div></div>`;
  });
  if (s.klaar){
    const volgende = p.idx < p.serie.length - 1;
    h += `<div class="rij" style="margin-top:6px">${volgende ? `<button class="btn" id="volgende">Volgende opdracht ▸</button>` : ''}${o.naKlaar ? `<span class="waarneming">${o.naKlaar()}</span>` : ''}</div>`;
  }
  if (o.stappen.some(x => x.type === 'teken')) h += `<div class="typtip">${TEKENTIP}</div>`;
  else if (o.stappen.some(x => x.type === 'getal')) h += `<div class="typtip">${GETALTIP}</div>`;
  return h;
}
const TEKENTIP = 'Tekenen: kies een atoomsoort en klik op het raster. Sleep vanaf een atoom om een binding met een nieuw of bestaand atoom te maken. Klik op een binding voor een dubbele binding. <b>+H aanvullen</b> zet ontbrekende H-atomen, maar je mag ze ook zelf zetten. <b>~</b> is een open binding: de keten gaat verder.';
const GETALTIP = 'Typ een getal met een komma, bijvoorbeeld <code>2,4</code> of <code>35</code>.';
const TYPTIP = 'Zo typ je (voorbeelden met titaan en chromaat): <code>Ti2(CrO4)3</code> · ion <code>Ti3+</code> of <code>CrO4 2-</code> · pijl <code>-></code> · toestand <code>(s)</code> <code>(aq)</code> <code>(l)</code> · coëfficiënt ervoor: <code>3 CrO4 2-(aq)</code>.';

function invoerHTML(st, k){
  const knoppen = `<button class="btn" data-ctl="${k}">Controleer</button><button class="btn g" data-hint="${k}">Hint</button><button class="btn g" data-toon="${k}" style="display:none">Toon antwoord</button>`;
  if (st.type === 'tekst') return `<div class="rij"><input class="in" id="in${k}" autocomplete="off" spellcheck="false" placeholder="${st.ph || ''}">${knoppen}</div><div class="voorbeeldweergave" id="vw${k}"></div>`;
  if (st.type === 'chips') return `<div class="chips" id="ch${k}">${st.opties.map((x, j) => `<span class="chip" data-j="${j}">${x.html}</span>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;
  if (st.type === 'keuze') return `<div class="opties" id="op${k}">${st.opties.map((x, j) => `<button class="optie" data-j="${j}">${x.html}</button>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;

  if (st.type === 'selects') return `<div class="rij">${st.selects.map((s, j) => `<label style="font-size:14px">${s.lab} <select class="sel" id="se${k}_${j}"><option value="">kies…</option>${s.opties.map(x => `<option value="${x.v}">${x.t}</option>`).join('')}</select></label>`).join('')}</div><div class="rij" style="margin-top:9px">${knoppen}</div>`;

function koppelOpdracht(w, p){
  const o = p.serie[p.idx], s = p.st[p.idx];
  $$('.oknop .dot').forEach(d => d.onclick = () => { p.idx = +d.dataset.k; renderTekst(); zetOpdrachtInSim(); });
  $('#nieuweserie').onclick = () => { nieuweSerie(w); renderTekst(); zetOpdrachtInSim(); };
  const v = $('#volgende'); if (v) v.onclick = () => { p.idx++; renderTekst(); zetOpdrachtInSim(); };
  o.stappen.forEach((st, k) => {
    if (k !== s.stap || s.klaar) return;
    const inp = $('#in' + k);
    if (st.type === 'teken'){
      const sleutel = w.id + '|' + p.idx + '|' + k + '|' + p.serieNr;
      const tv = new Tekenveld($('#tv' + k), { breedte: st.breedte || 32, hoogte: st.hoogte || 13 });
      if (TEKENINGEN[sleutel]) tv.zet(TEKENINGEN[sleutel]);
      const oud = tv.teken.bind(tv); tv.teken = () => { oud(); TEKENINGEN[sleutel] = tv.g; };
      tv.melding = m => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = m; };
      st._tv = tv;
    }
    if (inp && st.type === 'getal'){ inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); }; setTimeout(() => inp.focus({ preventScroll:true }), 30); }
    else if (inp){
      inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); };
      setTimeout(() => inp.focus({ preventScroll:true }), 30);
    }
    $$(`#ch${k} .chip`).forEach(c => c.onclick = () => c.classList.toggle('aan'));
    $$(`#op${k} .optie`).forEach(c => c.onclick = () => {
      if (!st.meer) $$(`#op${k} .optie`).forEach(x => x !== c && x.classList.remove('aan'));
      c.classList.toggle('aan');
    });
    $(`[data-ctl="${k}"]`).onclick = () => controleer(w, p, k);
    $(`[data-hint="${k}"]`).onclick = () => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = st.hint; };
    $(`[data-toon="${k}"]`).onclick = () => {
      s.getoond = true; const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = 'Antwoord: ' + st.antwoord();
      setTimeout(() => stapGoed(w, p, k), 1400);
    };
    if ((s.pogingen[k] || 0) >= 2) $(`[data-toon="${k}"]`).style.display = '';
  });
}
function waardeVan(st, k){
  if (st.type === 'tekst') return $('#in' + k).value;
  if (st.type === 'chips') return $$(`#ch${k} .chip.aan`).map(c => +c.dataset.j);
  if (st.type === 'keuze') return $$(`#op${k} .optie.aan`).map(c => +c.dataset.j);
  if (st.type === 'selects') return st.selects.map((x, j) => $(`#se${k}_${j}`).value);
  if (st.type === 'teken') return st._tv;
  if (st.type === 'getal') return $('#in' + k).value;
}
function controleer(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx], st = o.stappen[k];
  const r = st.check(waardeVan(st, k));
  const fb = $('#fb' + k);
  if (r.ok){ fb.className = 'fb toon goed'; fb.innerHTML = r.msg || 'Goed!'; setTimeout(() => stapGoed(w, p, k), 650); }
  else {
    s.pogingen[k] = (s.pogingen[k] || 0) + 1;
    fb.className = 'fb toon fout'; fb.innerHTML = r.msg;
    if (s.pogingen[k] >= 2) $(`[data-toon="${k}"]`).style.display = '';
  }
}
function stapGoed(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx];
  if (s.stap !== k) return;
  s.stap = k + 1;
  if (s.stap >= o.stappen.length) s.klaar = true;
  SIM.stapGoed && SIM.stapGoed(o, k);
  if (s.klaar){
    const nietSter = p.serie.map((x, j) => [x, p.st[j]]).filter(([x]) => !x.ster);
    if (nietSter.every(([, y]) => y.klaar && !y.getoond)){
      STAAT.voortgang[w.id] = { klaar:true }; bewaar(STAAT.voortgang); renderNav();
    }
  }
  renderTekst();
}
function zetOpdrachtInSim(){
  const w = WPS[STAAT.wp], p = PER_WP[w.id];
  SIM.opdracht && SIM.opdracht(STAAT.tab === 'opd' ? p.serie[p.idx] : null, STAAT.tab === 'opd' ? p.st[p.idx] : null);
}

function keuzeStap(vr, opties, o = {}){
  const opts = o.vast ? opties : schud(opties);
  return { type:'keuze', meer: !!o.meer, vr, opties: opts, hint: o.hint || '',
    check: v => {
      if (!v.length) return { ok:false, msg:'Kies een antwoord.' };
      const sel = v.map(j => opts[j]), goed = opts.filter(x => x.g);
      if (sel.length === goed.length && sel.every(x => x.g)) return { ok:true, msg: o.goedMsg };
      const fb = sel.find(x => !x.g && x.fb); if (fb) return { ok:false, msg: fb.fb };
      if (o.meer && sel.every(x => x.g)) return { ok:false, msg:'Je mist er nog een.' };
      return { ok:false, msg: o.fout || 'Nog niet goed.' };
    },
    antwoord: () => opts.filter(x => x.g).map(x => x.html).join('; '), goed: () => opts.map((x, j) => x.g ? j : -1).filter(j => j >= 0) };
}
function leesGetal(s){
  let t = String(s).trim().replace(/\s+/g, '').replace(/[×x*·]10\^?/i, 'e').replace(/10\^/, 'e');
  t = t.replace(',', '.');
  return /^-?\d*\.?\d+(e-?\d+)?$/i.test(t) ? parseFloat(t) : NaN;
}
function getalStap(vr, waarde, eenheid, uitleg, hint, tol){
  return { type:'getal', vr, eenheid, hint, ph:'getal',
    check: v => { const x = leesGetal(v); if (isNaN(x)) return { ok:false, msg:'Typ een getal, bijvoorbeeld <code>2,4</code>.' };
      if (Math.abs(x - waarde) <= Math.abs(waarde) * tol) return { ok:true, msg:'Goed! ' + uitleg };
      return { ok:false, msg:'Nog niet goed. ' + hint }; },
    antwoord: () => uitleg, goed: () => String(+waarde.toPrecision(3)).replace('.', ',') };
}
const COMBI = (vm, km) => `Vmax ${vm}, Km ${km}`;
function combiOpties(goedVm, goedKm){
  const opties = [];
  for (const vm of ['lager','gelijk','hoger']) for (const km of ['kleiner','gelijk','groter']) opties.push({ html: COMBI(vm, km), g: vm === goedVm && km === goedKm });
  return opties;
}
