<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zouten en ionen</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}

/* ---------- zijbalk ---------- */
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 26px}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
aside .voet .klein{font-size:11.5px;color:#6f859a}

/* ---------- werkplaats ---------- */
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(540px,640px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:760px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:22px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.binas{border-left-color:#5d7387}
.f{white-space:nowrap}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs button .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}

/* voorbeeld */
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.vb .verder{margin-top:8px}

/* opdrachten */
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.opdvraag{font-size:16px;margin-bottom:12px;color:var(--inkt)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42;pointer-events:none}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;flex:1 1 100%}
input.in:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
.voorbeeldweergave{font-size:13px;color:var(--grijs);min-height:20px;margin-top:4px}
.voorbeeldweergave b{color:var(--inkt);font-weight:600;font-size:15px}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px;display:none}
.fb.toon{display:block}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.opties{display:flex;flex-direction:column;gap:6px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.typtip{font-size:12.5px;color:var(--grijs);margin-top:14px;line-height:1.5}
.typtip code{font-family:var(--mono);background:#ebe4d4;border-radius:4px;padding:0 4px;font-size:12px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}

/* ---------- simulatiekolom ---------- */
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkol>*{flex-shrink:0}
.simkop{display:flex;justify-content:space-between;align-items:baseline}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl label{font-size:13.5px;color:var(--inkt2);display:flex;gap:6px;align-items:center}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;position:relative;overflow:hidden}
.doek canvas{display:block;width:100%;height:auto}
.waarneming{font-size:14px;color:var(--inkt2);min-height:22px}
.waarneming b{color:var(--inkt)}
.vgl{font-family:var(--serif);font-size:19px;text-align:center;min-height:30px;color:var(--inkt)}
.tabelkop{font-size:12px;font-weight:700;letter-spacing:1.2px;color:var(--goud);margin-bottom:6px;text-transform:uppercase}
table.b45{border-collapse:collapse;font-size:13px;background:#fff;color:var(--inkt)}
table.b45 th,table.b45 td{border:1px solid #6d6a62;padding:2px 0;text-align:center;width:38px}
table.b45 th{font-weight:600;background:#fff}
table.b45 th.hoek{width:46px;font-size:10px;font-weight:400;color:var(--grijs)}
table.b45 td.licht{background:#f6e3bf;font-weight:700}
table.b45 tr.licht th, table.b45 th.licht{background:#f3ead6}
.legenda{font-size:12px;color:var(--grijs);margin-top:6px;line-height:1.45}
.balk{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.balk .lijn{display:flex;align-items:center;gap:8px}
.balk .lijn span.lab{width:120px;color:var(--inkt2)}
.balk .vak{display:flex;gap:3px;flex-wrap:wrap}
.balk .q{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.balk .q.p{background:#c4822b}.balk .q.m{background:#3b6fa8}
.uitkomst{background:#fff;border:1px solid var(--rand);border-radius:10px;padding:10px 14px;font-size:14.5px}
.uitkomst .groot{font-family:var(--serif);font-size:22px}
.buislog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.buislog div{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:5px 7px;line-height:1.35}
.buislog div b{display:block;font-size:12.5px}

/* beamerstand */
body.beamer{font-size:18px}
body.beamer .tekst h2{font-size:36px}
body.beamer .opdvraag{font-size:19px}
body.beamer input.in{font-size:18px}
body.beamer .optie, body.beamer .chip{font-size:17px}
body.beamer table.b45{font-size:15px}

@media (max-width:1180px){
  .wp{grid-template-columns:1fr}
  .simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
}
@media print{aside,.simkol{display:none}.wp{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Zouten en ionen</h1>
    <div class="sub">4 vwo · hoofdstuk 4</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button id="beamerknop">Beamerstand</button>
      <button id="resetknop">Voortgang wissen</button>
      <div class="klein">Oplosbaarheid: uitsnede van Binas tabel 45A.</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
'use strict';
/* =====================================================================
   Gegevens: ionen en oplosbaarheid (uitsnede Binas tabel 45A, overgenomen
   uit de foto van de Binas die de klas gebruikt)
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rnd = (a, b) => a + Math.random() * (b - a);
const kies = arr => arr[Math.floor(Math.random() * arr.length)];
function schud(arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ggd = (a, b) => b ? ggd(b, a % b) : a;

/* id, formule (zonder lading), lading, naam (stam), kleur (deeltje), kleur oplossing */
const KAT = [
  { id:'Na',  f:'Na',  q:1, naam:'natrium',    kl:'#b48ad6' },
  { id:'K',   f:'K',   q:1, naam:'kalium',     kl:'#c7a0e6' },
  { id:'NH4', f:'NH4', q:1, naam:'ammonium',   kl:'#9aa7c4' },
  { id:'Ag',  f:'Ag',  q:1, naam:'zilver',     kl:'#c4ccd4' },
  { id:'Mg',  f:'Mg',  q:2, naam:'magnesium',  kl:'#9fd18b' },
  { id:'Ca',  f:'Ca',  q:2, naam:'calcium',    kl:'#e9c46a' },
  { id:'Ba',  f:'Ba',  q:2, naam:'barium',     kl:'#f2a65a' },
  { id:'Zn',  f:'Zn',  q:2, naam:'zink',       kl:'#a9b8c6' },
  { id:'Pb',  f:'Pb',  q:2, naam:'lood(II)',   kl:'#8d8a9c' },
  { id:'Cu',  f:'Cu',  q:2, naam:'koper(II)',  kl:'#4aa3c9', opl:'rgba(70,150,210,.30)' },
  { id:'Fe2', f:'Fe',  q:2, naam:'ijzer(II)',  kl:'#8cbf8a', opl:'rgba(150,200,140,.24)' },
  { id:'Fe3', f:'Fe',  q:3, naam:'ijzer(III)', kl:'#c9763c', opl:'rgba(214,160,60,.30)' },
  { id:'Al',  f:'Al',  q:3, naam:'aluminium',  kl:'#d9b8b0' },
];
const AN = [
  { id:'Cl',  f:'Cl',  q:-1, naam:'chloride',  kl:'#5bbf9f' },
  { id:'Br',  f:'Br',  q:-1, naam:'bromide',   kl:'#c96a5a' },
  { id:'I',   f:'I',   q:-1, naam:'jodide',    kl:'#8a6bb0' },
  { id:'OH',  f:'OH',  q:-1, naam:'hydroxide', kl:'#e28c8c' },
  { id:'NO3', f:'NO3', q:-1, naam:'nitraat',   kl:'#5a8fd8' },
  { id:'S',   f:'S',   q:-2, naam:'sulfide',   kl:'#d8c84a' },
  { id:'SO4', f:'SO4', q:-2, naam:'sulfaat',   kl:'#e0a03c' },
  { id:'CO3', f:'CO3', q:-2, naam:'carbonaat', kl:'#7b8c99' },
  { id:'PO4', f:'PO4', q:-3, naam:'fosfaat',   kl:'#b98bc8' },
];
/* extra ionen voor naamgeving en formules (werkplaats 1), niet in de oplosbaarheidstabel */
const KAT_X = [
  { id:'Li',  f:'Li', q:1, naam:'lithium',    kl:'#c6a0d8' },
  { id:'Cu1', f:'Cu', q:1, naam:'koper(I)',   kl:'#d07a54' },
  { id:'Sn2', f:'Sn', q:2, naam:'tin(II)',    kl:'#b0b6bd' },
  { id:'Sn4', f:'Sn', q:4, naam:'tin(IV)',    kl:'#9aa3ad' },
  { id:'Cr3', f:'Cr', q:3, naam:'chroom(III)',kl:'#7fae8a' },
  { id:'Mn2', f:'Mn', q:2, naam:'mangaan(II)',kl:'#d6a3b8' },
  { id:'Mn4', f:'Mn', q:4, naam:'mangaan(IV)',kl:'#b07a94' },
  { id:'Hg2', f:'Hg', q:2, naam:'kwik(II)',   kl:'#b8b8c8' },
];
const AN_X = [
  { id:'O',   f:'O',   q:-2, naam:'oxide',     kl:'#e05a4a' },
  { id:'F',   f:'F',   q:-1, naam:'fluoride',  kl:'#9fd8c8' },
  { id:'SO3', f:'SO3', q:-2, naam:'sulfiet',   kl:'#d6b86a' },
  { id:'HCO3',f:'HCO3',q:-1, naam:'waterstofcarbonaat', kl:'#93a3ad' },
];
const ALLE_KAT = KAT.concat(KAT_X), ALLE_AN = AN.concat(AN_X), ALLE_IONEN = ALLE_KAT.concat(ALLE_AN);
const ION = {}; for (const i of ALLE_IONEN) ION[i.id] = i;
const VARIABEL = new Set(['Pb','Cu','Fe2','Fe3','Cu1','Sn2','Sn4','Cr3','Mn2','Mn4','Hg2']);

/* oplosbaarheid: rijen = positieve ionen (volgorde KAT), kolommen = negatieve ionen (volgorde AN) */
const TAB_RIJ = {            /* kolommen: Cl⁻ Br⁻ I⁻ OH⁻ NO₃⁻ S²⁻ SO₄²⁻ CO₃²⁻ PO₄³⁻ */
  Na:'ggggggggg', K:'ggggggggg', NH4:'gggigrgrr', Ag:'sssigsmss', Mg:'gggsgmgms', Ca:'gggmgmmss', Ba:'gggggmsss',
  Zn:'gggsgsgss', Pb:'mmssgssss', Cu:'ggrsgsgss', Fe2:'gggsgsgss', Fe3:'ggrsgrgrs', Al:'gggsgrgrs'
};
function opl(kId, aId){ const r = TAB_RIJ[kId]; if (!r) return null; const j = AN.findIndex(a => a.id === aId); return j < 0 ? null : r[j]; }

/* kleur van een vaste stof (neerslag) */
const NEERKLEUR = {
  'Ag-I':'#efe2a0', 'Ag-Br':'#f1edcf', 'Ag-S':'#2b2a2a', 'Ag-PO4':'#e8d36a', 'Ag-CO3':'#f2ecd8',
  'Pb-I':'#f1cf3c', 'Pb-S':'#2b2a2a', 'Cu-OH':'#5fa6d8', 'Cu-S':'#2b2a2a', 'Cu-CO3':'#6cb8b0', 'Cu-PO4':'#7cc0d8',
  'Fe2-OH':'#9cbf86', 'Fe2-S':'#2b2a2a', 'Fe2-CO3':'#c8d0b0', 'Fe2-PO4':'#c9d4c0',
  'Fe3-OH':'#a5582a', 'Fe3-PO4':'#e9d9a8', 'Zn-S':'#f4f4ee',
};
const KLEURNAAM = { '#efe2a0':'lichtgeel', '#f1edcf':'gebroken wit', '#2b2a2a':'zwart', '#e8d36a':'geel', '#f1cf3c':'geel', '#5fa6d8':'blauw',
  '#6cb8b0':'blauwgroen', '#7cc0d8':'lichtblauw', '#9cbf86':'groen', '#c8d0b0':'grijsgroen', '#c9d4c0':'grijsgroen', '#a5582a':'roodbruin', '#e9d9a8':'lichtgeel', '#f4f4ee':'wit', '#f2ecd8':'wit' };
function neerKleur(kId, aId){ return NEERKLEUR[kId + '-' + aId] || '#f6f5f0'; }
function neerKleurNaam(kId, aId){ return KLEURNAAM[neerKleur(kId, aId)] || 'wit'; }

/* ---------- formules en namen ---------- */
const isSamengesteld = f => (f.match(/[A-Z]/g) || []).length > 1;
const ladingTxt = q => (Math.abs(q) === 1 ? '' : Math.abs(q)) + (q > 0 ? '+' : '-');          /* getypt: 2+ */
const ladingHTML = q => (Math.abs(q) === 1 ? '' : Math.abs(q)) + (q > 0 ? '+' : '−');
const SUPC = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻' };
const SUBC = { '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉' };
const subUni = s => s.replace(/([A-Za-z)])(\d+)/g, (m, a, d) => a + d.split('').map(c => SUBC[c]).join(''));
const ionUni = ion => subUni(ion.f) + ladingTxt(ion.q).split('').map(c => SUPC[c]).join('');      /* voor canvas */
const subHTML = s => s.replace(/([A-Za-z)])(\d+)/g, '$1<sub>$2</sub>');
const ionHTML = ion => `<span class="f">${subHTML(ion.f)}<sup>${ladingHTML(ion.q)}</sup></span>`;
const ionTyp = ion => ion.f + ladingTxt(ion.q);

function zout(kat, an){
  const n = Math.abs(kat.q * an.q) / ggd(Math.abs(kat.q), Math.abs(an.q));
  const nk = n / kat.q, na = n / Math.abs(an.q);
  const deel = (ion, x) => x === 1 ? ion.f : (isSamengesteld(ion.f) ? '(' + ion.f + ')' : ion.f) + x;
  const f = deel(kat, nk) + deel(an, na);
  const idDeel = (ion, x) => { const s = ionTyp(ion); return x === 1 ? s : '(' + s + ')' + x; };
  const idH = (ion, x) => x === 1 ? ionHTML(ion) : '(' + ionHTML(ion) + ')<sub>' + x + '</sub>';
  return { kat, an, nk, na, f, naam: kat.naam + an.naam, html: `<span class="f">${subHTML(f)}</span>`,
           ionTyp: idDeel(kat, nk) + idDeel(an, na) + '(s)', ionHTML: `<span class="f">${idH(kat, nk)}${idH(an, na)}(s)</span>`,
           opl: opl(kat.id, an.id) };
}

/* ---------- invoer normaliseren ---------- */
function norm(s){
  const sup = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-' };

  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻]/g, c => sup[c]).replace(/[₀-₉]/g, c => sub[c])

}
const naamNorm = s => s.toLowerCase().replace(/\s+/g, '').replace(/-/g, '').replace(/^(het|een)/, '');

/* ---------- vergelijkingen lezen ---------- */
let SOORTEN = null;
function soorten(){
  if (SOORTEN) return SOORTEN;
  const set = new Set(['H2O']);
  for (const i of ALLE_IONEN) set.add(ionTyp(i));
  for (const k of ALLE_KAT) for (const a of ALLE_AN) set.add(zout(k, a).f);
  return SOORTEN = Array.from(set).sort((a, b) => b.length - a.length);
}
function leesKant(s){
  const uit = []; let i = 0; const S = soorten();
  while (i < s.length){
    let m = s.slice(i).match(/^\d+/); let n = 1;
    if (m){ n = +m[0]; i += m[0].length; }
    const sp = S.find(x => s.startsWith(x, i));
    if (!sp) return null;
    i += sp.length;
    let st = '';
    const t = s.slice(i).match(/^\((s|l|g|aq)\)/);
    if (t){ st = t[1]; i += t[0].length; }
    uit.push({ n, sp, st });
    if (i < s.length){ if (s[i] === '+') i++; else return null; if (i >= s.length) return null; }
  }

}

  const s = norm(invoer);

  const [l, r, ...rest] = s.split('->');
  if (rest.length) return { fout:'pijlen' };
  const L = leesKant(l), R = leesKant(r);

}
/* verwacht: { L:[{n,sp,st}], R:[...] }; ext: { tribune:[sp] } */
function checkVgl(invoer, verw, ext = {}){
  if (!invoer.trim()) return { ok:false, msg:'Typ eerst een vergelijking.' };
  const v = leesVgl(invoer);
  if (v.fout === 'pijl') return { ok:false, msg:'Er ontbreekt een pijl. Typ de pijl als <code>-></code>.' };
  if (v.fout === 'pijlen') return { ok:false, msg:'Gebruik precies één pijl.' };
  if (v.fout) return { ok:false, msg:'Ik kan je vergelijking niet lezen. Controleer de formules, de ladingen en de plustekens tussen de deeltjes.' };
  if (v.L.concat(v.R).some(x => x.sp === 'H2O')) return { ok:false, msg:'Water schrijf je hier niet als deeltje in de vergelijking (hooguit boven de pijl).' };
  const sleutel = arr => arr.map(x => x.sp).sort().join('|');
  const samen = arr => { const o = {}; for (const x of arr) o[x.sp] = (o[x.sp] || 0) + x.n; return o; };
  const vl = samen(v.L), vr = samen(v.R), el = samen(verw.L), er = samen(verw.R);
  const zelfde = (a, b) => Object.keys(a).sort().join('|') === Object.keys(b).sort().join('|');
  if (!zelfde(vl, el) || !zelfde(vr, er)){
    if (zelfde(vl, er) && zelfde(vr, el)) return { ok:false, msg:'De deeltjes kloppen, maar ze staan aan de verkeerde kant van de pijl.' };
    const trib = ext.tribune || [];

  const coefOk = Object.keys(el).every(k => vl[k] === el[k]) && Object.keys(er).every(k => vr[k] === er[k]);

    const f = Object.keys(el).map(k => vl[k] / el[k]).concat(Object.keys(er).map(k => vr[k] / er[k]));
    if (f.every(x => x === f[0]) && Number.isInteger(f[0])) return { ok:false, msg:'De verhouding klopt, maar gebruik de kleinst mogelijke gehele getallen als coëfficiënten.' };

}
function vglTyp(v){ const deel = arr => arr.map(x => (x.n > 1 ? x.n + ' ' : '') + x.sp + (x.st ? '(' + x.st + ')' : '')).join(' + '); return deel(v.L) + ' -> ' + deel(v.R); }

}
function spHTML(sp){

/* ---------- formule-invoer controleren ---------- */
function checkIon(invoer, ion){
  const s = norm(invoer);
  if (!s) return { ok:false, msg:'Typ eerst een formule.' };
  const goed = ionTyp(ion);
  const alt = [goed]; if (Math.abs(ion.q) === 1) alt.push(ion.f + '1' + (ion.q > 0 ? '+' : '-'));
  if (alt.includes(s)) return { ok:true };
  if (s === ion.f) return { ok:false, msg:'Een ion heeft een lading. Vergeet die niet: typ bijvoorbeeld <code>Ti3+</code> of <code>CrO4 2-</code>.' };
  if (s.startsWith(ion.f)){
    const rest = s.slice(ion.f.length);
    if (/^[+-]\d$/.test(rest) && rest[1] == Math.abs(ion.q) && (rest[0] === '+') === (ion.q > 0)) return { ok:false, msg:'Bijna: schrijf eerst het getal en dan het teken, dus <code>' + goed + '</code>.' };
    return { ok:false, msg:'De formule klopt, maar de lading nog niet.' };
  }
  return { ok:false, msg:'Nog niet goed. Controleer de formule (Binas tabel 45).' };
}
function checkZoutFormule(invoer, z){
  const s = norm(invoer);
  if (!s) return { ok:false, msg:'Typ eerst een formule.' };
  if (s === z.f) return { ok:true };
  if (/[+-]/.test(s)) return { ok:false, msg:'In de verhoudingsformule van een zout schrijf je geen ladingen.' };
  const zh = x => x.replace(/[()]/g, '');
  if (zh(s) === zh(z.f)) return { ok:false, msg:'Bijna: zet haakjes om een samengesteld ion als er meer dan één van in de formule zit.' };
  const omgekeerd = s.startsWith(z.an.f) || s.startsWith('(' + z.an.f);
  if (omgekeerd) return { ok:false, msg:'Schrijf in de formule van een zout eerst het positieve ion.' };
  return { ok:false, msg:'Nog niet goed. Klopt de verhouding? De totale lading van een zout is nul.' };
}
function checkNaam(invoer, doel, opties = {}){
  const s = naamNorm(invoer);
  if (!s) return { ok:false, msg:'Typ eerst een naam.' };
  const d = naamNorm(doel);
  const varianten = [d]; if (opties.ion) varianten.push(d + 'ion', d.replace(/ion$/, ''));
  if (varianten.includes(s)) return { ok:true };
  if (s.replace(/\(|\)/g, '') === d.replace(/\(|\)/g, '')) return { ok:false, msg:'Zet de lading in Romeinse cijfers tussen haakjes, zonder spatie.' };
  if (/\(\d\)/.test(s)) return { ok:false, msg:'Schrijf de lading in Romeinse cijfers, bijvoorbeeld (II) of (III).' };
  if (/\((i|ii|iii|iv)\)/.test(d) && !/\(/.test(s)) return { ok:false, msg:'Dit metaal kan ionen met verschillende ladingen vormen. Zet de lading in Romeinse cijfers in de naam.' };
  if (/\((i|ii|iii|iv|v)\)/.test(s) && /\(/.test(d)) return { ok:false, msg:'De Romeinse cijfers kloppen nog niet. Leid de lading af uit de lading van het negatieve ion.' };
  return { ok:false, msg:'Nog niet goed. Let ook op de spelling.' };
}

function helder(hex){ const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299*r + 0.587*g + 0.114*b) / 255; }

function tekenIon(c, ion, x, y, r, alfa = 1, label = true){

  g.addColorStop(0, mengKleur(ion.kl, 0.55)); g.addColorStop(0.7, ion.kl); g.addColorStop(1, mengKleur(ion.kl, -0.0));

    c.font = `700 ${Math.max(9.5, Math.min(15, r * 0.6))}px ${getComputedStyle(document.body).fontFamily}`;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = helder(ion.kl) > 0.62 ? '#2b2a27' : '#fff';

}
/* watermolecuul: O op (x,y), H-atomen in richting 'hoek' (radialen) */
function tekenWater(c, x, y, hoek, alfa = 1, s = 1){
  c.save(); c.globalAlpha = alfa;
  const d = 6.3*s, a = 0.91;
  for (const t of [hoek - a, hoek + a]){
    c.fillStyle = '#f4f6f8'; c.strokeStyle = 'rgba(80,90,100,.45)'; c.lineWidth = 0.8;
    c.beginPath(); c.arc(x + Math.cos(t)*d, y + Math.sin(t)*d, 3.2*s, 0, Math.PI*2); c.fill(); c.stroke();
  }
  c.fillStyle = '#d9534a'; c.strokeStyle = 'rgba(110,30,25,.5)';

  c.restore();
}
function tekenBeker(c, x, y, w, h, kleur = '#7d8a96'){
  c.save(); c.strokeStyle = kleur; c.lineWidth = 2.4; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - 6, y); c.lineTo(x, y + 8); c.lineTo(x, y + h - 10); c.quadraticCurveTo(x, y + h, x + 10, y + h);
  c.lineTo(x + w - 10, y + h); c.quadraticCurveTo(x + w, y + h, x + w, y + h - 10); c.lineTo(x + w, y); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 7, y + 18); c.lineTo(x + 7, y + h - 18); c.stroke();

}
function vloeistofVlak(c, x, y, w, h, niveau, kleur){

  c.beginPath(); c.moveTo(x + 1.5, y + h - niveau); c.lineTo(x + w - 1.5, y + h - niveau); c.lineTo(x + w - 1.5, y + h - 10);
  c.quadraticCurveTo(x + w - 1.5, y + h - 1.5, x + w - 10, y + h - 1.5); c.lineTo(x + 10, y + h - 1.5); c.quadraticCurveTo(x + 1.5, y + h - 1.5, x + 1.5, y + h - 10); c.closePath(); c.fill();

function koppelOpdracht(w, p){

  o.stappen.forEach((st, k) => {
    if (k !== s.stap || s.klaar) return;
    const inp = $('#in' + k);
    if (inp){
      inp.oninput = () => { const vw = $('#vw' + k); vw.innerHTML = inp.value.trim() ? 'Zo lees ik het: <b>' + mooi(inp.value) + '</b>' : ''; };
      inp.onkeydown = e => { if (e.key === 'Enter') controleer(w, p, k); };
      setTimeout(() => inp.focus({ preventScroll:true }), 30);
    }
    $$(`#ch${k} .chip`).forEach(c => c.onclick = () => c.classList.toggle('aan'));
    $$(`#op${k} .optie`).forEach(c => c.onclick = () => {
      if (!st.meer) $$(`#op${k} .optie`).forEach(x => x !== c && x.classList.remove('aan'));
      c.classList.toggle('aan');
    });
    $(`[data-ctl="${k}"]`).onclick = () => controleer(w, p, k);
    $(`[data-hint="${k}"]`).onclick = () => { const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = st.hint; };
    $(`[data-toon="${k}"]`).onclick = () => {
      s.getoond = true; const fb = $('#fb' + k); fb.className = 'fb toon hint'; fb.innerHTML = 'Antwoord: ' + st.antwoord();
      setTimeout(() => stapGoed(w, p, k), 1400);
    };
    if ((s.pogingen[k] || 0) >= 2) $(`[data-toon="${k}"]`).style.display = '';
  });
}
function waardeVan(st, k){
  if (st.type === 'tekst') return $('#in' + k).value;
  if (st.type === 'chips') return $$(`#ch${k} .chip.aan`).map(c => +c.dataset.j);
  if (st.type === 'keuze') return $$(`#op${k} .optie.aan`).map(c => +c.dataset.j);
  if (st.type === 'selects') return st.selects.map((x, j) => $(`#se${k}_${j}`).value);
}
function controleer(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx], st = o.stappen[k];
  const r = st.check(waardeVan(st, k));
  const fb = $('#fb' + k);
  if (r.ok){ fb.className = 'fb toon goed'; fb.innerHTML = r.msg || 'Goed!'; setTimeout(() => stapGoed(w, p, k), 650); }
  else {
    s.pogingen[k] = (s.pogingen[k] || 0) + 1;
    fb.className = 'fb toon fout'; fb.innerHTML = r.msg;
    if (s.pogingen[k] >= 2) $(`[data-toon="${k}"]`).style.display = '';
  }
}
function stapGoed(w, p, k){
  const o = p.serie[p.idx], s = p.st[p.idx];
  if (s.stap !== k) return;
  s.stap = k + 1;
  if (s.stap >= o.stappen.length) s.klaar = true;
  SIM.stapGoed && SIM.stapGoed(o, k);
  if (s.klaar){
    const nietSter = p.serie.map((x, j) => [x, p.st[j]]).filter(([x]) => !x.ster);
    if (nietSter.every(([, y]) => y.klaar && !y.getoond)){
      STAAT.voortgang[w.id] = { klaar:true }; bewaar(STAAT.voortgang); renderNav();
    }
  }
  renderTekst();
}
function zetOpdrachtInSim(){

}

/* invoer netjes weergeven (sub- en superscript), zoals de tool het leest */
function mooi(invoer){
  const v = leesVgl(invoer);
  if (!v.fout) return vglHTML(v);
  const t = norm(invoer).replace(/[.*•⋅]/g, '·'), S = soorten();
  let uit = '', i = 0, naGroep = false;
  while (i < t.length){
    if (t.startsWith('->', i)){ uit += ' → '; i += 2; naGroep = false; continue; }
    const st = t.slice(i).match(/^\((s|l|g|aq)\)/);
    if (st && i > 0){ uit += st[0]; i += st[0].length; naGroep = false; continue; }
    const sp = S.find(x => t.startsWith(x, i));
    if (sp){ uit += spHTML(sp); i += sp.length; naGroep = false; continue; }
    const ch = t[i];
    if (/\d/.test(ch)){ const d = t.slice(i).match(/^\d+/)[0]; uit += naGroep ? '<sub>' + d + '</sub>' : d; i += d.length; naGroep = false; continue; }
    if (ch === ')'){ uit += ')'; i++; naGroep = true; continue; }
    if (ch === '+'){ uit += ' + '; i++; naGroep = false; continue; }
    const el = t.slice(i).match(/^[A-Z][a-z]?/);
    if (el){ uit += el[0]; i += el[0].length; naGroep = true; continue; }
    uit += ch.replace(/&/g, '&amp;').replace(/</g, '&lt;'); i++; naGroep = false;
  }
  return uit;
}

  const dt = Math.min(0.05, (t - tVorig) / 1000 || 0); tVorig = t;

}

const SIM1 = {

  },
  kies(kId, aId){ this.kat = ION[kId]; this.an = ION[aId]; $('#s1k').value = kId; $('#s1a').value = aId; this.leeg(); },
  leeg(){ this.ionen = []; this.toon = false; this.stat(); },
  slots(pos){
    const uit = [];
    for (let r = 0; r < 5; r++) for (let k = 0; k < 9; k++) if (((r + k) % 2 === 0) === pos) uit.push({ x: 300 + (k - 4) * 58, y: 165 + (r - 2) * 58 });
    return uit.sort((a, b) => Math.hypot(a.x - 300, (a.y - 165) * 1.25) - Math.hypot(b.x - 300, (b.y - 165) * 1.25));
  },
  voeg(ion){
    if (this.ionen.filter(i => i.ion.q * ion.q > 0).length >= 12) return;
    this.ionen.push({ ion, x: 300 + rnd(-200, 200), y: -30, t: 0 });
    this.toon = false; this.herschik(); this.stat();
  },
  herschik(){
    const sk = this.slots(true), sa = this.slots(false); let ik = 0, ia = 0;
    for (const i of this.ionen){ const s = i.ion.q > 0 ? sk[ik++] : sa[ia++]; i.tx = s.x; i.ty = s.y; }
  },
  stat(){
    const plus = this.ionen.filter(i => i.ion.q > 0).reduce((s, i) => s + i.ion.q, 0);
    const min = this.ionen.filter(i => i.ion.q < 0).reduce((s, i) => s - i.ion.q, 0);
    const vak = (n, cl, t) => Array.from({ length:n }, () => `<span class="q ${cl}">${t}</span>`).join('');
    $('#s1balk').innerHTML = `<div class="lijn"><span class="lab">positieve lading</span><div class="vak">${vak(plus, 'p', '+')}</div><b>${plus ? '+' + plus : '0'}</b></div>
      <div class="lijn"><span class="lab">negatieve lading</span><div class="vak">${vak(min, 'm', '−')}</div><b>${min ? '−' + min : '0'}</b></div>`;
    const nk = this.ionen.filter(i => i.ion.q > 0).length, na = this.ionen.length - nk;
    const uit = $('#s1uit');
    if (!this.ionen.length){ uit.innerHTML = 'Voeg ionen toe. Een zout is als geheel ongeladen: maak de positieve en negatieve lading even groot.'; return; }
    if (plus !== min || !nk || !na){ uit.innerHTML = `Totale lading: <b>${plus - min > 0 ? '+' : plus - min < 0 ? '−' : ''}${Math.abs(plus - min)}</b>. Dit is nog geen neutraal zout.`; return; }
    const g = ggd(nk, na), z = zout(this.kat, this.an);
    const geheim = this.geheim && this.geheim.has(z.f);
    let h = `<b>Neutraal.</b> ${nk} positieve en ${na} negatieve ionen: verhouding ${nk / g} : ${na / g}.`;
    if (geheim) h += `<div class="legenda">Dit zout hoort bij de opdracht. De formule zie je hier pas als je de opdracht hebt gedaan.</div>`;
    else if (this.toon) h += `<div style="margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px"><span>verhoudingsformule</span><span class="groot">${z.html}</span><span>ionnotatie</span><span class="groot">${z.ionHTML}</span><span>naam</span><span class="groot">${z.naam}</span></div>`;
    else h += ` <button class="btn klein" id="s1toon">Toon formule</button>`;
    uit.innerHTML = h;
    const b = $('#s1toon'); if (b) b.onclick = () => { this.toon = true; this.stat(); };
  },
  opdracht(o, st){ this.geheim = o && o.geheim && !(st && st.klaar) ? new Set(o.geheim) : null; this.stat(); },
  stapGoed(){ this.geheim = null; this.stat(); },
  update(dt){
    for (const i of this.ionen){ i.t += dt; const k = 1 - Math.pow(0.0008, dt); i.x = lerp(i.x, i.tx, k); i.y = lerp(i.y, i.ty, k); }
  },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    if (!this.ionen.length){ tekst(c, 'leeg ionrooster', 300, 165, { i:true, kleur:'#a8a294' }); return; }
    const tijd = performance.now() / 1000;
    const lijst = this.ionen.slice().sort((a, b) => a.ion.q - b.ion.q);
    for (const i of lijst){
      const tr = Math.sin(tijd * 7 + i.tx * 0.13) * 0.8;
      tekenIon(c, i.ion, i.x + tr, i.y + Math.cos(tijd * 6 + i.ty) * 0.8, ionStraal(i.ion) * 1.45);
    }
  }
};

const ZOUTEN_G = [['Ca','Cl'],['Na','Cl'],['K','Br'],['Mg','Cl'],['K','SO4'],['Na','CO3'],['NH4','SO4'],['Al','NO3'],['Na','PO4'],['Cu','SO4'],['Fe3','Cl'],['Ba','Cl'],['Zn','NO3']];

const BX = 150, BY = 70, BW = 300, BH = 290;   /* bekerglas */
const SIM2 = {
  init(host){
    this.z = zout(ION.Ca, ION.Cl); this.meter = false; this.geheim = null;
    host.innerHTML = `<div class="simkop"><b>Oplossen, indampen, smelten</b><span>deeltjesmodel</span></div>

      <div class="ctrl"><button class="btn" id="s2los">Los op in water</button><button class="btn" id="s2damp">Damp in</button><button class="btn" id="s2smelt">Verhit tot smelten</button><button class="btn g" id="s2koel">Laat afkoelen</button><button class="btn g" id="s2meter">Stroommeter: uit</button></div>

    this.c = maakCanvas($('#s2doek'), 600, 400);

    $('#s2los').onclick = () => this.oplossen();
    $('#s2damp').onclick = () => this.indampen();
    $('#s2smelt').onclick = () => this.smelten();
    $('#s2koel').onclick = () => this.afkoelen();
    $('#s2meter').onclick = () => { this.meter = !this.meter; $('#s2meter').textContent = 'Stroommeter: ' + (this.meter ? 'aan' : 'uit'); this.stat(); };
    this.zet('Ca', 'Cl');
  },
  zet(k, a){
    this.z = zout(ION[k], ION[a]); $('#s2z').value = k + '|' + a;
    const per = this.z.nk + this.z.na, nfu = Math.max(2, Math.min(5, Math.round(12 / per)));
    this.ionen = []; this.water = []; this.modus = 'vast'; this.fase = 'vast'; this.niveau = 0; this.temp = 0; this.klok = 0; this.weg = 0;
    const kat = [], an = [];

    const N = kat.length + an.length, kol = Math.min(6, Math.ceil(Math.sqrt(N * 1.4))), sp = 37;
    /* compact blok, van onder naar boven; posities slangsgewijs, typen verdeeld volgens de verhouding */

      const n = Math.min(kol, N - pos.length), rij = [];
      for (let q = 0; q < n; q++) rij.push({ x: 300 + (q - (n - 1) / 2) * sp + (r % 2 ? sp / 4 : -sp / 4) * (n === kol ? 1 : 0), y: BY + BH - 22 - r * sp * 0.92 });
      if (r % 2) rij.reverse(); pos.push(...rij);
    }
    let ik = 0, ia = 0;
    pos.forEach((p, k) => {
      const kat_ = Math.floor((k + 1) * kat.length / N) > Math.floor(k * kat.length / N);

  },
  oplossen(){
    if (this.modus !== 'vast') return;
    this.modus = 'oplossen'; this.klok = 0;
    this.water = Array.from({ length: Math.round(this.ionen.length * 5.5 + 26) }, () => ({ x: rnd(BX + 14, BX + BW - 14), y: rnd(BY + 60, BY + BH - 14), h: rnd(0, 6.28), vx: rnd(-20, 20), vy: rnd(-20, 20), a: 0, bind: null }));
    this.losVolgorde = this.ionen.slice().sort((a, b) => a.ly - b.ly || Math.abs(b.lx - 300) - Math.abs(a.lx - 300));

  },
  indampen(){ if (this.modus === 'opgelost' || this.modus === 'oplossen'){ this.modus = 'indampen'; this.klok = 0; this.stat(); } },
  smelten(){ if (this.modus === 'vast' && SMELTBAAR.has(this.z.f)){ this.modus = 'smelten'; this.klok = 0; this.stat(); } },
  afkoelen(){ if (this.modus === 'gesmolten' || this.modus === 'smelten'){ this.modus = 'afkoelen'; this.klok = 0; this.stat(); } },
  stroom(){ return this.meter && (this.modus === 'opgelost' || this.modus === 'gesmolten') ? 0.35 : 0; },
  stat(){
    const z = this.z, v = $('#s2vgl'), w = $('#s2w');
    const geheim = this.geheim && this.geheim.has(z.f);
    const vh = { vast: `${z.html}(s)`, gesmolten: `${z.html}(l)`, oplossen: `${z.html}(s) → …`, opgelost: vglHTML(oplosVgl(z)), indampen: vglHTML(indampVgl(z)), smelten: `${z.html}(s) → ${z.html}(l)`, afkoelen: `${z.html}(l) → ${z.html}(s)` }[this.modus];

    const toestand = { vast:'Vast zout: de ionen zitten vast in het ionrooster.', oplossen:'Het ionrooster valt uit elkaar. Watermoleculen omringen de ionen.', opgelost:'Een oplossing: de ionen zijn omringd door watermoleculen en kunnen vrij bewegen.',
      indampen:'Het water verdampt. De ionen vormen weer een ionrooster.', smelten:'Het zout wordt verhit. De ionen trillen steeds heftiger.', gesmolten:'Gesmolten zout: de ionen kunnen langs elkaar bewegen.', afkoelen:'Het zout koelt af en wordt weer vast.' }[this.modus];
    const meterTxt = this.meter ? (this.stroom() ? ' De stroommeter geeft een stroom aan.' : ' De stroommeter geeft geen stroom aan.') : '';
    w.innerHTML = toestand + meterTxt;

    $('#s2los').disabled = this.modus !== 'vast'; $('#s2smelt').disabled = this.modus !== 'vast' || !SMELTBAAR.has(z.f);
    if (this.modus === 'vast' && !SMELTBAAR.has(z.f)) w.innerHTML += ' <span style="color:#7a756b">Dit zout ontleedt bij verhitten voordat het smelt; kies een ander zout om te smelten.</span>';
    $('#s2koel').disabled = !(this.modus === 'gesmolten' || this.modus === 'smelten');
  },
  opdracht(o, st){ this.geheim = o && o.geheim && !(st && st.klaar) ? new Set(o.geheim) : null; this.stat(); },
  stapGoed(o){ const p = PER_WP.water; if (p && p.st[p.idx].klaar) this.geheim = null; this.stat(); },
  update(dt){
    this.klok += dt;
    const top = BY + BH - this.niveau;
    /* toestanden */
    if (this.modus === 'oplossen'){
      this.niveau = Math.min(250, this.niveau + 260 * dt);
      const n = Math.floor((this.klok - 0.7) / 0.2);
      this.losVolgorde.forEach((i, k) => { if (k <= n && !i.vrij){ i.vrij = true; i.vx = rnd(-60, 60); i.vy = rnd(-140, -70); this.hydrateer(i); } });

      for (const m of this.water) if (m.bind && !m.bind.vrij) m.bind = null;

    } else if (this.modus === 'afkoelen'){
      this.temp = Math.max(0, this.temp - dt / 1.6);

      if (i.vrij){
        i.vx += rnd(-1, 1) * 420 * dt; i.vy += rnd(-1, 1) * 420 * dt;
        if (I) i.vx += (i.ion.q > 0 ? -1 : 1) * 28 * dt;
        i.vx *= Math.pow(0.35, dt); i.vy *= Math.pow(0.35, dt);

        const m = i.r + 12;
        if (i.x < BX + m){ i.x = BX + m; i.vx = Math.abs(i.vx); } if (i.x > BX + BW - m){ i.x = BX + BW - m; i.vx = -Math.abs(i.vx); }
        if (i.y < yMin + 4){ i.y = yMin + 4; i.vy = Math.abs(i.vy); } if (i.y > BY + BH - m){ i.y = BY + BH - m; i.vy = -Math.abs(i.vy); }

      }
    }
    /* ionen botsen niet door elkaar heen (eenvoudig afstoten) */
    for (let a = 0; a < this.ionen.length; a++) for (let b = a + 1; b < this.ionen.length; b++){

  hydrateer(i){

  }

        goed: () => chipOpt.map((x, j) => ionen.includes(x.id) ? j : -1).filter(j => j >= 0), antwoord: () => ionen.map(i => ionHTML(ION[i]) + '(aq)').join(' + '), hint:'Welke ionen zitten in het zout van oplossing A, en welke in het zout van oplossing B?' };
      const kand = [[p.A[0], p.B[1]], [p.B[0], p.A[1]], p.A, p.B];
      const kOpt = schud(kand).map(q => ({ html: zoutVan(q).html + ' (' + zoutVan(q).naam + ')', p:q })).concat([{ html:'Er ontstaat geen neerslag.', p:null }]);
      const stap2 = { type:'keuze', meer:true, vr:'Welk zout slaat neer? Gebruik tabel 45A. Kies alles wat van toepassing is.', opties: kOpt,
        check: v => { if (!v.length) return { ok:false, msg:'Kies een antwoord.' };
          const sel = v.map(j => kOpt[j].p);
          const goed = neerP ? sel.length === 1 && sel[0] && sel[0].join() === neerP.join() : sel.length === 1 && sel[0] === null;
          if (goed) return { ok:true, msg: 'Goed voorspeld! Controleer je voorspelling met de proef: klik rechts op <b>Meng</b>.' };
          if (sel.some(q => q && (q.join() === p.A.join() || q.join() === p.B.join()))) return { ok:false, msg:'Die zouten zaten al opgelost in de oplossingen waarmee je begon. Kijk naar de nieuwe combinaties.' };
          if (sel.includes(null) && sel.length > 1) return { ok:false, msg:'Je antwoord spreekt zichzelf tegen.' };
          return { ok:false, msg:'Nog niet goed. Zoek beide nieuwe combinaties op in tabel 45A.' }; },
        goed: () => [kOpt.findIndex(x => neerP ? x.p && x.p.join() === neerP.join() : x.p === null)], antwoord: () => neerP ? zoutVan(neerP).html + ' slaat neer' : 'Er ontstaat geen neerslag.', hint:'Er zijn twee nieuwe combinaties: het positieve ion van A met het negatieve ion van B, en andersom.' };
      const o = { titel: neerP ? 'Neerslagreactie' : 'Neerslag of niet?', mengsel:[p.A, p.B], neerP,
        vraag:`Je mengt een <b>${zA.naam}</b>-oplossing met een <b>${zB.naam}</b>-oplossing.`, stappen:[stap1, stap2] };
      if (neerP){
        const z = zoutVan(neerP), verw = neerVgl(z);
        const trib = ionen.filter(i => i !== neerP[0] && i !== neerP[1]).map(i => ionTyp(ION[i]));
        o.stappen.push({ type:'tekst', vr:'Geef de vergelijking van de neerslagreactie.', ph:'vergelijking met toestandsaanduidingen', check: v => checkVgl(v, verw, { tribune: trib }), goed: () => vglTyp(verw), antwoord: () => vglHTML(verw),
          hint:'Voor de pijl alleen de ionen die het neergeslagen zout vormen, in de verhouding van de formule. Na de pijl het zout met (s).' });
      }
      return o;
    });
    /* ★ zelf een zout maken */
    const doel = kies([['Ba','SO4'],['Pb','I'],['Ca','CO3'],['Cu','OH'],['Zn','PO4'],['Fe3','OH'],['Mg','PO4']]);
    const zd = zoutVan(doel);
    const keuzes = schud([['Na','Cl'],['Na','OH'],['Na','SO4'],['Na','CO3'],['Na','PO4'],['K','I'],['Ba','NO3'],['Pb','NO3'],['Ca','NO3'],['Cu','NO3'],['Zn','NO3'],['Fe3','NO3'],['Mg','NO3'],['Ba','Cl'],['Cu','SO4']]);
    const maak = { titel:'Zelf een neerslag maken', ster:true, vraag:`Je wilt vast <b>${zd.naam}</b> (${zd.html}) maken door twee oplossingen te mengen. Er mag geen ander zout neerslaan. Welke twee oplossingen gebruik je?`,
      stappen:[{ type:'selects', vr:'Kies twee oplossingen:', selects:[0, 1].map(j => ({ lab: j ? 'en' : 'Meng', opties: keuzes.map(q => ({ v:q.join('|'), t: zoutVan(q).naam + '-oplossing' })) })),
        check: v => { if (!v[0] || !v[1]) return { ok:false, msg:'Kies twee oplossingen.' };
          const A = v[0].split('|'), B = v[1].split('|');
          if (A.join() === B.join()) return { ok:false, msg:'Kies twee verschillende oplossingen.' };
          const a = mengAnalyse(A, B); const heeft = a.neer.some(q => q.join() === doel.join());
          if (!heeft) return { ok:false, msg:'Met deze twee oplossingen ontstaat geen ' + zd.naam + '. Welk ion moet uit welke oplossing komen?' };
          if (a.neer.length > 1 || a.matig.length || a.raar) return { ok:false, msg:'Er ontstaat wel ' + zd.naam + ', maar er slaat (of reageert) ook nog iets anders. Kies oplossingen met ionen die verder niet neerslaan, zoals natrium- of nitraationen.' };
          return { ok:true, msg:'Goed: de andere ionen blijven als tribune-ionen in de oplossing.' }; },
        goed: () => { for (const A of keuzes) for (const B of keuzes){ const a = mengAnalyse(A, B); if (A.join() !== B.join() && a.neer.length === 1 && a.neer[0].join() === doel.join() && !a.matig.length && !a.raar) return [A.join('|'), B.join('|')]; } return null; }, antwoord: () => { const Ap = keuzes.find(q => q[0] === doel[0] && opl(q[0], q[1]) === 'g' && ['NO3','Cl','SO4'].includes(q[1])), Bp = keuzes.find(q => q[1] === doel[1] && ['Na','K'].includes(q[0]));
          return (Ap && Bp) ? zoutVan(Ap).naam + '-oplossing en ' + zoutVan(Bp).naam + '-oplossing (bijvoorbeeld)' : 'een oplossing met ' + ionHTML(ION[doel[0]]) + ' en een oplossing met ' + ionHTML(ION[doel[1]]); },
        hint:'Je hebt een oplossing nodig met het positieve ion en een oplossing met het negatieve ion. Natrium- en nitraationen slaan nooit neer.' }] };
    /* ★ tribune-ionen */
    const tp = metNeer.find(p => !gekozen.includes(p)) || metNeer[0];
    const tIonen = [tp.A[0], tp.A[1], tp.B[0], tp.B[1]], tNeer = tp.a.neer[0], tGoed = tIonen.filter(i => i !== tNeer[0] && i !== tNeer[1]);
    const tOpt = schud(tIonen).map(id => ({ html: ionHTML(ION[id]) + '(aq)', id })).concat([{ html:'geen ionen', id:'geen' }]);
    const trib = { titel:'Tribune-ionen', ster:true, vraag:`Je mengt een <b>${zoutVan(tp.A).naam}</b>-oplossing met een <b>${zoutVan(tp.B).naam}</b>-oplossing. Neem aan dat de ionen die reageren precies in de juiste verhouding aanwezig zijn. Welke ionen zitten na afloop nog in de oplossing?`,
      stappen:[{ type:'chips', vr:'Klik de ionen aan:', opties:tOpt, check: v => { const s = new Set(v.map(j => tOpt[j].id));
        if (s.size === 2 && tGoed.every(i => s.has(i))) return { ok:true, msg:'Goed: dit zijn de tribune-ionen.' };
        return { ok:false, msg:'Nog niet goed. Welk zout slaat neer? De ionen daarvan zijn uit de oplossing verdwenen.' }; },
        goed: () => tOpt.map((x, j) => tGoed.includes(x.id) ? j : -1).filter(j => j >= 0), antwoord: () => tGoed.map(i => ionHTML(ION[i]) + '(aq)').join(' + '), hint:'Bepaal eerst welk zout neerslaat.' }] };
    return opdr.concat([maak, trib]);
  }
});

/* =====================================================================
   Werkplaats ★ — Onbekende oplossing
   ===================================================================== */
const REAG_AN = [['Na','Cl'],['Na','I'],['Na','OH'],['Na','SO4'],['Na','CO3'],['Na','S'],['Na','PO4']];      /* tonen het positieve ion aan */
const REAG_KAT = [['Ag','NO3'],['Ba','NO3'],['Pb','NO3'],['Ca','NO3'],['Mg','NO3'],['Cu','NO3']];          /* tonen het negatieve ion aan */
function testUitkomst(onb, reag){
  /* nieuwe combinaties: positief ion van het reagens met negatief ion van de onbekende, en andersom */
  const combos = [[reag[0], onb[1]], [onb[0], reag[1]]].filter(p => !(p[0] === onb[0] && p[1] === onb[1]) && !(p[0] === reag[0] && p[1] === reag[1]));
  for (const p of combos){
    const l = opl(...p);
    if (l === 's') return { soort:'s', p, txt: neerKleurNaam(...p) + ' neerslag', kleur: neerKleur(...p) };
    if (l === 'r' || l === 'i') return { soort:l, p, txt: l === 'r' ? 'reageert met water (r)' : 'instabiel (i): er ontstaat een bruinachtige neerslag', kleur:'#9b8a6a' };
  }
  for (const p of combos) if (opl(...p) === 'm') return { soort:'m', p, txt:'lichte troebeling', kleur: neerKleur(...p) };
  return { soort:'g', txt:'geen neerslag' };
}
const kleurKlasse = t => t.replace('gebroken wit', 'wit').replace('grijsgroen', 'groen');
function sigKat(id){ return (ION[id].opl || '-') + REAG_AN.map(r => kleurKlasse(testUitkomst([id, 'NO3'], r).txt)).join('|'); }
function sigAn(id){ return REAG_KAT.map(r => kleurKlasse(testUitkomst(['Na', id], r).txt)).join('|'); }
const KAT_HERKENBAAR = KAT.filter(k => KAT.filter(j => sigKat(j.id) === sigKat(k.id)).length === 1).map(k => k.id);
const AN_HERKENBAAR = AN.filter(a => AN.filter(j => sigAn(j.id) === sigAn(a.id)).length === 1).map(a => a.id);

const SIM4 = {
  init(host){
    this.onb = ['Ba','I']; this.buizen = [];
    host.innerHTML = `<div class="simkop"><b>Reageerbuizenrek</b><span>druppel een reagens bij de onbekende oplossing</span></div>
      <div class="ctrl"><label>Reagens <select class="sel" id="s4r">
        <optgroup label="Natriumzouten (tonen het positieve ion aan)">${REAG_AN.map(p => `<option value="${p.join('|')}">${zoutVan(p).naam}-oplossing</option>`).join('')}</optgroup>
        <optgroup label="Nitraten (tonen het negatieve ion aan)">${REAG_KAT.map(p => `<option value="${p.join('|')}">${zoutVan(p).naam}-oplossing</option>`).join('')}</optgroup></select></label>
        <button class="btn" id="s4test">Test in een nieuwe buis</button><button class="btn g" id="s4leeg">Rek leegmaken</button></div>
      <div class="doek" id="s4doek"></div>
      <div class="buislog" id="s4log"></div>
      <div id="s4tab"></div>`;
    this.c = maakCanvas($('#s4doek'), 600, 300);
    $('#s4test').onclick = () => this.test($('#s4r').value.split('|'));
    $('#s4leeg').onclick = () => { this.buizen = []; this.stat(); };
    $('#s4tab').innerHTML = tabel45(null);
    this.stat();
  },
  zetOnbekend(p){ this.onb = p; this.buizen = []; this.stat(); },
  test(reag){
    if (this.buizen.length >= 8){ this.buizen.shift(); }
    this.buizen.push({ reag, u: testUitkomst(this.onb, reag), t: 0 });
    this.stat();
  },
  stat(){
    $('#s4log').innerHTML = this.buizen.map((b, i) => `<div><b>${i + 1}. ${zoutVan(b.reag).naam}</b>${b.u.txt}</div>`).join('') || '<div style="grid-column:1/-1;color:#7a756b">Nog geen tests gedaan.</div>';
  },
  opdracht(o){ if (o && o.onbekend){ if (this.onb.join() !== o.onbekend.join()) this.zetOnbekend(o.onbekend); } },
  update(dt){ for (const b of this.buizen) b.t += dt; },
  draw(){
    const c = this.c; c.clearRect(0, 0, c.W, c.H);
    /* voorraadfles */
    const tint = ION[this.onb[0]].opl || 'rgba(120,175,225,.16)';
    c.save(); c.strokeStyle = '#7d8a96'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(48, 70); c.lineTo(48, 110); c.lineTo(18, 160); c.lineTo(18, 250); c.quadraticCurveTo(18, 262, 30, 262); c.lineTo(102, 262); c.quadraticCurveTo(114, 262, 114, 250); c.lineTo(114, 160); c.lineTo(84, 110); c.lineTo(84, 70); c.stroke();
    c.fillStyle = tint; c.beginPath(); c.moveTo(20, 175); c.lineTo(112, 175); c.lineTo(112, 250); c.quadraticCurveTo(112, 260, 102, 260); c.lineTo(30, 260); c.quadraticCurveTo(20, 260, 20, 250); c.closePath(); c.fill();
    c.restore();
    tekst(c, 'onbekende', 66, 278, { i:true, px:12 }); tekst(c, 'oplossing', 66, 292, { i:true, px:12 });
    tekst(c, '?', 66, 215, { px:30, serif:true, kleur:'#5d6670' });
    /* rek */
    c.fillStyle = '#c9b48f'; c.fillRect(140, 222, 450, 12); c.fillRect(150, 234, 10, 46); c.fillRect(570, 234, 10, 46);
    for (let i = 0; i < 8; i++){
      const x = 170 + i * 52, y = 40, w = 26, h = 210;
      const b = this.buizen[i];
      if (b){
        const vul = 95;
        c.save(); c.beginPath(); c.moveTo(x, y + h - vul); c.lineTo(x + w, y + h - vul); c.lineTo(x + w, y + h - w / 2); c.arc(x + w / 2, y + h - w / 2, w / 2, 0, Math.PI); c.closePath();
        c.fillStyle = tint; c.fill(); c.clip();
        if (b.u.soort !== 'g'){
          const a = Math.min(1, b.t / 1.2), zak = Math.min(1, b.t / 4);
          c.globalAlpha = (b.u.soort === 'm' ? 0.3 : 0.75) * a * (1 - zak * 0.7); c.fillStyle = b.u.kleur; c.fillRect(x, y + h - vul, w, vul);
          c.globalAlpha = a; c.fillStyle = b.u.kleur;
          const dikte = (b.u.soort === 'm' ? 6 : 26) * zak;
          c.fillRect(x, y + h - dikte - 4, w, dikte + 4);
          c.globalAlpha = a * 0.5; c.fillStyle = 'rgba(60,50,40,.35)';
          for (let k = 0; k < 14; k++){ c.beginPath(); c.arc(x + 3 + ((k * 7) % (w - 6)), y + h - 4 - ((k * 13) % Math.max(4, dikte)), 1.3, 0, Math.PI * 2); c.fill(); }
          c.globalAlpha = a; c.strokeStyle = 'rgba(60,50,40,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y + h - dikte - 4); c.lineTo(x + w, y + h - dikte - 4); c.stroke();
        }
        c.restore();
        /* druppel */
        if (b.t < 0.7){ c.fillStyle = 'rgba(120,175,225,.8)'; c.beginPath(); c.arc(x + w / 2, y - 8 + b.t * 120, 3.5, 0, Math.PI * 2); c.fill(); }
        tekst(c, String(i + 1), x + w / 2, y - 14, { px:12, vet:true, kleur:'#2b2a27' });
      }
      c.save(); c.strokeStyle = '#7d8a96'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + h - w / 2); c.arc(x + w / 2, y + h - w / 2, w / 2, Math.PI, 0, true); c.lineTo(x + w, y); c.stroke(); c.restore();
    }
  }
};

WPS.push({
  id:'onbekend', titel:'Onbekende oplossing', par:'verdieping', ster:true, sim: SIM4,
  uitleg: () => `
    <p>Met neerslagreacties kun je ionen <b>aantonen</b>. Je voegt een reagens toe en neemt waar of er een neerslag ontstaat, en welke kleur die heeft.</p>
    <ul><li>Om het <b>positieve ion</b> aan te tonen gebruik je oplossingen van <b>natriumzouten</b>. Natriumionen slaan nooit neer, dus een neerslag komt door het negatieve ion van het reagens en het positieve ion van de onbekende oplossing.</li>
    <li>Om het <b>negatieve ion</b> aan te tonen gebruik je oplossingen van <b>nitraten</b>. Nitraationen slaan nooit neer.</li></ul>
    <p>Elke waarneming sluit ionen uit, of laat er een paar over. Combineer de waarnemingen met tabel 45A tot er één mogelijkheid over is. Let ook op de kleur van de oplossing en van de neerslag.</p>`,
  voorbeeld: {
    vraag: 'Een kleurloze oplossing bevat één opgelost zout. Bepaal welke ionen erin zitten.',
    stappen: [
      'Kleurloos: koper(II)ionen en ijzerionen vallen af (die geven een gekleurde oplossing).',
      `Natriumsulfaat-oplossing: <b>witte neerslag</b>. Volgens tabel 45A is het sulfaat slecht oplosbaar van ${ionHTML(ION.Ba)} en ${ionHTML(ION.Pb)}.`,
      `Natriumhydroxide-oplossing: <b>geen neerslag</b>. Loodhydroxide is s, dus ${ionHTML(ION.Pb)} valt af. Het positieve ion is ${ionHTML(ION.Ba)}.`,
      `Zilvernitraat-oplossing: <b>lichtgele neerslag</b>, en lood(II)nitraat-oplossing: <b>gele neerslag</b>. Het negatieve ion moet met ${ionHTML(ION.Ba)} een goed oplosbaar zout vormen (het zout is opgelost): ${ionHTML(ION.Cl)}, ${ionHTML(ION.Br)}, ${ionHTML(ION.I)}, ${ionHTML(ION.OH)} of ${ionHTML(ION.NO3)}. Daarvan is alleen ${ionHTML(ION.I)} slecht oplosbaar met zowel ${ionHTML(ION.Ag)} als ${ionHTML(ION.Pb)}. Conclusie: een bariumjodide-oplossing.`
    ],
    bijStap(n){
      if (n === 1) SIM4.zetOnbekend(['Ba','I']);
      if (n === 2) SIM4.test(['Na','SO4']);
      if (n === 3) SIM4.test(['Na','OH']);
      if (n === 4){ SIM4.test(['Ag','NO3']); SIM4.test(['Pb','NO3']); }
    }
  },
  maakSerie(){
    const gezien = new Set(['Ba,I']), uit = [];
    let pogingen = 0;
    while (uit.length < 3 && pogingen++ < 500){
      const k = kies(KAT_HERKENBAAR), a = kies(AN_HERKENBAAR);
      if (opl(k, a) !== 'g' || gezien.has(k + ',' + a) || uit.some(o => o.onbekend[0] === k || o.onbekend[1] === a)) continue;
      gezien.add(k + ',' + a);
      const p = [k, a];
      uit.push({ titel:'Onbekende oplossing', onbekend:p, vraag:`In de onbekende oplossing (rechts) is één zout opgelost. Doe tests in het reageerbuizenrek en bepaal welke ionen erin zitten.`,
        stappen:[{ type:'selects', vr:'Welke ionen bevat de oplossing?', selects:[
            { lab:'positief ion', opties: KAT.map(i => ({ v:i.id, t: ionUni(i) + ' (' + i.naam + ')' })) },
            { lab:'negatief ion', opties: AN.map(i => ({ v:i.id, t: ionUni(i) + ' (' + i.naam + ')' })) }],
          check: v => { if (!v[0] || !v[1]) return { ok:false, msg:'Kies een positief en een negatief ion.' };
            const gk = v[0] === k, ga = v[1] === a;
            if (gk && ga) return { ok:true, msg:`Goed: een ${zoutVan(p).naam}-oplossing.` };
            if (gk) return { ok:false, msg:'Het positieve ion klopt, het negatieve ion nog niet. Heb je genoeg nitraten getest?' };
            if (ga) return { ok:false, msg:'Het negatieve ion klopt, het positieve ion nog niet. Heb je genoeg natriumzouten getest?' };
            return { ok:false, msg:'Allebei nog niet goed. Controleer je waarnemingen met tabel 45A.' }; },
          goed: () => [k, a], antwoord: () => `${ionHTML(ION[k])} en ${ionHTML(ION[a])} (${zoutVan(p).naam})`, hint:'Begin met de natriumzouten voor het positieve ion. Noteer bij elke test welke ionen afvallen.' }] });
    }
    return uit;
  }
});
