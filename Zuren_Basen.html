<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zuren en basen rekenen</title>
<style>
:root{
  --papier:#f3efe6; --vel:#fffdf8; --rand:#e3dccb; --rand2:#d6cdb8;
  --inkt:#2b2a27; --inkt2:#3e3b35; --grijs:#7a756b; --goud:#a0701f; --goud2:#e2a84b;
  --nacht:#24323f; --nacht2:#33475a; --nachttekst:#cfd9e2;
  --goed:#3f8f63; --goedbg:#e5f2ea; --fout:#b4473a; --foutbg:#f8e6e2; --hint:#fbf1da;
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--inkt);font-size:15px;line-height:1.6}
button{font-family:inherit}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:var(--nacht);color:var(--nachttekst);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
aside h1{font-family:var(--serif);font-size:23px;color:#fff;font-weight:600;line-height:1.2}
aside .sub{font-size:12.5px;color:#8aa0b3;margin:4px 0 18px}
.lijn{display:flex;gap:4px;background:#1b2731;border-radius:10px;padding:4px;margin-bottom:18px}
.lijn button{flex:1;border:0;border-radius:7px;padding:7px 6px;font-size:13.5px;font-weight:700;background:transparent;color:#9fb2c3;cursor:pointer}
.lijn button.on{background:var(--goud2);color:var(--nacht)}
aside nav a{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:9px;font-size:14.5px;margin-bottom:4px;color:#b9c7d3;cursor:pointer;user-select:none;line-height:1.3}
aside nav a:hover{background:#2c3d4d}
aside nav a i{font-style:normal;flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #5d7387;font-size:12.5px;font-weight:700}
aside nav a.on{background:var(--nacht2);color:#fff}
aside nav a.on i{background:var(--goud2);border-color:var(--goud2);color:var(--nacht)}
aside nav a.klaar i{background:#5aa37c;border-color:#5aa37c;color:#fff}
aside nav a small{display:block;font-size:11.5px;color:#8aa0b3}
aside .voet{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:8px}
aside .voet button{background:transparent;border:1px solid #4b6074;color:#cfd9e2;border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;text-align:left}
aside .voet button:hover{background:#2c3d4d}
.wp{display:grid;grid-template-columns:minmax(380px,1fr) minmax(520px,680px);min-height:100vh}
.tekst{padding:34px 38px 60px;max-width:780px}
.kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--goud);font-weight:700}
.tekst h2{font-family:var(--serif);font-size:31px;margin:3px 0 14px;font-weight:600;line-height:1.2}
.tekst h3{font-family:var(--serif);font-size:19px;margin:20px 0 6px;font-weight:600}
.tekst p{margin-bottom:10px;color:var(--inkt2)}
.tekst ul,.tekst ol{margin:0 0 10px 20px;color:var(--inkt2)}
.tekst li{margin-bottom:3px}
.kader{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--goud2);border-radius:8px;padding:10px 14px;margin:10px 0 12px;color:var(--inkt2)}
.kader.proces{border-left-color:#5d7387}
.vgl{font-family:var(--serif);font-size:17px;margin-top:6px;color:var(--inkt)}
.tabs{display:flex;gap:4px;margin:20px 0 14px;border-bottom:1px solid var(--rand2)}
.tabs button{background:none;border:0;padding:9px 14px;font-size:14px;font-weight:600;color:var(--grijs);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--inkt);border-bottom-color:var(--goud2)}
.tabs .tel{font-weight:500;font-size:12px;color:var(--grijs);margin-left:4px}
.vb{background:var(--vel);border:1px solid var(--rand);border-radius:12px;padding:16px 18px;margin:4px 0 14px}
.vb .vbkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--goud);margin-bottom:4px}
.vb .vbvraag{font-weight:600;margin-bottom:8px}
.vbstap{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--rand2)}
.vbstap .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.vbstap .b{color:var(--inkt2)}
.oknop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.oknop .dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rand2);background:var(--vel);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--grijs);cursor:pointer}
.oknop .dot.on{border-color:var(--inkt);color:var(--inkt);box-shadow:0 0 0 2px var(--inkt) inset}
.oknop .dot.goed{background:var(--goed);border-color:var(--goed);color:#fff}
.oknop .dot.ster{border-style:dashed}
.oknop .rechts{margin-left:auto;font-size:13px;color:var(--grijs)}
.opdkop{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;color:var(--grijs);margin-bottom:4px}
.opdkop .st{color:var(--goud)}
.stap{display:flex;gap:12px;padding:13px 15px;background:var(--vel);border:1px solid var(--rand);border-radius:11px;margin-bottom:10px}
.stap>.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--inkt);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px}
.stap.dicht{opacity:.42}
.stap.dicht .inv{display:none}
.stap.goed{border-color:#bcdcc8;background:#fbfefc}
.stap.goed>.n{background:var(--goed)}
.stap .inh{flex:1;min-width:0}
.stap .vr{margin-bottom:8px}
.rij{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.in{font-family:var(--mono);font-size:15px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;background:#fff;min-width:0;width:220px;color:var(--inkt)}
input.in:focus,textarea.in:focus,select.sel:focus{outline:2px solid var(--goud2);outline-offset:0;border-color:var(--goud2)}
textarea.in{font-family:var(--sans);font-size:14.5px;border:1px solid var(--rand2);border-radius:8px;padding:8px 10px;width:100%;min-height:74px;background:#fff;color:var(--inkt)}
select.sel{border:1px solid var(--rand2);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--inkt);font-family:inherit}
.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:14px;cursor:pointer;background:var(--inkt);color:#fff}
.btn:hover{background:#45433e}
.btn.g{background:#ebe4d4;color:var(--inkt)}
.btn.g:hover{background:#e0d7c3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.klein{padding:5px 11px;font-size:13px}
.fb{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:14px}
.fb.goed{background:var(--goedbg);color:#255c3d}
.fb.fout{background:var(--foutbg);color:#7c2c22}
.fb.hint{background:var(--hint);color:#6b4d12}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.chip{border:1.5px solid var(--rand2);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;user-select:none;color:var(--inkt)}
.chip:hover{border-color:#b9ad93}
.chip.aan{background:var(--nacht);border-color:var(--nacht);color:#fff}
.chip.x{padding:3px 6px 3px 12px}
.chip.x b{margin-left:6px;font-weight:700;color:var(--grijs)}
.opties{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.optie{border:1.5px solid var(--rand2);background:#fff;border-radius:9px;padding:8px 12px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--inkt)}
.optie:hover{border-color:#b9ad93}
.optie.aan{border-color:var(--nacht);background:#eef2f6}
.model{background:var(--hint);border-radius:8px;padding:8px 11px;font-size:14px;color:#5b4210;margin-top:8px}
.model b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.klaarbanner{background:var(--goedbg);border:1px solid #bcdcc8;color:#255c3d;border-radius:11px;padding:12px 15px;margin:4px 0 12px}
.uitw{background:#fff;border:1px solid var(--rand);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:14.5px;color:var(--inkt2)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.simkol{background:var(--vel);border-left:1px solid var(--rand);padding:22px 22px 30px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.simkop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.simkop b{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--goud)}
.simkop span{font-size:12.5px;color:var(--grijs)}
.doek{border:1px solid var(--rand);border-radius:12px;background:#fbf8f1;overflow:hidden}
.doek svg{display:block;width:100%;height:auto}
.legenda{font-size:12.5px;color:var(--grijs);line-height:1.5}
.bouw{display:grid;gap:10px}
.bouw .vak{background:var(--vel);border:1px solid var(--rand);border-radius:11px;padding:12px 14px}
.bouw h4{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--grijs);margin-bottom:8px}
.strlijst{list-style:none;margin:0!important}
.strlijst li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--rand2);font-size:14px}
.strlijst li:first-child{border-top:0}
.nr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--inkt);font-size:12px;font-weight:700;margin-right:6px;flex:none}
.stroomkeuze{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.stroomkeuze button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rand2);background:#fff;font-weight:700;cursor:pointer;color:var(--inkt)}
.stroomkeuze button.on{background:var(--goud2);border-color:var(--goud2)}
.stroomkeuze button.goed{border-color:var(--goed);color:var(--goed)}
.stroomkeuze button.fout{border-color:var(--fout);color:var(--fout)}
body.beamer .wp{zoom:1.25}
@media (max-width:1100px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.wp{grid-template-columns:1fr}.simkol{position:static;height:auto;border-left:0;border-top:1px solid var(--rand)}.tekst{padding:24px 20px 30px}}
@media (prefers-reduced-motion:no-preference){.nieuw{animation:verschijn .6s ease-out}@keyframes verschijn{from{opacity:0}to{opacity:1}}}

.ld{background:var(--vel);border:1px solid var(--rand);border-left:4px solid var(--nacht);border-radius:8px;padding:9px 14px;margin:0 0 12px;color:var(--inkt2)}
.ld b{display:block;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--nacht);margin-bottom:2px}
table.boe{border-collapse:collapse;font-size:15px;background:#fff;margin:6px 0}
table.boe th,table.boe td{border:1px solid var(--rand2);padding:5px 9px;text-align:center;min-width:64px}
table.boe th{background:#f3ead6;font-weight:600}
table.boe td.rl{font-weight:700;background:#faf6ec;min-width:30px}
table.boe input{width:78px;font-family:var(--mono);font-size:14px;border:1px solid var(--rand2);border-radius:6px;padding:4px 6px;text-align:center}
table.boe td.ok{background:var(--goedbg)}table.boe td.leeg{color:var(--grijs)}
.formules{font-family:var(--serif);font-size:16.5px;line-height:1.9}
.phbalk{position:relative;height:30px;border-radius:8px;background:linear-gradient(90deg,#d9473f,#e98a3a,#e9c53a,#9cc95a,#3f8f63,#3b8fb0,#3b5fb0,#6a4fb0);margin:8px 0 22px}
.phbalk .tk{position:absolute;top:32px;font-size:11px;color:var(--grijs);transform:translateX(-50%)}
.phbalk .mk{position:absolute;top:-6px;width:4px;height:42px;background:#24323f;border-radius:2px;transform:translateX(-50%)}
.phbalk .mk span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;color:#24323f}
.mmol{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.mmol .bar{height:16px;border-radius:4px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Zuren en basen</h1>
    <div class="sub">Rekenen aan pH · 5V en 6V</div>
    <nav id="nav"></nav>
    <div class="voet">
      <button data-a="vrij">Vrij oefenen (generator)</button>
      <button data-a="beamer">Beamerstand</button>
      <button data-a="wis">Voortgang wissen</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
{
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const ML='mol L<sup>−1</sup>';
const g=(v,a,o)=>Object.assign({t:'getal',v,a},o||{});
const k=(v,o,a,h)=>({t:'keuze',v,o,a,h});
const HAC={kol:['HA','A⁻','H₃O⁺'],vgl:'HA + H₂O ⇌ A⁻ + H₃O⁺'};
const WP=[
{k:'pH en [H₃O⁺]',t:'pH en [H₃O⁺] van een sterk zuur',kl:'5V',
 ld:'Je kunt de pH berekenen uit [H₃O⁺] en omgekeerd, in het juiste aantal significante cijfers, ook voor een oplossing van een sterk zuur.',
 uitleg:`<div class="kader formules">pH = −log [H₃O⁺]<br>[H₃O⁺] = 10<sup>−pH</sup></div>
 <div class="kader"><ul style="margin-bottom:0"><li><b>Significantie:</b> het aantal decimalen van de pH is gelijk aan het aantal significante cijfers van [H₃O⁺]. [H₃O⁺] = 2,5·10<sup>−3</sup> (2 significante cijfers) geeft pH = 2,60 (2 decimalen).</li><li>Een <b>sterk zuur</b>, zoals HCl of HNO₃, reageert volledig met water. Bij 0,010 mol L<sup>−1</sup> HCl is [H₃O⁺] dus ook 0,010 mol L<sup>−1</sup>.</li></ul></div>`,
 vb:{v:'Bereken de pH van een oplossing met [H₃O⁺] = 2,5·10<sup>−3</sup> mol L<sup>−1</sup>.',s:['pH = −log (2,5·10<sup>−3</sup>) = 2,602…','[H₃O⁺] heeft 2 significante cijfers, dus de pH krijgt 2 decimalen.','pH = <b>2,60</b>']},
 opdr:[{naam:'Van [H₃O⁺] naar pH',intro:`In een oplossing is [H₃O⁺] = 4,0·10<sup>−4</sup> ${ML}.`,ph:3.40,steps:[g('Bereken de pH. Noteer je antwoord in het juiste aantal significante cijfers.',3.398,{abs:.006,dec:2,w:'pH = −log (4,0·10<sup>−4</sup>) = 3,40 (2 significante cijfers → 2 decimalen)'})]},
  {naam:'Van pH naar [H₃O⁺]',intro:'Een oplossing heeft pH = 2,35.',ph:2.35,steps:[g('Bereken [H₃O⁺]. Noteer je antwoord in het juiste aantal significante cijfers.',4.467e-3,{u:ML,sig:2,w:'[H₃O⁺] = 10<sup>−2,35</sup> = 4,5·10<sup>−3</sup> mol L<sup>−1</sup> (2 decimalen → 2 significante cijfers)'})]},
  {naam:'Zoutzuur',intro:`Een leerling heeft 0,020 ${ML} zoutzuur.`,ph:1.70,steps:[g('Geef [H₃O⁺] in deze oplossing.',0.020,{u:ML,h:'HCl is een sterk zuur: het reageert volledig met water.',w:'HCl + H₂O → H₃O⁺ + Cl⁻, volledig: [H₃O⁺] = 0,020 mol L<sup>−1</sup>'}),g('Bereken de pH. Noteer je antwoord in het juiste aantal significante cijfers.',1.699,{abs:.006,dec:2,w:'pH = −log 0,020 = 1,70'})]},
  {naam:'Salpeterzuur',intro:`Bereken de pH van 0,0050 ${ML} salpeterzuur (HNO₃, een sterk zuur).`,ph:2.30,steps:[g('pH =',2.301,{abs:.006,dec:2,w:'[H₃O⁺] = 0,0050 mol L<sup>−1</sup>; pH = −log 0,0050 = 2,30'})]},
  {naam:'Negatieve pH',ster:1,intro:'Geconcentreerd zoutzuur kan een negatieve pH hebben. Een oplossing heeft pH = −0,30.',ph:-0.3,steps:[g('Bereken [H₃O⁺].',1.995,{u:ML,sig:2,w:'[H₃O⁺] = 10<sup>0,30</sup> = 2,0 mol L<sup>−1</sup>'})]}]},
{k:'pOH en sterke basen',t:'pOH en sterke basen',kl:'5V',
 ld:'Je kunt met pOH en pH + pOH = 14,00 de pH berekenen van een oplossing van een sterke base, en omgekeerd.',
 uitleg:`<div class="kader formules">pOH = −log [OH⁻]<br>[OH⁻] = 10<sup>−pOH</sup><br>pH + pOH = 14,00 (bij 298 K)</div>
 <div class="kader"><ul style="margin-bottom:0"><li>Een <b>sterke base</b>, zoals NaOH of KOH, splitst volledig in ionen. Bij 0,010 mol L<sup>−1</sup> NaOH is [OH⁻] = 0,010 mol L<sup>−1</sup>.</li><li>Let op de formule: Ba(OH)₂ levert per formule-eenheid <b>twee</b> OH⁻-ionen.</li><li>Voor pOH geldt dezelfde significantieregel als voor pH.</li></ul></div>`,
 vb:{v:'Bereken de pH van 0,010 mol L<sup>−1</sup> natronloog.',s:['[OH⁻] = 0,010 mol L<sup>−1</sup> (NaOH splitst volledig).','pOH = −log 0,010 = 2,00','pH = 14,00 − 2,00 = <b>12,00</b>']},
 opdr:[{naam:'Van [OH⁻] naar pH',intro:`In een oplossing is [OH⁻] = 3,0·10<sup>−3</sup> ${ML}.`,ph:11.48,steps:[g('Bereken de pOH.',2.523,{abs:.006,dec:2,w:'pOH = −log (3,0·10<sup>−3</sup>) = 2,52'}),g('Bereken de pH.',11.477,{abs:.006,dec:2,w:'pH = 14,00 − 2,52 = 11,48'})]},
  {naam:'Van pH naar [OH⁻]',intro:'Een oplossing van kaliloog heeft pH = 12,60.',ph:12.6,steps:[g('Bereken de pOH.',1.40,{abs:.006,dec:2,w:'pOH = 14,00 − 12,60 = 1,40'}),g('Bereken [OH⁻].',0.0398,{u:ML,sig:2,w:'[OH⁻] = 10<sup>−1,40</sup> = 4,0·10<sup>−2</sup> mol L<sup>−1</sup>'})]},
  {naam:'Bariumhydroxide',intro:`Een oplossing bevat 0,0050 mol Ba(OH)₂ per liter.`,ph:12.0,steps:[g('Bereken [OH⁻].',0.010,{u:ML,h:'Ba(OH)₂ → Ba²⁺ + 2 OH⁻',w:'[OH⁻] = 2 × 0,0050 = 0,010 mol L<sup>−1</sup>'}),g('Bereken de pH.',12.00,{abs:.006,dec:2,w:'pOH = 2,00; pH = 14,00 − 2,00 = 12,00'})]},
  {naam:'Kaliloog',intro:`Bereken de pH van 0,25 ${ML} kaliloog.`,ph:13.40,steps:[g('pH =',13.398,{abs:.006,dec:2,w:'pOH = −log 0,25 = 0,60; pH = 14,00 − 0,60 = 13,40'})]},
  {naam:'H₃O⁺ in een base',ster:1,intro:`Ook in 0,25 ${ML} kaliloog zitten H₃O⁺-ionen.`,ph:13.40,steps:[g('Bereken [H₃O⁺].',4.0e-14,{u:ML,sig:2,h:'Gebruik de pH, of K<sub>w</sub> = [H₃O⁺] · [OH⁻] = 1,0·10<sup>−14</sup>.',w:'[H₃O⁺] = 10<sup>−13,40</sup> = 4,0·10<sup>−14</sup> mol L<sup>−1</sup>'})]}]},
{k:'Verdunnen',t:'Verdunnen',kl:'5V',
 ld:'Je kunt de pH berekenen na het verdunnen van een sterk zuur of een sterke base, en uitleggen waarom de pH door verdunnen nooit voorbij 7 komt.',
 uitleg:`<p>Bij verdunnen verandert het aantal mol opgeloste stof niet, alleen het volume.</p>
 <div class="kader formules">c<sub>na</sub> = c<sub>voor</sub> · ${fr('V<sub>voor</sub>','V<sub>voor</sub> + V<sub>water</sub>')}</div>
 <div class="kader"><ul style="margin-bottom:0"><li>Een sterk zuur 10 keer verdunnen: [H₃O⁺] wordt 10 keer zo klein, de pH 1 hoger.</li><li>Een sterke base 10 keer verdunnen: [OH⁻] wordt 10 keer zo klein, de pH 1 lager.</li><li>Heel ver verdund gaat de pH naar 7, maar niet voorbij 7: water zelf levert ook H₃O⁺ en OH⁻.</li></ul></div>`,

/* ============ STATE ============ */
const KEY='zurenbasen-v2';let S={wp:0,tab:'uitleg',opd:{},steps:{},prog:{}};
try{const t=JSON.parse(localStorage.getItem(KEY));if(t&&t.prog)S=Object.assign(S,t)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let T={};const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=()=>WP[S.wp];const oi=()=>Math.min(S.opd[S.wp]||0,W().opdr.length-1);const O=()=>W().opdr[oi()];const key=()=>S.wp+'-'+oi();

/* ============ PARSERS ============ */
function mant(txt){return String(txt).trim().replace(/\s/g,'').replace(/−/g,'-').split(/[eE]|[·×x*]10\^?/)[0]}
function parseNum(txt){let t=String(txt).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-');
  t=t.replace(/[·×x*]10\^?/i,'e').replace(/e\+?/,'e');const v=Number(t);return t===''?NaN:v}
function decOf(txt){const m=mant(txt).replace('.',',');const i=m.indexOf(',');return i<0?0:m.length-i-1}
function sigOf(txt){let m=mant(txt).replace('-','').replace('.',',');const heeftKomma=m.includes(',');m=m.replace(',','').replace(/^0+/,'');if(!heeftKomma)m=m.replace(/0+$/,'');return m.length||1}
function parseX(txt){let t=String(txt).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/−/g,'-').toLowerCase();
  if(!t||!/^[0-9x+\-.*()]+$/.test(t))return null;t=t.replace(/(\d)x/g,'$1*x');
  try{const f=new Function('x','return ('+t+')');return isFinite(f(.013))?f:null}catch(e){return null}}
const sameX=(txt,model)=>{const f=parseX(txt),g=parseX(model);if(!f)return false;return[0.0013,0.0071,0.02].every(x=>Math.abs(f(x)-g(x))<1e-9)};
const fmtX=(v,r)=>{let s=String(v).replace('.',',').replace(/-/g,' − ');if(r==='O'&&!/^\s*−/.test(s))s='+'+s;return s.trim()};

/* ============ RENDER ============ */
function phBalk(ph){return `<div class="phbalk">${[0,2,4,6,7,8,10,12,14].map(v=>`<span class="tk" style="left:${v/14*100}%">${v}</span>`).join('')}${ph!=null?`<div class="mk" style="left:${Math.max(0,Math.min(14,ph))/14*100}%"><span>pH ${String(ph.toFixed(2)).replace('.',',')}</span></div>`:''}</div>`}
function render(){
  $('#nav').innerHTML=WP.map((w,i)=>{const d=w.opdr.filter((_,j)=>S.prog[i+'-'+j]).length;return `<a data-a="wp" data-v="${i}" class="${S.wp===i?'on':''} ${d===w.opdr.length?'klaar':''}"><i>${d===w.opdr.length?'✓':i+1}</i><span>${w.k}<small>${w.kl} · ${d} van ${w.opdr.length}</small></span></a>`}).join('');
  const w=W(),done=w.opdr.filter((_,j)=>S.prog[S.wp+'-'+j]).length;
  let t=`<div class="kicker">Werkplaats ${S.wp+1} · ${w.kl}</div><h2>${w.t}</h2><div class="tabs"><button data-a="tab" data-v="uitleg" class="${S.tab==='uitleg'?'on':''}">Uitleg en voorbeeld</button><button data-a="tab" data-v="opdr" class="${S.tab==='opdr'?'on':''}">Opdrachten<span class="tel">${done}/${w.opdr.length}</span></button></div>`;
  let sim='';
  if(S.tab==='uitleg'){
    t+=`<div class="ld"><b>Leerdoel</b>${w.ld}</div>${w.uitleg}<div class="vb"><div class="vbkop">Voorbeeld</div><div class="vbvraag">${w.vb.v}</div>${w.vb.s.map((x,i)=>`<div class="vbstap"><div class="n">${i+1}</div><div class="b">${x}</div></div>`).join('')}</div><button class="btn" data-a="tab" data-v="opdr">Naar de opdrachten</button>`;
    sim=`<div class="simkop"><b>pH-schaal</b></div>${phBalk(null)}<div class="legenda">Zuur: pH &lt; 7 · neutraal: pH = 7 · basisch: pH &gt; 7 (bij 298 K). Machten van tien typ je als 4,5·10^-3 of 4,5e-3.</div>`;
  } else {const r=opdr();t+=r.t;sim=r.sim}
  $('#main').innerHTML=`<div class="wp"><div class="tekst">${t}</div><div class="simkol">${sim}</div></div>`;
}
function opdr(){
  const w=W(),o=O(),k=key(),nD=S.steps[k]||0;
  let t=`<div class="oknop">${w.opdr.map((x,i)=>`<div class="dot ${i===oi()?'on':''} ${S.prog[S.wp+'-'+i]?'goed':''} ${x.ster?'ster':''}" data-a="opd" data-v="${i}">${i+1}</div>`).join('')}<span class="rechts">${o.ster?'★ uitdaging':''}</span></div>
  <div class="opdkop">Opdracht ${oi()+1} ${o.ster?'<span class="st">★</span>':''} · ${o.naam}</div>`;
  if(S.prog[k])t+=`<div class="klaarbanner">Deze opdracht is af.</div>`;
  if(o.intro)t+=`<div class="kader proces">${w.boe?`<div class="vgl">${HAC.vgl}</div>`:''}<div${w.boe?' style="margin-top:6px"':''}>${o.intro}</div></div>`;
  t+=o.steps.map((s,i)=>stap(s,i,nD,k)).join('');
  let sim=`<div class="simkop"><b>pH-schaal</b><span>${o.naam}</span></div>${phBalk(S.prog[k]&&o.ph!=null?o.ph:null)}`;
  if(!S.prog[k]&&o.ph!=null)sim+=`<div class="legenda">De pH verschijnt hier als je de opdracht af hebt.</div>`;
  if(o.mm){const m=Math.max(...o.mm);sim+=`<div class="simkop" style="margin-top:8px"><b>Hoeveelheden</b></div><div class="mmol"><span>H₃O⁺</span><div class="bar" style="width:${o.mm[0]/m*100}%;background:#d9473f"></div><span>${String(o.mm[0].toFixed(2)).replace('.',',')} mmol</span><span>OH⁻</span><div class="bar" style="width:${o.mm[1]/m*100}%;background:#3b5fb0"></div><span>${String(o.mm[1].toFixed(2)).replace('.',',')} mmol</span></div>`}
  if(w.boe){const rows={};o.steps.forEach((s,i)=>{if(s.t==='rij'&&i<nD)rows[s.rij]=s});
    sim+=`<div class="simkop" style="margin-top:8px"><b>BOE-schema</b></div><table class="boe"><tr><th></th>${HAC.kol.map(c=>`<th>[${c}]</th>`).join('')}</tr>${['O','E'].map(r=>`<tr><td class="rl">${r}</td>${HAC.kol.map((_,j)=>rows[r]?`<td class="ok">${fmtX(rows[r].a[j],r)}</td>`:'<td class="leeg">…</td>').join('')}</tr>`).join('')}</table><div class="legenda">De O-rij werkt hier met x-termen. Water laat je weg.</div>`}
  return{t,sim}}
function stap(s,i,nD,k){
  const st=i<nD?'goed':i===nD?'':'dicht';const tk=k+'-'+i;const cur=T[tk]||{};
  const title=s.t==='rij'?`Vul de ${s.rij}-rij in met x-termen.`:s.v;
  let h=`<div class="stap ${st}"><div class="n">${i+1}</div><div class="inh"><div class="vr">${title}</div>`;
  if(i<nD){
    if(s.t==='getal')h+=`<div class="uitw">${s.w||''}</div>`;
    if(s.t==='keuze')h+=`<div class="fb goed">${s.o[s.a]}</div>`;
    if(s.t==='multi')h+=`<div class="fb goed">${s.a.map(j=>s.o[j]).join(' · ')}</div>`;
    if(s.t==='rij')h+=`<div class="fb goed">${HAC.kol.map((c,j)=>`[${c}]: ${fmtX(s.a[j],s.rij)}`).join(' · ')}</div>`;
    return h+'</div></div>'}
  h+='<div class="inv">';
  if(s.t==='getal')h+=`<div class="rij"><input class="in" id="g-${i}" inputmode="decimal" placeholder="bijv. 4,5·10^-3" value="${esc(cur.txt||'')}">${s.u?`<span>${s.u}</span>`:''}<button class="btn" data-a="check" data-i="${i}">Controleer</button></div>${cur.tries>=2&&!cur.showW?`<button class="btn g klein" style="margin-top:6px" data-a="showw" data-i="${i}">Toon de uitwerking</button>`:''}${cur.showW?`<div class="uitw">${s.w}</div>`:''}`;
  if(s.t==='keuze')h+=`<div class="opties">${s.o.map((_,j)=>j).sort((a,b)=>((a*7+i*3+oi())%5)-((b*7+i*3+oi())%5)).map(j=>`<button class="optie ${cur.v===j?'aan':''}" data-a="kies" data-i="${i}" data-v="${j}">${s.o[j]}</button>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  if(s.t==='multi')h+=`<div class="chips">${s.o.map((x,j)=>`<span class="chip ${(cur.sel||[]).includes(j)?'aan':''}" data-a="chip" data-i="${i}" data-v="${j}">${x}</span>`).join('')}</div><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  if(s.t==='rij')h+=`<table class="boe"><tr><th></th>${HAC.kol.map(c=>`<th>[${c}]</th>`).join('')}</tr><tr><td class="rl">${s.rij}</td>${HAC.kol.map((_,j)=>`<td><input id="r-${j}" value="${esc((cur.v||[])[j]||'')}" placeholder="${s.rij==='O'?'bijv. -x':'bijv. 0,10-x'}"></td>`).join('')}</tr></table><button class="btn" data-a="check" data-i="${i}">Controleer</button>`;
  h+='</div>';if(cur.fb)h+=`<div class="fb ${cur.fb[0]}">${cur.fb[1]}</div>`;
  return h+'</div></div>'}
function check(i){
  const o=O(),k=key(),s=o.steps[i],tk=k+'-'+i,cur=T[tk]=T[tk]||{};let ok=false,msg='Nog niet goed.';
  if(s.t==='getal'){const inp=$('#g-'+i);cur.txt=inp.value;const x=parseNum(inp.value);
    if(isNaN(x)){cur.fb=['hint','Dit getal kan ik niet lezen.'];render();return}
    const waardeOk=s.abs!=null?Math.abs(x-s.a)<=s.abs:Math.abs(x-s.a)/Math.abs(s.a)<=(s.rel||.012);
    if(waardeOk&&s.dec!=null&&decOf(inp.value)!==s.dec){cur.fb=['hint',`De waarde klopt, maar let op de significantie: hier hoort de pH (of pOH) ${s.dec} decimalen te hebben. Het aantal decimalen is gelijk aan het aantal significante cijfers van de concentratie.`];render();return}
    if(waardeOk&&s.sig!=null&&sigOf(inp.value)!==s.sig){cur.fb=['hint',`De waarde klopt, maar let op de significantie: geef ${s.sig} significante cijfers. Dat is het aantal decimalen van de pH.`];render();return}
    ok=waardeOk;if(!ok){cur.tries=(cur.tries||0)+1;
      if(s.abs!=null&&Math.abs(14-x-s.a)<=s.abs*2)msg='Nog niet goed. Heb je pH en pOH verwisseld?';
      else if(s.abs==null&&Math.abs(Math.log10(Math.abs(x))+Math.log10(Math.abs(s.a))+14)<.05)msg='Nog niet goed. Heb je [H₃O⁺] en [OH⁻] verwisseld?';
      else msg='Nog niet goed.'+(s.h?' Tip: '+s.h:'')}}
  if(s.t==='keuze'){if(cur.v==null){cur.fb=['hint','Kies eerst een antwoord.'];render();return}ok=cur.v===s.a;msg='Nog niet goed.'+(s.h?' Tip: '+s.h:'')}
  if(s.t==='multi'){const sel=cur.sel||[];if(!sel.length){cur.fb=['hint','Kies minstens één antwoord.'];render();return}
    const mis=s.a.filter(j=>!sel.includes(j)).length,tv=sel.filter(j=>!s.a.includes(j)).length;ok=!mis&&!tv;
    msg=`Nog niet goed: ${tv?tv+' gekozen '+(tv===1?'antwoord is':'antwoorden zijn')+' fout':''}${tv&&mis?' en ':''}${mis?'je mist er nog '+mis:''}. Een buffer bevat een zwak zuur én de bijbehorende base.`}
  if(s.t==='rij'){const v=HAC.kol.map((_,j)=>$('#r-'+j).value);cur.v=v;
    if(v.some(x=>!x.trim())){cur.fb=['hint','Vul alle vakjes in.'];render();return}
    const bad=HAC.kol.filter((c,j)=>!sameX(v[j],s.a[j]));ok=!bad.length;
    msg=`Nog niet goed bij ${bad.map(c=>'['+c+']').join(', ')}.`+(s.rij==='O'?' HA verdwijnt (−x), A⁻ en H₃O⁺ ontstaan (+x).':' E = B + O.')}
  if(ok){cur.fb=null;S.steps[k]=i+1;if(i+1>=o.steps.length)S.prog[k]=true;save()}else cur.fb=['fout',msg];
  render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'wp':S.wp=+v;S.tab='uitleg';T={};save();window.scrollTo(0,0);break;
    case 'tab':S.tab=v;save();window.scrollTo(0,0);break;
    case 'opd':S.opd[S.wp]=+v;T={};save();break;
    case 'kies':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};T[tk].v=+v;T[tk].fb=null;break}
    case 'chip':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};const s=T[tk].sel||[];const j=+v;T[tk].sel=s.includes(j)?s.filter(x=>x!==j):[...s,j];T[tk].fb=null;break}
    case 'check':check(+el.dataset.i);return;
    case 'showw':{const tk=key()+'-'+el.dataset.i;T[tk]=T[tk]||{};T[tk].showW=true;break}
    case 'vrij':location.href='Zuren_Basen_Vrij.html';return;
    case 'beamer':document.body.classList.toggle('beamer');return;
    case 'wis':if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='Zeker weten? Klik nogmaals';return}S.prog={};S.steps={};T={};save();el.dataset.c='';el.textContent='Voortgang wissen';break;
    default:return}
  render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('g-')){const b=e.target.parentNode.querySelector('[data-a=check]');if(b)b.click()}});
render();
window.__zb={WP,S:()=>S,check,render,decOf,sigOf,parseNum};
}
